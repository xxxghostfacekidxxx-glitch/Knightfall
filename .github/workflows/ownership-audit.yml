name: Knightfall Ownership Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/ownership-audit.mjs"
      - ".github/workflows/ownership-audit.yml"

permissions:
  contents: read

concurrency:
  group: knightfall-ownership-audit
  cancel-in-progress: false

jobs:
  audit_credentials:
    name: Check dedicated audit accounts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check audit credentials
        id: credentials
        shell: bash
        env:
          KNIGHTFALL_MEMBER_USERNAME: ${{ secrets.KNIGHTFALL_MEMBER_USERNAME }}
          KNIGHTFALL_MEMBER_PASSWORD: ${{ secrets.KNIGHTFALL_MEMBER_PASSWORD }}
          KNIGHTFALL_MODERATOR_USERNAME: ${{ secrets.KNIGHTFALL_MODERATOR_USERNAME }}
          KNIGHTFALL_MODERATOR_PASSWORD: ${{ secrets.KNIGHTFALL_MODERATOR_PASSWORD }}
          KNIGHTFALL_ADMIN_USERNAME: ${{ secrets.KNIGHTFALL_ADMIN_USERNAME }}
          KNIGHTFALL_ADMIN_PASSWORD: ${{ secrets.KNIGHTFALL_ADMIN_PASSWORD }}
        run: |
          if [ -n "$KNIGHTFALL_MEMBER_USERNAME" ] && [ -n "$KNIGHTFALL_MEMBER_PASSWORD" ] &&
             [ -n "$KNIGHTFALL_MODERATOR_USERNAME" ] && [ -n "$KNIGHTFALL_MODERATOR_PASSWORD" ] &&
             [ -n "$KNIGHTFALL_ADMIN_USERNAME" ] && [ -n "$KNIGHTFALL_ADMIN_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All dedicated role-test credentials are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Authenticated audit skipped::One or more dedicated role-test secrets are missing."
          fi

  ownership_audit:
    name: Authenticated ownership tests
    needs: audit_credentials
    if: needs.audit_credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ownership boundary audit
        env:
          KNIGHTFALL_API: https://api.ash-fall.com
          KNIGHTFALL_MEMBER_USERNAME: ${{ secrets.KNIGHTFALL_MEMBER_USERNAME }}
          KNIGHTFALL_MEMBER_PASSWORD: ${{ secrets.KNIGHTFALL_MEMBER_PASSWORD }}
          KNIGHTFALL_MODERATOR_USERNAME: ${{ secrets.KNIGHTFALL_MODERATOR_USERNAME }}
          KNIGHTFALL_MODERATOR_PASSWORD: ${{ secrets.KNIGHTFALL_MODERATOR_PASSWORD }}
          KNIGHTFALL_ADMIN_USERNAME: ${{ secrets.KNIGHTFALL_ADMIN_USERNAME }}
          KNIGHTFALL_ADMIN_PASSWORD: ${{ secrets.KNIGHTFALL_ADMIN_PASSWORD }}
        run: node scripts/ownership-audit.mjs

  audit_skipped:
    name: Explain skipped authenticated audit
    needs: audit_credentials
    if: needs.audit_credentials.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped audit
        shell: bash
        run: |
          {
            echo "## Authenticated security audit: SKIPPED"
            echo ""
            echo "The authenticated checks did not run because one or more dedicated test-account secrets are missing. The authenticated audit job is marked skipped, not passed."
            echo ""
            echo "Configure all six repository Actions secrets: `KNIGHTFALL_MEMBER_USERNAME`, `KNIGHTFALL_MEMBER_PASSWORD`, `KNIGHTFALL_MODERATOR_USERNAME`, `KNIGHTFALL_MODERATOR_PASSWORD`, `KNIGHTFALL_ADMIN_USERNAME`, and `KNIGHTFALL_ADMIN_PASSWORD`."
            echo ""
            echo "Use dedicated test accounts only. Do not use production personal credentials or put secret values in logs, issues, or commits."
          } >> "$GITHUB_STEP_SUMMARY"
