name: Arcade Test Bot Fleet

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "public/arcade/**"
      - "scripts/arcade-browser-smoke.mjs"
      - "scripts/arcade-asset-doctor.mjs"
      - "scripts/arcade-import-audit.mjs"
      - "public/arcade-30-games.html"
      - "scripts/arcade-asset-doctor.test.mjs"
      - "scripts/arcade-gameplay-replay.mjs"
      - "scripts/arcade-gameplay-doctor.mjs"
      - ".github/workflows/arcade-test-fleet.yml"
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "public/arcade/**"
      - "scripts/arcade-browser-smoke.mjs"
      - "scripts/arcade-gameplay-replay.mjs"
      - "scripts/arcade-gameplay-doctor.mjs"
      - "scripts/arcade-asset-doctor.mjs"
      - "scripts/arcade-import-audit.mjs"
      - "public/arcade-30-games.html"
      - "scripts/arcade-asset-doctor.test.mjs"
      - "public/admin.html"
      - "public/admin.css"
      - ".github/workflows/arcade-test-fleet.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: arcade-test-bot-fleet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-bot:
    permissions:
      contents: read
      actions: read
    name: "${{ matrix.bot }} · full arcade audit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        bot:
          - Ash Sentinel
          - Cinder Scout
          - Rook Runner
          - Maze Warden
          - Tower Keeper
          - Rally Hound
          - Kaiju Watch
          - Pixel Medic
          - Savekeeper
          - Cabinet Auditor
        include:
          - { bot: Ash Sentinel, profile: phone }
          - { bot: Cinder Scout, profile: smallPhone }
          - { bot: Rook Runner, profile: largePhone }
          - { bot: Maze Warden, profile: tablet }
          - { bot: Tower Keeper, profile: desktop }
          - { bot: Rally Hound, profile: phone }
          - { bot: Kaiju Watch, profile: smallPhone }
          - { bot: Pixel Medic, profile: largePhone }
          - { bot: Savekeeper, profile: tablet }
          - { bot: Cabinet Auditor, profile: desktop }
    steps:
      - name: Checkout Knightfall
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --directory public > /tmp/knightfall-static.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/chaos-cartridge.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/knightfall-static.log
          exit 1
      - name: Validate bot scripts and repair rules
        run: |
          node --check scripts/arcade-browser-smoke.mjs
          node --check scripts/arcade-gameplay-replay.mjs
          node --check scripts/arcade-gameplay-doctor.mjs
          node --check scripts/arcade-asset-doctor.mjs
          node --test scripts/arcade-asset-doctor.test.mjs
      - name: Audit local game imports and license records
        run: |
          node --check scripts/arcade-import-audit.mjs
          node scripts/arcade-import-audit.mjs 2>&1 | tee /tmp/arcade-import-audit.log
      - name: Audit arcade asset references
        run: |
          node scripts/arcade-asset-doctor.mjs > /tmp/arcade-asset-audit.json || true
          cat /tmp/arcade-asset-audit.json
      - name: Reproduce mobile and desktop gameplay scenarios
        env:
          ARCADE_TEST_PROFILE: ${{ matrix.profile }}
          ARCADE_TEST_BASE: http://127.0.0.1:8765
        run: |
          node scripts/arcade-gameplay-replay.mjs 2>&1 | tee /tmp/arcade-gameplay-replay.log
      - name: Run full local arcade browser suite
        env:
          ARCADE_TEST_BASE: http://127.0.0.1:8765
        run: |
          set -o pipefail
          node scripts/arcade-browser-smoke.mjs 2>&1 | tee /tmp/arcade-local-results.log
      - name: Run full live-site arcade browser suite
        if: github.event_name != 'pull_request'
        env:
          ARCADE_TEST_BASE: https://ash-fall.com
        run: |
          set -o pipefail
          node scripts/arcade-browser-smoke.mjs 2>&1 | tee /tmp/arcade-live-results.log
      - name: Save per-bot test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-test-results-${{ strategy.job-index }}-${{ matrix.bot }}
          path: |
            /tmp/knightfall-static.log
            /tmp/arcade-local-results.log
            /tmp/arcade-live-results.log
            /tmp/arcade-asset-audit.json
            /tmp/arcade-import-audit.log
            /tmp/arcade-browser-evidence/
            /tmp/arcade-replays/
            /tmp/arcade-gameplay-replay.log
          if-no-files-found: ignore
          retention-days: 14

  safe-auto-repair:
    name: Prepare safe asset repairs for review
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify automated repair rules
        run: node --test scripts/arcade-asset-doctor.test.mjs
      - name: Apply strictly deterministic arcade asset fixes
        run: |
          status=0
          node scripts/arcade-asset-doctor.mjs --fix > /tmp/arcade-doctor.json || status=$?
          cat /tmp/arcade-doctor.json
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
      - name: Apply known-safe gameplay regression fixes
        run: |
          node scripts/arcade-gameplay-doctor.mjs --fix > /tmp/arcade-gameplay-doctor.json
          cat /tmp/arcade-gameplay-doctor.json
          node --check public/arcade/hosted/arcade-cabinet-engine.js
      - name: Verify proposed gameplay repairs in browser
        run: |
          if git diff --quiet -- public/arcade; then exit 0; fi
          python3 -m http.server 8766 --directory public > /tmp/arcade-repair-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8766/chaos-cartridge.html >/dev/null; then break; fi
            sleep 1
          done
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          ARCADE_TEST_BASE=http://127.0.0.1:8766 ARCADE_TEST_PROFILE=phone node scripts/arcade-gameplay-replay.mjs
      - name: Create reviewable repair PR only when files changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- public/arcade; then
            echo "No safe repairs needed"
            exit 0
          fi
          BRANCH="bot/arcade-asset-doctor"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add public/arcade
          git commit -m "fix(arcade): apply verified asset and gameplay regression repairs"
          git push --force-with-lease origin "$BRANCH"
          if gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --title "fix(arcade): automated asset and gameplay regression repairs" --body "Deterministic repairs only: existing-file asset URL corrections and known Kaiju hitbox regression signature. Review required. Source: https://github.com/$GH_REPO/actions/runs/$RUN_ID"
          fi

  report-failure:
    if: github.event_name != 'pull_request' && always() && needs.browser-bot.result == 'failure'
    name: Create or update repair ticket
    needs: [browser-bot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Summarize failed bot jobs
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run view "$RUN_ID" --repo "$GH_REPO" --json url,headSha,jobs > /tmp/run.json
          FAILED_BOTS=$(jq -r '[.jobs[] | select(.conclusion == "failure") | .name] | unique | join(", ")' /tmp/run.json)
          RUN_URL=$(jq -r '.url' /tmp/run.json)
          HEAD_SHA=$(jq -r '.headSha' /tmp/run.json)
          {
            echo "failed_bots=$FAILED_BOTS"
            echo "run_url=$RUN_URL"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Create repair ticket or update existing open ticket
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_BOTS: ${{ steps.summary.outputs.failed_bots }}
          RUN_URL: ${{ steps.summary.outputs.run_url }}
          HEAD_SHA: ${{ steps.summary.outputs.head_sha }}
        run: |
          TITLE="[Arcade Test Fleet] Browser checks failed"
          BODY=$(cat <<EOF
          ## Automated arcade test failure

          - **Failed agents:** ${FAILED_BOTS:-Unknown}
          - **Commit:** ${HEAD_SHA}
          - **Workflow evidence:** ${RUN_URL}

          ## Repair protocol
          - [ ] Download the failed agent's \`arcade-test-results-*\` artifact and identify the first actionable failure.
          - [ ] Reproduce the failure locally; distinguish a game defect from a live-site/network/deployment issue.
          - [ ] Create a dedicated fix branch and make the smallest targeted change.
          - [ ] Add or update a regression check for the exact failure.
          - [ ] Run the full arcade browser suite and relevant static/API checks.
          - [ ] Open a pull request with root cause, changed files, test evidence, and rollback notes.
          - [ ] Human reviewer approves and merges only after checks pass.

          **Safety:** This ticket is diagnostic evidence, not permission to edit production automatically. The fleet never pushes a repair or merges a pull request on its own.

          ---
          Updated from workflow run: ${RUN_URL}
          EOF
          )
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search '"[Arcade Test Fleet] Browser checks failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$BODY"
            echo "Updated existing repair issue #$EXISTING"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          fi
