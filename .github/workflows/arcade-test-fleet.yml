name: Arcade Test Bot Fleet

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "public/arcade/**"
      - "public/chaos-cartridge-theme.css"
      - "public/arcade-polish.css"
      - "public/arcade-games.html"
      - "public/nav.js"
      - "scripts/nav-offline-api.test.mjs"
      - "public/arcade-catalog.*"
      - "public/arcade-cabinet-ui.*"
      - "public/chaos-cartridge.html"
      - "scripts/build-arcade-catalog.mjs"
      - "scripts/arcade-browser-smoke.mjs"
      - "scripts/arcade-sharded-smoke.mjs"
      - "scripts/arcade-shard-summary.mjs"
      - "scripts/arcade-shard-summary.test.mjs"
      - "scripts/browserquest-name-flow.test.mjs"
      - "scripts/admin-dashboard-structure.test.mjs"
      - "public/admin.html"
      - "public/admin.css"
      - "scripts/arcade-asset-doctor.mjs"
      - "scripts/arcade-import-audit.mjs"
      - "scripts/arcade-import-audit.test.mjs"
      - "scripts/arcade-inventory.mjs"
      - "scripts/arcade-anchor-audit.mjs"
      - "scripts/arcade-dependency-audit.mjs"
      - "scripts/arcade-originals-audit.mjs"
      - "scripts/arcade-mini-games.test.mjs"
      - "scripts/cinder-eights-runtime.test.mjs"
      - "scripts/cinder-reversi-runtime.test.mjs"
      - "scripts/arcade-original-trio.test.mjs"
      - "scripts/arcade-original-driving.test.mjs"
      - "scripts/arcade-original-matching.test.mjs"
      - "scripts/arcade-original-action.test.mjs"
      - "scripts/arcade-original-runtime-smoke.test.mjs"
      - "scripts/arcade-canvas-fx.test.mjs"
      - "scripts/arcade-cinder-lander.test.mjs"
      - "scripts/arcade-conversion-integrity.test.mjs"
      - "scripts/arcade-original-runner.test.mjs"
      - "scripts/arcade-ash-lexicon.test.mjs"
      - "scripts/arcade-original-vector.test.mjs"
      - "scripts/arcade-fish-table-controls.test.mjs"
      - "scripts/arcade-provenance-runtime.test.mjs"
      - "scripts/arcade-mini-games-runtime.test.mjs"
      - "scripts/arcade-neon-engine.test.mjs"
      - "scripts/arcade-neon-surge.test.mjs"
      - "scripts/arcade-shelf-dedup.test.mjs"
      - "scripts/arcade-route-integrity.test.mjs"
      - "scripts/arcade-space-fighter.test.mjs"
      - "scripts/arcade-bubble-barrage.test.mjs"
      - "scripts/arcade-tether-tangle.test.mjs"
      - "scripts/arcade-original-runner-regression.test.mjs"
      - "scripts/arcade-glitch-rift-runtime.test.mjs"
      - "scripts/arcade-original-sports.test.mjs"
      - "scripts/arcade-provenance-audit.mjs"
      - "public/arcade/original-creations.json"
      - "public/arcade-30-games.html"
      - "scripts/arcade-asset-doctor.test.mjs"
      - "scripts/arcade-gameplay-replay.mjs"
      - "scripts/arcade-gameplay-doctor.mjs"
      - ".github/workflows/arcade-test-fleet.yml"
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/arcade-*.test.mjs"
      - "public/arcade/**"
      - "public/chaos-cartridge-theme.css"
      - "public/arcade-polish.css"
      - "public/arcade-games.html"
      - "public/nav.js"
      - "scripts/nav-offline-api.test.mjs"
      - "public/arcade-catalog.*"
      - "public/arcade-cabinet-ui.*"
      - "public/chaos-cartridge.html"
      - "scripts/build-arcade-catalog.mjs"
      - "scripts/arcade-browser-smoke.mjs"
      - "scripts/arcade-sharded-smoke.mjs"
      - "scripts/arcade-shard-summary.mjs"
      - "scripts/admin-dashboard-structure.test.mjs"
      - "public/admin.html"
      - "public/admin.css"
      - "scripts/arcade-gameplay-replay.mjs"
      - "scripts/arcade-gameplay-doctor.mjs"
      - "scripts/arcade-asset-doctor.mjs"
      - "scripts/arcade-import-audit.mjs"
      - "scripts/arcade-import-audit.test.mjs"
      - "scripts/arcade-inventory.mjs"
      - "scripts/arcade-anchor-audit.mjs"
      - "scripts/arcade-dependency-audit.mjs"
      - "scripts/arcade-originals-audit.mjs"
      - "scripts/arcade-mini-games.test.mjs"
      - "scripts/cinder-eights-runtime.test.mjs"
      - "scripts/cinder-reversi-runtime.test.mjs"
      - "scripts/arcade-original-trio.test.mjs"
      - "scripts/arcade-original-driving.test.mjs"
      - "scripts/arcade-original-matching.test.mjs"
      - "scripts/arcade-original-action.test.mjs"
      - "scripts/arcade-original-runtime-smoke.test.mjs"
      - "scripts/arcade-cinder-lander.test.mjs"
      - "scripts/arcade-conversion-integrity.test.mjs"
      - "scripts/arcade-original-runner.test.mjs"
      - "scripts/arcade-ash-lexicon.test.mjs"
      - "scripts/arcade-original-vector.test.mjs"
      - "scripts/arcade-fish-table-controls.test.mjs"
      - "scripts/arcade-original-sports.test.mjs"
      - "scripts/arcade-provenance-audit.mjs"
      - "public/arcade/original-creations.json"
      - "public/arcade-30-games.html"
      - "scripts/arcade-asset-doctor.test.mjs"
      - ".github/workflows/arcade-test-fleet.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: arcade-test-bot-fleet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-bot:
    permissions:
      contents: read
      actions: read
    name: "${{ matrix.bot }} · sharded arcade audit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        bot:
          - Ash Sentinel
          - Cinder Scout
          - Rook Runner
          - Maze Warden
          - Tower Keeper
          - Rally Hound
          - Kaiju Watch
          - Pixel Medic
          - Savekeeper
          - Cabinet Auditor
        include:
          - { bot: Ash Sentinel, profile: phone }
          - { bot: Cinder Scout, profile: smallPhone }
          - { bot: Rook Runner, profile: largePhone }
          - { bot: Maze Warden, profile: tablet }
          - { bot: Tower Keeper, profile: desktop }
          - { bot: Rally Hound, profile: phone }
          - { bot: Kaiju Watch, profile: smallPhone }
          - { bot: Pixel Medic, profile: largePhone }
          - { bot: Savekeeper, profile: tablet }
          - { bot: Cabinet Auditor, profile: desktop }
    steps:
      - name: Checkout Knightfall
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --directory public > /tmp/knightfall-static.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/chaos-cartridge.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/knightfall-static.log
          exit 1
      - name: Validate bot scripts and repair rules
        run: |
          node --test scripts/admin-dashboard-structure.test.mjs scripts/arcade-shard-summary.test.mjs scripts/browserquest-name-flow.test.mjs scripts/arcade-publishing.test.mjs scripts/franchise-directory.test.mjs scripts/arcade-import-audit.test.mjs scripts/nav-offline-api.test.mjs
          node --check scripts/arcade-shard-summary.mjs
          node --check scripts/arcade-sharded-smoke.mjs
          node --check scripts/arcade-browser-smoke.mjs
          node --check scripts/arcade-gameplay-replay.mjs
          node --check scripts/arcade-gameplay-doctor.mjs
          node --test scripts/arcade-neon-surge.test.mjs
          node --test scripts/arcade-shelf-dedup.test.mjs scripts/arcade-boot-regression.test.mjs scripts/arcade-score-registration.test.mjs scripts/arcade-state-roundtrip.test.mjs scripts/arcade-fish-table-controls.test.mjs
          node --test scripts/arcade-route-integrity.test.mjs scripts/cinder-eights-runtime.test.mjs scripts/cinder-reversi-runtime.test.mjs
          node scripts/arcade-gameplay-doctor.mjs
          node --check scripts/arcade-asset-doctor.mjs
          node --test scripts/arcade-asset-doctor.test.mjs scripts/arcade-mini-games.test.mjs scripts/arcade-original-trio.test.mjs scripts/arcade-original-sports.test.mjs scripts/arcade-original-driving.test.mjs scripts/arcade-original-matching.test.mjs scripts/arcade-original-action.test.mjs scripts/arcade-original-runtime-smoke.test.mjs scripts/arcade-cinder-lander.test.mjs scripts/arcade-conversion-integrity.test.mjs scripts/arcade-original-runner.test.mjs scripts/arcade-ash-lexicon.test.mjs scripts/arcade-original-vector.test.mjs scripts/arcade-provenance-runtime.test.mjs scripts/arcade-mini-games-runtime.test.mjs scripts/arcade-neon-engine.test.mjs scripts/arcade-space-fighter.test.mjs scripts/arcade-bubble-barrage.test.mjs scripts/arcade-tether-tangle.test.mjs scripts/arcade-original-runner-regression.test.mjs scripts/arcade-glitch-rift-runtime.test.mjs scripts/arcade-rooftop-colossus.test.mjs scripts/arcade-rift-marshland-regression.test.mjs scripts/arcade-marshland-marksman.test.mjs scripts/arcade-particle-panic.test.mjs scripts/arcade-canvas-fx.test.mjs scripts/arcade-nextgen-visual.test.mjs scripts/arcade-strategy-games.test.mjs scripts/arcade-original-sprite-integration.test.mjs
      - name: Audit local game imports and license records
        run: |
          node --check scripts/arcade-import-audit.mjs
          set -o pipefail
          node scripts/arcade-import-audit.mjs 2>&1 | tee /tmp/arcade-import-audit.log
      - name: Validate first-party games and sprite archive
        run: |
          node --check scripts/arcade-originals-audit.mjs
          node scripts/arcade-originals-audit.mjs
      - name: Inventory code and asset provenance across 104 cartridges
        run: |
          node --check scripts/arcade-provenance-audit.mjs
          node scripts/arcade-provenance-audit.mjs --report
      - name: Audit arcade asset references
        run: |
          node scripts/arcade-asset-doctor.mjs > /tmp/arcade-asset-audit.json || true
          cat /tmp/arcade-asset-audit.json
      - name: Reproduce mobile and desktop gameplay scenarios
        env:
          ARCADE_TEST_PROFILE: ${{ matrix.profile }}
          ARCADE_TEST_BASE: http://127.0.0.1:8765
        run: |
          set -o pipefail
          node scripts/arcade-gameplay-replay.mjs 2>&1 | tee /tmp/arcade-gameplay-replay.log
      - name: Run full local arcade browser suite
        env:
          ARCADE_TEST_BASE: http://127.0.0.1:8765
          ARCADE_TEST_TARGET: local
          ARCADE_SHARD_COUNT: 10
          ARCADE_SHARD_INDEX: ${{ strategy.job-index }}
          ARCADE_TEST_PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          node scripts/arcade-sharded-smoke.mjs 2>&1 | tee /tmp/arcade-local-results.log
      - name: Run full live-site arcade browser suite
        if: always() && github.event_name != 'pull_request'
        env:
          ARCADE_TEST_BASE: https://ash-fall.com
          ARCADE_TEST_TARGET: live
          ARCADE_SHARD_COUNT: 10
          ARCADE_SHARD_INDEX: ${{ strategy.job-index }}
          ARCADE_TEST_PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          node scripts/arcade-sharded-smoke.mjs 2>&1 | tee /tmp/arcade-live-results.log
      - name: Run specialized gameplay and cabinet regression suite
        if: matrix.bot == 'Cabinet Auditor'
        env:
          ARCADE_TEST_BASE: http://127.0.0.1:8765
          ARCADE_TEST_PROFILE: desktop
        run: |
          set -o pipefail
          node scripts/arcade-browser-smoke.mjs 2>&1 | tee /tmp/arcade-specialized-results.log
      - name: Save per-bot test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-test-results-${{ strategy.job-index }}-${{ matrix.bot }}
          path: |
            /tmp/knightfall-static.log
            /tmp/arcade-local-results.log
            /tmp/arcade-live-results.log
            /tmp/arcade-specialized-results.log
            /tmp/arcade-asset-audit.json
            /tmp/arcade-import-audit.log
            artifacts/arcade-provenance.json
            /tmp/arcade-browser-evidence/
            /tmp/arcade-replays/
            /tmp/arcade-gameplay-replay.log
          if-no-files-found: ignore
          retention-days: 14

  consolidate-coverage:
    name: Consolidate ten-bot arcade coverage
    if: always()
    needs: [browser-bot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: arcade-test-results-*
          path: artifacts/shards
          merge-multiple: false
      - name: Verify static arcade dependencies
        run: node scripts/arcade-dependency-audit.mjs
      - name: Verify hash-routed mini-game anchors
        run: node scripts/arcade-anchor-audit.mjs
      - name: Inventory arcade routes and orphan candidates
        run: node scripts/arcade-inventory.mjs --output=artifacts/arcade-inventory.json
      - name: Upload arcade inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-inventory
          path: artifacts/arcade-inventory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify complete local and live catalog coverage
        env:
          ARCADE_SHARD_COUNT: 10
          ARCADE_REQUIRE_LIVE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: node scripts/arcade-shard-summary.mjs artifacts/shards artifacts/arcade-fleet-summary.json
      - name: Prepare sanitized dashboard report artifact
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -f artifacts/arcade-fleet-summary.json ]; then exit 0; fi
          node -e 'const fs=require("fs");const p="artifacts/arcade-fleet-summary.json";const d=JSON.parse(fs.readFileSync(p));d.sourceRunId=Number(process.env.RUN_ID);for(const t of Object.values(d.targets||{})){t.failures=(t.failures||[]).map(f=>({game:f.game,route:f.route,profile:f.profile,action:f.action,reason:String(f.error||f.reason||"Test failed").slice(0,350),target:f.target,screenshot:f.screenshot,networkErrorCount:Array.isArray(f.networkErrors)?f.networkErrors.length:0,browserErrorCount:Array.isArray(f.browserErrors)?f.browserErrors.length:0}));}fs.mkdirSync("public/arcade",{recursive:true});fs.writeFileSync("public/arcade/arcade-fleet-latest.json",JSON.stringify(d,null,2));'
          echo "Dashboard report prepared. Production publication is intentionally separate."
      - name: Upload dashboard JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-dashboard-report
          path: public/arcade/arcade-fleet-latest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish fleet summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-fleet-summary
          path: artifacts/arcade-fleet-summary.json
          if-no-files-found: warn
          retention-days: 14

  publish-dashboard:
    name: Publish verified fleet dashboard JSON
    needs: [consolidate-coverage]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: arcade-dashboard-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: arcade-dashboard-report
          path: /tmp/arcade-dashboard
      - name: Commit dashboard report to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test -s /tmp/arcade-dashboard/arcade-fleet-latest.json
          LATEST=$(gh api "repos/$GH_REPO/actions/workflows/arcade-test-fleet.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].id')
          if [ "$LATEST" != "$RUN_ID" ]; then echo "Skipping stale fleet report from run $RUN_ID; latest is $LATEST"; exit 0; fi
          git pull --ff-only origin main
          cp /tmp/arcade-dashboard/arcade-fleet-latest.json public/arcade/arcade-fleet-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arcade/arcade-fleet-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(arcade): publish sanitized fleet dashboard report [skip ci]"
          git push origin HEAD:main

  safe-auto-repair:
    name: Prepare safe asset repairs for review
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify automated repair rules
        run: node --test scripts/arcade-asset-doctor.test.mjs
      - name: Apply strictly deterministic arcade asset fixes
        run: |
          status=0
          node scripts/arcade-asset-doctor.mjs --fix > /tmp/arcade-doctor.json || status=$?
          cat /tmp/arcade-doctor.json
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
      - name: Apply known-safe gameplay regression fixes
        run: |
          node scripts/arcade-gameplay-doctor.mjs --fix > /tmp/arcade-gameplay-doctor.json
          cat /tmp/arcade-gameplay-doctor.json
          node --check public/arcade/hosted/arcade-cabinet-engine.js
      - name: Verify proposed gameplay repairs in browser
        run: |
          if git diff --quiet -- public/arcade; then exit 0; fi
          python3 -m http.server 8766 --directory public > /tmp/arcade-repair-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8766/chaos-cartridge.html >/dev/null; then break; fi
            sleep 1
          done
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          ARCADE_TEST_BASE=http://127.0.0.1:8766 ARCADE_TEST_PROFILE=phone node scripts/arcade-gameplay-replay.mjs
      - name: Export verified arcade repairs for review without creating a branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/arcade; then
            echo "No safe repairs needed"
            exit 0
          fi
          git diff --binary -- public/arcade > /tmp/arcade-reviewed-repairs.patch
          test -s /tmp/arcade-reviewed-repairs.patch
          echo "Safe repair proposal exported as artifact. Only explicit owner-approved changes are committed to main."
      - name: Upload safe repair patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-reviewed-repairs
          path: /tmp/arcade-reviewed-repairs.patch
          if-no-files-found: ignore
          retention-days: 14

  report-failure:
    if: github.event_name != 'pull_request' && always() && needs.browser-bot.result == 'failure'
    name: Create or update repair ticket
    needs: [browser-bot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Summarize failed bot jobs
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run view "$RUN_ID" --repo "$GH_REPO" --json url,headSha,jobs > /tmp/run.json
          FAILED_BOTS=$(jq -r '[.jobs[] | select(.conclusion == "failure") | .name] | unique | join(", ")' /tmp/run.json)
          RUN_URL=$(jq -r '.url' /tmp/run.json)
          HEAD_SHA=$(jq -r '.headSha' /tmp/run.json)
          {
            echo "failed_bots=$FAILED_BOTS"
            echo "run_url=$RUN_URL"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Create repair ticket or update existing open ticket
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_BOTS: ${{ steps.summary.outputs.failed_bots }}
          RUN_URL: ${{ steps.summary.outputs.run_url }}
          HEAD_SHA: ${{ steps.summary.outputs.head_sha }}
        run: |
          TITLE="[Arcade Test Fleet] Browser checks failed"
          BODY=$(cat <<EOF
          ## Automated arcade test failure

          - **Failed agents:** ${FAILED_BOTS:-Unknown}
          - **Commit:** ${HEAD_SHA}
          - **Workflow evidence:** ${RUN_URL}

          ## Repair protocol
          - [ ] Download the failed agent's \`arcade-test-results-*\` artifact and identify the first actionable failure.
          - [ ] Reproduce the failure locally; distinguish a game defect from a live-site/network/deployment issue.
          - [ ] Create a dedicated fix branch and make the smallest targeted change.
          - [ ] Add or update a regression check for the exact failure.
          - [ ] Run the full arcade browser suite and relevant static/API checks.
          - [ ] Open a pull request with root cause, changed files, test evidence, and rollback notes.
          - [ ] Human reviewer approves and merges only after checks pass.

          **Safety:** This ticket is diagnostic evidence, not permission to edit production automatically. The fleet never pushes a repair or merges a pull request on its own.

          ---
          Updated from workflow run: ${RUN_URL}
          EOF
          )
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search '"[Arcade Test Fleet] Browser checks failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$BODY"
            echo "Updated existing repair issue #$EXISTING"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          fi
