name: Roads, Rooftop Riot & Not Dead Yet Quality Gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/arcade/hosted/roads-of-cinder/**"
      - "public/not-dead-yet.html"
      - "public/not-dead-yet-overhaul.css"
      - "public/arcade/hosted/rooftop-riot/**"
      - "scripts/test-life-games.mjs"
      - "scripts/arcade-road-zombie-rebuild.test.mjs"
      - "scripts/arcade-road-zombie-browser.mjs"
      - "scripts/arcade-rooftop-zombie-browser.mjs"
      - "scripts/arcade-rooftop-colossus.test.mjs"
      - ".github/workflows/roads-zombie-overhaul.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/arcade/hosted/roads-of-cinder/**"
      - "public/not-dead-yet.html"
      - "public/not-dead-yet-overhaul.css"
      - "public/arcade/hosted/rooftop-riot/**"
      - "scripts/test-life-games.mjs"
      - "scripts/arcade-road-zombie-rebuild.test.mjs"
      - "scripts/arcade-road-zombie-browser.mjs"
      - "scripts/arcade-rooftop-zombie-browser.mjs"
      - "scripts/arcade-rooftop-colossus.test.mjs"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate the life-game engine and old Conway distinction
        run: node scripts/test-life-games.mjs
      - name: Run life-board and zombie-campaign regressions
        run: node --test scripts/arcade-road-zombie-rebuild.test.mjs scripts/arcade-rooftop-colossus.test.mjs
      - name: Check scripts for syntax errors
        run: |
          node --check public/arcade/hosted/roads-of-cinder/engine.js
          node --check public/arcade/hosted/roads-of-cinder/view.js
          node --check public/arcade/hosted/rooftop-riot/engine.js
          node --check public/arcade/hosted/rooftop-riot/view.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Chromium for real device smoke checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local arcade server
        run: |
          python3 -m http.server 8765 --directory public > /tmp/road-zombie-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/not-dead-yet.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/road-zombie-http.log
          exit 1
      - name: Exercise both games on desktop and mobile
        env:
          ARCADE_TEST_BASE: http://127.0.0.1:8765
        run: |
          node scripts/arcade-road-zombie-browser.mjs
          node scripts/arcade-rooftop-zombie-browser.mjs
      - name: Collect server log on failure
        if: failure()
        run: cat /tmp/road-zombie-http.log || true
