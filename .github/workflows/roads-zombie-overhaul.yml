name: Roads of Cinder & Not Dead Yet Overhaul Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/arcade/hosted/roads-of-cinder/**"
      - "public/not-dead-yet.html"
      - "scripts/test-life-games.mjs"
      - "scripts/arcade-road-zombie-rebuild.test.mjs"
      - ".github/workflows/roads-zombie-overhaul.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/arcade/hosted/roads-of-cinder/**"
      - "public/not-dead-yet.html"
      - "scripts/test-life-games.mjs"
      - "scripts/arcade-road-zombie-rebuild.test.mjs"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate the life-game engine and old Conway distinction
        run: node scripts/test-life-games.mjs
      - name: Run life-board and zombie-campaign regressions
        run: node --test scripts/arcade-road-zombie-rebuild.test.mjs
      - name: Check scripts for syntax errors
        run: |
          node --check public/arcade/hosted/roads-of-cinder/engine.js
          node --check public/arcade/hosted/roads-of-cinder/view.js
