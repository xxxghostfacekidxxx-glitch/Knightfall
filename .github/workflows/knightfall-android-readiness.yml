name: Knightfall Android release readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/knightfall-android-readiness.yml'

permissions:
  contents: read
  actions: write

jobs:
  signed-candidate-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_KEYSTORE: ${{ secrets.KNIGHTFALL_ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_STORE_PASSWORD: ${{ secrets.KNIGHTFALL_ANDROID_KEYSTORE_PASSWORD != '' }}
      HAS_ALIAS: ${{ secrets.KNIGHTFALL_ANDROID_KEY_ALIAS != '' }}
      HAS_KEY_PASSWORD: ${{ secrets.KNIGHTFALL_ANDROID_KEY_PASSWORD != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check protected signing setup without reading or printing secret values
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_KEYSTORE" != true || "$HAS_STORE_PASSWORD" != true || "$HAS_ALIAS" != true || "$HAS_KEY_PASSWORD" != true ]]; then
            echo 'Android production release signing: owner setup is needed.' >> "$GITHUB_STEP_SUMMARY"
            echo 'No signed candidate was started; no private signing data was generated or exposed.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Use scripts/bootstrap-android-signing.sh on the owner-controlled device.' >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'All four protected Android signing secrets are configured. Starting signed candidate build without public release.' >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Start owner-controlled signed Android candidate
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run knightfall-android-release.yml \
            --repo "$GH_REPO" --ref main \
            -f version_name=0.2.0 \
            -f version_code=2 \
            -f stage_asset_links=true \
            -f publish_public_release=false \
            -f physical_test_confirmation=NOT_TESTED
          echo 'Signed candidate dispatched. Real-device QA is still mandatory before public distribution.' >> "$GITHUB_STEP_SUMMARY"
