name: Clean up merged selected-game staging branch
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  remove-merged-staging:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'staging/selected-open-source-games-14-15'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged game-import staging branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/staging/selected-open-source-games-14-15" \
            || echo "Staging branch already removed or deletion not permitted."
