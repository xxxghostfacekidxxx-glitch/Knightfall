name: Stage Permitted Browser Game Sources
on:
  workflow_dispatch:
  schedule:
    - cron: '31 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect upstream repositories without publishing copyrighted game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-audit
          : > upstream-audit/report.txt
          repos=(
            gd4Ark/star-battle
            njecolina/Single-HTML-Space-Shooter
            piecioshka/7balls
            osman144/DragonBall-Z-game
            AntonovAtanas/Star-Wars-Browser-Game
            johnchampaign/star-wars-rebellion
            leosaiyanx/dragon_ball_z_saiyan_cephas
            gald89/super-saiya-densetsu-2
            kushvr7/DRAGON-BALL-GAME
            imStav/dbz-js
            mclol0/dbzfe_open
            emswann/StarWarsRPG
            Virtastic/jka-web
          )
          for repo in "${repos[@]}"; do
            name="${repo##*/}"
            echo "Inspecting ${repo}"
            if ! git clone --depth=1 "https://github.com/${repo}.git" "upstream-audit/${name}"; then
              echo "::warning::Unable to clone ${repo}"
              continue
            fi
            # Record actionable licensing/build evidence, not just filenames in job logs.
            {
              echo "## ${repo}"
              echo "Commit: $(git -C "upstream-audit/${name}" rev-parse HEAD)"
              echo "License candidates:"
              find "upstream-audit/${name}" -maxdepth 3 -type f \( -iname '*licen*' -o -iname '*copying*' \) -not -path '*/node_modules/*' | head -20
              echo "Browser entrypoints:"
              find "upstream-audit/${name}" -maxdepth 3 -type f \( -name 'index.html' -o -name 'package.json' \) -not -path '*/node_modules/*' | head -20
              echo "Potentially restricted artwork:"
              find "upstream-audit/${name}" -maxdepth 4 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.webp' -o -iname '*.mp3' \) | head -20
              echo
            } >> upstream-audit/report.txt
          done
          echo "Source availability is not permission to redistribute third-party franchise assets." >> upstream-audit/report.txt
          cat upstream-audit/report.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("upstream-audit")
          projects=[]
          for folder in sorted(root.iterdir()):
            if not folder.is_dir(): continue
            license_files=[str(p.relative_to(folder)) for p in folder.rglob("*") if p.is_file() and p.name.lower().startswith(("license","copying")) and len(p.relative_to(folder).parts)<=3]
            entrypoints=[str(p.relative_to(folder)) for p in folder.rglob("index.html") if len(p.relative_to(folder).parts)<=4]
            projects.append({"project":folder.name,"licenseCandidates":license_files[:20],"browserEntrypoints":entrypoints[:20],"status":"manual asset and license review required"})
          (root/"machine-readable-review.json").write_text(json.dumps({"projects":projects,"automaticallyApprovedForHosting":False},indent=2))
          print(f"Generated machine-readable review for {len(projects)} fetched projects; none automatically approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: franchise-upstream-license-audit
          path: upstream-audit/
          retention-days: 7
