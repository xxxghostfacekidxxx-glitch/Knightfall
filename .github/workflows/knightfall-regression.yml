name: Knightfall smoke and regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/monster-mmo.js
          node --check public/arcade-save.js
          node --check public/monster-mmo-moves.js
          node --check scripts/messages-history-cursor.test.mjs
          node --check scripts/devil-tools-icon-choices.test.mjs
          node --check scripts/monster-recovered-sprites.test.mjs
          node --check scripts/arcade-revision-migration.test.mjs
          node --check scripts/archived-arcade-features.test.mjs
          node --check scripts/arcade-bridge-manifest.test.mjs
          node --check scripts/selected-open-source-games.test.mjs
          node --check public/arcade/nextgen.js
          node --check public/arcade/hosted/ashfall-neon-engine.js
          node --check scripts/arcade-nextgen-visual.test.mjs
          node --check scripts/arcade-neon-surge.test.mjs
          node --check scripts/arcade-embervale.test.mjs
          node --check scripts/arcade-embervale-expansion.test.mjs
          node --check public/arcade/hosted/embervale/js/world.js
          node --check public/arcade/hosted/embervale/js/entities.js
          node --check public/arcade/hosted/embervale/js/game.js
          node --check public/arcade/hosted/embervale/js/knightfall-expansion.js
          node --check public/arcade/hosted/embervale/js/knightfall-touch.js
      - name: Run focused regression tests
        run: |
          node --test scripts/arcade-nextgen-visual.test.mjs
          node --test scripts/arcade-neon-surge.test.mjs
          node --test scripts/arcade-embervale.test.mjs
          node --test scripts/arcade-embervale-expansion.test.mjs
          node --test scripts/admin-offline-paths.test.mjs
          node --test scripts/messages-history-cursor.test.mjs scripts/monster-mmo-moves.test.mjs scripts/devil-tools-icon-choices.test.mjs scripts/monster-recovered-sprites.test.mjs scripts/arcade-revision-migration.test.mjs scripts/archived-arcade-features.test.mjs scripts/arcade-bridge-manifest.test.mjs scripts/selected-open-source-games.test.mjs
