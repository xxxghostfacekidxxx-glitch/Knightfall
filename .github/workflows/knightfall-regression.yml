name: Knightfall smoke and regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/monster-mmo.js
          node --check public/arcade/hosted/cinderwild/game.js
          node --check public/arcade/hosted/cinderwild/cloud-sync.js
          node --check public/arcade/hosted/cinderwild/online-world.js
          node --check backend/src/cinderwild-online-world.js
          node --check backend/src/cinderwild-world-rules.mjs
          node --check public/personal-bots.js
          node --check public/bot-creator-pro.js
          node --check public/profile.js
          node --check public/sw.js
          node --check public/chat-bubbles.js
          node --check public/message-live.js
          node --check backend/src/message-search.js
          node --check backend/src/message-conversation-summary.js
          node --check backend/src/messaging-live.js
          node --check public/miss-chaos-presence.js
          node --check backend/src/bot-creator-access.js
          node --check backend/src/staff-capabilities.js
          node --check backend/src/eye-of-horus.js
          node --check backend/src/god-trash.js
          node --check backend/src/date-journal.js
          node --check backend/src/member-memos.js
          node --check backend/src/member-memo-mail.js
          node --check public/eye-of-horus.js
          node --check backend/src/home-activity-feed.js
          node --check public/home-activity.js
          node --check backend/src/index.js
          node --check backend/src/privacy-assistance.js
          node --check public/arcade-save.js
          node --check public/monster-mmo-moves.js
          node --check scripts/messages-history-cursor.test.mjs
          node --check scripts/devil-tools-icon-choices.test.mjs
          node --check scripts/monster-recovered-sprites.test.mjs
          node --check scripts/arcade-revision-migration.test.mjs
          node --check scripts/archived-arcade-features.test.mjs
          node --check scripts/arcade-bridge-manifest.test.mjs
          node --check scripts/selected-open-source-games.test.mjs
          node --check public/arcade/nextgen.js
          node --check public/arcade/hosted/ashfall-neon-engine.js
          node --check scripts/arcade-nextgen-visual.test.mjs
          node --check scripts/arcade-neon-surge.test.mjs
          node --check scripts/arcade-embervale.test.mjs
          node --check scripts/arcade-embervale-expansion.test.mjs
          node --check public/arcade/hosted/embervale/js/world.js
          node --check public/arcade/hosted/embervale/js/entities.js
          node --check public/city-of-cinders-world.js
          node --check scripts/city-of-cinders-destruction.test.mjs
          node --check public/arcade/hosted/embervale/js/game.js
          node --check public/arcade/hosted/embervale/js/knightfall-expansion.js
          node --check public/arcade/hosted/embervale/js/knightfall-touch.js
      - name: Inventory live stylesheet references and duplicate arcade entry links
        run: node scripts/css-route-inventory.mjs
      - name: Inventory exact CSS rule duplication
        run: node scripts/css-rule-dedup.mjs --check
      - name: Run focused regression tests
        run: |
          node --check public/business-metrics-report.js
          node --test scripts/home-start.test.mjs scripts/business-metrics-report.test.mjs backend/src/business-metrics.test.mjs
          node --test scripts/public-legal-and-shop-theme.test.mjs
          node --test backend/src/mascot-payments.test.mjs
          node --test backend/src/eye-of-chaos.test.mjs scripts/eye-of-chaos-ui.test.mjs
          python3 scripts/test_eye_of_chaos_sql.py
          node --test scripts/cinderwild-qol.test.mjs
          node --test scripts/cinderwild-cloud-sync.test.mjs
          node --test scripts/cinderwild-world-rules.test.mjs
          node --test backend/src/cinderwild-online-world.test.mjs
          node --test scripts/cinderwild-online-ui.test.mjs
          node --test scripts/password-reset-security.test.mjs
          node --test scripts/message-native-limit.test.mjs
          node --test scripts/digital-creator-access.test.mjs
          node --test scripts/chat-notification-routing.test.mjs scripts/mobile-message-notification.test.mjs scripts/push-navigation.test.mjs scripts/messaging-quality.test.mjs
          node --test backend/src/message-search.test.mjs backend/src/messaging-live.test.mjs scripts/message-realtime-client.test.mjs
          node --test scripts/messaging-refresh-performance.test.mjs scripts/messaging-mobile-invites.test.mjs scripts/messaging-repeat-send.test.mjs
          node --test backend/src/message-conversation-summary.test.mjs scripts/messaging-history-deeplink.test.mjs
          node --test backend/src/date-journal.test.mjs
          node --test scripts/privacy-assistance.test.mjs
          node --test scripts/bot-creator-access.test.mjs backend/src/home-activity-feed.test.mjs backend/src/staff-capabilities.test.mjs backend/src/eye-of-horus.test.mjs backend/src/god-trash.test.mjs
          python3 scripts/test_eye_of_horus_sql.py
          python3 scripts/test_home_bot_tiers_sql.py
          node --test scripts/knightfall-art-rollout.test.mjs
          node --test scripts/knightfall-art-motion.test.mjs
          node --test scripts/knightfall-android-shell.test.mjs
          node --test scripts/android-release-assets.test.mjs
          node --test scripts/arcade-nextgen-visual.test.mjs
          node --test scripts/arcade-neon-surge.test.mjs
          node --test scripts/arcade-embervale.test.mjs
          node --test scripts/arcade-embervale-expansion.test.mjs
          node --test scripts/city-of-cinders-destruction.test.mjs
          node --test scripts/infernal-reign-upgrades.test.mjs
          node --test scripts/admin-offline-paths.test.mjs scripts/admin-offline-install.test.mjs scripts/messages-composer-races.test.mjs
          node --test scripts/messages-history-cursor.test.mjs scripts/monster-mmo-moves.test.mjs scripts/devil-tools-icon-choices.test.mjs scripts/monster-recovered-sprites.test.mjs scripts/arcade-revision-migration.test.mjs scripts/archived-arcade-features.test.mjs scripts/arcade-bridge-manifest.test.mjs scripts/selected-open-source-games.test.mjs
