name: Knightfall Runtime Smoke Test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'backend/src/**'
      - 'backend/package.json'
      - 'scripts/cloudflare-free-config.test.mjs'
      - 'scripts/security-headers.test.mjs'
      - 'scripts/push-navigation.test.mjs'
      - 'scripts/nav-offline-api.test.mjs'
      - 'scripts/mobile-push-recovery.test.mjs'
      - 'scripts/mobile-message-notification.test.mjs'
      - 'scripts/mobile-push-browser-smoke.mjs'
      - 'scripts/registration-release.test.mjs'
      - 'scripts/turnstile-ui.test.mjs'
      - 'scripts/notification-queue.test.mjs'
      - 'scripts/push-retry-policy.test.mjs'
      - 'scripts/astrology.test.mjs'
      - 'scripts/cosmic-chart.test.mjs'
      - 'scripts/cosmic-atlas.test.mjs'
      - 'scripts/cosmic-lexicon.test.mjs'
      - 'public/cosmic-lexicon.js'
      - 'scripts/cosmic-geo-timezone.test.mjs'
      - 'public/cosmic-place-timezone.js'
      - 'public/vendor/tz-lookup.js'
      - 'scripts/cosmic-atlas-browser.mjs'
      - 'scripts/cosmic-member-browser.mjs'
      - 'scripts/profile-birth-chart.test.mjs'
      - 'scripts/miss-chaos-ux.test.mjs'
      - 'scripts/miss-chaos-memo.test.mjs'
      - 'backend/src/member-memo-mail.test.mjs'
      - 'scripts/miss-chaos-memo-browser.mjs'
      - 'scripts/messaging-consecutive-browser.mjs'
      - 'scripts/miss-chaos-stream.test.mjs'
      - 'scripts/pwa-update-audit.test.mjs'
      - 'scripts/profile-navigation.test.mjs'
      - 'scripts/profile-community-overhaul.test.mjs'
      - 'scripts/profile-community-browser.mjs'
      - 'scripts/profile-wall-ui.test.mjs'
      - 'backend/src/profile-wall.test.mjs'
      - 'scripts/profile-studio-next.test.mjs'
      - 'scripts/profile-photo-studio.test.mjs'
      - 'scripts/profile-link-hub.test.mjs'
      - 'backend/src/profile-links.test.mjs'
      - 'scripts/profile-studio-browser.mjs'
      - 'backend/src/starter-public-bots.test.mjs'
      - 'scripts/public-bot-starters.test.mjs'
      - 'scripts/starter-bots-browser.mjs'
      - 'backend/migrations/**'
      - 'backend/wrangler.jsonc'
      - 'wrangler.jsonc'
      - 'scripts/static-audit.mjs'
      - 'scripts/html-audit-metadata.py'
      - 'scripts/card-room-runtime.test.mjs'
      - 'scripts/push-notifications-audit.mjs'
      - 'scripts/account-deletion-audit.mjs'
      - 'scripts/test_account_deletion_migration.py'
      - 'scripts/privacy-assistance.test.mjs'
      - 'scripts/privacy-assistance-browser.mjs'
      - 'scripts/admin-offline-browser-smoke.cjs'
      - 'scripts/pwa-browser-smoke.mjs'
      - 'scripts/arcade-browser-smoke.mjs'
      - 'scripts/arcade-leaderboard-browser-smoke.mjs'
      - 'scripts/arcade-leaderboards.test.mjs'
      - 'scripts/arcade-mini-save-validation.test.mjs'
      - 'scripts/admin-task-navigation.test.mjs'
      - 'scripts/navigation-redirects.test.mjs'
      - 'scripts/site-link-integrity.mjs'
      - 'scripts/smoke-navigation.mjs'
      - 'scripts/build-arcade-catalog.mjs'
      - 'scripts/messaging-theme-audit.mjs'
      - 'scripts/site-theme-audit.mjs'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Knightfall API"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knightfall-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install astronomy dependency
        run: npm install --prefix backend --no-audit --no-fund
      - name: Verify birth charts, card-room rules and offline navigation
        run: node --test scripts/astrology.test.mjs scripts/profile-birth-chart.test.mjs scripts/cosmic-chart.test.mjs scripts/cosmic-atlas.test.mjs scripts/cosmic-lexicon.test.mjs scripts/cosmic-geo-timezone.test.mjs scripts/card-room-runtime.test.mjs scripts/nav-offline-api.test.mjs
      - name: Verify public profile hub, privacy, and custom themes
        run: node --test scripts/profile-community-overhaul.test.mjs
      - name: Check profile wall data access, reactions and comment moderation
        run: node --test backend/src/profile-wall.test.mjs scripts/profile-wall-ui.test.mjs && node --check public/profile-wall.js
      - name: Validate rebuilt profile editor and crop/save code
        run: |
          node --test scripts/profile-navigation.test.mjs scripts/profile-studio-next.test.mjs scripts/profile-photo-studio.test.mjs scripts/profile-link-hub.test.mjs backend/src/profile-links.test.mjs
          node --check public/profile-studio-next.js
          node --check public/profile-photo-studio.js
          node --check public/profile-links-editor.js
          node --check public/profile-links-view.js
          node --check backend/src/profile-links.js
      - name: Verify twelve official public starter bots, safe directory and real AI chat routing
        run: |
          node --test backend/src/starter-public-bots.test.mjs scripts/public-bot-starters.test.mjs
          node --check backend/src/starter-public-bots.js
          node --check public/bots.js
          node --check public/bot-public.js
      - name: Verify memo API, floating dock and member quick-send
        run: |
          node --test backend/src/member-memos.test.mjs backend/src/member-memo-mail.test.mjs scripts/miss-chaos-memo.test.mjs
          node --check public/memo-pad.js
          node --check public/memo-communications.js
          node --check public/miss-chaos-dock.js
          node --check public/miss-chaos-presence.js
          node --check backend/src/member-memos.js
          node --check backend/src/member-memo-mail.js
      - name: Verify messaging uses neon palette (no retired orange)
        run: node scripts/messaging-theme-audit.mjs
      - name: Guard unified neon/yellow design system and protected surfaces
        run: node scripts/site-theme-audit.mjs
      - name: Verify admin task navigation and permissions contract
        run: node --test scripts/admin-task-navigation.test.mjs
      - name: Verify canonical URLs and redirect targets
        run: node --test scripts/navigation-redirects.test.mjs
      - name: Audit internal links across first-party public pages
        run: node scripts/site-link-integrity.mjs
      - name: Validate mini-game save snapshots
        run: node --test scripts/arcade-mini-save-validation.test.mjs
      - name: Check arcade scoreboard and generated catalog consistency
        run: node --test scripts/arcade-leaderboards.test.mjs && node --check public/arcade-leaderboards.js && node --check backend/src/index.js
      - name: Reproduce and prevent Android push registration failures
        run: node --check public/sw.js && node --test scripts/mobile-push-recovery.test.mjs scripts/mobile-message-notification.test.mjs scripts/push-navigation.test.mjs scripts/push-retry-policy.test.mjs
      - name: Test D1 account deletion request migration and uniqueness
        run: python3 -m unittest discover -s scripts -p 'test_account_deletion_migration.py' -v
      - name: Audit JavaScript, configs, and local HTML assets
        run: node --check public/sw.js && node --check public/nav.js && node --check public/miss-chaos.js && node --check public/cosmic-chart.js && node --check public/cosmic-lexicon.js && node --check public/cosmic-insights.js && node --check public/cosmic-place-timezone.js && node --check public/vendor/tz-lookup.js && node --check public/cosmic-timezone.js && node --check backend/src/index.js && node scripts/static-audit.mjs && node --test scripts/security-headers.test.mjs scripts/registration-release.test.mjs scripts/turnstile.test.mjs scripts/turnstile-ui.test.mjs scripts/notification-queue.test.mjs scripts/push-retry-policy.test.mjs scripts/cloudflare-free-config.test.mjs scripts/push-navigation.test.mjs && node scripts/push-notifications-audit.mjs && node scripts/account-deletion-audit.mjs && node --test scripts/astrology.test.mjs scripts/profile-birth-chart.test.mjs scripts/miss-chaos-ux.test.mjs scripts/miss-chaos-stream.test.mjs scripts/pwa-update-audit.test.mjs scripts/profile-navigation.test.mjs

  arcade-browser-smoke:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --directory public > /tmp/knightfall-static.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/chaos-cartridge.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/knightfall-static.log
          exit 1
      - name: Exercise navigation, login roles and legacy bookmarks on mobile and desktop
        run: node scripts/smoke-navigation.mjs
      - name: Exercise Cosmic Atlas on Android and desktop (natal, focus, transits)
        run: node scripts/cosmic-atlas-browser.mjs
      - name: Verify profile-to-Miss-Chaos published-chart comparison and privacy on mobile
        run: node scripts/cosmic-member-browser.mjs
      # Run the Playwright smoke suite for desktop and mobile regressions.
      - name: Browse starter bots and chat on desktop and Android
        run: node scripts/starter-bots-browser.mjs
      - name: Exercise Profile Studio desktop and Android editing, crop and save flows
        run: node scripts/profile-studio-browser.mjs
      - name: Exercise member profile hub owner and visitor on Android and desktop
        run: node scripts/profile-community-browser.mjs
      - name: Exercise PWA start page, icons, shortcuts, and mobile policy pages
        run: node scripts/pwa-browser-smoke.mjs
      - name: Exercise public privacy assistance and staff queue at phone/desktop widths
        run: node scripts/privacy-assistance-browser.mjs
      - name: Verify offline installation and disconnected game playback
        run: node scripts/admin-offline-browser-smoke.cjs
      - name: Exercise Memo Mail and live chat tabs on desktop and Android
        run: node scripts/miss-chaos-memo-browser.mjs
      - name: Send two consecutive messages in an open inbox and floating chat on Android and desktop
        run: node scripts/messaging-consecutive-browser.mjs
      - name: Exercise Android push enablement and subscription recovery
        run: node scripts/mobile-push-browser-smoke.mjs
      - name: Exercise arcade community leaderboards on desktop and mobile
        run: node scripts/arcade-leaderboard-browser-smoke.mjs
      - name: Exercise hosted arcade cabinets in mobile Chromium
        run: node scripts/arcade-browser-smoke.mjs
      - name: Verify deployed arcade in mobile Chromium
        if: github.event_name != 'pull_request'
        env:
          ARCADE_TEST_BASE: https://ash-fall.com
        run: node scripts/arcade-browser-smoke.mjs

  live-smoke:
    needs: static-audit
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public API, bot/shop directories, CORS, and security headers
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.ash-fall.com'
          body=$(mktemp)
          headers=$(mktemp)
          trap 'echo "::error::Public API smoke failed at line $LINENO"; head -c 2000 "$body"' ERR
          code=$(curl -sS -o "$body" -w '%{http_code}' "$base/health")
          echo "health=$code $(cat "$body")"
          test "$code" = 200
          grep -q '"ok":true' "$body"
          grep -q '"database":true' "$body"
          # Prevent a healthy D1 connection from masking a missing release-critical migration.
          grep -q '"deletion_requests_ready":true' "$body"
          settings_code=$(curl -sS -o "$body" -w '%{http_code}' "$base/api/site-settings")
          test "$settings_code" = 200
          maintenance=false
          if grep -q '"maintenance_mode":"true"' "$body"; then maintenance=true; fi
          chaos_enabled=true
          if grep -q '"feature_miss_chaos":"false"' "$body"; then chaos_enabled=false; fi
          # Public profile galleries should respond for an existing member after the profile-media migration.
          photos_code=$(curl -sS -o "$body" -w '%{http_code}' "$base/api/profile/photos?username=knightfall")
          photos_expected=200
          if [ "$maintenance" = true ]; then photos_expected=503; fi
          echo "profile-gallery=$photos_code expected=$photos_expected $(cat "$body" | head -c 250)"
          test "$photos_code" = "$photos_expected"
          if [ "$photos_code" = 200 ]; then grep -q '"photos":' "$body"; fi
          for endpoint in /api/public-bots /api/shops /api/categories /api/threads; do
            code=$(curl -sS -o "$body" -w '%{http_code}' "$base$endpoint")
            expected=200
            if [ "$maintenance" = true ]; then expected=503; fi
            echo "$endpoint=$code expected=$expected $(cat "$body" | head -c 250)"
            test "$code" = "$expected"
          done
          # Verify all twelve official starter bots on the deployed API without running AI inference.
          if [ "$maintenance" = false ]; then
            starter_code=$(curl -sS -o "$body" -w '%{http_code}' "$base/api/public-bots")
            test "$starter_code" = 200
            python3 - "$body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          bots=[b for b in data.get("bots",[]) if b.get("system_bot") is True]
          assert len(bots)==12, f"Expected 12 Knightfall Originals, got {len(bots)}"
          assert len({b["id"] for b in bots})==12
          assert all(b.get("is_nsfw") is False and b.get("owner_username")=="Knightfall" for b in bots)
          assert all("system_prompt" not in b for b in bots)
          print("Public starter catalog verified:",", ".join(b["name"] for b in bots))
          PY
            detail_code=$(curl -sS -o "$body" -w '%{http_code}' "$base/api/public-bots/0000000000000000000000000000b001")
            test "$detail_code" = 200
            python3 - "$body" <<'PY'
          import json,sys
          item=json.load(open(sys.argv[1],encoding="utf-8"))["bot"]
          assert item["name"]=="Night Shift" and item["system_bot"] is True
          assert len(item["starters"])>=3 and "system_prompt" not in item
          print("Official starter details verified")
          PY
          fi
          # The adult category stays hidden; provider-verification status requires a signed-in account.
          categories_code=$(curl -sS -o "$body" -w '%{http_code}' "$base/api/categories")
          echo "adult-category-check=$categories_code"
          test "$categories_code" = 200
          grep -q '"adult_category_locked":true' "$body"
          grep -q '"slug":"astrology"' "$body"
          if grep -q '"slug":"adults-only"' "$body"; then echo "adult category leaked to anonymous visitor"; exit 1; fi
          adult_status_code=$(curl -sS -o "$body" -w '%{http_code}' "$base/api/adult/status")
          echo "adult-status=$adult_status_code $(cat "$body")"
          test "$adult_status_code" = 401
          grep -q '"error":' "$body"
          # Read-only authorization checks: these must never create production records.
          for spec in 'GET /api/admin/overview 403' 'GET /api/admin/audit 403' 'GET /api/admin/account-deletion-requests 403' 'GET /api/admin/privacy-assistance 403' 'GET /api/account/deletion-request 401' 'POST /api/account/deletion-request 401' 'DELETE /api/account/deletion-request 401' 'GET /api/admin/settings 403' 'GET /api/admin/deleted 403' 'GET /api/admin/chaos-lab/config 403' 'POST /api/admin/chaos-lab/apply-proposal 403' 'GET /api/personal-bots 401' 'GET /api/my-shop 401' 'GET /api/vault/items 401' 'GET /api/vault/summary 401' 'GET /api/notifications 401' 'GET /api/messages/conversations 401' 'GET /api/messages/conversations/1/typing 401' 'GET /api/messages/conversations/1/reactions 401' 'POST /api/messages/1/reactions 401' 'POST /api/messages/groups 401' 'GET /api/messages/conversations/1/members 401' 'POST /api/messages/conversations/1/members 401' 'GET /api/messages/conversations/1/attachments 401' 'POST /api/messages/conversations/1/attachments 401' 'GET /api/messages/attachments/1 401' 'DELETE /api/messages/attachments/1 401' 'GET /api/friends 401' 'POST /api/profile/photos 401' 'DELETE /api/profile/photos/1 401' 'POST /api/chaos/astrology/chart 401' 'GET /api/chaos/memories 401' 'GET /api/die-ary/entries 401' 'GET /api/profile/links 401' 'PUT /api/profile/links 401'; do
            read -r method endpoint expected <<< "$spec"
            if [ "$maintenance" = true ] && [[ "$endpoint" != /api/admin/* && "$endpoint" != /api/vault/* ]]; then expected=503; fi
            if [ "$endpoint" = /api/chaos/memories ] && [ "$chaos_enabled" = false ]; then expected=503; fi
            code=$(curl -sS -o "$body" -w '%{http_code}' -X "$method" "$base$endpoint")
            echo "authorization $method $endpoint=$code expected=$expected"
            test "$code" = "$expected"
          done
          code=$(curl -sS -o "$body" -w '%{http_code}' "$base/api/auth/me")
          echo "auth-me=$code $(cat "$body")"
          test "$code" = 200
          grep -q '"user":null' "$body"
          code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' -X OPTIONS "$base/api/auth/me" -H 'Origin: https://ash-fall.com' -H 'Access-Control-Request-Method: GET')
          echo "cors=$code"
          test "$code" = 204
          grep -qi '^access-control-allow-origin: https://ash-fall.com' "$headers"
          grep -qi '^access-control-allow-credentials: true' "$headers"
          curl -sS -D "$headers" -o /dev/null "$base/health"
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^x-frame-options: DENY' "$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$headers"
