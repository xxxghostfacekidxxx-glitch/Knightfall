name: Verify existing advanced static game editions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-advanced-static-games.yml'
      - 'public/arcade/hosted/interstellar-armada/**'
      - 'public/arcade/hosted/browserquest-solo/**'
      - 'public/arcade/hosted/openfront-solo/**'
      - 'scripts/advanced-games/verify.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate hosted games and canonical catalog without staging branches
        run: |
          python3 scripts/advanced-games/verify.py
          node --test scripts/arcade-shelf-dedup.test.mjs
