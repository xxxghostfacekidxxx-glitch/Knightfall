      - 'public/miss-chaos.html'
      - 'public/miss-chaos-experience.css'
      - 'public/miss-chaos-chat-format.js'
      - 'public/miss-chaos-realm.html'
      - 'public/realm-theme-engine.css'
      - 'public/profile-edit.html'
      - 'public/assets/knightfall/miss-chaos/**'
      - 'scripts/miss-chaos-experience.test.mjs'
      - 'backend/chaos-voice.mjs'
      - 'public/chaos-textract*'
      - 'scripts/chaos-textract.test.mjs'
      - 'scripts/chaos-textract-lab.test.mjs'
