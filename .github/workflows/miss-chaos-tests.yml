name: Miss Chaos Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/chaos-*'
      - 'backend/src/chaos-companion.mjs'
      - 'backend/src/chaos-chat-image.js'
      - 'backend/src/chaos-chat-image.test.mjs'
      - 'public/chaos-chat-image-picker*'
      - 'public/miss-chaos.js'
      - 'public/miss-chaos.html'
      - 'public/miss-chaos-presence*'
      - 'public/nav.js'
      - 'public/memo-pad.js'
      - 'public/memo-pad.css'
      - 'public/memo-pad.html'
      - 'scripts/miss-chaos-memo.test.mjs'
      - 'scripts/miss-chaos-private-switch.test.mjs'
      - 'public/miss-chaos-dock.js'
      - 'public/miss-chaos-field-kit.mjs'
      - 'public/chaos-crucible*'
      - 'scripts/chaos-crucible.test.mjs'
      - 'scripts/chaos-crucible-progress.test.mjs'
      - 'scripts/miss-chaos-field-kit.test.mjs'
      - 'public/creator-art-studio*'
      - 'public/devil-tools.html'
      - 'scripts/miss-chaos-image-ui.test.mjs'
      - 'scripts/miss-chaos-image-browser.mjs'
      - 'public/samantha-chaos*'
      - 'public/chaos-code-studio*'
      - 'public/chaos-visual-lab*'
      - 'scripts/chaos-visual-lab-ui.test.mjs'
      - 'scripts/chaos-visual-lab-libraries.test.mjs'
      - 'scripts/chaos-visual-effects.test.mjs'
      - 'public/chaos-visual-effects.mjs'
      - 'public/chaos-openverse.mjs'
      - 'public/vendor/visual-lab/**'
      - 'public/ai-handoff.html'
      - 'backend/src/ai-handoff.js'
      - 'scripts/chaos-code-studio-ui.test.mjs'
      - 'scripts/samantha-chaos-ui.test.mjs'
      - '.github/workflows/miss-chaos-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies for parser tests
        run: npm install --prefix backend --no-audit --no-fund
      - run: node --test backend/chaos-*.test.mjs backend/offline-bot-cache.test.mjs
      - name: Verify Code Studio interface and client syntax
        run: node --check public/chaos-code-studio.js && node --test scripts/chaos-code-studio-ui.test.mjs
      - name: Verify privacy-preserving member Chaos Visual Lab
        run: |
          node --check public/chaos-visual-lab.js
          node --check public/chaos-openverse.mjs
          node --check public/chaos-visual-effects.mjs
          node --check public/vendor/visual-lab/pica.min.mjs
          node --check public/vendor/visual-lab/qrcode.mjs
          node --check public/vendor/visual-lab/imagetracer.js
          node --test scripts/chaos-visual-lab-ui.test.mjs scripts/chaos-visual-lab-libraries.test.mjs scripts/chaos-visual-effects.test.mjs
      - name: Verify Crucible original project briefs and safe chat draft handoff
        run: |
          node --check public/chaos-crucible-core.mjs
          node --check public/chaos-crucible.mjs
          node --check public/chaos-crucible-progress.mjs
          node --test scripts/chaos-crucible.test.mjs scripts/chaos-crucible-progress.test.mjs
      - name: Verify Miss Chaos floating dock, private modes and memo publishing
        run: |
          node --check public/nav.js
          node --check public/memo-pad.js
          node --check public/miss-chaos-presence.js
          node --check public/miss-chaos-dock.js
          node --check public/miss-chaos-field-kit.mjs
          node --test scripts/miss-chaos-private-switch.test.mjs scripts/miss-chaos-memo.test.mjs scripts/miss-chaos-field-kit.test.mjs
      - name: Verify Android photo-picker, private popup and ephemeral AI image chat
        run: |
          node --check public/miss-chaos-presence.js
          node --check public/miss-chaos-dock.js
          node --check public/miss-chaos.js
          node --check public/chaos-chat-image-picker.mjs
          node --check public/creator-art-studio.js
          node --check backend/src/chaos-chat-image.js
          node --test scripts/miss-chaos-image-ui.test.mjs backend/src/chaos-chat-image.test.mjs
      - name: Verify private Samantha companion and relay UI
        run: node --check public/samantha-chaos.js && node --test scripts/samantha-chaos-ui.test.mjs
