name: Nightly Knightfall security and arcade checks

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knightfall-nightly-quality
  cancel-in-progress: true

jobs:
  code-and-arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install backend test dependency
        run: npm install --prefix backend --no-audit --no-fund
      - name: Audit source and authorization boundaries
        run: |
          node scripts/static-audit.mjs
          node scripts/push-notifications-audit.mjs
          node scripts/account-deletion-audit.mjs
          node scripts/security-surface-inventory.mjs
          node --test scripts/turnstile.test.mjs scripts/turnstile-ui.test.mjs scripts/notification-queue.test.mjs scripts/push-retry-policy.test.mjs scripts/cloudflare-free-config.test.mjs
          node --test scripts/astrology.test.mjs scripts/profile-birth-chart.test.mjs scripts/miss-chaos-ux.test.mjs scripts/miss-chaos-stream.test.mjs scripts/pwa-update-audit.test.mjs scripts/profile-navigation.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start isolated local frontend
        run: |
          python3 -m http.server 8765 --directory public > /tmp/knightfall-static.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/chaos-cartridge.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/knightfall-static.log
          exit 1
      - name: Exercise hosted arcade and PWA on mobile viewport
        run: |
          node scripts/arcade-browser-smoke.mjs
          node scripts/pwa-browser-smoke.mjs
