name: Repair notifications API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add notifications API routes if missing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/index.js')
          s=p.read_text()
          if 'url.pathname==="/api/notifications"' in s:
              print('Notifications routes already present.')
              raise SystemExit(0)
          marker='  if(url.pathname.startsWith("/api/")&&!url.pathname.startsWith("/api/auth/")&&!url.pathname.startsWith("/api/admin/")&&url.pathname!=="/api/site-settings"&&(await getSetting(env,"maintenance_mode"))==="true")'
          route='''  if(url.pathname==="/api/notifications"&&request.method==="GET"){const user=await requireUser(request,env);if(!user)return json({error:"Authentication required."},401,origin);const limit=Math.min(Math.max(Number(url.searchParams.get("limit")||50),1),100),unread=url.searchParams.get("unread")==="true";const where=unread?"AND n.read_at IS NULL":"";const {results}=await env.DB.prepare(`SELECT n.id,n.actor_id,n.kind,n.target_type,n.target_id,n.title,n.body,n.url,n.created_at,n.read_at,u.username AS actor_username FROM notifications n LEFT JOIN users u ON u.id=n.actor_id WHERE n.user_id=? ${where} ORDER BY n.created_at DESC LIMIT ?`).bind(user.id,limit).all();const count=await env.DB.prepare("SELECT COUNT(*) AS count FROM notifications WHERE user_id=? AND read_at IS NULL").bind(user.id).first();return json({notifications:results||[],unread_count:Number(count?.count||0)},200,origin);}
  const notificationMatch=url.pathname.match(/^\\/api\\/notifications\\/(\\d+)$/);if(notificationMatch&&request.method==="PATCH"){const user=await requireUser(request,env);if(!user)return json({error:"Authentication required."},401,origin);await env.DB.prepare("UPDATE notifications SET read_at=? WHERE id=? AND user_id=?").bind(new Date().toISOString(),Number(notificationMatch[1]),user.id).run();return json({ok:true},200,origin);}
  if(url.pathname==="/api/notifications/read-all"&&request.method==="POST"){const user=await requireUser(request,env);if(!user)return json({error:"Authentication required."},401,origin);await env.DB.prepare("UPDATE notifications SET read_at=? WHERE user_id=? AND read_at IS NULL").bind(new Date().toISOString(),user.id).run();return json({ok:true},200,origin);}
'''
          if marker not in s:
              raise SystemExit('Expected maintenance route marker not found.')
          s=s.replace(marker,route+marker,1)
          p.write_text(s)
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/index.js
          git commit -m 'Add missing notifications API routes'
          git push
