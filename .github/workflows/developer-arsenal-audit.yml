name: Devil's Toolkit code and security audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/developer-arsenal-audit.yml'
      - 'scripts/developer-arsenal*.mjs'
      - 'public/devil-tools.html'
      - 'public/admin-command-center.js'
      - 'public/admin-command-center.css'
      - 'docs/developer-arsenal.md'
      - 'backend/chaos-audit-summary*.mjs'
      - 'backend/chaos-capabilities.mjs'
      - 'backend/chaos-tool-dispatch.mjs'
      - 'backend/src/developer-audit-ingest.js'
      - 'backend/src/developer-audit-ingest.test.mjs'
      - 'backend/src/index.js'
  pull_request:
  workflow_dispatch:
concurrency:
  group: developer-arsenal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate key JavaScript modules
        run: |
          node --check public/open-source-arsenal.js
          node --check public/admin-command-center.js
          node --check public/nav.js
          node --check backend/chaos-tool-dispatch.mjs
          node --check backend/chaos-audit-summary.mjs
          node --check backend/src/developer-audit-ingest.js
      - name: Run existing permission and security audits
        run: |
          node scripts/security-surface-inventory.mjs
          node --test scripts/developer-arsenal.test.mjs backend/chaos-audit-summary.test.mjs backend/chaos-capabilities.test.mjs backend/src/developer-audit-ingest.test.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local, isolated web server
        run: |
          python3 -m http.server 8765 --directory public > /tmp/knightfall-devtools-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/devil-tools.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/knightfall-devtools-http.log
          exit 1
      - name: Exercise Devil Tools in mobile browser fixtures
        run: node scripts/developer-arsenal-browser.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: developer-arsenal-browser-evidence
          path: /tmp/developer-arsenal-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Biome advisory scan
        continue-on-error: true
        run: |
          npx --yes @biomejs/biome@2.2.6 lint public/open-source-arsenal.js public/admin-command-center.js backend/chaos-tool-dispatch.mjs > biome-report.txt 2>&1
          cat biome-report.txt
      - name: Install Semgrep
        run: python3 -m pip install --user 'semgrep>=1.90,<2'
      - name: Run Semgrep advisory scan
        run: |
          "$HOME/.local/bin/semgrep" scan --config p/javascript --config p/secrets --metrics=off --json --output semgrep-report.json public backend
          test -s semgrep-report.json
      - name: Produce privacy-safe security summary
        if: always()
        run: |
          if [ -s semgrep-report.json ]; then
            node scripts/developer-arsenal-summary.mjs semgrep-report.json biome-report.txt
          else
            echo "Semgrep report unavailable; no scan results can be summarized." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish sanitized counts to private Worker storage
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KNIGHTFALL_DIAGNOSTICS_INGEST_KEY: ${{ secrets.KNIGHTFALL_DIAGNOSTICS_INGEST_KEY }}
          KNIGHTFALL_DIAGNOSTICS_INGEST_URL: https://api.ash-fall.com/api/internal/developer-audit
        run: |
          if [ ! -s developer-arsenal-summary.json ]; then
            echo "No summary available; upload skipped."
            exit 0
          fi
          node scripts/developer-arsenal-upload.mjs
      - name: Explain audit evidence
        if: always()
        run: |
          {
            echo "## Devil's Toolkit Developer Arsenal"
            echo ""
            echo "- Offline regression and mobile browser fixtures run in the diagnostics job."
            echo "- Biome findings are advisory. Semgrep must complete and produce valid JSON; its findings still require review."
            echo "- No production API credentials or deployment permissions are used."
            echo ""
            echo "### Report files"
            for file in biome-report.txt semgrep-report.json; do
              if [ -s "$file" ]; then
                echo "- $file generated"
              else
                echo "- $file unavailable (check preceding steps)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Store audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-arsenal-audit
          path: |
            developer-arsenal-summary.json
            biome-report.txt
          if-no-files-found: ignore
          retention-days: 7
