name: Mascot Sanctuary Integration Tests
on:
  push:
    branches: [main]
    paths:
      - 'backend/src/mascot-pets.js'
      - 'backend/src/mascot-pets.test.mjs'
      - 'backend/src/index.js'
      - 'backend/migrations/0103_mascot_pets.sql'
      - 'backend/migrations/0104_mascot_economy.sql'
      - 'backend/migrations/0105_mascot_adventures.sql'
      - 'backend/migrations/0106_mascot_egg_reservations.sql'
      - 'backend/migrations/0107_mascot_passport.sql'
      - 'backend/migrations/0108_mascot_room_layouts.sql'
      - 'backend/migrations/0109_mascot_furniture.sql'
      - 'backend/src/mascot-furniture.js'
      - 'backend/src/mascot-furniture.test.mjs'
      - 'backend/src/mascot-room-api.js'
      - 'backend/src/mascot-room-api.test.mjs'
      - 'public/mascot-room-furniture.js'
      - 'public/mascot-room-furniture.css'
      - 'scripts/mascot-furniture-sql.test.py'
      - 'public/assets/devil-tools/neon-nuisances/furniture/**'
      - 'backend/src/mascot-room.test.mjs'
      - 'public/mascot-room.*'
      - 'public/mascot-trials.*'
      - 'public/mascot-trials-engine.mjs'
      - 'scripts/mascot-trials.test.mjs'
      - 'scripts/mascot-room-sql.test.py'
      - 'backend/src/mascot-passport.js'
      - 'backend/src/mascot-passport.test.mjs'
      - 'public/mascot-passport.js'
      - 'public/mascot-cinder-catch.js'
      - 'scripts/mascot-cinder-catch.test.mjs'
      - 'scripts/mascot-passport-sql.test.py'
      - 'public/assets/devil-tools/neon-nuisances/badges/**'
      - 'backend/src/mascot-adventures.js'
      - 'backend/src/mascot-adventures.test.mjs'
      - 'public/mascot-adventures.js'
      - 'scripts/mascot-adventures-sql.test.py'
      - 'public/assets/devil-tools/neon-nuisances/habitats/**'
      - 'public/assets/devil-tools/neon-nuisances/eggs/**'
      - 'backend/src/mascot-collectibles.js'
      - 'backend/src/member-shop-checkout.js'
      - 'scripts/mascot-economy-sql.test.py'
      - 'backend/src/mascot-payments.test.mjs'
      - 'scripts/integrate-mascot-pets.mjs'
      - 'public/mascot-pets.*'
      - 'public/profile-mascots.*'
      - 'public/assets/devil-tools/neon-nuisances/portraits/**'
      - '.github/workflows/mascot-sanctuary-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanctuary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate adoption rules, routes, ownership and privacy
        run: node --test backend/src/mascot-pets.test.mjs backend/src/mascot-payments.test.mjs backend/src/mascot-adventures.test.mjs backend/src/mascot-passport.test.mjs scripts/mascot-cinder-catch.test.mjs backend/src/mascot-room.test.mjs backend/src/mascot-room-api.test.mjs backend/src/mascot-furniture.test.mjs scripts/mascot-trials.test.mjs
      - name: Validate atomic Cinders pet rescues and accessory ownership
        run: python3 scripts/mascot-economy-sql.test.py && python3 scripts/mascot-adventures-sql.test.py && python3 scripts/mascot-passport-sql.test.py && python3 scripts/mascot-room-sql.test.py && python3 scripts/mascot-furniture-sql.test.py
      - name: Confirm Worker and browser syntax
        run: |
          node --check backend/src/index.js
          node --check backend/src/mascot-pets.js
          node --check backend/src/mascot-room-api.js
          node --check backend/src/mascot-furniture.js
          node --check public/mascot-room-furniture.js
          node --check backend/src/mascot-adventures.js
          node --check backend/src/mascot-passport.js
          node --check public/mascot-passport.js
          node --check public/mascot-cinder-catch.js
          node --check public/mascot-room.js
          node --check public/mascot-trials.js
          node --check public/mascot-trials-engine.mjs
          node --check public/mascot-adventures.js
          node --check backend/src/member-shop-checkout.js
          node --check scripts/integrate-mascot-pets.mjs
          node --check public/mascot-pets.js
          node --check public/profile-mascots.js
      - name: Check original vector art
        run: python3 scripts/devil-tools-validate-svg.py
