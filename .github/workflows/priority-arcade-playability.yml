name: Priority Arcade Playability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke-priority-arcade.mjs'
      - 'public/monster-mmo*'
      - 'public/arcade/hosted/sanctuary-*/**'
      - 'public/arcade/hosted/browserquest-solo/**'
      - 'public/arcade/hosted/fable-gta/**'
      - 'public/arcade/hosted/pikkuautot-city/**'
      - 'public/arcade/hosted/cinder-battleship/**'
      - 'public/arcade/hosted/fifteen-puzzle/**'
      - 'public/arcade/catalog.json'
      - 'public/arcade/hosted/arcade-playback-assist.js'
      - 'public/arcade-cabinet-ui.js'
      - 'public/arcade-fullscreen.js'
      - 'scripts/arcade-fullscreen-contract.test.mjs'
      - 'public/arcade/hosted/cinder-chess/index.html'
      - 'public/arcade/hosted/hex-embers/index.html'
      - 'public/arcade/hosted/radius-raid/index.html'
      - 'public/arcade/hosted/terravia/index.html'
      - 'public/arcade/hosted/interstellar-armada/index.html'
      - 'public/arcade/hosted/single-html-space-shooter/index.html'
      - 'public/arcade/hosted/cinder-life/index.html'
      - 'public/arcade/hosted/cinder-slots/index.html'
      - 'public/arcade/hosted/openfront-solo/index.html'
      - 'public/arcade/hosted/neon-surge/index.html'
      - 'scripts/arcade-playback-assist.test.mjs'
      - 'scripts/smoke-arcade-playback-assist.mjs'
      - 'scripts/smoke-arcade-render-health.mjs'
      - 'scripts/smoke-arcade-board-health.mjs'
      - 'public/arcade/hosted/ash-sudoku/**'
      - 'public/arcade/hosted/ash-veil/**'
      - 'public/arcade/hosted/cinder-gauntlet/**'
      - 'scripts/smoke-arcade-three-boot.mjs'
      - 'public/arcade/hosted/neon-mahjong/**'
      - 'public/arcade/hosted/cinder-merge/**'
      - 'public/arcade/hosted/cinder-checkers/**'
      - 'public/arcade/hosted/cinder-reversi/**'
      - 'public/arcade/hosted/cinder-mines/**'
      - 'public/arcade/hosted/cinder-slots/**'
      - 'public/arcade/hosted/cinder-life/**'
      - 'public/arcade-repair.js'
      - 'scripts/arcade-repair.test.mjs'
      - 'scripts/arcade-sw-fresh-assets.test.mjs'
      - 'public/sw.js'
      - 'public/_headers'
      - 'scripts/arcade-sharded-smoke.mjs'
      - 'public/nav.js'
      - 'scripts/smoke-navigation.mjs'
      - '.github/workflows/priority-arcade-playability.yml'
      - 'public/admin-offline/**'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify preserved fullscreen game controls
        run: node --test scripts/arcade-fullscreen-contract.test.mjs
      - name: Browser smoke test shared navigation
        run: node scripts/smoke-navigation.mjs
      - name: Verify visible and playable boards for ten arcade games (mobile and desktop)
        if: success() || failure()
        run: node scripts/smoke-arcade-board-health.mjs
      - name: Verify Ash Veil, Cinder Gauntlet and Sudoku paint and accept input on mobile and desktop
        if: success() || failure()
        run: node scripts/smoke-arcade-three-boot.mjs
      - name: Browser smoke test priority arcade games
        if: success() || failure()
        run: node scripts/smoke-priority-arcade.mjs
      - name: Validate arcade fullscreen and loading-recovery wiring
        if: success() || failure()
        run: node --test scripts/arcade-playback-assist.test.mjs scripts/arcade-repair.test.mjs scripts/arcade-asset-doctor.test.mjs scripts/arcade-sw-fresh-assets.test.mjs
      - name: Exercise fullscreen and game recovery on actual browser pages
        if: success() || failure()
        run: node scripts/smoke-arcade-playback-assist.mjs
      - name: Find black-screen or failed module startup in actual game pages
        if: success() || failure()
        run: node scripts/smoke-arcade-render-health.mjs
      - name: Upload screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority-arcade-evidence
          path: priority-arcade-evidence/
          retention-days: 7
