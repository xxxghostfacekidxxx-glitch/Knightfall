name: Order 66 scheduled research fallback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/order66-remote-research.mjs'
      - '.github/workflows/order66-research-fallback.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_run:
    workflows: ['Deploy Knightfall API']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: order66-research-fallback
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fixed public-source research and upload through scoped OIDC
        run: node scripts/order66-remote-research.mjs
