name: Integrate Mascot Sanctuary API
on:
  push:
    branches: [main]
    paths:
      - 'backend/src/mascot-pets.js'
      - 'scripts/integrate-mascot-pets.mjs'
      - '.github/workflows/integrate-mascot-pets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-mascot-pets-main
  cancel-in-progress: false
jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mount API endpoint without changing unrelated routes
        run: node scripts/integrate-mascot-pets.mjs
      - name: Confirm source compiles
        run: node --check backend/src/index.js && node --check backend/src/mascot-pets.js
      - name: Commit routing directly to main if changed
        run: |
          if git diff --quiet -- backend/src/index.js; then
            echo "Sanctuary routes already integrated."
          else
            git config user.name "knightfall-synced-automation"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/src/index.js
            git commit -m "feat(sanctuary): register mascot pets API routes in Worker"
            git push origin HEAD:main
          fi
