name: Import Sanctuary's End ARPG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-sanctuary-arpg.yml'
      - 'arcade-overrides/sanctuary/**'
permissions:
  contents: write
concurrency:
  group: sanctuary-arpg-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch open-source ARPG
        run: |
          git clone --depth 1 https://github.com/J3vb/Sanctuarys_End.git /tmp/sanctuary
          test -f /tmp/sanctuary/LICENSE
          test -f /tmp/sanctuary/CREDITS.md
          test -f /tmp/sanctuary/sanctuary.html
          grep -q 'MIT License' /tmp/sanctuary/LICENSE
          git -C /tmp/sanctuary rev-parse HEAD > /tmp/sanctuary-revision
      - name: Copy untouched original and independent Ash-Fall development fork
        run: |
          ORIGINAL=public/arcade/hosted/sanctuary-original
          DEV=public/arcade/hosted/sanctuary-end
          mkdir -p "$ORIGINAL" "$DEV"
          # Original is a clean upstream snapshot, without Ash-Fall modifications.
          rsync -a --delete --exclude='.git' --exclude='node_modules' --exclude='Server' --exclude='tests' --exclude='.github' --exclude='package-lock.json' --exclude='package.json' --exclude='jsconfig.json' --exclude='biome.json' --exclude='README.md' --exclude='ROADMAP.md' --exclude='CHANGELOG.md' /tmp/sanctuary/ "$ORIGINAL/"
          cp /tmp/sanctuary-revision "$ORIGINAL/UPSTREAM_COMMIT.txt"
          # Create dev copy only once. Never overwrite developer edits on subsequent imports.
          if [ ! -f "$DEV/sanctuary.html" ]; then
            cp -a "$ORIGINAL/." "$DEV/"
            cp /tmp/sanctuary-revision "$DEV/UPSTREAM_COMMIT.txt"
          fi
          cp arcade-overrides/sanctuary/ashfall-theme.css "$DEV/ashfall-theme.css"
          cp arcade-overrides/sanctuary/js/03-save.js "$DEV/js/03-save.js"
          cp arcade-overrides/sanctuary/js/02-skills.js "$DEV/js/02-skills.js"
          cp arcade-overrides/sanctuary/js/22-screens.js "$DEV/js/22-screens.js"
          python3 - <<'PY'
          from pathlib import Path
          original=Path('public/arcade/hosted/sanctuary-original/sanctuary.html')
          dev=Path('public/arcade/hosted/sanctuary-end/sanctuary.html')
          assert 'ashfall-theme.css' not in original.read_text(), 'Original must remain untouched'
          html=dev.read_text()
          assert '</head>' in html
          html=html.replace("<title>Sanctuary's End — 3D</title>", "<title>Ash-Fall: Infernal Reign · Development Edition</title>")
          if 'ashfall-theme.css' not in html:
              html=html.replace('</head>', '<link rel="stylesheet" href="./ashfall-theme.css">\\n</head>', 1)
          dev.write_text(html)
          PY
      - name: Validate static bundle
        run: |
          test -s public/arcade/hosted/sanctuary-original/sanctuary.html
          test -s public/arcade/hosted/sanctuary-original/LICENSE
          test -s public/arcade/hosted/sanctuary-original/CREDITS.md
          test -s public/arcade/hosted/sanctuary-end/sanctuary.html
          test -s public/arcade/hosted/sanctuary-end/LICENSE
          test -s public/arcade/hosted/sanctuary-end/CREDITS.md
          test -d public/arcade/hosted/sanctuary-end/js
          test -d public/arcade/hosted/sanctuary-end/vendor
          test -d public/arcade/hosted/sanctuary-original/js
          test -d public/arcade/hosted/sanctuary-original/vendor
          grep -q "KEY: 'sanctuarys_end_saves'" public/arcade/hosted/sanctuary-original/js/03-save.js
          grep -q "KEY: 'ashfall_sanctuary_dev_saves'" public/arcade/hosted/sanctuary-end/js/03-save.js
          grep -q "ashfall-class-emblem" public/arcade/hosted/sanctuary-end/js/22-screens.js
          grep -q "Ash Cleaver" public/arcade/hosted/sanctuary-end/js/02-skills.js
          grep -q "Hellwarden" public/arcade/hosted/sanctuary-end/js/02-skills.js
          grep -q "Hexweaver" public/arcade/hosted/sanctuary-end/js/02-skills.js
          grep -q "Voidstalker" public/arcade/hosted/sanctuary-end/js/02-skills.js
          grep -q "Ruinborn" public/arcade/hosted/sanctuary-end/js/02-skills.js
          ! grep -q "Hellwarden" public/arcade/hosted/sanctuary-original/js/02-skills.js
          grep -q 'ashfall-theme.css' public/arcade/hosted/sanctuary-end/sanctuary.html
      - name: Build installable offline app game bundles
        run: |
          mkdir -p public/admin-offline/games/original public/admin-offline/games/infernal
          rsync -a --delete public/arcade/hosted/sanctuary-original/ public/admin-offline/games/original/
          rsync -a --delete public/arcade/hosted/sanctuary-end/ public/admin-offline/games/infernal/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/admin-offline')
          files=sorted('/admin-offline/'+str(p.relative_to(root)).replace('\\','/') for p in (root/'games').rglob('*') if p.is_file())
          (root/'game-assets.json').write_text(json.dumps({'version': 'arpg-v1', 'files': files},indent=2))
          assert any(p.endswith('original/sanctuary.html') for p in files)
          assert any(p.endswith('infernal/sanctuary.html') for p in files)
          PY
      - name: Build downloadable offline game archives
        run: |
          mkdir -p /tmp/ashfall-admin-game-packages
          (cd public/arcade/hosted/sanctuary-original && zip -q -r /tmp/ashfall-admin-game-packages/sanctuary-original.zip .)
          (cd public/arcade/hosted/sanctuary-end && zip -q -r /tmp/ashfall-admin-game-packages/ashfall-infernal-reign-dev.zip .)
          unzip -tq /tmp/ashfall-admin-game-packages/sanctuary-original.zip
          unzip -tq /tmp/ashfall-admin-game-packages/ashfall-infernal-reign-dev.zip
          test -s /tmp/ashfall-admin-game-packages/sanctuary-original.zip
          test -s /tmp/ashfall-admin-game-packages/ashfall-infernal-reign-dev.zip
      - name: Upload private admin packages to R2 when credentials are configured
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::R2 credentials missing; no private download packages published."
            exit 0
          fi
          for game in sanctuary-original ashfall-infernal-reign-dev; do
            CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" npx --yes wrangler@4 r2 object put "knightfall-personal-admin-vault/admin-game-builds/$game.zip" --file "/tmp/ashfall-admin-game-packages/$game.zip" --remote
          done
      - name: Commit playable static game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arcade/hosted/sanctuary-original public/arcade/hosted/sanctuary-end /tmp/ashfall-admin-game-packages/sanctuary-original.zip /tmp/ashfall-admin-game-packages/ashfall-infernal-reign-dev.zip
          if ! git diff --cached --quiet; then
            git commit -m "vendor(arcade): import Sanctuary's End ARPG with Ash-Fall theme"
            git push
          fi
