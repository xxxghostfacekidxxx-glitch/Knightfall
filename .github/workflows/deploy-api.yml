name: Deploy Knightfall API

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/package.json'
      - 'backend/migrations/**'
      - 'backend/src/profile-wall.test.mjs'
      - 'scripts/profile-wall-ui.test.mjs'
      - 'backend/wrangler.jsonc'
      - 'public/index.html'
      - 'public/arcade/catalog.json'
      - 'public/lunar-phases.mjs'
      - 'public/shadow-prompts.mjs'
      - 'scripts/registration-release.test.mjs'
      - 'scripts/turnstile.test.mjs'
      - 'scripts/turnstile-ui.test.mjs'
      - 'scripts/profile-wall-ui.test.mjs'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-knightfall-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install astronomy dependency
        run: npm install --prefix backend --no-audit --no-fund

      - name: Validate official starter-bot catalog and public chat routing
        run: node --test backend/src/starter-public-bots.test.mjs scripts/public-bot-starters.test.mjs

      - name: Verify astrology calculations
        run: node --test scripts/astrology.test.mjs backend/src/chaos-radar.test.mjs

      - name: Check profile photo deletion cleanup
        run: node --test scripts/profile-photo-studio.test.mjs scripts/profile-link-hub.test.mjs backend/src/profile-links.test.mjs

      - name: Validate profile wall access, reactions, comments and D1 schema
        run: |
          node --test backend/src/profile-wall.test.mjs scripts/profile-wall-ui.test.mjs
          node --check backend/src/profile-wall.js
          node --check public/profile-wall.js
      - name: Gate Worker deployment on member profile wall privacy and permissions
        run: |
          node --test backend/src/profile-wall.test.mjs scripts/profile-wall-ui.test.mjs
          node --check backend/src/profile-wall.js
          node --check public/profile-wall.js

      - name: Validate coordinated registration release
        run: node --test scripts/registration-release.test.mjs scripts/turnstile.test.mjs scripts/turnstile-ui.test.mjs

      - name: Verify Memo Pad, separate Memo Mail, and member chat integration
        run: |
          node --test backend/src/member-memos.test.mjs backend/src/member-memo-mail.test.mjs scripts/miss-chaos-memo.test.mjs
          node --check backend/src/member-memo-mail.js
          node --check backend/src/member-memos.js
          node --check backend/src/index.js

      - name: Validate discover escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/index.js')
          s = p.read_text()
          if 'q.replace(/[%_]/g,"\\\\$&")' in s:
              print('Discover escaping is correctly preserved.')
          elif 'q.replace(/[%_]/g," ")' in s:
              raise SystemExit('Unsafe discover escaping pattern found.')
          else:
              print('Discover route escaping pattern not found; deployment continues for unrelated backend changes.')
          PY

      # Schema migrations are intentionally NOT applied by routine code deployments.
      # Use the separately approved apply-d1-migrations.yml workflow after review.
      - name: Confirm migration separation
        run: echo 'Production D1 schema changes require the reviewed migration workflow.'

      # A deploy can fail while Cloudflare generates an existing D1 binding
      # (validation error 10021) even if the database exists and all tests pass.
      # Retry the identical safe deployment, never re-create or migrate D1.
      - name: Deploy Worker (first attempt)
        id: deploy_first
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Retry Worker deploy (second attempt)
        id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Final Worker deploy attempt
        id: deploy_final
        if: steps.deploy_first.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Explain persistent Cloudflare binding failure
        if: always() && steps.deploy_first.outcome == 'failure' && steps.deploy_retry.outcome == 'failure' && steps.deploy_final.outcome == 'failure'
        run: |
          echo '::error::Cloudflare Worker deployment failed after three attempts. Inspect the Wrangler errors and verify the account, D1 database ID, and Cloudflare platform health. Do not delete production D1 data to bypass a binding error.'
          exit 1
