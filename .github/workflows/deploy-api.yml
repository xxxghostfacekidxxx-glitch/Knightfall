name: Deploy Knightfall API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-knightfall-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard discover escaping regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/index.js')
          s = p.read_text()
          bad = 'const like="%"+q.replace(/[%_]/g,"\\\\      // Direct messaging")+"%";'
          good = 'const like="%"+q.replace(/[%_]/g," ")+"%";'
          if bad in s:
              p.write_text(s.replace(bad, good, 1))
              print('Applied discover escaping regression guard.')
          elif 'q.replace(/[%_]/g," ")' in s or 'q.replace(/[%_]/g,"\\\\$&")' in s:
              print('Discover escaping already corrected.')
          else:
              raise SystemExit('Discover route did not match an expected safe pattern.')
          PY

      # Production D1 is already aligned with the checked-in migrations.
      # Keep schema changes separate from Worker deployment so CI does not
      # require direct D1 API access just to publish application code.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
