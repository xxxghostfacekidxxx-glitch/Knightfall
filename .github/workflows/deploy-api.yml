name: Deploy Knightfall API

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/index.js'
      - 'backend/migrations/**'
      - 'backend/wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-knightfall-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate discover escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/index.js')
          s = p.read_text()
          if 'q.replace(/[%_]/g,"\\\\$&")' in s:
              print('Discover escaping is correctly preserved.')
          elif 'q.replace(/[%_]/g," ")' in s:
              raise SystemExit('Unsafe discover escaping pattern found.')
          else:
              print('Discover route escaping pattern not found; deployment continues for unrelated backend changes.')
          PY

      - name: Require dedicated D1 migration credentials
        shell: bash
        env:
          CLOUDFLARE_D1_MIGRATION_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_D1_MIGRATION_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_D1_MIGRATION_TOKEN Actions secret with D1 migration permissions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID Actions secret is required."
            exit 1
          fi
          echo "Dedicated D1 migration credentials are present."

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: d1 migrations apply knightfall-forum --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
