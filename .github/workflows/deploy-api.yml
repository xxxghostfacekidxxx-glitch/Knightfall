name: Deploy Knightfall API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-knightfall-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate discover escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/index.js')
          s = p.read_text()
          if 'q.replace(/[%_]/g,"\\\\$&")' in s:
              print('Discover escaping is correctly preserved.')
          elif 'q.replace(/[%_]/g," ")' in s:
              raise SystemExit('Unsafe discover escaping pattern found.')
          else:
              print('Discover route escaping pattern not found; deployment continues for unrelated backend changes.')
          PY

      # D1 migrations are applied separately using the managed Cloudflare connection;
      # the GitHub deployment token does not currently have D1 query permissions.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
