name: Deploy Knightfall API

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/package.json'
      - 'backend/migrations/**'
      - 'backend/wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-knightfall-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install astronomy dependency
        run: npm install --prefix backend --no-audit --no-fund

      - name: Verify astrology calculations
        run: node --test scripts/astrology.test.mjs

      - name: Validate discover escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/index.js')
          s = p.read_text()
          if 'q.replace(/[%_]/g,"\\\\$&")' in s:
              print('Discover escaping is correctly preserved.')
          elif 'q.replace(/[%_]/g," ")' in s:
              raise SystemExit('Unsafe discover escaping pattern found.')
          else:
              print('Discover route escaping pattern not found; deployment continues for unrelated backend changes.')
          PY

      # Schema migrations are intentionally NOT applied by routine code deployments.
      # Use the separately approved apply-d1-migrations.yml workflow after review.
      - name: Confirm migration separation
        run: echo 'Production D1 schema changes require the reviewed migration workflow.'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
