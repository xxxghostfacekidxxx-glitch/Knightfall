name: Knightfall Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/knightfall-android.yml'
      - 'public/icons/knightfall-crest-512.png'

permissions:
  contents: read

concurrency:
  group: knightfall-android-debug
  cancel-in-progress: true

jobs:
  test-apk:
    name: Compile debug-signed Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted Ubuntu runners already include the Android command-line SDK.
      # setup-android@v3 currently tries to install the retired "tools" package
      # and fails before Gradle starts; use the provisioned sdkmanager directly.
      - name: Configure Android SDK with API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Knightfall crest into Android resources
        run: |
          test -s public/icons/knightfall-crest-512.png
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp public/icons/knightfall-crest-512.png android/app/src/main/res/drawable-nodpi/knightfall_icon.png
      - name: Compile debug app
        run: gradle --project-dir android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify and fingerprint test APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          echo "NOTICE: This is a DEBUG-SIGNED TEST APK, not an approved public Knightfall release." >> "$GITHUB_STEP_SUMMARY"
          echo "TWA fullscreen verification needs a permanent release certificate fingerprint in /.well-known/assetlinks.json." >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise isolated Gradle release signing without publishing a key or APK
        shell: bash
        run: bash scripts/android-signing-smoke.sh
      - name: Upload private test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: knightfall-android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Boot Knightfall in Android emulator
    needs: test-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: knightfall-android-debug-apk
          path: android-test
      - name: Prepare KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-knightfall-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator launch / crash smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/knightfall-emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knightfall-emulator-evidence
          path: emulator-evidence/
          retention-days: 14
          if-no-files-found: warn
