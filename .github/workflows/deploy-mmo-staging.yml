name: Deploy Monster MMO Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: Confirm deployment to the isolated Monster MMO staging Worker.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-monster-mmo-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ inputs.confirm_staging }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate isolated staging configuration and credentials
        working-directory: backend
        shell: bash
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_STAGING_API_TOKEN" || { echo "::error::Missing dedicated CLOUDFLARE_STAGING_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          node -e '
            const fs = require("node:fs");
            const c = JSON.parse(fs.readFileSync("wrangler.staging.jsonc", "utf8"));
            if (c.name !== "knightfall-mmo-staging") throw new Error("Unexpected Worker name");
            const source = fs.readFileSync("src/index.mmo-staging.js", "utf8");
            if (!source.includes("class MonsterWorldRoom") || !source.includes("/api/game/save")) throw new Error("MMO staging entrypoint is incomplete");
            if (c.d1_databases?.[0]?.database_id !== "6c72439f-2319-4f03-9bb6-711157d18963") throw new Error("Staging must use the isolated D1 database");
            if (c.kv_namespaces?.[0]?.id !== "56931d38c9f64871b812867e422b771b") throw new Error("Staging must use the isolated KV namespace");
            if (c.r2_buckets?.some(b => !b.bucket_name.startsWith("knightfall-mmo-staging-"))) throw new Error("Staging must not bind production R2 buckets");
            if (c.routes?.length) throw new Error("Staging must not bind production routes");
            console.log("Isolated staging bindings validated.");
          '

      - name: Deploy isolated Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --config wrangler.staging.jsonc
