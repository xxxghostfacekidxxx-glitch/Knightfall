name: Sync Canonical Arcade Directory
on:
  push:
    branches: [main]
    paths:
      - 'public/arcade/catalog.json'
      - 'scripts/build-arcade-catalog.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arcade-catalog-sync
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'xxxghostfacekidxxx-glitch/Knightfall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical Chaos Cartridge directory
        run: node scripts/build-arcade-catalog.mjs
      - name: Commit generated pages when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/chaos-cartridge.html
          if git diff --cached --quiet; then
            echo "Catalog page already synchronized"
          else
            git commit -m "Sync canonical arcade directory with catalog"
            git push origin HEAD:main
          fi
