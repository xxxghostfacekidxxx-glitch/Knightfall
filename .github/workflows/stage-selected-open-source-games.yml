name: Verify existing selected open-source games
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-selected-open-source-games.yml'
      - 'public/arcade/hosted/a-dark-room/**'
      - 'public/arcade/hosted/evolution-of-trust/**'
      - 'scripts/selected-open-source-games.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing imports without creating branches or PRs
        run: |
          python3 scripts/verify-selected-open-source-imports.py
          node --test scripts/selected-open-source-games.test.mjs
