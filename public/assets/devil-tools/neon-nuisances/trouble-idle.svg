<radialGradient id="eye"><stop stop-color="#fff9b8"/><stop offset=".45" stop-color="#ffbf23"/><stop offset="1" stop-color="#f35313"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs><style>
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flutter{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes blink{0%,88%,92%,100%{transform:scaleY(1)}90%{transform:scaleY(.12)}}
#trouble{animation:hover 2.4s ease-in-out infinite;transform-origin:center}#wings{animation:flutter 1.8s ease-in-out infinite;transform-origin:160px 178px}#eyes{animation:blink 6s infinite;transform-origin:160px 143px}
@media(prefers-reduced-motion:reduce){#trouble,#wings,#eyes{animation:none}}
</style>
