<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title id="title">Trouble, Knightfall's infernal messenger</title><desc id="desc">A richly ornamented crimson imp with curling engraved horns, glowing amber eyes, gold jewelry, leather armor, scorched wings and a barbed tail.</desc><defs>
<radialGradient id="skin" cx=".34" cy=".24" r=".9"><stop stop-color="#ffae74"/><stop offset=".25" stop-color="#fa5046"/><stop offset=".67" stop-color="#b7152c"/><stop offset="1" stop-color="#420b24"/></radialGradient>
<linearGradient id="horn" x2=".9" y2="1"><stop stop-color="#dfaa57"/><stop offset=".18" stop-color="#201c27"/><stop offset=".52" stop-color="#51414b"/><stop offset="1" stop-color="#090c14"/></linearGradient>
