<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Skunk Riot · punk skunk mischief</title>
<desc id="desc">Original Knightfall Skunk Riot mascot, a mischievous black-and-white skunk with a hot-pink and toxic-green mohawk, a huge arched stripe tail, pierced ears and a studded leather jacket.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#4a245d"/><stop offset=".6" stop-color="#1f1836"/><stop offset="1" stop-color="#0d1021"/></radialGradient>
<linearGradient id="fur" x2="0" y2="1"><stop stop-color="#4c455f"/><stop offset=".48" stop-color="#252337"/><stop offset="1" stop-color="#111522"/></linearGradient>
<linearGradient id="stripe" x2=".8" y2="1"><stop stop-color="#fff7ff"/><stop offset=".5" stop-color="#dfd3ed"/><stop offset="1" stop-color="#adabc5"/></linearGradient>
<linearGradient id="mohawk" x2="0" y2="1"><stop stop-color="#ffb4ec"/><stop offset=".4" stop-color="#ff41c8"/><stop offset="1" stop-color="#a5229c"/></linearGradient>
<linearGradient id="leather" x2="1" y2="1"><stop stop-color="#3b3645"/><stop offset="1" stop-color="#10111c"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="320" height="320" rx="38" fill="url(#bg)"/>
