 <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4ff98"/><stop offset="1" stop-color="#50d8bf"/></linearGradient>
 <filter id="halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
