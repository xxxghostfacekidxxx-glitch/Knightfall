<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Minion Mouse | Ash-Fall Neon Nuisances</title>
<desc id="desc">A scrappy mischievous cyber-mouse with enormous stitched ears, mint goggles, patchwork vest, a winding mechanical tail and stolen batteries.</desc>
