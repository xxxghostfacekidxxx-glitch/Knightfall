<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Gravebyte | Gravewave Neon Nuisances</title>
<desc id="desc">A cyberpunk skeleton DJ with huge headphones, acid-green audio-reactive eyes, hot pink circuitry, a metal skull, glowing ribs, mechanical arms and a tiny turntable badge.</desc>
