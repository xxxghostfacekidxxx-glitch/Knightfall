<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">The Eddie | Ash-Fall Neon Nuisances</title>
<desc id="desc">The Eddie, a tiny fearless undead punk with a tall lime mohawk, stitched scar, crimson and green mismatched eyes, cracked jacket, skeletal chest, heavy boots and an oversized mischievous grin.</desc>
