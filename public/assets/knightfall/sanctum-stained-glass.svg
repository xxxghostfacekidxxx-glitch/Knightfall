<title id="title">Illuminated stained-glass sanctum</title>
<desc id="desc">Original Knightfall Gothic rose window above three jeweled lancet windows, glowing with crimson, violet, turquoise, spectral green, and amber light within intricate dark stone tracery.</desc>
