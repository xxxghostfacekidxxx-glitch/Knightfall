<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ash-Fall member profiles: the person behind the chaos, with public details controlled by the member.">
  <title>Ash-Fall Profile</title>
  <link rel="stylesheet" href="/theme.css?v=20261026-ember-default">
  <link rel="stylesheet" href="/profile.css?v=20261026-layout-presets">
  <link rel="stylesheet" href="/admin-command-center.css?v=20261010-private-admin-command-center">
<style>
.wallet-card{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1rem 0 1.25rem;padding:1.1rem 1.25rem;border:1px solid #4a2e55;border-radius:16px;background:radial-gradient(ellipse at 5% 0%,#e44eff18,transparent 60%),linear-gradient(130deg,#17101d,#0d1017);box-shadow:0 12px 36px #0004}
.wallet-main{min-width:200px}.wallet-kicker{display:block;color:#c97bff;font-size:.68rem;font-weight:900;letter-spacing:.16em}.wallet-balance{display:block;margin:.25rem 0;font-size:clamp(1.7rem,5vw,2.5rem);letter-spacing:-.05em;color:#f3e8ff;font-variant-numeric:tabular-nums}.wallet-balance small{font-size:.68rem;letter-spacing:.12em;color:#c97bff}.wallet-main p,.wallet-public-note{margin:.3rem 0 0;color:#a8a0b1;font-size:.82rem;line-height:1.5}.wallet-claims{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;max-width:100%}.wallet-claims #wallet-status{width:100%;margin:.1rem 0 0;color:#b5a8c1;font-size:.78rem}.wallet-claims button:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:620px){.wallet-card{align-items:flex-start;padding:1rem}.wallet-claims{width:100%}.wallet-claims button{flex:1 1 150px}}
</style>
</head>
<body>
  <header class="kf-header"></header>
  <main class="profile-shell">
    <section id="profile" class="card" aria-live="polite">
      <p>Loading profile…</p>
    </section>
  </main>
  <script src="/nav.js" defer></script>
  <script src="/profile.js?v=20261026-layout-presets" defer></script>
  <script src="/admin-command-center.js?v=20261010-private-admin-command-center" defer></script>
</body>
</html>
