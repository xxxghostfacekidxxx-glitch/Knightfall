.wallet-card{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1rem 0 1.25rem;padding:1.1rem 1.25rem;border:1px solid #82617c;border-radius:16px;background:radial-gradient(ellipse at 5% 0%,#b25b6818,transparent 60%),linear-gradient(130deg,#242128,#0d1013);box-shadow:0 12px 36px #0004}
.wallet-main{min-width:200px}.wallet-kicker{display:block;color:#c7a77c;font-size:.68rem;font-weight:900;letter-spacing:.16em}.wallet-balance{display:block;margin:.25rem 0;font-size:clamp(1.7rem,5vw,2.5rem);letter-spacing:-.05em;color:#ece1d3;font-variant-numeric:tabular-nums}.wallet-balance small{font-size:.68rem;letter-spacing:.12em;color:#c7a77c}.wallet-main p,.wallet-public-note{margin:.3rem 0 0;color:#b9afa8;font-size:.82rem;line-height:1.5}.wallet-claims{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;max-width:100%}.wallet-claims #wallet-status{width:100%;margin:.1rem 0 0;color:#b9afa8;font-size:.78rem}.wallet-claims button:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:620px){.wallet-card{align-items:flex-start;padding:1rem}.wallet-claims{width:100%}.wallet-claims button{flex:1 1 150px}}
</style>
