<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Card & Board Games | Chaos Cartridge</title><link rel="stylesheet" href="/theme.css"><script src="/nav.js" defer></script><style>:root{color-scheme:dark}body{margin:0;background:#090909;color:#f4f4f4;font:16px system-ui}main{max-width:1100px;margin:auto;padding:1.5rem}h1{font-size:clamp(2.2rem,7vw,4rem);color:#ff55d8}a{color:#a4ffb4}input,select{background:#171717;border:1px solid #555;color:white;border-radius:9px;padding:.8rem;font:inherit;max-width:100%}.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.5rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:1rem}.game{border:1px solid #343434;background:#141414;border-radius:14px;padding:1rem}.game h2{margin:.2rem 0;color:#fff}.game p{color:#bbb;line-height:1.5}.tag{color:#a4ffb4;font-size:.8rem}.play{display:inline-block;background:#ff55d8;color:#140813;padding:.7rem 1rem;border-radius:8px;text-decoration:none;font-weight:800}#count{color:#aaa}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Card & Board Games</h1><p>Local browser tables and board games. Pick a cabinet and play. More licensed games will be added after verification.</p><div class="toolbar"><input id="search" type="search" placeholder="Find a game…" aria-label="Search games"><select id="kind" aria-label="Game type"><option value="">All card and board games</option><option value="Card">Card games</option><option value="Board">Board games</option></select></div><p id="count" role="status"></p><div class="grid" id="games"></div><p id="error" role="alert"></p></main><script>(()=>{'use strict';const root=document.getElementById('games'),search=document.getElementById('search'),kind=document.getElementById('kind'),count=document.getElementById('count'),error=document.getElementById('error');let games=[];function render(){const q=search.value.trim().toLowerCase();const found=games.filter(g=>(!kind.value||g.genre===kind.value)&&(g.title+' '+g.description).toLowerCase().includes(q));root.replaceChildren();for(const g of found){const article=document.createElement('article');article.className='game';const tag=document.createElement('div');tag.className='tag';tag.textContent=g.genre;const title=document.createElement('h2');title.textContent=g.title;const desc=document.createElement('p');desc.textContent=g.description;const link=document.createElement('a');link.className='play';link.href=g.route;link.textContent='Play now';article.append(tag,title,desc,link);root.append(article)}count.textContent=found.length+' available game entries'}search.addEventListener('input',render);kind.addEventListener('change',render);fetch('/arcade/catalog.json').then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json()}).then(data=>{games=data.games.filter(g=>['Card','Board'].includes(g.genre));render()}).catch(()=>{error.textContent='The game catalog could not be loaded. Try again when connected.'})})();</script></body></html>
