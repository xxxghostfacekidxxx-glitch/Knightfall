<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ash-Fall | Password Recovery</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/auth.css">
<style>[hidden]{display:none!important}.recovery-form{margin-top:1.4rem}.recovery-form p{color:#aaa;line-height:1.6}.recovery-form button:disabled{opacity:.6;cursor:wait}.recovery-form a{color:#ff55d8}</style>
</head><body><main class="auth-shell"><section class="auth-card">
<a class="back" href="/auth.html">← Back to sign in</a><h1 id="title">RESET YOUR PASSWORD.</h1><p class="muted" id="intro">Lost your way back in? It happens.</p>
<form id="request-form" class="recovery-form"><label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button class="primary" type="submit">Send reset link</button><p>For privacy, the response is the same whether or not an account matches that email.</p></form>
<form id="complete-form" class="recovery-form" hidden><label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><small>Use at least 12 characters.</small><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="primary" type="submit">Set new password</button></form>
<p id="status" class="status" role="status" aria-live="polite"></p></section></main>
<script>
const API="https://api.ash-fall.com",params=new URLSearchParams(location.search),token=params.get("token")||"",requestForm=document.querySelector("#request-form"),completeForm=document.querySelector("#complete-form"),status=document.querySelector("#status");
function show(message,error=false){status.textContent=message;status.className="status "+(error?"error":"success")}
async function post(path,data){const r=await fetch(API+path,{method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify(data)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}
if(token){requestForm.hidden=true;completeForm.hidden=false;document.querySelector("#title").textContent="CHOOSE A NEW PASSWORD.";document.querySelector("#intro").textContent="Reset links expire after 30 minutes and can only be used once."}
requestForm.addEventListener("submit",async e=>{e.preventDefault();const button=requestForm.querySelector("button");button.disabled=true;show("Sending request…");try{const d=await post("/api/auth/password-reset/request",{email:new FormData(requestForm).get("email")});show(d.message||"If an account matches that email, instructions will be sent.");requestForm.reset()}catch(err){show(err.message,true)}finally{button.disabled=false}});
completeForm.addEventListener("submit",async e=>{e.preventDefault();const data=new FormData(completeForm),password=data.get("password");if(password!==data.get("confirm")){show("Those passwords do not match.",true);return}const button=completeForm.querySelector("button");button.disabled=true;show("Updating password…");try{const d=await post("/api/auth/password-reset/complete",{token,password});show(d.message+" Redirecting to sign in…");completeForm.reset();setTimeout(()=>location.href="/auth.html",1200)}catch(err){show(err.message,true)}finally{button.disabled=false}});
</script></body></html>
