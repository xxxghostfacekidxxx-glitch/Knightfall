<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Issue Queue · Knightfall Admin</title><link rel="stylesheet" href="/theme.css"><script src="/nav.js" defer></script><style>main{max-width:950px;margin:2rem auto;padding:1rem;color:#f7e8f2;font:16px/1.5 system-ui}article{margin:1rem 0;padding:1rem;border:1px solid #a16a91;border-radius:14px;background:#201b28}button,select,textarea{font:inherit;padding:.55rem;border-radius:8px}textarea{display:block;width:95%;background:#16131c;color:#fff}a{color:#ffc0e5}</style></head><body><header class="kf-header"></header><main><h1>Admin · Reports & Contact Inbox</h1><p>Private game reports, site issues and Contact Us messages. Authorized administrators, Osiris and Isis can review and resolve them.</p><label>Status <select id="filter"><option>open</option><option>resolved</option><option>dismissed</option></select></label><button id="refresh">Refresh</button><p id="status" role="status"></p><div id="list"></div></main><script>const q=id=>document.getElementById(id);async function api(path,options){const r=await fetch(path,{credentials:"include",...options});const data=await r.json();if(!r.ok)throw Error(data.error||"Request failed");return data;}async function load(){q("list").replaceChildren();q("status").textContent="Loading…";try{const data=await api("/api/admin/arcade-issues?status="+encodeURIComponent(q("filter").value));q("status").textContent=(data.reports||[]).length+" reports";for(const report of data.reports||[]){const article=document.createElement("article"),heading=document.createElement("h2"),details=document.createElement("p"),description=document.createElement("p"),note=document.createElement("textarea"),select=document.createElement("select"),save=document.createElement("button");heading.textContent="#"+report.id+" · "+report.game;details.textContent="From "+(report.reporter_username||"member")+" · "+report.created_at;description.textContent=report.description;note.value=report.admin_note||"";note.placeholder="Internal admin resolution note";for(const value of ["open","resolved","dismissed"]){const option=document.createElement("option");option.value=option.textContent=value;option.selected=report.status===value;select.append(option);}save.textContent="Save resolution";save.onclick=async()=>{save.disabled=true;try{await api("/api/admin/arcade-issues/"+report.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:select.value,admin_note:note.value})});await load();}catch(e){q("status").textContent=e.message;}finally{save.disabled=false;}};article.append(heading,details,description,note,select,save);q("list").append(article);}}catch(e){q("status").textContent=e.message;}}q("filter").onchange=load;q("refresh").onclick=load;load();</script></body></html>
