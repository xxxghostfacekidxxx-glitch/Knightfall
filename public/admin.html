<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knightfall | Administrator</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/admin.css"></head><body><header class="kf-header"></header><main class="admin-shell"><section class="hero"><p class="eyebrow">ADMINISTRATOR CONTROL CENTER</p><h1>God Mode.</h1><p>Users, roles, sessions, moderation, and community health.</p></section><p id="status">Loading…</p><section id="stats" class="stats"></section><section class="panel"><h2>User Command</h2><div id="users"></div></section><section class="panel"><h2>Open Reports</h2><div id="reports"></div></section></main><script src="/nav.js" defer></script><script>
const API="https://api.ash-fall.com",esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(p,o={}){const r=await fetch(API+p,{credentials:"include",cache:"no-store",...o,headers:{"content-type":"application/json",...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}function stat(d){document.querySelector("#stats").innerHTML=Object.entries(d.stats).map(([k,v])=>`<div><span>${esc(k.replaceAll("_"," "))}</span><b>${esc(v)}</b></div>`).join("")}async function users(){const d=await api("/api/admin/users");document.querySelector("#users").innerHTML=`<table><tr><th>User</th><th>Role</th><th>Status</th><th>Session</th></tr>${d.users.map(u=>`<tr><td><b>${esc(u.display_name||u.username)}</b><small>@${esc(u.username)}</small></td><td><select data-role="${u.id}" ${u.username==="knightfall"?"disabled":""}><option ${u.role==="member"?"selected":""}>member</option><option ${u.role==="moderator"?"selected":""}>moderator</option><option ${u.role==="admin"?"selected":""}>admin</option></select></td><td><select data-status="${u.id}" ${u.username==="knightfall"?"disabled":""}><option ${u.status==="active"?"selected":""}>active</option><option ${u.status==="suspended"?"selected":""}>suspended</option><option ${u.status==="banned"?"selected":""}>banned</option></select></td><td><button data-revoke="${u.id}">Revoke</button></td></tr>`).join("")}</table>`;document.querySelectorAll("[data-role],[data-status]").forEach(e=>e.onchange=async()=>{const id=e.dataset.role||e.dataset.status;await api("/api/admin/users/"+id,{method:"PATCH",body:JSON.stringify({role:document.querySelector(`[data-role="${id}"]`).value,status:document.querySelector(`[data-status="${id}"]`).value})});await users()});document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{await api("/api/admin/users/"+b.dataset.revoke,{method:"POST",body:"{}"});b.textContent="Revoked"})}async function reports(){const d=await api("/api/admin/reports?status=open");document.querySelector("#reports").innerHTML=d.reports.length?d.reports.map(r=>`<article><b>#${r.id} · ${esc(r.target_type)} #${r.target_id}</b><p>${esc(r.reason)}</p><button data-report="${r.id}" data-state="resolved">Resolve</button> <button data-report="${r.id}" data-state="dismissed">Dismiss</button></article>`).join(""):"<p>No open reports.</p>";document.querySelectorAll("[data-report]").forEach(b=>b.onclick=async()=>{await api("/api/moderation/reports/"+b.dataset.report,{method:"PATCH",body:JSON.stringify({status:b.dataset.state})});await reports()})}async function boot(){try{const me=await api("/api/auth/me");if(me.user?.role!=="admin")throw Error("Administrator access required.");const d=await api("/api/admin/overview");stat(d);await users();await reports();document.querySelector("#status").textContent="Administrator controls online."}catch(e){document.querySelector("#status").textContent=e.message}}boot();
</script></body></html>
