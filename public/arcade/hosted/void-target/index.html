<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Target | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b291d,#10111a 76%);color:#ffe8d2;font:16px system-ui}main{max-width:670px;margin:auto}a{color:#ffc08a}h1{color:#ffa260;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 15px;background:#65382c;border:1px solid #d9925b;color:#ffe7d0;border-radius:8px;font-weight:800;cursor:pointer}button:disabled{opacity:.3}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:520px;margin:18px 0}.tile{aspect-ratio:1;min-width:0;padding:2px;background-color:#302736;background-size:22%;background-position:right bottom;background-repeat:no-repeat;font-size:clamp(12px,4vw,24px)}.tile img{width:75%;height:75%}.selected{outline:4px solid #fca45e}.reels{font-size:clamp(45px,12vw,88px);letter-spacing:12px;padding:30px 0;color:#ffc27c}input{font-size:22px;padding:12px;width:150px;background:#282231;color:#fff;border:2px solid #d68c58;border-radius:8px}#status{color:#ffdda9;font-weight:800;min-height:35px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Void Target</h1><p>Shoot moving Void targets in a thirty-second precision gallery.</p><div id="board" class="board"></div><p><button id="start">Start round</button></p><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board");function finish(score){try{const k="ashfall:void-target:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("void-target",score,{score,game:"void-target"})).catch(()=>{})}let score=0,remaining=30,active=false,clock=null,hop=null,position=0;function render(){board.innerHTML="";for(let i=0;i<16;i++){const b=document.createElement("button");b.className="tile";b.setAttribute("aria-label","Target "+(i+1));if(active&&i===position)b.innerHTML='<img src="./sprites/void-eye.svg" alt="Void target">';b.onclick=()=>{if(!active)return;if(i===position){score+=20;position=Math.floor(Math.random()*16)}else score=Math.max(0,score-5);render()};board.append(b)}status.textContent=(active?remaining+" seconds":"Ready")+" · "+score+" points"}function reset(){clearInterval(clock);clearInterval(hop);score=0;remaining=30;active=true;position=Math.floor(Math.random()*16);clock=setInterval(()=>{remaining--;if(remaining<=0){active=false;clearInterval(clock);clearInterval(hop);finish(score)}render()},1000);hop=setInterval(()=>{position=Math.floor(Math.random()*16);render()},650);render()}$("start").onclick=reset;document.addEventListener("visibilitychange",()=>{if(document.hidden&&active){active=false;clearInterval(clock);clearInterval(hop);status.textContent="Round interrupted. Restart to play."}});render();})();</script></body></html>
