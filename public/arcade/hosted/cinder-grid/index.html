<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100f17"><title>Cinder Grid | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#47251f,#0c0d15 72%);color:#fce9d5;font:16px system-ui}main{max-width:780px;margin:auto}a{color:#ffc07c}h1{color:#ff9b4d;font-size:clamp(2.1rem,8vw,4rem);margin:14px 0 4px}p{color:#cdbeb7;line-height:1.5}.stats{display:flex;flex-wrap:wrap;gap:18px;color:#ffd99b;font-weight:900;margin:14px 0}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(3px,1vw,9px);padding:clamp(7px,2vw,15px);border:3px solid #c27849;border-radius:15px;background:linear-gradient(135deg,#40303b,#1c2133);box-shadow:0 15px 45px #0009}.cell{aspect-ratio:1;border-radius:50%;border:2px solid #635164;background:#0e111a;box-shadow:inset 0 4px 12px #000b;cursor:pointer;display:grid;place-items:center;padding:3px;min-width:0;touch-action:manipulation}.cell img{width:100%;height:100%;object-fit:contain;pointer-events:none}.cell:focus-visible{outline:3px solid #fff3b8;outline-offset:2px}.cell.win{border-color:#fff2aa;box-shadow:0 0 16px #ffc76d}button,.mode{font:inherit;border-radius:9px;padding:11px 15px;background:#633322;border:1px solid #d98550;color:#ffe4c8;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:default}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}#status{font-weight:800;color:#ffda9b;min-height:26px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Grid</h1><p>Drop ember and void sigils into the grid. Connect four horizontally, vertically or diagonally. Face the wasteland AI or a friend.</p><div class="stats"><span>EMBER WINS <output id="ember-wins">0</output></span><span>VOID WINS <output id="void-wins">0</output></span><span>DRAWS <output id="draws">0</output></span></div><div id="board" class="board" role="group" aria-label="Seven column, six row game board"></div><div class="controls"><button id="restart">New match</button><label>Mode <select class="mode" id="mode"><option value="cpu">Versus CPU</option><option value="local">Two players</option></select></label><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Ember moves first. Select a column.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const ROWS=6,COLS=7,$=id=>document.getElementById(id),boardEl=$("board"),token={1:"./sprites/ember-token.svg",2:"./sprites/void-token.svg"};let grid=[],turn=1,finished=false,busy=false,winning=[],wins=[0,0,0],timer=null;try{const w=JSON.parse(localStorage.getItem("ashfall:cinder-grid:wins")||"null");if(Array.isArray(w)&&w.length===3&&w.every(n=>Number.isInteger(n)&&n>=0))wins=w}catch{}function showWins(){$("ember-wins").textContent=wins[0];$("void-wins").textContent=wins[1];$("draws").textContent=wins[2]}function reset(){if(timer!==null){clearTimeout(timer);timer=null}grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));turn=1;finished=false;busy=false;winning=[];$("status").textContent="Ember moves first. Select a column.";render()}function available(b){return [3,2,4,1,5,0,6].filter(c=>b[0][c]===0)}function place(b,col,who){for(let r=ROWS-1;r>=0;r--)if(b[r][col]===0){b[r][col]=who;return r}return -1}function winLine(b){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const who=b[r][c];if(!who)continue;for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const line=Array.from({length:4},(_,i)=>[r+dr*i,c+dc*i]);if(line.every(([y,x])=>y>=0&&y<ROWS&&x>=0&&x<COLS&&b[y][x]===who))return {who,line}}}return null}function render(){boardEl.replaceChildren();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cell=document.createElement("button");cell.className="cell";cell.type="button";cell.setAttribute("aria-label","Column "+(c+1)+", row "+(r+1)+", "+(grid[r][c]===1?"ember":grid[r][c]===2?"void":"empty"));if(winning.some(([y,x])=>y===r&&x===c))cell.classList.add("win");if(grid[r][c]){const img=document.createElement("img");img.src=token[grid[r][c]];img.alt="";cell.append(img)}cell.addEventListener("click",()=>move(c));boardEl.append(cell)}}function evaluate(b){let value=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const cells=Array.from({length:4},(_,i)=>[r+dr*i,c+dc*i]);if(!cells.every(([y,x])=>y>=0&&y<ROWS&&x>=0&&x<COLS))continue;const a=cells.map(([y,x])=>b[y][x]),v=a.filter(x=>x===2).length,h=a.filter(x=>x===1).length;if(!h)value+=[0,1,9,60,10000][v];if(!v)value-=[0,1,11,80,10000][h]}return value}function search(b,depth,alpha,beta,maximizing){const won=winLine(b);if(won)return won.who===2?100000+depth:-100000-depth;const choices=available(b);if(depth===0||!choices.length)return evaluate(b);if(maximizing){let best=-Infinity;for(const c of choices){const copy=b.map(row=>row.slice());place(copy,c,2);best=Math.max(best,search(copy,depth-1,alpha,beta,false));alpha=Math.max(alpha,best);if(alpha>=beta)break}return best}let best=Infinity;for(const c of choices){const copy=b.map(row=>row.slice());place(copy,c,1);best=Math.min(best,search(copy,depth-1,alpha,beta,true));beta=Math.min(beta,best);if(alpha>=beta)break}return best}function chooseAI(){const choices=available(grid);let best=-Infinity,choice=choices[0];for(const c of choices){const copy=grid.map(row=>row.slice());place(copy,c,2);const val=search(copy,4,-Infinity,Infinity,false);if(val>best){best=val;choice=c}}return choice}function submit(who){const score=who===1?100:who===0?25:10;if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-grid",score,{score,game:"cinder-grid",winner:who,mode:$("mode").value})).catch(()=>{})}function finish(who,line){finished=true;busy=false;winning=line||[];wins[who===1?0:who===2?1:2]++;try{localStorage.setItem("ashfall:cinder-grid:wins",JSON.stringify(wins))}catch{}showWins();$("status").textContent=who===1?"Ember wins!":who===2?"Void wins!":"The grid is full. Draw!";render();submit(who)}function move(c){if(finished||busy||($("mode").value==="cpu"&&turn===2)||grid[0][c])return;drop(c)}function drop(c){if(place(grid,c,turn)<0)return;const result=winLine(grid);if(result){finish(result.who,result.line);return}if(!available(grid).length){finish(0,[]);return}turn=3-turn;render();$("status").textContent=(turn===1?"Ember":"Void")+" to move"+(turn===2&&$("mode").value==="cpu"?" (thinking…)":"");if(turn===2&&$("mode").value==="cpu"){busy=true;timer=setTimeout(()=>{timer=null;if(finished||$("mode").value!=="cpu"){busy=false;return}const choice=chooseAI();busy=false;drop(choice)},180)}}$("restart").onclick=reset;$("mode").onchange=reset;$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else boardEl.requestFullscreen().catch(()=>{})};showWins();reset()})();
</script></body></html>
