<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Fleet</title><style>body{margin:0;padding:16px;background:#0d0d17;color:#fff;font:16px system-ui;text-align:center}a{color:#9f9}h1{color:#ff58c7}.wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}.grid{display:grid;grid-template-columns:repeat(8,1fr);width:min(90vw,330px);gap:3px}.grid button{aspect-ratio:1;border:1px solid #425068;border-radius:4px;background:#18243a;color:white;font-size:20px;padding:0}.grid .ship{background:#386b83}.grid .hit{background:#b73463}.grid .miss{background:#43536b}.grid button:disabled{opacity:1}#reset{padding:12px 22px;background:#ff58c7;border:0;border-radius:8px;font-weight:bold}#status{min-height:2em}</style><a href="/arcade-card-board.html">← Card & Board Games</a><h1>Cinder Fleet</h1><p>Find and sink the CPU fleet. Ships: 4, 3, 3 and 2 squares. You shoot first.</p><p id="status" role="status"></p><div class="wrap"><section><h2>Enemy waters</h2><div id="enemy" class="grid"></div></section><section><h2>Your waters</h2><div id="player" class="grid"></div></section></div><p><button id="reset">New game</button></p><script>(()=>{'use strict';const sizes=[4,3,3,2],N=8;let us,them,shotsUs,shotsThem,over,busy;const status=document.getElementById('status');function fleet(){const a=Array(64).fill(0);for(const length of sizes){let ok=false;for(let attempts=0;attempts<1000&&!ok;attempts++){const horiz=Math.random()<.5,x=Math.floor(Math.random()*(horiz?N-length+1:N)),y=Math.floor(Math.random()*(horiz?N:N-length+1)),ids=Array.from({length},(_,k)=>(y+(horiz?0:k))*N+x+(horiz?k:0));if(ids.every(i=>!a[i])){ids.forEach(i=>a[i]=1);ok=true}}if(!ok)throw Error('Unable to place fleet')}return a}function count(a,shots){return a.reduce((n,v,i)=>n+(v&&shots[i]?1:0),0)}function render(message){for(const [id,a,shots,reveal] of [['enemy',them,shotsThem,false],['player',us,shotsUs,true]]){const root=document.getElementById(id);root.replaceChildren();a.forEach((ship,i)=>{const b=document.createElement('button');const hit=shots[i];b.className=hit?(ship?'hit':'miss'):(ship&&reveal?'ship':'');b.textContent=hit?(ship?'✕':'•'):(ship&&reveal?'■':'');b.disabled=id==='player'||over||busy||!!hit;b.setAttribute('aria-label',(id==='enemy'?'Enemy':'Your')+' row '+(Math.floor(i/N)+1)+' column '+(i%N+1)+(hit?(ship?' hit':' miss'):' unshot'));if(id==='enemy')b.onclick=()=>fire(i);root.append(b)})}status.textContent=message||(busy?'CPU firing':'Choose a target')}function fire(i){if(over||busy||shotsThem[i])return;shotsThem[i]=1;if(count(them,shotsThem)===sizes.reduce((a,b)=>a+b,0)){over=true;render('You sank the entire fleet!');return}busy=true;render(them[i]?'Hit! CPU responding.':'Miss. CPU responding.');setTimeout(cpu,350)}function cpu(){if(over)return;const options=shotsUs.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!options.length){over=true;render('Draw');return}const adjacent=[];shotsUs.forEach((v,i)=>{if(!v||!us[i])return;const x=i%N,y=Math.floor(i/N);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<N&&ny>=0&&ny<N&&!shotsUs[ny*N+nx])adjacent.push(ny*N+nx)}});const i=adjacent.length?adjacent[Math.floor(Math.random()*adjacent.length)]:options[Math.floor(Math.random()*options.length)];shotsUs[i]=1;if(count(us,shotsUs)===sizes.reduce((a,b)=>a+b,0)){over=true;render('CPU sank your fleet');return}busy=false;render(us[i]?'CPU hit your ship!':'CPU missed. Your turn.')}function start(){us=fleet();them=fleet();shotsUs=Array(64).fill(0);shotsThem=Array(64).fill(0);over=false;busy=false;render()}document.getElementById('reset').onclick=start;start()})();</script></html>
