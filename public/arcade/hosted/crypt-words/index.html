<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120f16"><title>Crypt Words | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#43241f,#101017 70%);color:#fbe6cf;font:16px system-ui}main{max-width:630px;margin:auto}a{color:#ffb477}h1{color:#ff9c4b;font-size:clamp(2rem,8vw,4rem);margin:12px 0}h1 img{width:44px;vertical-align:middle}p{color:#cbbab0;line-height:1.5}.stats{display:flex;gap:16px;flex-wrap:wrap;color:#ffce91;font-weight:900;margin:10px 0}.board{display:grid;gap:7px;max-width:360px;margin:20px auto}.guess{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tile{aspect-ratio:1;display:grid;place-items:center;border:2px solid #775642;background:#1a1a22;border-radius:8px;font-size:clamp(1.2rem,6vw,2rem);font-weight:900;text-transform:uppercase}.tile.exact{background:#407a57;border-color:#8dd49b}.tile.present{background:#ab7033;border-color:#ffc26c}.tile.absent{background:#383643;border-color:#65606d}.keyboard{display:grid;gap:6px}.keyrow{display:flex;gap:4px;justify-content:center}.key{min-width:0;flex:1;max-width:52px;padding:13px 0;background:#4b3534;color:#fff1da;border:1px solid #ac7555;border-radius:7px;font:700 14px system-ui;cursor:pointer}.key.wide{max-width:80px;flex:1.5;font-size:11px}.key.exact{background:#407a57}.key.present{background:#ab7033}.key.absent{background:#383643}button{touch-action:manipulation}.actions{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.actions button{padding:11px 15px;background:#6c3526;border:1px solid #db9158;border-radius:9px;color:#ffe4c6;font-weight:800}#status{color:#ffd495;font-weight:800;min-height:45px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1><img src="./sprites/rune.svg" alt=""> Crypt Words</h1><p>Decode the five-letter word hidden in the ashes. Six attempts. Green means exact; amber means the letter exists elsewhere.</p><div class="stats"><span>WINS <output id="wins">0</output></span><span>STREAK <output id="streak">0</output></span><span>ATTEMPT <output id="attempt">1</output>/6</span></div><div id="board" class="board" role="group" aria-label="Six guesses of five letters"></div><div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div><div class="actions"><button id="new">New puzzle</button><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Type your first five-letter guess.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const WORDS="ashes ember flame crypt grave skull night ruins crows ghost stone blade raven cinder".split(" ").filter(w=>w.length===5);const MORE="torch haunt curse smoke spire wraith blood shank gloom decay altar metal shard frost demon eerie thorn beast storm witch black spark wrath chaos drift infer brink carve spell relic".split(" ").filter(w=>w.length===5);const BANK=[...new Set([...WORDS,...MORE])];const $=id=>document.getElementById(id),rows=6,cols=5,key="ashfall:crypt-words:v1";let target="",guesses=[],current="",finished=false,wins=0,streak=0;function choose(){return BANK[Math.floor(Math.random()*BANK.length)]}function save(){try{localStorage.setItem(key,JSON.stringify({target,guesses,current,finished,wins,streak}))}catch{}}function load(){try{const v=JSON.parse(localStorage.getItem(key)||"null");if(!v||!BANK.includes(v.target)||!Array.isArray(v.guesses)||v.guesses.length>6||v.guesses.some(w=>typeof w!=="string"||w.length!==5||!/^[a-z]+$/.test(w))||typeof v.current!=="string"||v.current.length>5||!/^[a-z]*$/.test(v.current)||typeof v.finished!=="boolean")return false;target=v.target;guesses=v.guesses;current=v.current;finished=v.finished;wins=Number.isInteger(v.wins)&&v.wins>=0?v.wins:0;streak=Number.isInteger(v.streak)&&v.streak>=0?v.streak:0;return true}catch{return false}}function grade(word){const out=Array(5).fill("absent"),remain={};for(let i=0;i<5;i++){if(word[i]===target[i])out[i]="exact";else remain[target[i]]=(remain[target[i]]||0)+1}for(let i=0;i<5;i++)if(out[i]!=="exact"&&remain[word[i]]>0){out[i]="present";remain[word[i]]--}return out}function render(){const board=$("board");board.replaceChildren();const states={};for(let r=0;r<rows;r++){const row=document.createElement("div");row.className="guess";const word=guesses[r]||(r===guesses.length&&!finished?current:""),result=r<guesses.length?grade(word):[];for(let c=0;c<cols;c++){const tile=document.createElement("div");tile.className="tile"+(result[c]?" "+result[c]:"");tile.textContent=word[c]||"";tile.setAttribute("aria-label","Row "+(r+1)+", letter "+(c+1)+": "+(word[c]||"empty")+(result[c]?", "+result[c]:""));row.append(tile);if(result[c]){const priority={absent:1,present:2,exact:3};if(!states[word[c]]||priority[result[c]]>priority[states[word[c]]])states[word[c]]=result[c]}}board.append(row)}const keyboard=$("keyboard");keyboard.replaceChildren();for(const letters of ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"]){const row=document.createElement("div");row.className="keyrow";const keys=letters==="ZXCVBNM"?["ENTER",...letters,"BACK"]:Array.from(letters);for(const k of keys){const b=document.createElement("button");b.type="button";b.className="key"+(k.length>1?" wide":"")+(states[k.toLowerCase()]?" "+states[k.toLowerCase()]:"");b.textContent=k;b.setAttribute("aria-label",k);b.addEventListener("click",()=>input(k));row.append(b)}keyboard.append(row)}$("wins").textContent=wins;$("streak").textContent=streak;$("attempt").textContent=Math.min(6,guesses.length+1);save()}function fresh(){target=choose();guesses=[];current="";finished=false;$("status").textContent="New crypt opened. Decode the word.";render()}function submitScore(){const score=Math.max(100,700-guesses.length*80);if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-words",score,{score,game:"crypt-words",attempts:guesses.length})).catch(()=>{})}function input(k){if(finished)return;if(k==="BACK"){current=current.slice(0,-1)}else if(k==="ENTER"){if(current.length!==5){$("status").textContent="Enter five letters.";return}if(!BANK.includes(current)){$("status").textContent="Use a word from the crypt's vocabulary.";return}guesses.push(current);if(current===target){finished=true;wins++;streak++;$("status").textContent="Crypt unlocked in "+guesses.length+" attempts!";submitScore()}else if(guesses.length===6){finished=true;streak=0;$("status").textContent="The crypt sealed. Word: "+target.toUpperCase()}else $("status").textContent="Keep decoding.";current=""}else if(/^[A-Z]$/.test(k)&&current.length<5)current+=k.toLowerCase();render()}document.addEventListener("keydown",e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;const k=e.key==="Backspace"?"BACK":e.key==="Enter"?"ENTER":e.key.toUpperCase();if(k==="BACK"||k==="ENTER"||/^[A-Z]$/.test(k)){e.preventDefault();input(k)}});$("new").onclick=fresh;$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $("board").requestFullscreen().catch(()=>{})};if(!load())fresh();else{render();if(finished)$("status").textContent=guesses.includes(target)?"Crypt unlocked. Start a new puzzle.":"The crypt sealed. Word: "+target.toUpperCase()}})();
</script></body></html>
