<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110d17"><title>Ash Veil | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at top,#4c2923,#0d0e16 75%);color:#ffe9d1;font:16px system-ui}main{max-width:760px;margin:auto}a{color:#ffc083}h1{color:#ff9c56;font-size:clamp(2rem,8vw,3.7rem);margin:12px 0}p{line-height:1.45;color:#d3bfb4}.stats{display:flex;gap:18px;flex-wrap:wrap;color:#ffdcac;font-weight:900;margin:14px 0}.game{max-width:540px;margin:auto}canvas{width:100%;height:auto;display:block;border:3px solid #d28a56;border-radius:12px;background:#181723;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:14px auto}button{border:1px solid #d88b56;border-radius:9px;padding:12px 8px;background:#62372d;color:#ffe4c8;font:800 15px system-ui;cursor:pointer}.controls #up{grid-column:2}.controls #left{grid-column:1}.controls #down{grid-column:2}.controls #right{grid-column:3}.other{display:flex;gap:10px;flex-wrap:wrap}#status{color:#ffdcaa;font-weight:800;min-height:45px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Veil</h1><p>Slip through the wasteland patrols, collect three ember keys, and reach the exit. Sentinels see forward in a straight line. Walls break their sight. Every move counts.</p><div class="stats"><span>LEVEL <output id="level">1</output></span><span>KEYS <output id="keys">0/3</output></span><span>MOVES <output id="moves">0</output></span><span>BEST <output id="best">0</output></span></div><div class="game"><canvas id="board" width="540" height="540" aria-label="Nine by nine stealth grid"></canvas><div class="controls"><button id="up" aria-label="Move up">▲</button><button id="left" aria-label="Move left">◀</button><button id="down" aria-label="Move down">▼</button><button id="right" aria-label="Move right">▶</button></div></div><div class="other"><button id="restart">Restart level</button><button id="new">New campaign</button><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Avoid the patrols. Find the keys.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),canvas=$("board"),g=canvas.getContext("2d"),N=9,S=60,dirs=[[0,-1],[1,0],[0,1],[-1,0]],maps=[["#########","#.......#","#.##.##.#","#.......#","#.##.##.#","#.......#","#.##.##.#","#.......#","#########"],["#########","#.......#","#.#.#.#.#","#.#...#.#","#...#...#","#.#...#.#","#.#.#.#.#","#.......#","#########"],["#########","#.......#","#.###.#.#","#...#...#","###...###","#...#...#","#.#.###.#","#.......#","#########"]],imgs=[new Image(),new Image()];imgs[0].src="./sprites/cinder-rogue.svg";imgs[1].src="./sprites/void-sentinel.svg";let level=1,player={x:1,y:1},enemies=[],keys=[],exit={x:7,y:7},moves=0,best=0,over=false,won=false;try{best=Number(localStorage.getItem("ashfall:ash-veil:best"))||0}catch{}const eq=(a,b)=>a.x===b.x&&a.y===b.y;function wall(x,y){return x<0||y<0||x>=N||y>=N||maps[(level-1)%maps.length][y][x]==="#"}function setup(l){level=l;player={x:1,y:1};moves=0;over=false;won=false;exit={x:7,y:7};const placements=[[[7,1,2],[1,5,1],[5,7,3]],[[7,1,2],[3,3,1],[5,5,3]],[[7,1,2],[3,5,0],[5,3,2]]][(level-1)%3];enemies=placements.filter(([x,y])=>!wall(x,y)).map(([x,y,d])=>({x,y,d}));keys=[[5,1],[1,7],[7,5]].filter(([x,y])=>!wall(x,y)).map(([x,y])=>({x,y}));if(keys.length<3){for(let y=1;y<8&&keys.length<3;y++)for(let x=1;x<8&&keys.length<3;x++)if(!wall(x,y)&&!keys.some(k=>k.x===x&&k.y===y)&&!(x===1&&y===1)&&!(x===7&&y===7))keys.push({x,y})}$("status").textContent="Level "+level+": gather three ember keys and escape.";hud();draw()}function hud(){$("level").textContent=level;$("keys").textContent=(3-keys.length)+"/3";$("moves").textContent=moves;$("best").textContent=best}function visible(e,p){const [dx,dy]=dirs[e.d];if(dx&&p.y!==e.y||dy&&p.x!==e.x)return false;const dist=dx?p.x-e.x:p.y-e.y;if(dist===0)return true;if(dist*(dx||dy)<=0)return false;const steps=Math.abs(dist);for(let k=1;k<steps;k++)if(wall(e.x+dx*k,e.y+dy*k))return false;return true}function danger(){return enemies.some(e=>visible(e,player))}function fail(){over=true;$("status").textContent="A sentinel spotted you. Restart to try again.";draw()}function submit(){const points=Math.max(100,level*400-moves*4);best=Math.max(best,points);try{localStorage.setItem("ashfall:ash-veil:best",String(best))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-veil",points,{score:points,game:"ash-veil",level,moves})).catch(()=>{})}function move(dx,dy){if(over||won)return;const x=player.x+dx,y=player.y+dy;if(wall(x,y))return;player={x,y};moves++;keys=keys.filter(k=>!eq(k,player));if(danger()){fail();hud();return}if(eq(player,exit)&&!keys.length){won=true;submit();hud();$("status").textContent="Escape successful! The next sector awaits.";draw();setTimeout(()=>{if(won)setup(level+1)},850);return}for(const e of enemies){const [ex,ey]=dirs[e.d],nx=e.x+ex,ny=e.y+ey;if(wall(nx,ny)||eq({x:nx,y:ny},exit)){e.d=(e.d+2)%4}else{e.x=nx;e.y=ny}if(visible(e,player)){fail();hud();return}}$("status").textContent=eq(player,exit)&&keys.length?"The exit needs all three keys.":"Stay out of the sentinels' sight.";hud();draw()}function draw(){g.fillStyle="#181723";g.fillRect(0,0,540,540);const map=maps[(level-1)%maps.length];for(let y=0;y<N;y++)for(let x=0;x<N;x++){g.fillStyle=map[y][x]==="#"?"#57382e":(x+y)%2?"#26212c":"#30252c";g.fillRect(x*S+1,y*S+1,S-2,S-2)}g.fillStyle=keys.length?"#84664c":"#4fa17c";g.fillRect(exit.x*S+8,exit.y*S+8,S-16,S-16);g.fillStyle="#ffe7b1";g.font="bold 22px system-ui";g.textAlign="center";g.fillText("EXIT",exit.x*S+S/2,exit.y*S+S/2+7);for(const k of keys){g.fillStyle="#ffb655";g.beginPath();g.arc(k.x*S+S/2,k.y*S+S/2,12,0,Math.PI*2);g.fill();g.fillStyle="#42251e";g.fillRect(k.x*S+S/2-3,k.y*S+S/2-5,6,10)}for(const e of enemies){const [dx,dy]=dirs[e.d];for(let step=1;step<N;step++){const x=e.x+dx*step,y=e.y+dy*step;if(wall(x,y))break;g.fillStyle="#c67d8233";g.fillRect(x*S+3,y*S+3,S-6,S-6)}g.save();g.translate(e.x*S+S/2,e.y*S+S/2);g.rotate(e.d*Math.PI/2);if(imgs[1].complete&&imgs[1].naturalWidth)g.drawImage(imgs[1],-24,-24,48,48);else{g.fillStyle="#c8a4f5";g.fillRect(-20,-20,40,40)}g.fillStyle="#ffe2f1";g.beginPath();g.moveTo(0,-28);g.lineTo(-7,-16);g.lineTo(7,-16);g.fill();g.restore()}if(imgs[0].complete&&imgs[0].naturalWidth)g.drawImage(imgs[0],player.x*S+6,player.y*S+6,S-12,S-12);else{g.fillStyle="#ffa45d";g.beginPath();g.arc(player.x*S+30,player.y*S+30,20,0,Math.PI*2);g.fill()}if(over||won){g.fillStyle="#0c0b17c4";g.fillRect(0,0,540,540);g.fillStyle="#ffe0b2";g.font="bold 34px system-ui";g.fillText(won?"ESCAPED":"DETECTED",270,270)}}const inputs={up:[0,-1],right:[1,0],down:[0,1],left:[-1,0]};for(const [id,[dx,dy]] of Object.entries(inputs))$(id).onclick=()=>move(dx,dy);document.addEventListener("keydown",e=>{const k={ArrowUp:"up",ArrowRight:"right",ArrowDown:"down",ArrowLeft:"left",w:"up",d:"right",s:"down",a:"left"}[e.key];if(k){e.preventDefault();move(...inputs[k])}});let touch=null;canvas.addEventListener("pointerdown",e=>{touch={x:e.clientX,y:e.clientY}});canvas.addEventListener("pointerup",e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))});$("restart").onclick=()=>setup(level);$("new").onclick=()=>setup(1);$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else canvas.requestFullscreen().catch(()=>{})};imgs.forEach(im=>im.onload=draw);setup(1)})();
</script></body></html>
