<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Hunt | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b291d,#10111a 76%);color:#ffe8d2;font:16px system-ui}main{max-width:670px;margin:auto}a{color:#ffc08a}h1{color:#ffa260;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 15px;background:#65382c;border:1px solid #d9925b;color:#ffe7d0;border-radius:8px;font-weight:800;cursor:pointer}button:disabled{opacity:.3}.board{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;max-width:520px;margin:18px 0}.tile{aspect-ratio:1;min-width:0;padding:2px;background-color:#302736;background-size:22%;background-position:right bottom;background-repeat:no-repeat;font-size:clamp(12px,4vw,24px)}.tile img{width:75%;height:75%}.selected{outline:4px solid #fca45e}.reels{font-size:clamp(45px,12vw,88px);letter-spacing:12px;padding:30px 0;color:#ffc27c}input{font-size:22px;padding:12px;width:150px;background:#282231;color:#fff;border:2px solid #d68c58;border-radius:8px}#status{color:#ffdda9;font-weight:800;min-height:35px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Hunt</h1><p>Find hidden infernal words in a randomly generated letter grid.</p><div id="board" class="board word" style="background:url('./sprites/crypt-letter.svg') no-repeat right bottom;background-size:42px"></div><p>Tap the first and last letter of a word. Words run horizontally, either direction.</p><p><button id="start">New puzzle</button></p><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board");function finish(score){try{const k="ashfall:crypt-hunt:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-hunt",score,{score,game:"crypt-hunt"})).catch(()=>{})}const words=["ASH","VOID","RUNE","PYRE","CRYPT"],N=9;let grid=[],found=new Set(),start=null;function reset(){grid=Array.from({length:N*N},()=>String.fromCharCode(65+Math.floor(Math.random()*26)));found=new Set;words.forEach((word,k)=>{const row=k*2,col=k%2?N-word.length:0;for(let j=0;j<word.length;j++)grid[row*N+col+j]=word[j]});start=null;render()}function choose(i){if(start===null){start=i;render();return}const a=Math.floor(start/N),b=Math.floor(i/N),lo=Math.min(start%N,i%N),hi=Math.max(start%N,i%N);if(a===b){const s=grid.slice(a*N+lo,a*N+hi+1).join("");const reverse=[...s].reverse().join("");for(const word of words)if(s===word||reverse===word)found.add(word)}start=null;if(found.size===words.length)finish(1000);render()}function render(){board.innerHTML="";grid.forEach((ch,i)=>{const b=document.createElement("button");b.className="tile";b.textContent=ch;if(start===i)b.classList.add("selected");b.onclick=()=>choose(i);board.append(b)});status.textContent="Found "+found.size+"/5: "+words.map(w=>found.has(w)?"✓ "+w:w).join(" · ")}$("start").onclick=reset;reset();})();</script></body></html>
