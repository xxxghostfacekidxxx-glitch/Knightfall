<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Last Cinder Standing | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#f2a05d;--green:#ffcc88}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#49251b 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#3c241c 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #eaa16b70;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#ffcc88,#f2a05d);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.arena{aspect-ratio:420/620}</style><style>.ashfall-original-mark{display:block;width:58px;height:58px;filter:drop-shadow(0 0 13px #e99a5b77);margin:4px 0 10px}</style></head><body><img class="ashfall-original-mark" src="./sprites/survivor.svg" alt="Last Cinder Standing original sigil"><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SURVIVAL</div><h1 class="title">Last Cinder Standing</h1><p class="muted">Stay alive for 60 seconds while the horde closes in. Move with WASD/arrows or drag to steer. Your weapon fires automatically. This is what happens when nobody reads the evacuation memo.</p><div class="hud"><span>KILLS <b id="score">0</b></span><span>HEALTH <b id="health">100</b>%</span><span>TIME <b id="time">60</b>s</span></div><canvas id="game" class="arena" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">Restart survival</button><span class="muted">Local run only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let p,enemies,shots,score,health,time,over,last,spawn,fire,keys={},target=null;
function init(){p={x:210,y:310,r:13};enemies=[];shots=[];score=0;health=100;time=60;over=false;last=0;spawn=0;fire=0;keys={};$("score").textContent=0;$("health").textContent=100;$("time").textContent=60;requestAnimationFrame(loop);}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){time-=dt;if(keys.ArrowLeft||keys.a||keys.A)p.x-=210*dt;if(keys.ArrowRight||keys.d||keys.D)p.x+=210*dt;if(keys.ArrowUp||keys.w||keys.W)p.y-=210*dt;if(keys.ArrowDown||keys.s||keys.S)p.y+=210*dt;if(target){p.x+=(target.x-p.x)*Math.min(1,dt*4);p.y+=(target.y-p.y)*Math.min(1,dt*4);}p.x=Math.max(15,Math.min(405,p.x));p.y=Math.max(15,Math.min(605,p.y));spawn-=dt;fire-=dt;if(spawn<=0){const a=Math.random()*Math.PI*2;enemies.push({x:p.x+Math.cos(a)*260,y:p.y+Math.sin(a)*260,r:10+Math.random()*5,s:35+Math.random()*35});spawn=Math.max(.18,.7-score*.004);}if(fire<=0&&enemies.length){let near=enemies.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b);const dx=near.x-p.x,dy=near.y-p.y,d=Math.hypot(dx,dy)||1;shots.push({x:p.x,y:p.y,vx:dx/d*330,vy:dy/d*330});fire=.32;}for(const e of enemies){const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.s*dt;e.y+=dy/d*e.s*dt;if(d<p.r+e.r){health-=24*dt;}}for(const b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;}for(const b of shots)for(const e of enemies)if(!b.dead&&!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){b.dead=e.dead=true;score++;$("score").textContent=score;}enemies=enemies.filter(e=>!e.dead);shots=shots.filter(b=>!b.dead&&b.x>-20&&b.x<440&&b.y>-20&&b.y<640);$("health").textContent=Math.max(0,Math.floor(health));$("time").textContent=Math.ceil(Math.max(0,time));if(health<=0||time<=0){over=true;}}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,620);x.fillStyle="#0b1018";x.fillRect(0,0,420,620);for(let i=0;i<20;i++){x.strokeStyle="#ffcc8810";x.beginPath();x.arc(210,310,25+i*17,0,Math.PI*2);x.stroke();}for(const e of enemies){x.fillStyle="#f2a05d";x.shadowColor="#f2a05d";x.shadowBlur=8;x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle="#140b17";x.fillRect(e.x-4,e.y-2,3,3);x.fillRect(e.x+3,e.y-2,3,3);}x.fillStyle="#ffcc88";x.shadowColor="#ffcc88";x.shadowBlur=14;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle="#f4ffcf";x.beginPath();x.arc(p.x-4,p.y-3,2,0,Math.PI*2);x.arc(p.x+4,p.y-3,2,0,Math.PI*2);x.fill();x.fillStyle="#fff";for(const b of shots){x.beginPath();x.arc(b.x,b.y,3,0,Math.PI*2);x.fill();}if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#ffcc88";x.textAlign="center";x.font="bold 28px system-ui";x.fillText(health<=0?"YOU GOT SWARMED":"YOU SURVIVED",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Kills: "+score,210,330);}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*420/r.width,y:(e.clientY-r.top)*620/r.height};}
c.addEventListener("pointermove",e=>{target=pos(e)});c.addEventListener("pointerleave",()=>target=null);document.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault()});document.addEventListener("keyup",e=>keys[e.key]=false);$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-survivor" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
