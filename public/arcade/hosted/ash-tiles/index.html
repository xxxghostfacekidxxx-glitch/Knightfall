<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Tiles | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b291d,#10111a 76%);color:#ffe8d2;font:16px system-ui}main{max-width:670px;margin:auto}a{color:#ffc08a}h1{color:#ffa260;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 15px;background:#65382c;border:1px solid #d9925b;color:#ffe7d0;border-radius:8px;font-weight:800;cursor:pointer}button:disabled{opacity:.3}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:520px;margin:18px 0}.tile{aspect-ratio:1;min-width:0;padding:2px;background-color:#302736;background-size:22%;background-position:right bottom;background-repeat:no-repeat;font-size:clamp(12px,4vw,24px)}.tile img{width:75%;height:75%}.selected{outline:4px solid #fca45e}.reels{font-size:clamp(45px,12vw,88px);letter-spacing:12px;padding:30px 0;color:#ffc27c}input{font-size:22px;padding:12px;width:150px;background:#282231;color:#fff;border:2px solid #d68c58;border-radius:8px}#status{color:#ffdda9;font-weight:800;min-height:35px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Tiles</h1><p>Slide fifteen numbered ash tiles into order around the empty space.</p><div id="board" class="board"></div><p><button id="start">New puzzle</button></p><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board");function finish(score){try{const k="ashfall:ash-tiles:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-tiles",score,{score,game:"ash-tiles"})).catch(()=>{})}let tiles=[],moves=0,won=false;const solved=Array.from({length:15},(_,i)=>i+1).concat(0);function neighbors(i){const x=i%4,y=Math.floor(i/4);return [i-4,i+4,i-1,i+1].filter(j=>j>=0&&j<16&&Math.abs(j%4-x)+Math.abs(Math.floor(j/4)-y)===1)}function reset(){tiles=[...solved];for(let i=0;i<150;i++){const empty=tiles.indexOf(0),options=neighbors(empty),j=options[Math.floor(Math.random()*options.length)];[tiles[empty],tiles[j]]=[tiles[j],tiles[empty]]}moves=0;won=false;render()}function pick(i){if(won)return;const e=tiles.indexOf(0);if(!neighbors(e).includes(i))return;[tiles[e],tiles[i]]=[tiles[i],tiles[e]];moves++;if(tiles.every((v,i)=>v===solved[i])){won=true;finish(Math.max(100,1800-moves*8))}render()}function render(){board.innerHTML="";tiles.forEach((v,i)=>{const b=document.createElement("button");b.className="tile";b.disabled=v===0;b.textContent=v||"";if(v)b.style.backgroundImage="url(./sprites/tile-mark.svg)";b.onclick=()=>pick(i);board.append(b)});status.textContent=(won?"Solved! · ":"Moves · ")+moves}$("start").onclick=reset;reset();})();</script></body></html>
