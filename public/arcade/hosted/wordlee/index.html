<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wordlee | Chaos Cartridge</title><style>
:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:560px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:350px;margin:18px auto}.tile{aspect-ratio:1;border:1px solid #ffffff30;border-radius:7px;display:grid;place-items:center;font-size:clamp(1.2rem,5vw,1.7rem);font-weight:900;text-transform:uppercase;background:#111722}.tile.good{background:#a8ff48;color:#10160a;border-color:#a8ff48}.tile.present{background:#ff5edb;color:#160d17;border-color:#ff5edb}.tile.absent{background:#303744;color:#fff;border-color:#303744}.keyboard{display:grid;gap:6px;max-width:460px;margin:12px auto}.row{display:flex;gap:5px;justify-content:center}.key{flex:1;min-width:0;padding:12px 0;border:1px solid #ffffff1b;border-radius:6px;background:#242c39;color:#f5f7fb;font-weight:900;cursor:pointer}.key.wide{flex:1.5;font-size:.72rem}.key.good{background:#a8ff48;color:#10160a}.key.present{background:#ff5edb;color:#160d17}.key.absent{background:#303744}.status{text-align:center;min-height:28px;color:var(--green);font-weight:900}.btn{display:block;margin:12px auto 0;border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}
</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / WORD GAME</div><h1 class="title">WORDLEE<br><span>AFTER DARK</span></h1><p class="muted">Guess the five-letter word in six tries. Green means correct, pink means the letter is somewhere else. The dictionary is small and local. Unlike most online arguments.</p><div class="board" id="board"></div><div class="status" id="status" aria-live="polite">Type a five-letter word.</div><div class="keyboard" id="keyboard"></div><button class="btn" id="reset">New word</button></section></main><script>
const words=["ASHEN","BRAVE","CHAOS","CLOUD","CRUEL","DREAM","EMBER","FLAME","GHOST","GRIME","HAPPY","JOKER","KNIFE","LAUGH","LEMON","MAGIC","NIGHT","PIXEL","QUEEN","QUICK","RAVEN","ROBOT","SNAKE","SPARK","SPOOK","STORM","SWIFT","TOXIC","TRICK","WITCH","WORLD","ZEBRA"];let answer="",row=0,guess="",done=false,guesses=[],keyState={};const $=id=>document.getElementById(id);
const rows=[["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["ENTER","Z","X","C","V","B","N","M","⌫"]];
function init(){answer=words[Math.floor(Math.random()*words.length)];row=0;guess="";done=false;guesses=[];keyState={};$("status").textContent="Type a five-letter word.";draw();}
function draw(){const board=$("board");board.innerHTML="";for(let r=0;r<6;r++)for(let c=0;c<5;c++){const t=document.createElement("div");t.className="tile";const g=guesses[r];if(g){t.textContent=g.word[c]||"";if(g.colors)t.classList.add(g.colors[c]);}else if(r===row)t.textContent=guess[c]||"";board.appendChild(t);}const kb=$("keyboard");kb.innerHTML="";for(const parts of rows){const line=document.createElement("div");line.className="row";for(const ch of parts)line.appendChild(key(ch));kb.appendChild(line);}}
function key(ch){const b=document.createElement("button");b.className="key"+(["ENTER","⌫"].includes(ch)?" wide":"")+(keyState[ch]?" "+keyState[ch]:"");b.textContent=ch;b.addEventListener("click",()=>press(ch));return b;}
function press(ch){if(done)return;if(ch==="ENTER"){submit();return;}if(ch==="⌫"||ch==="BACKSPACE"){guess=guess.slice(0,-1);draw();return;}if(/^[A-Z]$/.test(ch)&&guess.length<5){guess+=ch;draw();}}
function submit(){if(guess.length!==5){$("status").textContent="Need five letters. The rules remain undefeated.";return;}const chars=guess.split(""),answerChars=answer.split(""),colors=Array(5).fill("absent");for(let i=0;i<5;i++)if(chars[i]===answerChars[i]){colors[i]="good";answerChars[i]=null;}for(let i=0;i<5;i++)if(colors[i]!=="good"){const idx=answerChars.indexOf(chars[i]);if(idx>=0){colors[i]="present";answerChars[idx]=null;}}guesses[row]={word:guess,colors};for(let i=0;i<5;i++){const s=colors[i],old=keyState[chars[i]];if(s==="good"||(!old&&s==="present")||(!old&&s==="absent"))keyState[chars[i]]=s;}if(guess===answer){done=true;$("status").textContent="Solved. You are temporarily allowed to feel clever.";}else if(row===5){done=true;$("status").textContent="Out of guesses. Word: "+answer;}else{$("status").textContent="Guess "+(row+2)+" of 6.";row++;}guess="";draw();}
document.addEventListener("keydown",e=>{if(e.key==="Enter")press("ENTER");else if(e.key==="Backspace")press("⌫");else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());});$("reset").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-wordlee" data-score-mode="completion"></script>
</body></html>
