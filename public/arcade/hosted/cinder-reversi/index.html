<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Cinder Reversi | Chaos Cartridge</title><link rel="stylesheet" href="/theme.css"><script src="/nav.js" defer></script>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#080808;color:#eee;font:16px system-ui;margin:0}main{max-width:650px;margin:2rem auto;padding:1rem}h1{color:#ff55d8}a{color:#8dff9a}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:#164b35;padding:8px;border:2px solid #ff55d8;border-radius:12px;aspect-ratio:1}.cell{border:0;border-radius:3px;background:#257550;display:grid;place-items:center;padding:0;cursor:pointer;position:relative}.cell:focus-visible{outline:3px solid white}.disc{width:76%;height:76%;border-radius:50%;box-shadow:inset 0 2px 7px #0009}.human{background:#ff55d8}.cpu{background:#101010;border:2px solid #a7ffae}.hint:after{content:"";width:20%;height:20%;border-radius:50%;background:#b6ffb6;position:absolute}.cell:disabled{cursor:default}.bar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:1rem 0}button{font:inherit}#reset{background:#ff55d8;color:#130710;border:0;border-radius:8px;padding:.6rem 1rem;font-weight:800}#status{min-height:2em}small{color:#aaa}</style></head><body><main><a href="/arcade.html">← Arcade</a><h1>Cinder Reversi</h1><p>Flip the board. You are pink; the CPU is black. Capture pieces by enclosing them in straight lines.</p><div class="bar"><strong id="score">Pink 2 · Black 2</strong><button id="reset">New game</button></div><p id="status" role="status" aria-live="polite">Your turn.</p><div class="board" id="board" role="group" aria-label="Reversi board"></div><p><small>Tap a highlighted square. If neither player can move, the most discs wins. No external scripts or network required.</small></p></main>
<script>
(()=>{'use strict';const el=document.getElementById('board'),status=document.getElementById('status'),score=document.getElementById('score');const dirs=[-1,0,1].flatMap(y=>[-1,0,1].filter(x=>x||y).map(x=>[x,y]));let b,turn,ended,timer;const at=(x,y)=>x>=0&&x<8&&y>=0&&y<8?b[y*8+x]:null;function flips(x,y,p){if(at(x,y)!==0)return [];let all=[];for(const [dx,dy] of dirs){let cx=x+dx,cy=y+dy,found=[];while(at(cx,cy)===-p){found.push(cy*8+cx);cx+=dx;cy+=dy}if(at(cx,cy)===p)all.push(...found)}return all}function moves(p){let m=[];for(let y=0;y<8;y++)for(let x=0;x<8;x++){const f=flips(x,y,p);if(f.length)m.push({x,y,f})}return m}function count(p){return b.filter(v=>v===p).length}function render(){const legal=turn===1&&!ended?moves(1):[];el.replaceChildren();for(let y=0;y<8;y++)for(let x=0;x<8;x++){const i=y*8+x,cell=document.createElement('button');cell.className='cell';cell.type='button';cell.setAttribute('aria-label',String.fromCharCode(65+x)+(y+1)+(b[i]===1?' pink':b[i]===-1?' black':' empty'));const m=legal.find(m=>m.x===x&&m.y===y);if(m){cell.classList.add('hint');cell.onclick=()=>play(m,1)}else cell.disabled=true;if(b[i]){const disc=document.createElement('span');disc.className='disc '+(b[i]===1?'human':'cpu');cell.append(disc)}el.append(cell)}score.textContent='Pink '+count(1)+' · Black '+count(-1)}function advance(){const current=moves(turn);if(!current.length){turn=-turn;if(!moves(turn).length){ended=true;const a=count(1),c=count(-1);status.textContent=a===c?'Draw!':a>c?'You win!':'CPU wins!';render();return}status.textContent=(turn===1?'CPU':'You')+' had no moves. Turn passes.'}else status.textContent=turn===1?'Your turn.':'CPU thinking…';render();if(turn===-1&&!ended)timer=setTimeout(cpu,320)}function play(m,p){if(ended||turn!==p)return;clearTimeout(timer);b[m.y*8+m.x]=p;for(const i of m.f)b[i]=p;turn=-p;advance()}function cpu(){if(ended||turn!==-1)return;const options=moves(-1);if(!options.length){advance();return}const weight=m=>{const corner=(m.x===0||m.x===7)&&(m.y===0||m.y===7);const edge=m.x===0||m.x===7||m.y===0||m.y===7;return m.f.length+(corner?40:edge?4:0)};options.sort((a,c)=>weight(c)-weight(a));play(options[0],-1)}function reset(){clearTimeout(timer);b=Array(64).fill(0);b[27]=-1;b[28]=1;b[35]=1;b[36]=-1;turn=1;ended=false;status.textContent='Your turn.';render()}document.getElementById('reset').onclick=reset;reset()})();
</script></body></html>
