<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Maze | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#49291e,#0d0e17 76%);color:#ffe7d0;font:16px system-ui}main{max-width:660px;margin:auto}a{color:#ffbb80}h1{font-size:clamp(2rem,7vw,3.5rem);color:#ffa05c}p{color:#d7c1b4;line-height:1.5}canvas{display:block;width:min(100%,520px);height:auto;border:3px solid #cc8452;border-radius:12px;touch-action:none}.pad{display:flex;gap:8px;flex-wrap:wrap}button{padding:12px 16px;margin:7px 6px 7px 0;background:#663b2d;border:1px solid #d48a52;color:#ffe8d0;border-radius:9px;font-weight:800;cursor:pointer}#status{font-weight:800;color:#ffdda8;min-height:30px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Maze</h1><canvas id="game" width="480" height="480"></canvas><p>Use arrow keys, WASD, or the touch controls. Collect every ember before the Void catches you.</p><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button id="restart">Restart</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status");function finish(points){try{const k="ashfall:cinder-maze:best";localStorage.setItem(k,String(Math.max(points,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-maze",points,{score:points,game:"cinder-maze"})).catch(()=>{})}const canvas=$("game"),ctx=canvas.getContext("2d"),map=["###############","#.............#","#.###.###.###.#","#...#.....#...#","###.#.###.#.###","#...#...#.....#","#.#####.#.###.#","#.......#.....#","#.###.#####.#.#","#...#.......#.#","###.#.###.###.#","#...#...#.....#","#.###.#.###.#.#","#.....#.......#","###############"],N=15,S=32,dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};let player,enemy,shards,score,over,won,steps;const key=(x,y)=>x+","+y;function wall(x,y){return !map[y]||map[y][x]!=="."}function reset(){player={x:1,y:1};enemy={x:13,y:13};shards=new Set;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!wall(x,y)&&!(x===1&&y===1)&&!(x===13&&y===13))shards.add(key(x,y));score=0;steps=0;over=false;won=false;draw()}function move(d){if(over||won)return;const [dx,dy]=dirs[d],x=player.x+dx,y=player.y+dy;if(wall(x,y))return;player={x,y};steps++;if(shards.delete(key(x,y)))score+=10;if(player.x===enemy.x&&player.y===enemy.y){lose();return}if(!shards.size){won=true;finish(score+500);draw();return}if(steps%2===0){const options=Object.values(dirs).map(([a,b])=>({x:enemy.x+a,y:enemy.y+b})).filter(p=>!wall(p.x,p.y));options.sort((a,b)=>(Math.abs(a.x-player.x)+Math.abs(a.y-player.y))-(Math.abs(b.x-player.x)+Math.abs(b.y-player.y)));enemy=options[Math.random()<.75?0:Math.floor(Math.random()*options.length)]||enemy}if(player.x===enemy.x&&player.y===enemy.y){lose();return}draw()}function lose(){over=true;finish(score);draw()}function draw(){ctx.fillStyle="#111521";ctx.fillRect(0,0,480,480);for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=wall(x,y)?"#50332e":"#25232b";ctx.fillRect(x*S+1,y*S+1,S-2,S-2);if(shards.has(key(x,y))){ctx.fillStyle="#ffc47c";ctx.beginPath();ctx.arc(x*S+16,y*S+16,4,0,7);ctx.fill()}}ctx.fillStyle="#f19351";ctx.beginPath();ctx.arc(player.x*S+16,player.y*S+16,12,0,7);ctx.fill();ctx.fillStyle="#ab83e0";ctx.beginPath();ctx.arc(enemy.x*S+16,enemy.y*S+16,12,0,7);ctx.fill();status.textContent=(won?"Escaped!":over?"The Void found you.":"Embers "+(score/10)+" · Remaining "+shards.size)+" · Score "+score}document.addEventListener("keydown",e=>{const d={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key];if(d){e.preventDefault();move(d)}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>move(b.dataset.dir));$("restart").onclick=reset;reset();})();</script></body></html>
