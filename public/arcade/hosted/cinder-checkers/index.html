<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Checkers</title><style>body{background:#0d0b13;color:#fff;font:16px system-ui;text-align:center;margin:0;padding:15px}a{color:#9f9}h1{color:#ff5bd2}#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));max-width:560px;margin:18px auto;border:5px solid #403a48}#board button{aspect-ratio:1;border:0;padding:0;min-width:0;position:relative}#board .dark{background:#514355}#board .light{background:#e3c9c5}#board .selected{outline:4px solid #9f9;outline-offset:-4px}#board .target:before{content:'';position:absolute;inset:36%;background:#9f9;border-radius:50%}#board .p1:after,#board .p2:after{content:'';display:block;position:absolute;inset:12%;border-radius:50%;background:#ff5bd2;border:3px solid #9a276b}#board .p2:after{background:#16161d;border-color:#aaa}#board .king:after{box-shadow:inset 0 0 0 5px #f4ce54}#reset{padding:12px 20px;border:0;background:#ff5bd2;border-radius:9px;font-weight:bold}#status{min-height:2em}</style><a href="/arcade-card-board.html">← Card & Board Games</a><h1>Cinder Checkers</h1><p>Pink moves up, black moves down. Captures are mandatory. Reach the far side to crown a king.</p><p id="status" role="status"></p><div id="board" aria-label="Checkers board"></div><button id="reset">New game</button><script>(()=>{'use strict';const board=document.getElementById('board'),status=document.getElementById('status');let cells,turn,selected,chain,over;const xy=i=>[i%8,Math.floor(i/8)],index=(x,y)=>y*8+x,inside=(x,y)=>x>=0&&x<8&&y>=0&&y<8;function moves(i,jumpsOnly=false){const p=cells[i];if(!p)return[];const [x,y]=xy(i),dirs=p.king?[-1,1]:[p.owner===1?-1:1],out=[];for(const dy of dirs)for(const dx of [-1,1]){const a=x+dx,b=y+dy;if(!inside(a,b))continue;const near=cells[index(a,b)];if(!near&&!jumpsOnly)out.push({from:i,to:index(a,b),capture:-1});else if(near&&near.owner!==p.owner&&inside(a+dx,b+dy)&&!cells[index(a+dx,b+dy)])out.push({from:i,to:index(a+dx,b+dy),capture:index(a,b)})}return out}function legal(owner){const own=cells.flatMap((p,i)=>p&&p.owner===owner?moves(i):[]);const jumps=own.filter(m=>m.capture>=0);return jumps.length?jumps:own}function draw(msg){board.replaceChildren();const all=legal(turn),allowed=chain!==null?moves(chain,true).filter(m=>m.capture>=0):all;cells.forEach((p,i)=>{const b=document.createElement('button');const [x,y]=xy(i);b.className=(x+y)%2?'dark':'light';if(p)b.className+=' p'+p.owner+(p.king?' king':'');if(selected===i)b.className+=' selected';if(selected!==null&&allowed.some(m=>m.from===selected&&m.to===i))b.className+=' target';b.disabled=over||turn!==1;b.setAttribute('aria-label','Row '+(y+1)+' column '+(x+1)+(p?' '+(p.owner===1?'pink':'black')+(p.king?' king':''):' empty'));b.onclick=()=>click(i);board.append(b)});status.textContent=msg||(turn===1?'Your move':'CPU move')}function perform(m){const p=cells[m.from];cells[m.from]=null;cells[m.to]=p;if(m.capture>=0)cells[m.capture]=null;const y=xy(m.to)[1],crowned=!p.king&&(p.owner===1?y===0:y===7);if(crowned)p.king=true;if(m.capture>=0&&!crowned&&moves(m.to,true).some(n=>n.capture>=0)){chain=m.to;selected=m.to;draw('Continue capturing');if(turn===2)setTimeout(cpu,250);return}chain=null;selected=null;turn=3-turn;if(!legal(turn).length){over=true;draw(turn===2?'You win!':'CPU wins');return}draw();if(turn===2)setTimeout(cpu,250)}function click(i){if(over||turn!==1)return;const all=chain!==null?moves(chain,true).filter(m=>m.capture>=0):legal(1);if(selected!==null){const m=all.find(m=>m.from===selected&&m.to===i);if(m){perform(m);return}}if(all.some(m=>m.from===i)){selected=i;draw()}else if(chain===null){selected=null;draw()}}function cpu(){if(over||turn!==2)return;const all=chain!==null?moves(chain,true).filter(m=>m.capture>=0):legal(2);if(!all.length){over=true;draw('You win!');return}all.sort((a,b)=>(b.capture>=0)-(a.capture>=0));perform(all[Math.floor(Math.random()*Math.min(3,all.length))])}function start(){cells=Array(64).fill(null);for(let y=0;y<8;y++)for(let x=0;x<8;x++)if((x+y)%2===1){if(y<3)cells[index(x,y)]={owner:2,king:false};if(y>4)cells[index(x,y)]={owner:1,king:false}}turn=1;selected=null;chain=null;over=false;draw()}document.getElementById('reset').onclick=start;start()})();</script></html>
