<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Balance Beam | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.beam{aspect-ratio:420/620}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SKILL</div><h1 class="title">BALANCE<br><span>BEAM</span></h1><p class="muted">The beam tilts under shifting weight and wind. Tap the side that is dropping to counter it. Keep the angle stable for 30 seconds. Physics is just consequences with better branding.</p><div class="hud"><span>STABILITY <b id="score">100</b>%</span><span>TIME <b id="time">30</b>s</span><span id="state">BALANCE</span></div><canvas id="game" class="beam" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">Try again</button><span class="muted">Tap left/right or use ←/→</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let tilt=0,wind=0,time=30,over=false,last=0,windTimer=0,score=100;
function init(){tilt=0;wind=0;time=30;over=false;last=0;windTimer=0;score=100;$("score").textContent=100;$("time").textContent=30;$("state").textContent="BALANCE";requestAnimationFrame(loop);}
function nudge(side){if(over)return;tilt+=side*.13;tilt=Math.max(-1.2,Math.min(1.2,tilt));}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){time-=dt;windTimer-=dt;if(windTimer<=0){wind=(Math.random()-.5)*.7;windTimer=.7+Math.random()*1.2;}tilt+=wind*dt;tilt*=1-.16*dt;score=Math.max(0,100-Math.floor(Math.abs(tilt)*100));$("score").textContent=score;$("time").textContent=Math.ceil(Math.max(0,time));if(Math.abs(tilt)>1.05){over=true;$("state").textContent="TIPPED OVER";}else if(time<=0){time=0;over=true;$("state").textContent="BALANCED!";}}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,620);x.fillStyle="#0b1018";x.fillRect(0,0,420,620);for(let i=0;i<18;i++){x.fillStyle="#ffffff10";x.fillRect(i*25,50+(i*53)%500,2,2);}x.fillStyle="#151d2a";x.fillRect(0,490,420,130);x.fillStyle="#ff5edb";x.beginPath();x.moveTo(210,400);x.lineTo(165,500);x.lineTo(255,500);x.closePath();x.fill();x.save();x.translate(210,390);x.rotate(tilt);x.fillStyle="#a8ff48";x.shadowColor="#a8ff48";x.shadowBlur=12;x.fillRect(-175,-9,350,18);x.shadowBlur=0;for(const side of [-1,1]){x.fillStyle=side===-1?"#ff5edb":"#45d9ff";x.beginPath();x.arc(side*125,-28,18,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.fillRect(side*125-7,-52,14,18);}x.restore();x.strokeStyle="#ffffff30";x.lineWidth=2;x.beginPath();x.moveTo(25,110);x.lineTo(395,110);x.stroke();x.fillStyle="#a8ff48";x.fillRect(25,100,Math.max(0,370*(1-Math.abs(tilt)/1.2)),20);if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#a8ff48";x.textAlign="center";x.font="bold 28px system-ui";x.fillText(Math.abs(tilt)>1.05?"TIMBER!":"BALANCE HELD",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Stability: "+score+"%",210,330);}}
c.addEventListener("pointerdown",e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*420/r.width;nudge(px<210?1:-1)});document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")nudge(1);if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")nudge(-1)});$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-balance-stack" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
