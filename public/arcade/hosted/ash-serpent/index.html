<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#150d0c"><title>Ash Serpent | Chaos Cartridge</title><style>*{box-sizing:border-box}body{font:16px system-ui;color:#fce9d5;background:radial-gradient(circle at top,#462218,#100e12 70%);margin:0;padding:16px}main{max-width:720px;margin:auto}a{color:#ffb76c}h1{font-size:clamp(2.2rem,8vw,4rem);color:#ff9d4d;margin:14px 0 0}p{color:#d2c1b6;line-height:1.5}.stats{display:flex;gap:20px;font-weight:800;color:#ffe1a5;margin:12px 0}canvas{width:100%;aspect-ratio:1;display:block;background:#111820;border:3px solid #a35c36;border-radius:16px;touch-action:none}button{background:#5d2c21;color:#fff0da;border:1px solid #d47e45;padding:13px;border-radius:10px;font-weight:800;min-width:56px;touch-action:none}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.pad{display:grid;grid-template-columns:repeat(3,68px);justify-content:center;gap:6px}.pad button[data-dir=up]{grid-column:2}.pad button[data-dir=left]{grid-column:1}.pad button[data-dir=down]{grid-column:2}.pad button[data-dir=right]{grid-column:3}#status{color:#ffda98;font-weight:800}</style><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Serpent</h1><p>Devour emberfruit. Don't eat your own tail. Custom Ash-Fall sprites and original gameplay code.</p><div class="stats"><span>SCORE <output id="score">0</output></span><span>BEST <output id="best">0</output></span><span>LEVEL <output id="level">1</output></span></div><canvas id="game" width="600" height="600" aria-label="Ash Serpent playfield"></canvas><div class="controls"><button id="start">Start / Restart</button><button id="pause">Pause</button><button id="full">Fullscreen</button></div><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p id="status" role="status">Press Start to begin. Arrow keys / WASD or swipe to steer.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const c=document.getElementById("game"),g=c.getContext("2d"),N=20,T=c.width/N,ui=id=>document.getElementById(id),headImg=new Image(),fruitImg=new Image();headImg.src="./sprites/serpent-head.svg";fruitImg.src="./sprites/ember-fruit.svg";let snake=[],dir="right",next="right",fruit=null,score=0,best=0,playing=false,paused=false,clock=0,last=0;try{best=Number(localStorage.getItem("ashfall:ash-serpent:best"))||0}catch{}const vector={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},opposite={up:"down",down:"up",left:"right",right:"left"};function hud(){ui("score").textContent=score;ui("best").textContent=best;ui("level").textContent=1+Math.floor(score/50)}function spawn(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});fruit=free.length?free[Math.floor(Math.random()*free.length)]:null;if(!fruit){end("The entire wasteland is yours. Victory!")}}function start(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=next="right";score=0;playing=true;paused=false;clock=0;spawn();hud();ui("status").textContent="Collect emberfruit to grow.";ui("pause").textContent="Pause"}function end(message){playing=false;ui("status").textContent=message+" Score: "+score;try{localStorage.setItem("ashfall:ash-serpent:best",String(best))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-serpent",score,{score,game:"ash-serpent",lastPlayedAt:new Date().toISOString()})).catch(()=>{})}function steer(d){if(vector[d]&&d!==opposite[dir])next=d}function step(){dir=next;const [dx,dy]=vector[dir],h={x:snake[0].x+dx,y:snake[0].y+dy},eats=fruit&&h.x===fruit.x&&h.y===fruit.y;if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.slice(0,eats?undefined:-1).some(p=>p.x===h.x&&p.y===h.y)){end("The serpent turned to ash.");return}snake.unshift(h);if(eats){score+=10;best=Math.max(score,best);spawn()}else snake.pop();hud()}function sprite(img,x,y,angle=0){g.save();g.translate((x+.5)*T,(y+.5)*T);g.rotate(angle);if(img.complete&&img.naturalWidth)g.drawImage(img,-T*.49,-T*.49,T*.98,T*.98);else{g.fillStyle="#ff9d4e";g.fillRect(-T*.4,-T*.4,T*.8,T*.8)}g.restore()}function draw(){g.fillStyle="#111820";g.fillRect(0,0,c.width,c.height);for(let y=0;y<N;y++)for(let x=0;x<N;x++){g.fillStyle=(x+y)%2?"#1a2026":"#20252a";g.fillRect(x*T+1,y*T+1,T-2,T-2)}if(fruit)sprite(fruitImg,fruit.x,fruit.y);snake.forEach((p,i)=>{if(i===0){sprite(headImg,p.x,p.y,{right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[dir])}else{g.fillStyle=i%2?"#a24c28":"#c7682d";g.beginPath();g.roundRect(p.x*T+2,p.y*T+2,T-4,T-4,9);g.fill();g.fillStyle="#f7b46a";g.fillRect(p.x*T+T*.38,p.y*T+T*.38,T*.24,T*.24)}});if(!playing||paused){g.fillStyle="#07090dbb";g.fillRect(0,0,c.width,c.height);g.textAlign="center";g.fillStyle="#ffd9a2";g.font="bold 42px system-ui";g.fillText(paused?"PAUSED":snake.length?"RUN ENDED":"ASH SERPENT",300,300)}}function frame(t){const dt=last?Math.min(t-last,100):0;last=t;if(playing&&!paused){clock+=dt;const interval=Math.max(75,160-Math.floor(score/50)*12);if(clock>=interval){clock-=interval;step()}}draw();requestAnimationFrame(frame)}const keyMap={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};document.addEventListener("keydown",e=>{if(keyMap[e.key]){e.preventDefault();steer(keyMap[e.key])}if(e.key.toLowerCase()==="p"&&!e.repeat)toggle()});document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>steer(b.dataset.dir)));let touch=null;c.addEventListener("pointerdown",e=>{touch={x:e.clientX,y:e.clientY}});c.addEventListener("pointerup",e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;steer(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up")});function toggle(){if(!playing)return;paused=!paused;ui("pause").textContent=paused?"Resume":"Pause"}ui("start").onclick=start;ui("pause").onclick=toggle;ui("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else c.requestFullscreen().catch(()=>{})};document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)paused=true});hud();requestAnimationFrame(frame)})();
</script></html>
