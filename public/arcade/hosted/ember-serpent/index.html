<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Serpent | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#48281f,#0d0e17 75%);color:#ffe9d3;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffbb7d}h1{font-size:clamp(2rem,7vw,3.5rem);color:#ffa15e}p{line-height:1.5;color:#d7c3b7}canvas{display:block;width:min(100%,480px);height:auto;border:3px solid #ca804d;border-radius:12px;touch-action:none}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:520px;margin:12px 0}.cell{aspect-ratio:1;display:grid;place-items:center;background:#40332f;font-size:25px;border-radius:5px}.cell.wall{background:#1a1b29}.cell.goal{box-shadow:inset 0 0 0 3px #e7a861}.cell img,.hole img{width:75%;height:75%}.holes{grid-template-columns:repeat(3,1fr);max-width:450px}.hole{aspect-ratio:1;background:#332634;border:3px solid #af7051;border-radius:50%;cursor:pointer}.pad{display:flex;gap:8px;flex-wrap:wrap}button:not(.hole){padding:12px 16px;margin:8px 5px 8px 0;background:#623729;border:1px solid #e0975b;color:#ffe6c9;border-radius:9px;font-weight:800;cursor:pointer}#status{color:#ffdbab;font-weight:800;min-height:32px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ember Serpent</h1><canvas id="screen" width="480" height="480"></canvas><p>Arrow keys, WASD, or swipe to steer. Collect relics. Don't hit the walls or your tail.</p><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status");function finish(points){try{const k="ashfall:ember-serpent:best";localStorage.setItem(k,String(Math.max(points,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ember-serpent",points,{score:points,game:"ember-serpent"})).catch(()=>{})}const c=$("screen"),g=c.getContext("2d"),N=20,S=24,dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};let snake,dir,next,food,score,active,timer;function spawn(){const empty=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});return empty[Math.floor(Math.random()*empty.length)]||null}function reset(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir="right";next="right";score=0;active=true;food=spawn();timer=setInterval(tick,130);draw()}function steer(d){if(!active)return;const a=dirs[d],b=dirs[dir];if(a[0]!==-b[0]||a[1]!==-b[1])next=d}function tick(){if(!active)return;dir=next;const [dx,dy]=dirs[dir],head={x:snake[0].x+dx,y:snake[0].y+dy},eating=food&&head.x===food.x&&head.y===food.y;if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.slice(0,eating?undefined:-1).some(p=>p.x===head.x&&p.y===head.y)){active=false;clearInterval(timer);finish(score);draw();return}snake.unshift(head);if(eating){score+=25;food=spawn();if(!food){active=false;clearInterval(timer);finish(score)}}else snake.pop();draw()}function draw(){g.fillStyle="#14151f";g.fillRect(0,0,480,480);g.strokeStyle="#ffffff09";for(let i=0;i<=N;i++){g.beginPath();g.moveTo(i*S,0);g.lineTo(i*S,480);g.moveTo(0,i*S);g.lineTo(480,i*S);g.stroke()}snake.forEach((p,i)=>{g.fillStyle=i?"#b95636":"#ffae62";g.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});if(food){g.fillStyle="#e6d2a0";g.beginPath();g.arc(food.x*S+12,food.y*S+12,9,0,7);g.fill()}status.textContent="Relics: "+score/25+" · Score: "+score+(active?"":" · Game over")};document.addEventListener("keydown",e=>{const k={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key];if(k){e.preventDefault();steer(k)}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>steer(b.dataset.dir));let start=null;c.onpointerdown=e=>{start=[e.clientX,e.clientY]};c.onpointerup=e=>{if(!start)return;const dx=e.clientX-start[0],dy=e.clientY-start[1];start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;steer(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up")};document.addEventListener("visibilitychange",()=>{if(document.hidden&&active){clearInterval(timer);active=false;status.textContent="Paused by backgrounding. Start a new run."}});reset();})();
</script></body></html>
