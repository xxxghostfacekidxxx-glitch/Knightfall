<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Orbit | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49291f,#0e1019 75%);color:#ffe7d1;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffc18b}h1{color:#ffa15c;font-size:clamp(2rem,8vw,3.6rem)}p{color:#dbc5b8;line-height:1.5}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-width:510px;margin:20px 0}.cell{aspect-ratio:1;display:grid;place-items:center;min-width:0;background:#322936;border:2px solid #99644b;border-radius:10px;color:#ffd5a2;cursor:pointer}.cell img{width:68%;height:68%}.cell.flash{background:#e49a58;color:#221a24}.conduit{font-size:clamp(22px,6vw,43px);font-weight:900}button:not(.cell){padding:12px 18px;background:#65392c;color:#ffe8d2;border:1px solid #da905b;border-radius:9px;font-weight:800;cursor:pointer;margin:7px 8px 7px 0}#status{font-weight:800;color:#ffdda9;min-height:35px}.guess{padding:12px;font-size:22px;width:140px;background:#27212d;color:#ffe6cb;border:2px solid #d58b53;border-radius:8px}.history p{padding:8px;border-bottom:1px solid #5c453f}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Orbit</h1><p>Rotate conduit tiles so adjoining connections match, with no exposed ends at the outer edge.</p><div id="board" class="board"></div><button id="start">New circuit</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status");function finish(score){try{const k="ashfall:ash-orbit:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-orbit",score,{score,game:"ash-orbit"})).catch(()=>{})}const N=4;let tiles=[],moves=0,done=false;function rot(mask,n){for(let j=0;j<n;j++)mask=((mask<<1)&15)|(mask>>3);return mask}function build(){tiles=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let mask=0;if(y>0)mask|=1;if(x<N-1)mask|=2;if(y<N-1)mask|=4;if(x>0)mask|=8;tiles.push({mask:rot(mask,Math.floor(Math.random()*4))})}moves=0;done=false;render()}function check(){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const a=tiles[y*N+x].mask;if(y===0&&(a&1)||x===N-1&&(a&2)||y===N-1&&(a&4)||x===0&&(a&8))return false;if(x<N-1&&!!(a&2)!==!!(tiles[y*N+x+1].mask&8))return false;if(y<N-1&&!!(a&4)!==!!(tiles[(y+1)*N+x].mask&1))return false}return true}function render(){board.innerHTML="";tiles.forEach((t,i)=>{const b=document.createElement("button");b.className="cell";b.setAttribute("aria-label","Rotate conduit "+(i+1));const glyph=document.createElement("span");glyph.className="conduit";glyph.textContent=["·","╹","╺","┗","╻","┃","┏","┣","╸","┛","━","┻","┓","┫","┳","╋"][t.mask];b.append(glyph);b.style.backgroundImage="url(./sprites/conduit.svg)";b.style.backgroundSize="25%";b.style.backgroundRepeat="no-repeat";b.style.backgroundPosition="right 4px bottom 4px";b.onclick=()=>{if(done)return;t.mask=rot(t.mask,1);moves++;if(check()){done=true;finish(Math.max(100,1200-moves*15))}render()};board.append(b)});status.textContent=done?"Circuit complete in "+moves+" turns!":"Turns: "+moves+" · Rotate tiles to connect all edges"}document.getElementById("start").onclick=build;build();})();</script></body></html>
