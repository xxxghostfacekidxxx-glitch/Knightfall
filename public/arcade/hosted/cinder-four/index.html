<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Four</title><style>body{background:#0d0b14;color:#fff;font:18px system-ui;text-align:center;margin:0;padding:16px}a{color:#9f9}h1{color:#ff59d6}#board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));max-width:560px;margin:20px auto;background:#343050;border-radius:16px;padding:8px;gap:5px}button{cursor:pointer}#board button{aspect-ratio:1;border-radius:50%;border:2px solid #777;background:#14111f;min-width:0;touch-action:manipulation}#board button.p1{background:#ff56d5}#board button.p2{background:#9bffac}#board button:disabled{cursor:default}#reset{padding:12px 22px;background:#ff56d5;border:0;border-radius:10px;font-weight:bold}#status{min-height:2em}</style><a href="/arcade-card-board.html">← Card & Board Games</a><h1>Cinder Four</h1><p>Connect four discs in any direction before the CPU does.</p><p id="status" role="status" aria-live="polite"></p><div id="board" aria-label="Seven-column Connect Four board"></div><button id="reset">New game</button><script>(()=>{'use strict';const W=7,H=6;let cells,ended,turn;const board=document.getElementById('board'),status=document.getElementById('status');function lines(x,y,p){return [[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>{let n=1;for(const sign of [-1,1]){let a=x+dx*sign,b=y+dy*sign;while(a>=0&&a<W&&b>=0&&b<H&&cells[b][a]===p){n++;a+=dx*sign;b+=dy*sign}}return n>=4})}function drop(col,p){for(let y=H-1;y>=0;y--)if(!cells[y][col]){cells[y][col]=p;return y}return -1}function available(){return Array.from({length:W},(_,i)=>i).filter(i=>!cells[0][i])}function render(message){board.replaceChildren();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const b=document.createElement('button');b.className=cells[y][x]?'p'+cells[y][x]:'';b.disabled=ended||turn!==1||!available().includes(x);b.setAttribute('aria-label','Column '+(x+1)+', row '+(y+1)+(cells[y][x]?', '+(cells[y][x]===1?'your disc':'CPU disc'):', empty'));b.onclick=()=>move(x,1);board.append(b)}status.textContent=message||(!available().length?'Draw':turn===1?'Your turn':'CPU turn')}function move(x,p){if(ended||turn!==p||!available().includes(x))return;const y=drop(x,p);if(lines(x,y,p)){ended=true;render(p===1?'You win! 🎉':'CPU wins');return}if(!available().length){ended=true;render('Draw');return}turn=3-p;render();if(turn===2)setTimeout(cpu,280)}function cpu(){if(ended||turn!==2)return;const opts=available();let chosen;for(const p of [2,1]){for(const x of opts){const y=drop(x,p),win=lines(x,y,p);cells[y][x]=0;if(win){chosen=x;break}}if(chosen!==undefined)break}if(chosen===undefined)chosen=opts.sort((a,b)=>Math.abs(a-3)-Math.abs(b-3))[Math.floor(Math.random()*Math.min(2,opts.length))];move(chosen,2)}function start(){cells=Array.from({length:H},()=>Array(W).fill(0));ended=false;turn=1;render()}document.getElementById('reset').onclick=start;start()})();</script></html>
