<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Mancala</title><style>body{background:#0d0c14;color:#fff;font:17px system-ui;text-align:center;margin:0;padding:18px}a{color:#9f9}h1{color:#ff56c7}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(2,95px);gap:6px;max-width:800px;margin:25px auto;padding:12px;background:#3b2b42;border-radius:20px}.pit{border-radius:45%;border:2px solid #8b6c8d;background:#211824;color:#fff;font-size:25px;min-width:0}.pit:disabled{opacity:.7}.pit.player{border-color:#ff56c7}.pit.cpu{border-color:#9f9}.store{grid-row:1/3;border-radius:40px;background:#18121e;border:3px solid #e5c28b;font-size:30px}.left{grid-column:1}.right{grid-column:8}.top{grid-row:1}.bottom{grid-row:2}#restart{background:#ff56c7;border:0;padding:13px 22px;border-radius:10px;font-weight:bold}#status{min-height:2em}</style><a href="/arcade-card-board.html">← Card & Board Games</a><h1>Cinder Mancala</h1><p>Kalah rules: pick a pink pit to sow counterclockwise. Your store is on the right. Landing in your store gives an extra turn.</p><p id="status" role="status"></p><div id="board" class="board" aria-label="Mancala board"></div><button id="restart">New game</button><script>(()=>{'use strict';let pits,turn,done;const board=document.getElementById('board'),status=document.getElementById('status');function sideEmpty(p){return (p===0?[0,1,2,3,4,5]:[7,8,9,10,11,12]).every(i=>pits[i]===0)}function finish(){if(!sideEmpty(0)&&!sideEmpty(1))return false;for(let i=0;i<6;i++){pits[6]+=pits[i];pits[i]=0}for(let i=7;i<13;i++){pits[13]+=pits[i];pits[i]=0}done=true;return true}function sow(i){let n=pits[i],pos=i;pits[i]=0;while(n){pos=(pos+1)%14;if((turn===0&&pos===13)||(turn===1&&pos===6))continue;pits[pos]++;n--}const own=turn===0?pos<6:pos>6&&pos<13;if(own&&pits[pos]===1&&pits[12-pos]>0){const store=turn===0?6:13;pits[store]+=1+pits[12-pos];pits[pos]=0;pits[12-pos]=0}const extra=pos===(turn===0?6:13);finish();if(!extra&&!done)turn=1-turn;render();if(turn===1&&!done)setTimeout(cpu,300)}function cpu(){if(turn!==1||done)return;const moves=[7,8,9,10,11,12].filter(i=>pits[i]);if(!moves.length){finish();render();return}const extra=moves.find(i=>(i+pits[i])%14===13);const pick=extra??moves.sort((a,b)=>pits[b]-pits[a])[0];sow(pick)}function render(){board.replaceChildren();function add(i,cls,grid){const b=document.createElement('button');b.className=cls;b.textContent=pits[i];b.style.gridColumn=grid;b.disabled=done||turn!==0||i>5||!pits[i];b.setAttribute('aria-label',(i<6?'Your pit ':i<13?'CPU pit ':'Store ')+i+', '+pits[i]+' stones');b.onclick=()=>sow(i);board.append(b)}add(13,'store left','1');add(6,'store right','8');for(let i=12;i>=7;i--)add(i,'pit cpu top',String(14-i));for(let i=0;i<6;i++)add(i,'pit player bottom',String(i+2));status.textContent=done?'Game over. You '+pits[6]+', CPU '+pits[13]+'. '+(pits[6]===pits[13]?'Draw':pits[6]>pits[13]?'You win!':'CPU wins'):turn===0?'Your turn':'CPU turn'}function start(){pits=Array(14).fill(4);pits[6]=pits[13]=0;turn=0;done=false;render()}document.getElementById('restart').onclick=start;start()})();</script></html>
