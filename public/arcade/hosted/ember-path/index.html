<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Path | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49291f,#0e1019 75%);color:#ffe7d1;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffc18b}h1{color:#ffa15c;font-size:clamp(2rem,8vw,3.6rem)}p{color:#dbc5b8;line-height:1.5}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;max-width:510px;margin:20px 0}.cell{aspect-ratio:1;display:grid;place-items:center;min-width:0;background:#322936;border:2px solid #99644b;border-radius:10px;color:#ffd5a2;cursor:pointer}.cell img{width:68%;height:68%}.cell.flash{background:#e49a58;color:#221a24}.conduit{font-size:clamp(22px,6vw,43px);font-weight:900}button:not(.cell){padding:12px 18px;background:#65392c;color:#ffe8d2;border:1px solid #da905b;border-radius:9px;font-weight:800;cursor:pointer;margin:7px 8px 7px 0}#status{font-weight:800;color:#ffdda9;min-height:35px}.guess{padding:12px;font-size:22px;width:140px;background:#27212d;color:#ffe6cb;border:2px solid #d58b53;border-radius:8px}.history p{padding:8px;border-bottom:1px solid #5c453f}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ember Path</h1><p>Start in the top-left corner. Visit every square exactly once using only up, down, left, and right moves.</p><div id="board" class="board"></div><button id="start">Restart path</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status");function finish(score){try{const k="ashfall:ember-path:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ember-path",score,{score,game:"ember-path"})).catch(()=>{})}const N=5;let visited=[],current=0,done=false;function reset(){visited=[0];current=0;done=false;render()}function select(i){if(done||visited.includes(i))return;const x=i%N,y=Math.floor(i/N),a=current%N,b=Math.floor(current/N);if(Math.abs(x-a)+Math.abs(y-b)!==1)return;visited.push(i);current=i;if(visited.length===N*N){done=true;finish(Math.max(100,1200-visited.length*10))}render()}function render(){board.innerHTML="";for(let i=0;i<N*N;i++){const b=document.createElement("button");b.className="cell "+(visited.includes(i)?"flash":"");b.setAttribute("aria-label","Path tile "+(i+1));b.innerHTML=visited.includes(i)?'<img src="./sprites/path-sigil.svg" alt="Visited">':"·";b.onclick=()=>select(i);board.append(b)}status.textContent=done?"All 25 tiles traced!":visited.length+"/25 tiles · Choose an adjacent unvisited tile"}document.getElementById("start").onclick=reset;reset();})();</script></body></html>
