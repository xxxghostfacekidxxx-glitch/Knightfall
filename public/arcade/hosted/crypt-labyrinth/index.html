<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Labyrinth | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b2a20,#0f111a 76%);color:#ffe7cf;font:16px system-ui}main{max-width:680px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa15e}p{line-height:1.5;color:#ddc6b7}button{padding:12px 16px;margin:5px;background:#64382e;border:1px solid #da8d56;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:540px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(18px,5vw,30px);background:#35283a}.tile.chosen{outline:4px solid #ffce84}.maze-cell{aspect-ratio:1;display:grid;place-items:center;background:#292430;font-size:clamp(12px,3vw,22px);color:#ffd58c}canvas{display:block;width:100%;max-width:540px;height:auto;border:3px solid #d18b56;border-radius:10px;touch-action:none}#status{font-weight:800;color:#ffdda9;min-height:42px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Labyrinth</h1><p>Navigate a randomly carved labyrinth to recover the ember at the exit.</p><img src="./sprites/compass.svg" width="42" height="42" alt=""><div id="board" class="board"></div><div><button id="up">↑</button><button id="left">←</button><button id="down">↓</button><button id="right">→</button></div><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:crypt-labyrinth:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-labyrinth",score,{score,game:"crypt-labyrinth"})).catch(()=>{})}const N=9;let walls=[],player=0,steps=0,done=false;const directions=[[-1,0,1,4],[1,0,4,1],[0,-1,8,2],[0,1,2,8]];function reset(){walls=Array(N*N).fill(15);const seen=new Set([0]),stack=[0];while(stack.length){const i=stack.at(-1),x=i%N,y=Math.floor(i/N),opts=directions.map(([dx,dy,a,b])=>({dx,dy,a,b,j:(y+dy)*N+x+dx})).filter(o=>x+o.dx>=0&&x+o.dx<N&&y+o.dy>=0&&y+o.dy<N&&!seen.has(o.j));if(!opts.length){stack.pop();continue}const o=opts[Math.floor(Math.random()*opts.length)];walls[i]&=~o.a;walls[o.j]&=~o.b;seen.add(o.j);stack.push(o.j)}player=0;steps=0;done=false;draw()}function move(dx,dy){if(done)return;const dir=directions.find(v=>v[0]===dx&&v[1]===dy);if(!dir||walls[player]&dir[2])return;player+=dx+dy*N;steps++;if(player===N*N-1){done=true;finish(Math.max(100,1800-steps*8))}draw()}function draw(){board.innerHTML="";board.style.gridTemplateColumns="repeat(9,1fr)";walls.forEach((w,i)=>{const b=document.createElement("div");b.className="maze-cell";b.style.borderTop=(w&8)?"3px solid #b17d56":"3px solid transparent";b.style.borderRight=(w&4)?"3px solid #b17d56":"3px solid transparent";b.style.borderBottom=(w&2)?"3px solid #b17d56":"3px solid transparent";b.style.borderLeft=(w&1)?"3px solid #b17d56":"3px solid transparent";b.textContent=i===player?"◆":i===80?"✦":"";board.append(b)});status.textContent=done?"Exit found in "+steps+" steps!":"Steps "+steps+" · Reach the bottom-right ember"}$("up").onclick=()=>move(0,-1);$("down").onclick=()=>move(0,1);$("left").onclick=()=>move(-1,0);$("right").onclick=()=>move(1,0);document.addEventListener("keydown",e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});$("reset").onclick=reset;reset();})();</script></body></html>
