<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashbound Runner | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4a241b,#0b0d14 65%);color:#ffe7cf;font:16px system-ui}main{max-width:940px;margin:auto}a{color:#ffba76}h1{color:#ff944c;font-size:clamp(2rem,7vw,4rem);margin:12px 0}p{color:#d4bdb0}.hud{display:flex;gap:20px;font-weight:900;color:#ffd59a;margin:12px 0}canvas{width:100%;aspect-ratio:16/9;display:block;border:2px solid #bc6838;border-radius:14px;background:#111520;touch-action:none}button{background:#f18d46;color:#25130f;border:0;border-radius:9px;padding:13px 20px;font-weight:900;margin:10px 8px 0 0;touch-action:none}#status{color:#ffcf91;font-weight:bold}</style><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ashbound Runner</h1><p>Leap over scorched spikes. Duck beneath the wasteland's winged scavengers. Original sprites and game engine.</p><div class="hud"><span>SCORE <output id="score">0</output></span><span>BEST <output id="best">0</output></span><span>SPEED <output id="speed">1</output>x</span></div><canvas id="game" width="960" height="540" aria-label="Ashbound Runner playfield"></canvas><div><button id="start">Start / Restart</button><button id="jump">▲ Jump</button><button id="duck">▼ Duck</button><button id="pause">Pause</button><button id="full">Fullscreen</button></div><p id="status" role="status">Press Start. Space / ↑ jumps, ↓ ducks. Touch buttons work on mobile.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const c=document.getElementById("game"),g=c.getContext("2d"),W=c.width,H=c.height,G=430,$=id=>document.getElementById(id),imgs={};for(const name of ["runner","spike","wing"]){const i=new Image();i.src="./sprites/"+name+".svg";imgs[name]=i}let p={x:150,y:G-82,vy:0},obstacles=[],score=0,best=0,speed=330,spawn=1,playing=false,paused=false,duck=false,last=0;try{best=Number(localStorage.getItem("ashfall:ashbound-runner:best"))||0}catch{}function hud(){$("score").textContent=Math.floor(score);$("best").textContent=Math.floor(best);$("speed").textContent=(speed/330).toFixed(1)}function reset(){p={x:150,y:G-82,vy:0};obstacles=[];score=0;speed=330;spawn=1;playing=true;paused=false;duck=false;$("status").textContent="Run for your life.";hud()}function jump(){if(!playing||paused)return;if(p.y>=G-(duck?48:82)-1){duck=false;p.vy=-790}}function end(){playing=false;best=Math.max(best,Math.floor(score));try{localStorage.setItem("ashfall:ashbound-runner:best",String(best))}catch{}$("status").textContent="Wiped out. Score: "+Math.floor(score);if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ashbound-runner",Math.floor(score),{score:Math.floor(score),game:"ashbound-runner"})).catch(()=>{})}function tick(dt){if(!playing||paused)return;dt=Math.min(.045,dt);score+=dt*12;speed=Math.min(760,330+score*.55);spawn-=dt;if(spawn<=0){const wing=Math.random()<.28;obstacles.push({x:W+50,type:wing?"wing":"spike",w:wing?74:54,h:wing?46:65,y:wing?G-122:G-65});spawn=.8+Math.random()*.7-(speed-330)/1500}p.vy+=2000*dt;p.y+=p.vy*dt;const h=duck&&p.y>=G-82?48:82;if(p.y>G-h){p.y=G-h;p.vy=0}for(const o of obstacles){o.x-=speed*dt;const ph=duck&&p.vy===0?48:82,py=G-ph;if(o.x+o.w>p.x+14&&o.x<p.x+53&&o.y+o.h>py+13&&o.y<G-7)end()}obstacles=obstacles.filter(o=>o.x+o.w>-10);best=Math.max(best,Math.floor(score));hud()}function drawImage(name,x,y,w,h){const im=imgs[name];if(im.complete&&im.naturalWidth)g.drawImage(im,x,y,w,h);else{g.fillStyle="#f69a52";g.fillRect(x,y,w,h)}}function draw(t){g.fillStyle="#111520";g.fillRect(0,0,W,H);for(let i=0;i<15;i++){const x=(i*117-(score*3)%117+W)%W;g.fillStyle="#34303c";g.fillRect(x,250+(i%3)*27,45,80)}g.fillStyle="#5e382b";g.fillRect(0,G,W,110);g.fillStyle="#df8546";g.fillRect(0,G,W,7);for(let i=0;i<15;i++){g.fillStyle="#a65d3d";g.fillRect((i*83-score*5%83+W)%W,G+28,32,4)}for(const o of obstacles)drawImage(o.type,o.x,o.y,o.w,o.h);if(playing||p){const h=duck&&p.vy===0?48:82;drawImage("runner",p.x,p.y+(82-h),72,h)}if(!playing||paused){g.fillStyle="#070b12bc";g.fillRect(0,0,W,H);g.fillStyle="#ffdaa3";g.font="bold 45px system-ui";g.textAlign="center";g.fillText(paused?"PAUSED":score?"RUN ENDED":"ASHBOUND RUNNER",W/2,H/2)}}function frame(t){tick(last?(t-last)/1000:0);last=t;draw(t);requestAnimationFrame(frame)}$("start").onclick=reset;$("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});const down=e=>{e.preventDefault();duck=true},up=()=>duck=false;$("duck").addEventListener("pointerdown",down);for(const ev of ["pointerup","pointercancel","lostpointercapture"])$("duck").addEventListener(ev,up);$("pause").onclick=()=>{if(playing)paused=!paused};$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else c.requestFullscreen().catch(()=>{})};document.addEventListener("keydown",e=>{if([" ","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault();if((e.key===" "||e.key==="ArrowUp"||e.key.toLowerCase()==="w")&&!e.repeat)jump();if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")duck=true;if(e.key.toLowerCase()==="p"&&!e.repeat&&playing)paused=!paused});document.addEventListener("keyup",e=>{if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")duck=false});c.addEventListener("pointerdown",jump);document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)paused=true});hud();requestAnimationFrame(frame)})();
</script></html>
