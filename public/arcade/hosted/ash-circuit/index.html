<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Circuit | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#47281f,#0d0f18 75%);color:#ffe7cf;font:16px system-ui}main{max-width:780px;margin:auto}a{color:#ffbf81}h1{color:#ffa05b;font-size:clamp(2rem,8vw,3.5rem)}p{color:#d9c3b6;line-height:1.5}canvas{display:block;width:min(100%,600px);height:auto;border:3px solid #c7804f;border-radius:12px;touch-action:none}button{padding:12px 17px;margin:7px 8px 7px 0;border:1px solid #d88b51;border-radius:9px;background:#64392e;color:#ffe7cf;font-weight:800;cursor:pointer}button:disabled{opacity:.45}#status{color:#ffdda8;font-weight:800;min-height:50px}.stats{display:flex;flex-wrap:wrap;gap:14px;color:#ffdaa6;font-weight:800}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Circuit</h1><p>Race four Cinder runners against three Void houses around the 28-space ring. Roll a six to release a runner, then reach the finish exactly. Land on a rival to send them home. Tap your runner to choose a move.</p><canvas id="game" width="600" height="600" aria-label="Circular race board with four competing teams"></canvas><div class="stats"><span id="dice">Die: ·</span><span id="turn">Cinder turn</span><span id="score">Finished: 0/4</span></div><button id="roll">Roll die</button><button id="restart">New race</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),c=$("game"),ctx=c.getContext("2d"),COLORS=["#f3a05e","#b98de9","#78c9b2","#e2ca75"],N=28,FINISH=28,START=[0,7,14,21];const runnerArt=["cinder-runner.svg","void-runner.svg"].map(n=>{const im=new Image();im.src="./sprites/"+n;im.onload=draw;return im});let tokens,turn=0,die=0,phase="roll",finished=false,choice=[],busy=false,botTimer=null,reported=false;const pos=(i,r=220)=>({x:300+Math.cos((i/N)*Math.PI*2-Math.PI/2)*r,y:300+Math.sin((i/N)*Math.PI*2-Math.PI/2)*r});function reset(){clearTimeout(botTimer);tokens=Array.from({length:4},()=>Array(4).fill(-1));turn=0;die=0;phase="roll";finished=false;choice=[];busy=false;reported=false;status.textContent="Cinder begins. Roll the die to enter the ring.";draw()}function options(){return tokens[turn].map((v,i)=>({v,i})).filter(({v})=>v===-1?die===6:v<FINISH&&v+die<=FINISH).map(o=>o.i)}function roll(){if(finished||phase!=="roll"||busy)return;die=1+Math.floor(Math.random()*6);phase="choose";choice=options();if(!choice.length){status.textContent=["Cinder","Void","Moss","Gold"][turn]+" rolled "+die+" but cannot move.";phase="wait";next()}else{status.textContent=["Cinder","Void","Moss","Gold"][turn]+" rolled "+die+". "+(turn===0?"Tap a highlighted runner.":"Opponent is choosing.");if(turn!==0){busy=true;botTimer=setTimeout(()=>{busy=false;move(choice[Math.floor(Math.random()*choice.length)])},450)}}draw()}function move(i){if(phase!=="choose"||!choice.includes(i)||finished)return;const old=tokens[turn][i];tokens[turn][i]=old===-1?0:old+die;const v=tokens[turn][i];if(v<FINISH){const square=(START[turn]+v)%N;for(let t=0;t<4;t++)if(t!==turn)for(let j=0;j<4;j++){const q=tokens[t][j];if(q>=0&&q<FINISH&&(START[t]+q)%N===square)tokens[t][j]=-1}}if(tokens[turn].every(v=>v===FINISH)){finished=true;phase="done";status.textContent=["Cinder","Void","Moss","Gold"][turn]+" wins the Ash Circuit!";if(!reported){reported=true;const score=turn===0?1500:tokens[0].filter(v=>v===FINISH).length*250;try{localStorage.setItem("ashfall:ash-circuit:best",String(Math.max(score,Number(localStorage.getItem("ashfall:ash-circuit:best"))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-circuit",score,{score,game:"ash-circuit",winner:turn})).catch(()=>{})}}else{phase="wait";next()}draw()}function next(){if(finished)return;turn=(turn+1)%4;die=0;phase="roll";if(turn!==0){busy=true;botTimer=setTimeout(()=>{busy=false;roll()},550)}else status.textContent="Your turn. Roll the die.";draw()}function draw(){ctx.fillStyle="#171923";ctx.fillRect(0,0,600,600);ctx.textAlign="center";for(let i=0;i<N;i++){const p=pos(i),team=START.indexOf(i);ctx.fillStyle=team<0?"#43352e":COLORS[team];ctx.beginPath();ctx.arc(p.x,p.y,18,0,7);ctx.fill();ctx.fillStyle="#fce8ce";ctx.font="12px system-ui";ctx.fillText(String(i+1),p.x,p.y+4)}ctx.strokeStyle="#bd885e";ctx.lineWidth=3;ctx.beginPath();ctx.arc(300,300,163,0,7);ctx.stroke();ctx.fillStyle="#ffe2b4";ctx.font="bold 28px system-ui";ctx.fillText("ASH CIRCUIT",300,270);ctx.font="17px system-ui";ctx.fillText("First to finish four runners",300,300);for(let t=0;t<4;t++)for(let i=0;i<4;i++){const v=tokens[t][i];let p;if(v===-1){const a=t*Math.PI/2-Math.PI/2;p={x:300+Math.cos(a)*95+(i%2?18:-18),y:300+Math.sin(a)*95+(i>1?18:-18)}}else if(v===FINISH){p={x:252+(t%2)*96+(i%2)*15,y:340+Math.floor(t/2)*55+(i>1?15:0)}}else p=pos((START[t]+v)%N,215+(i%2)*16);ctx.fillStyle=COLORS[t];ctx.beginPath();ctx.arc(p.x,p.y,12,0,7);ctx.fill();const im=runnerArt[t===0?0:1];if(im.complete&&im.naturalWidth)ctx.drawImage(im,p.x-12,p.y-12,24,24);ctx.strokeStyle=t===turn&&choice.includes(i)?"#ffffff":"#221e2b";ctx.lineWidth=t===turn&&choice.includes(i)?5:2;ctx.stroke();ctx.fillStyle="#1a1421";ctx.font="bold 12px system-ui";ctx.fillText(String(i+1),p.x,p.y+4)}$("dice").textContent="Die: "+(die||"·");$("turn").textContent=["Cinder","Void","Moss","Gold"][turn]+" turn";$("score").textContent="Finished: "+tokens[0].filter(v=>v===FINISH).length+"/4";$("roll").disabled=phase!=="roll"||busy||turn!==0}function chooseAt(e){if(turn!==0||phase!=="choose")return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;for(const i of choice){const v=tokens[0][i];let p;if(v===-1)p={x:300-18+(i%2)*36,y:205+(i>1?36:0)};else p=pos(v,215+(i%2)*16);if(Math.hypot(x-p.x,y-p.y)<22){move(i);return}}}c.addEventListener("pointerdown",chooseAt);$("roll").onclick=roll;$("restart").onclick=reset;reset()})();
</script></body></html>
