<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110e16"><title>Ash Sudoku | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at top,#43251d,#0d0d15 70%);color:#fbe4cc;font:16px system-ui}main{max-width:660px;margin:auto}a{color:#ffc083}h1{font-size:clamp(2rem,8vw,3.7rem);color:#ff9a4c;margin:12px 0}h1 img{width:42px;vertical-align:middle}p{color:#d1bfb3;line-height:1.45}.stats,.controls,.digits{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.stats{color:#ffd59a;font-weight:900;gap:20px}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));border:3px solid #e0a06a;border-radius:8px;overflow:hidden;max-width:540px;aspect-ratio:1;margin:12px auto;background:#201a24}.cell{min-width:0;padding:0;border:1px solid #604b4d;background:#1b1a23;color:#ffdeac;font-size:clamp(15px,4.5vw,25px);font-weight:800;cursor:pointer;position:relative}.cell.given{background:#38282a;color:#ffe6c8}.cell.selected{background:#875137}.cell.peer{background:#302a33}.cell.error{color:#ff8b95;background:#4b2631}.cell:nth-child(3n){border-right:2px solid #d99058}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #d99058}.cell:focus-visible{outline:3px solid #fff2aa;outline-offset:-4px}.cell small{position:absolute;bottom:1px;right:2px;font-size:8px;color:#f5a858}button,select{font:inherit;border:1px solid #c87a4a;border-radius:8px;padding:10px;background:#563226;color:#ffe6c8;font-weight:800;cursor:pointer}.digits{justify-content:center}.digits button{flex:1;min-width:37px;max-width:52px}.digits button.active{background:#a86639}.controls{justify-content:center}#status{color:#ffd59a;font-weight:800;min-height:45px}@media(max-width:450px){.cell{font-size:18px}.digits{gap:3px}.digits button{min-width:28px;padding:10px 4px}.controls button{padding:9px}}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1><img src="./sprites/logic-sigil.svg" alt=""> Ash Sudoku</h1><p>Restore order to the nine infernal chambers. Every row, column and 3×3 chamber must contain the numbers 1 through 9 once.</p><div class="stats"><span>TIME <output id="time">00:00</output></span><span>MISTAKES <output id="mistakes">0</output></span><span>SOLVED <output id="solved">0</output></span></div><div id="board" class="board" role="grid" aria-label="Nine by nine Sudoku puzzle"></div><div class="digits" id="digits" aria-label="Number entry"></div><div class="controls"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label><button id="new">New puzzle</button><button id="erase">Erase</button><button id="hint">Hint</button><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Select an empty square and enter a number.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),store="ashfall:ash-sudoku:v1",base=Array.from({length:81},(_,i)=>(Math.floor(i/9)*3+Math.floor(Math.floor(i/9)/3)+i%9)%9+1);let solution=[],puzzle=[],values=[],selected=0,chosen=1,mistakes=0,seconds=0,solved=0,finished=false,level="easy",hintCount=0;
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeSolution(){const digits=shuffled([1,2,3,4,5,6,7,8,9]),bands=shuffled([0,1,2]),stacks=shuffled([0,1,2]),rows=bands.flatMap(b=>shuffled([0,1,2]).map(x=>b*3+x)),cols=stacks.flatMap(b=>shuffled([0,1,2]).map(x=>b*3+x));return rows.flatMap(r=>cols.map(c=>digits[base[r*9+c]-1]))}
function candidates(b,i){if(b[i])return [];const r=Math.floor(i/9),c=i%9,used=new Set();for(let j=0;j<9;j++){used.add(b[r*9+j]);used.add(b[j*9+c]);used.add(b[(Math.floor(r/3)*3+Math.floor(j/3))*9+Math.floor(c/3)*3+j%3])}return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
function countSolutions(b,limit=2){let count=0;function solve(){if(count>=limit)return;let spot=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){const c=candidates(b,i);if(!c.length)return;if(!opts||c.length<opts.length){spot=i;opts=c;if(c.length===1)break}}if(spot===-1){count++;return}for(const n of opts){b[spot]=n;solve();b[spot]=0;if(count>=limit)return}}solve();return count}
function generate(difficulty){solution=makeSolution();puzzle=[...solution];const target={easy:40,medium:34,hard:29}[difficulty],order=shuffled(Array.from({length:81},(_,i)=>i));for(const i of order){if(puzzle.filter(Boolean).length<=target)break;const n=puzzle[i];puzzle[i]=0;if(countSolutions([...puzzle])!==1)puzzle[i]=n}values=[...puzzle];selected=values.findIndex(v=>!v);chosen=1;mistakes=0;seconds=0;finished=false;hintCount=0;level=difficulty;$("difficulty").value=level;$("status").textContent="Fresh "+difficulty+" puzzle. Every chamber needs balance.";render()}
function save(){try{localStorage.setItem(store,JSON.stringify({solution,puzzle,values,selected,chosen,mistakes,seconds,solved,finished,level,hintCount}))}catch{}}
function load(){try{const v=JSON.parse(localStorage.getItem(store)||"null");if(!v||!["easy","medium","hard"].includes(v.level)||![v.solution,v.puzzle,v.values].every(a=>Array.isArray(a)&&a.length===81&&a.every(n=>Number.isInteger(n)&&n>=0&&n<=9))||v.solution.some(n=>!n)||v.puzzle.some((n,i)=>n!==0&&n!==v.solution[i])||v.values.some((n,i)=>v.puzzle[i]!==0&&n!==v.puzzle[i])||!Number.isInteger(v.seconds)||v.seconds<0||v.seconds>1e8)return false;({solution,puzzle,values}=v);selected=Number.isInteger(v.selected)&&v.selected>=0&&v.selected<81?v.selected:0;chosen=Number.isInteger(v.chosen)&&v.chosen>=1&&v.chosen<=9?v.chosen:1;mistakes=Math.max(0,Number(v.mistakes)||0);seconds=v.seconds;solved=Math.max(0,Number(v.solved)||0);finished=!!v.finished;level=v.level;hintCount=Math.max(0,Number(v.hintCount)||0);$("difficulty").value=level;return true}catch{return false}}
function render(){const board=$("board");board.replaceChildren();for(let i=0;i<81;i++){const b=document.createElement("button");b.className="cell";b.type="button";b.setAttribute("role","gridcell");const r=Math.floor(i/9),c=i%9,sr=Math.floor(selected/9),sc=selected%9;if(puzzle[i])b.classList.add("given");else if(values[i]&&values[i]!==solution[i])b.classList.add("error");if(i===selected)b.classList.add("selected");else if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))b.classList.add("peer");b.textContent=values[i]||"";b.setAttribute("aria-label","Row "+(r+1)+", column "+(c+1)+", "+(values[i]||"empty")+(puzzle[i]?", fixed":""));b.onclick=()=>{selected=i;render()};board.append(b)}const digits=$("digits");digits.replaceChildren();for(let n=1;n<=9;n++){const b=document.createElement("button");b.textContent=n;b.type="button";if(n===chosen)b.className="active";b.onclick=()=>{chosen=n;enter(n)};digits.append(b)}$("mistakes").textContent=mistakes;$("solved").textContent=solved;$("time").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");save()}
function score(){const points=Math.max(100,1400-seconds*2-mistakes*75-hintCount*200);if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-sudoku",points,{score:points,game:"ash-sudoku",difficulty:level,seconds,mistakes,hints:hintCount})).catch(()=>{})}
function enter(n){if(finished||puzzle[selected])return;if(n!==0&&n!==solution[selected]&&values[selected]!==n){mistakes++;$("status").textContent="That number conflicts with the chamber's solution. Try again."}else $("status").textContent="Chamber updated.";values[selected]=n;if(values.every((v,i)=>v===solution[i])){finished=true;solved++;$("status").textContent="The nine chambers are restored! Puzzle complete.";score()}render()}
function hint(){if(finished)return;const empty=values.findIndex((v,i)=>!puzzle[i]&&v!==solution[i]);if(empty<0)return;selected=empty;hintCount++;values[empty]=solution[empty];if(values.every((v,i)=>v===solution[i])){finished=true;solved++;$("status").textContent="Puzzle completed with hints.";score()}else $("status").textContent="A chamber reveals its true number.";render()}
document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement?.tagName))return;if(/^[1-9]$/.test(e.key)){e.preventDefault();chosen=Number(e.key);enter(chosen)}else if(e.key==="Backspace"||e.key==="Delete"||e.key==="0"){e.preventDefault();enter(0)}else if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];selected=(selected+d+81)%81;render()}});$("new").onclick=()=>generate($("difficulty").value);$("erase").onclick=()=>enter(0);$("hint").onclick=hint;$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $("board").requestFullscreen().catch(()=>{})};document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});setInterval(()=>{if(!finished&&!document.hidden){seconds++;$("time").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");save()}},1000);if(!load())generate("easy");else{render();$("status").textContent=finished?"Puzzle solved. Start another.":"Puzzle restored from your saved progress."}
})();
</script></body></html>
