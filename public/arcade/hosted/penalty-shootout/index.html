<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Penalty Panic | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.court{aspect-ratio:400/600}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SPORTS</div><h1 class="title">PENALTY<br><span>PANIC</span></h1><p class="muted">Drag from the ball toward a target in the goal and release. Beat the moving keeper. Five shots. One extremely dramatic little scoreboard.</p><div class="hud"><span>GOALS <b id="score">0</b></span><span>SHOT <b id="shot">1</b>/5</span><span id="state">AIM</span></div><canvas id="game" class="court" width="400" height="600"></canvas><div class="controls"><button class="btn" id="restart">New shootout</button><span class="muted">Touch and mouse supported · local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let ball,keeperX=155,aim=null,drag=false,goals=0,shot=1,active=false,done=false,clock=0,last=0,shotResult="";
function resetBall(){ball={x:200,y:510,vx:0,vy:0,r:12};active=false;aim=null;drag=false;}
function init(){goals=0;shot=1;done=false;clock=0;last=0;shotResult="";resetBall();$("score").textContent=0;$("shot").textContent=1;$("state").textContent="AIM";requestAnimationFrame(loop);}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;clock+=dt;keeperX=160+Math.sin(clock*2.1)*95;if(active){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.997;ball.vy*=.997;if(ball.y<145){const onTarget=ball.x>78&&ball.x<322;const saved=Math.abs(ball.x-keeperX)<45;if(onTarget&&!saved){goals++;shotResult="GOAL!";}else shotResult=saved?"SAVED!":"WIDE!";active=false;$("score").textContent=goals;$("state").textContent=shotResult;if(shot>=5){done=true;$("state").textContent="FINAL: "+goals+"/5";}else{shot++;$("shot").textContent=shot;setTimeout(()=>{if(!done){resetBall();$("state").textContent=shotResult+" · AIM";}},600);}}}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,400,600);const g=x.createLinearGradient(0,0,0,600);g.addColorStop(0,"#182a2a");g.addColorStop(1,"#080a0f");x.fillStyle=g;x.fillRect(0,0,400,600);x.fillStyle="#a8ff4816";x.fillRect(30,20,340,560);x.strokeStyle="#a8ff4870";x.lineWidth=3;x.strokeRect(70,65,260,105);x.strokeStyle="#ff5edb";x.lineWidth=5;x.beginPath();x.moveTo(70,170);x.lineTo(330,170);x.stroke();x.strokeStyle="#ffffff30";x.lineWidth=2;for(let i=0;i<8;i++){x.beginPath();x.moveTo(75+i*36,170);x.lineTo(80+i*33,205);x.stroke();}x.fillStyle="#a8ff48";x.fillRect(keeperX,120,80,18);x.fillStyle="#ff5edb";x.beginPath();x.arc(keeperX+40,113,12,0,Math.PI*2);x.fill();x.fillStyle="#ffffff60";x.font="bold 12px system-ui";x.textAlign="center";x.fillText("GOAL",200,52);x.fillStyle="#ff5edb";x.shadowColor="#ff5edb";x.shadowBlur=12;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0;if(drag&&aim){x.strokeStyle="#a8ff48";x.lineWidth=3;x.setLineDash([6,5]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(aim.x,aim.y);x.stroke();x.setLineDash([]);}if(done){x.fillStyle="#080a0fdd";x.fillRect(0,0,400,600);x.fillStyle="#a8ff48";x.font="bold 30px system-ui";x.fillText("SHOOTOUT OVER",200,290);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Goals: "+goals+"/5",200,322);}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*600/r.height};}
c.addEventListener("pointerdown",e=>{if(active||done)return;drag=true;aim=pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(drag)aim=pos(e)});c.addEventListener("pointerup",e=>{if(!drag||done)return;drag=false;const p=pos(e),dx=p.x-ball.x,dy=p.y-ball.y;ball.vx=Math.max(-7,Math.min(7,dx*.045));ball.vy=Math.max(-14,Math.min(-6,dy*.055));active=true;aim=null;$("state").textContent="SHOOTING";});$("restart").addEventListener("click",init);init();
</script></body></html>
