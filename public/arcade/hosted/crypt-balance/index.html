<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Balance | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b2a20,#0f111a 76%);color:#ffe7cf;font:16px system-ui}main{max-width:680px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa15e}p{line-height:1.5;color:#ddc6b7}button{padding:12px 16px;margin:5px;background:#64382e;border:1px solid #da8d56;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:540px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(18px,5vw,30px);background:#35283a}.tile.chosen{outline:4px solid #ffce84}.maze-cell{aspect-ratio:1;display:grid;place-items:center;background:#292430;font-size:clamp(12px,3vw,22px);color:#ffd58c}canvas{display:block;width:100%;max-width:540px;height:auto;border:3px solid #d18b56;border-radius:10px;touch-action:none}#status{font-weight:800;color:#ffdda9;min-height:42px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Balance</h1><p>Balance the crypt's scales by choosing a combination of weighted stones.</p><img src="./sprites/scale.svg" width="42" height="42" alt=""><div id="board" class="board"></div><p id="sum"></p><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:crypt-balance:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-balance",score,{score,game:"crypt-balance"})).catch(()=>{})}let weights=[],target=0,chosen=new Set,round=0,score=0,done=false;function reset(){round=0;score=0;done=false;next()}function next(){if(round>=5){done=true;finish(score);draw();return}round++;weights=Array.from({length:6},()=>1+Math.floor(Math.random()*9));const pick=new Set;while(pick.size<2+Math.floor(Math.random()*2))pick.add(Math.floor(Math.random()*6));target=[...pick].reduce((s,i)=>s+weights[i],0);chosen=new Set;draw()}function toggle(i){if(done)return;chosen.has(i)?chosen.delete(i):chosen.add(i);const sum=[...chosen].reduce((s,j)=>s+weights[j],0);if(sum===target){score+=200;next()}else draw()}function draw(){board.innerHTML="";board.style.gridTemplateColumns="repeat(3,1fr)";weights.forEach((w,i)=>{const b=document.createElement("button");b.className="tile";b.textContent="◆ "+w;if(chosen.has(i))b.classList.add("chosen");b.onclick=()=>toggle(i);board.append(b)});$("sum").textContent="Selected weight: "+[...chosen].reduce((s,j)=>s+weights[j],0);status.textContent=done?"All five scales balanced! "+score+" points":"Round "+round+"/5 · Target weight: "+target+" · Score "+score}$("reset").onclick=reset;reset();})();</script></body></html>
