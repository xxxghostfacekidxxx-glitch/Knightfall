<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Caldera | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#48291f,#0e1019 75%);color:#ffe8d1;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc18b}h1{color:#ffa25e;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 16px;background:#66392c;border:1px solid #d9925a;color:#ffe5ca;border-radius:9px;font-weight:800;cursor:pointer;margin:4px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:530px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(20px,5vw,33px);background:#322735}#readout{font-size:24px;font-weight:800;padding:25px 0}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cf8956}#status{font-weight:800;color:#ffdda8;min-height:35px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Caldera</h1><p>Rotate conduit tiles to send molten energy from the first cell to the final altar.</p><div id="board" class="board"></div><button id="restart">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board"),readout=$("readout"),roll=$("action"),bank=$("extra");function finish(score){try{const k="ashfall:crypt-caldera:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-caldera",score,{score,game:"crypt-caldera"})).catch(()=>{})}const N=5,base=[5,10,3,6,9,12,7,11,13,14,15];let tiles=[],turns=0,done=false;function rot(v){return(v<<1&15)|(v>>3)}function mask(i){let v=tiles[i].v;for(let k=0;k<tiles[i].r;k++)v=rot(v);return v}function reach(){const q=[0],seen=new Set(q);while(q.length){const i=q.shift(),x=i%N,y=Math.floor(i/N);for(const [a,b,dx,dy] of [[1,4,0,-1],[2,8,1,0],[4,1,0,1],[8,2,-1,0]]){const xx=x+dx,yy=y+dy,j=yy*N+xx;if(xx>=0&&xx<N&&yy>=0&&yy<N&&(mask(i)&a)&&(mask(j)&b)&&!seen.has(j)){seen.add(j);q.push(j)}}}return seen}function click(i){if(done)return;tiles[i].r=(tiles[i].r+1)%4;turns++;if(reach().has(24)){done=true;finish(Math.max(100,1000-turns*8))}draw()}function draw(){const hot=reach();board.innerHTML="";board.style.gridTemplateColumns="repeat(5,1fr)";tiles.forEach((t,i)=>{const b=document.createElement("button");b.className="tile";b.textContent=["·","╹","╺","┗","╻","┃","┏","┣","╸","┛","━","┻","┓","┫","┳","╋"][mask(i)];if(hot.has(i))b.style.background="#8a4c32";b.onclick=()=>click(i);board.append(b)});status.textContent=done?"Altar ignited!":"Rotate pipes · "+turns+" turns"}function reset(){tiles=Array.from({length:25},(_,i)=>({v:base[(i*7+3)%base.length],r:Math.floor(Math.random()*4)}));turns=0;done=false;draw()}$("restart").onclick=reset;reset();})();</script></body></html>
