<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Dice | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#48291f,#0e1019 75%);color:#ffe8d1;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc18b}h1{color:#ffa25e;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 16px;background:#66392c;border:1px solid #d9925a;color:#ffe5ca;border-radius:9px;font-weight:800;cursor:pointer;margin:4px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:530px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(20px,5vw,33px);background:#322735}#readout{font-size:24px;font-weight:800;padding:25px 0}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cf8956}#status{font-weight:800;color:#ffdda8;min-height:35px}main{background-image:url("./sprites/dice.svg");background-repeat:no-repeat;background-size:38px;background-position:right 12px top 12px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Dice</h1><p>Roll dice against the Void. Bank your points before rolling a one.</p><div id="readout"></div><button id="action">Roll</button><button id="extra">Bank</button><button id="restart">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board"),readout=$("readout"),roll=$("action"),bank=$("extra");function finish(score){try{const k="ashfall:cinder-dice:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-dice",score,{score,game:"cinder-dice"})).catch(()=>{})}let scores=[0,0],pot=0,turn=0,over=false;function draw(){board.textContent="Cinder "+scores[0]+" | Void "+scores[1]+" | Pot "+pot+" | "+(turn?"Void":"Cinder")+" turn";status.textContent=over?"Match finished":"Roll or bank your points"}function bank(){scores[turn]+=pot;pot=0;if(scores[turn]>=100){over=true;finish(turn?Math.floor(scores[0]*10):1000);draw();return}turn=1-turn;draw();if(turn)setTimeout(cpu,500)}function rollDie(){if(over)return;const n=1+Math.floor(Math.random()*6);status.textContent="Rolled "+n;if(n===1){pot=0;turn=1-turn;if(turn)setTimeout(cpu,500)}else pot+=n;draw()}function cpu(){if(over||turn!==1)return;rollDie();if(turn!==1)return;if(pot>=15||scores[1]+pot>=100)bank();else setTimeout(cpu,350)}$("action").onclick=()=>{if(turn===0&&!over)roll()};$("extra").onclick=()=>{if(turn===0&&!over)bank()};function reset(){scores=[0,0];pot=0;turn=0;over=false;draw()}$("restart").onclick=reset;reset();})();</script></body></html>
