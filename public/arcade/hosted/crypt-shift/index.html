<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Shift | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49281d,#0f111b 75%);color:#ffe8d0;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa363}p{color:#ddc6b8;line-height:1.5}button{padding:12px 16px;margin:5px;background:#663a2d;border:1px solid #dc935d;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:530px;margin:20px 0}.tube{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:#302636;border:3px solid #a86d4f;border-top:0;border-radius:0 0 20px 20px}.tube.chosen{outline:3px solid #ffe4a3}.ember{width:42px;height:32px;border-radius:8px;background:#28212f}.tile{aspect-ratio:1;min-width:0;font-size:clamp(15px,4vw,28px);background:#342738}.tile.static{display:grid;place-items:center;color:#ffe5c6;border:1px solid #ad7250;border-radius:8px}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cc8553;border-radius:12px;touch-action:none}label{display:inline-block;margin:8px}input[type=range]{display:block;accent-color:#ff9b5e}#status{font-weight:800;color:#ffdda7;min-height:40px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Shift</h1><p>Rotate rows and columns of a rune matrix until the original ordered sigil is restored.</p><img src="./sprites/shift-rune.svg" alt="" width="42" height="42"><div id="board" class="board"></div><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:crypt-shift:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-shift",score,{score,game:"crypt-shift"})).catch(()=>{})}const N=4;let cells=[],moves=0,done=false;function shiftRow(y,n){const row=cells.slice(y*N,y*N+N);for(let x=0;x<N;x++)cells[y*N+x]=row[(x-n+N)%N]}function shiftCol(x,n){const col=Array.from({length:N},(_,y)=>cells[y*N+x]);for(let y=0;y<N;y++)cells[y*N+x]=col[(y-n+N)%N]}function solved(){return cells.every((v,i)=>v===i+1)}function reset(){cells=Array.from({length:16},(_,i)=>i+1);for(let i=0;i<60;i++){const a=Math.floor(Math.random()*4);if(Math.random()<.5)shiftRow(a,1);else shiftCol(a,1)}if(solved())shiftRow(0,1);moves=0;done=false;draw()}function move(type,i){if(done)return;if(type==="r")shiftRow(i,1);else shiftCol(i,1);moves++;if(solved()){done=true;finish(Math.max(100,1500-moves*10))}draw()}function draw(){board.innerHTML="";board.style.gridTemplateColumns="repeat(5,1fr)";for(let y=0;y<N;y++){for(let x=0;x<N;x++){const b=document.createElement("div");b.className="tile static";b.textContent=cells[y*N+x];board.append(b)}const b=document.createElement("button");b.className="tile";b.textContent="↶";b.setAttribute("aria-label","Shift row "+(y+1));b.onclick=()=>move("r",y);board.append(b)}for(let x=0;x<N;x++){const b=document.createElement("button");b.className="tile";b.textContent="↑";b.setAttribute("aria-label","Shift column "+(x+1));b.onclick=()=>move("c",x);board.append(b)}status.textContent=done?"Matrix restored in "+moves+" moves!":"Restore 1–16 in reading order · "+moves+" moves"}$("reset").onclick=reset;reset();})();</script></body></html>
