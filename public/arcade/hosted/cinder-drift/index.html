<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Drift | Ash-Fall</title><style>body{background:#100d12;color:#ffe2bf;font:16px system-ui;margin:12px auto;max-width:900px}a{color:#ffac60}h1{color:#ff873f}canvas{display:block;width:100%;aspect-ratio:16/10;background:#080c16;border:2px solid #e67b38;border-radius:12px;touch-action:none}button{background:#60301e;color:white;border:1px solid #e98e4e;border-radius:9px;padding:13px;margin:5px;font-weight:bold;touch-action:none}#hud{display:flex;gap:22px;flex-wrap:wrap}</style><a href="/chaos-cartridge.html">← Arcade</a><h1>Cinder Drift</h1><p>Original Ash-Fall arcade shooter with custom ship, debris, and ember sprites.</p><div id="hud"><span>Score <b id="score">0</b></span><span>Hull <b id="hull">3</b></span><span>Wave <b id="wave">1</b></span></div><canvas id="game" width="900" height="560" aria-label="Cinder Drift game"></canvas><button id="start">Start / Restart</button><button id="pause">Pause</button><button id="full">Fullscreen</button><div><button data-k="left">◀</button><button data-k="up">▲ Thrust</button><button data-k="right">▶</button><button data-k="fire">✦ Fire</button></div><p id="status" role="status">Press Start. Arrow keys / WASD to steer, Space to fire, P to pause.</p><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const c=document.querySelector("canvas"),g=c.getContext("2d"),W=c.width,H=c.height,keys=new Set(),img={};for(const name of ["ship","debris","ember"]){img[name]=new Image();img[name].src="./sprites/"+name+".svg"}let ship,rocks=[],bullets=[],score=0,hull=3,wave=1,active=false,paused=false,last=0,cool=0,shield=0;const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.random()*(b-a),wrap=(x,m)=>(x+m)%m;function hud(){$("score").textContent=score;$("hull").textContent=hull;$("wave").textContent=wave}function addRock(x,y,r){rocks.push({x,y,r,vx:rand(-85,85),vy:rand(-85,85),a:rand(0,6),spin:rand(-2,2)})}function spawn(){for(let i=0;i<Math.min(5+wave,15);i++){let x,y;do{x=rand(0,W);y=rand(0,H)}while(Math.hypot(x-ship.x,y-ship.y)<170);addRock(x,y,rand(26,48))}}function submit(){try{localStorage.setItem("ashfall:cinder-drift:best",String(Math.max(score,Number(localStorage.getItem("ashfall:cinder-drift:best"))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-drift",score,{score,wave,game:"cinder-drift"})).catch(()=>{})}function reset(){ship={x:W/2,y:H/2,a:-Math.PI/2,vx:0,vy:0};rocks=[];bullets=[];score=0;hull=3;wave=1;cool=0;shield=2;active=true;paused=false;keys.clear();spawn();hud();$("status").textContent="Survive the ash belt."}function tick(dt){if(!active||paused)return;dt=Math.min(.04,dt);cool=Math.max(0,cool-dt);shield=Math.max(0,shield-dt);if(keys.has("left"))ship.a-=3.5*dt;if(keys.has("right"))ship.a+=3.5*dt;if(keys.has("up")){ship.vx+=Math.cos(ship.a)*240*dt;ship.vy+=Math.sin(ship.a)*240*dt}ship.vx*=.99;ship.vy*=.99;ship.x=wrap(ship.x+ship.vx*dt,W);ship.y=wrap(ship.y+ship.vy*dt,H);if(keys.has("fire")&&!cool){bullets.push({x:ship.x,y:ship.y,vx:ship.vx+Math.cos(ship.a)*500,vy:ship.vy+Math.sin(ship.a)*500,t:1});cool=.18}for(const r of rocks){r.x=wrap(r.x+r.vx*dt,W);r.y=wrap(r.y+r.vy*dt,H);r.a+=r.spin*dt;if(!shield&&Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+14){hull--;shield=2;ship.x=W/2;ship.y=H/2;ship.vx=ship.vy=0;if(!hull){active=false;submit();$("status").textContent="Hull destroyed. Score: "+score}}}for(const b of bullets){b.x=wrap(b.x+b.vx*dt,W);b.y=wrap(b.y+b.vy*dt,H);b.t-=dt;for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){rocks.splice(i,1);score+=Math.round(100-r.r);if(r.r>25){addRock(r.x,r.y,r.r*.58);addRock(r.x,r.y,r.r*.58)}b.t=0;break}}}bullets=bullets.filter(b=>b.t>0);if(active&&!rocks.length){wave++;shield=2;spawn();submit()}hud()}function sprite(name,x,y,size,a){g.save();g.translate(x,y);g.rotate(a);const im=img[name];if(im.complete&&im.naturalWidth)g.drawImage(im,-size/2,-size/2,size,size);else{g.fillStyle="#ffab58";g.fillRect(-size/4,-size/4,size/2,size/2)}g.restore()}function draw(t){g.fillStyle="#080c16";g.fillRect(0,0,W,H);for(let i=0;i<80;i++){g.fillStyle=i%3?"#384153":"#bc7647";g.fillRect((i*139)%W,(i*223)%H,2,2)}for(const r of rocks)sprite("debris",r.x,r.y,r.r*2.3,r.a);for(const b of bullets)sprite("ember",b.x,b.y,18,0);if(ship&&(!shield||Math.floor(t/120)%2===0))sprite("ship",ship.x,ship.y,52,ship.a+Math.PI/2);if(!active||paused){g.fillStyle="#080c16bb";g.fillRect(0,0,W,H);g.fillStyle="#ffd6a0";g.font="bold 42px system-ui";g.textAlign="center";g.fillText(paused?"PAUSED":ship?"GAME OVER":"CINDER DRIFT",W/2,H/2)}}function frame(t){tick(last?(t-last)/1000:0);last=t;draw(t);requestAnimationFrame(frame)}const map={ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right",ArrowUp:"up",w:"up"," ":"fire"};document.addEventListener("keydown",e=>{if(map[e.key]){e.preventDefault();keys.add(map[e.key])}if(e.key.toLowerCase()==="p"&&!e.repeat)toggle()});document.addEventListener("keyup",e=>{if(map[e.key])keys.delete(map[e.key])});document.querySelectorAll("[data-k]").forEach(b=>{b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)});for(const ev of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(ev,()=>keys.delete(b.dataset.k))});function toggle(){if(active)paused=!paused}$("start").onclick=reset;$("pause").onclick=toggle;$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else c.requestFullscreen().catch(()=>{})};document.addEventListener("visibilitychange",()=>{keys.clear();if(document.hidden&&active)paused=true});requestAnimationFrame(frame)})();
</script></html>
