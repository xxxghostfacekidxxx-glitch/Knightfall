<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101016"><title>Cinder Merge | Chaos Cartridge</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0b10;color:#f7f2e9}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#44251a,#0b0b10 65%);min-height:100vh}main{max-width:560px;margin:auto}a{color:#ffad63}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(2rem,8vw,3.8rem);margin:18px 0 4px;line-height:1}h1 span{color:#ff9944}p{color:#c9bdb4;line-height:1.5}.scores{display:flex;gap:10px}.scores div{border:1px solid #ffffff33;background:#211b1d;padding:10px;border-radius:12px;min-width:85px;text-align:center}.scores strong{display:block;font-size:1.4rem;color:#ffd6a5}.scores small{color:#c8bdb2}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:10px;background:#211a1b;border:2px solid #77412d;border-radius:18px;aspect-ratio:1;touch-action:none;box-shadow:0 14px 45px #0009}.tile{border-radius:10px;background:#ffffff0a;display:grid;place-items:center;font-size:clamp(1.1rem,6vw,2rem);font-weight:900;min-width:0;transition:background .1s}.tile[data-v="2"]{background:#654332}.tile[data-v="4"]{background:#885035}.tile[data-v="8"]{background:#a85329}.tile[data-v="16"]{background:#bd642c}.tile[data-v="32"]{background:#d47328}.tile[data-v="64"]{background:#ed8d29;color:#21100a}.tile[data-v="128"],.tile[data-v="256"],.tile[data-v="512"]{background:#ffba46;color:#29150b}.tile[data-v="1024"],.tile[data-v="2048"]{background:#ffec94;color:#26170c;box-shadow:0 0 24px #ff8c2280}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{cursor:pointer;min-height:44px;padding:10px 15px;border-radius:10px;border:1px solid #a96b45;background:#3a2723;color:#fff;font:inherit;font-weight:700}button:focus-visible{outline:3px solid #ffd29a}button.primary{background:#ec8334;color:#201008}#message{min-height:28px;color:#ffd29a;font-weight:700}.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:8px;margin-top:16px}.pad button{padding:8px}.pad [data-dir="up"]{grid-column:2}.pad [data-dir="left"]{grid-column:1}.pad [data-dir="down"]{grid-column:2}.pad [data-dir="right"]{grid-column:3}@media(min-width:750px){.pad{display:none}}
</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a>
<header><div><h1>Cinder <span>Merge</span></h1><p>Fuse the embers. Build the inferno.</p></div></header>
<div class="scores"><div><strong id="score">0</strong><small>SCORE</small></div><div><strong id="best">0</strong><small>BEST</small></div></div>
<div class="controls"><button class="primary" id="restart">New run</button><button id="undo">Undo</button><button id="full">Fullscreen</button></div>
<div id="board" class="board" role="grid" aria-label="Cinder Merge board. Use arrow keys, WASD, or swipe." tabindex="0"></div>
<div class="pad" aria-label="Directional controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<p id="message" role="status" aria-live="polite"></p><p>Slide all embers together. Matching values fuse once per move. Reach 2048 to ignite the core. Swipe on mobile, or use the arrow keys or WASD.</p><p id="arcade-account-status">Local scores are saved on this device.</p></main>
<script src="/arcade-save.js"></script><script>
(() => {
"use strict";
const N=4, key="ashfall:cinder-merge:v1";
const board=document.getElementById("board"), scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),msg=document.getElementById("message");
let cells=Array(16).fill(0),score=0,best=0,previous=null,ended=false,won=false;
const safeRead=()=>{try{return JSON.parse(localStorage.getItem(key)||"null")}catch{return null}};
const persist=()=>{try{localStorage.setItem(key,JSON.stringify({cells,score,best,ended,won}))}catch{}};
const clone=()=>({cells:[...cells],score,ended,won});
function spawn(){const empty=[];cells.forEach((v,i)=>{if(!v)empty.push(i)});if(empty.length){cells[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4}}
function render(){board.replaceChildren();cells.forEach((v,i)=>{const el=document.createElement("div");el.className="tile";el.dataset.v=String(v);el.setAttribute("role","gridcell");el.setAttribute("aria-label",v?String(v):"empty");el.textContent=v?String(v):"";board.append(el)});scoreEl.textContent=score;bestEl.textContent=best;persist()}
function finish(){if(cells.includes(2048)&&!won){won=true;msg.textContent="CORE IGNITED! Keep playing for a bigger score."}if(!cells.includes(0)&&![...Array(16).keys()].some(i=>(i%4<3&&cells[i]===cells[i+1])||(i<12&&cells[i]===cells[i+4]))){ended=true;msg.textContent="Ashes. No moves left. Start another run.";submit()}}
function submit(){if(!window.AshFallArcade?.recordScore)return;Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-merge",score,{score,game:"cinder-merge",lastPlayedAt:new Date().toISOString()})).catch(()=>{})}
function move(dir){if(ended)return;const before=clone();let gained=0;const next=[...cells];for(let lane=0;lane<N;lane++){const ids=[];for(let step=0;step<N;step++){const p=(dir==="right"||dir==="down")?N-1-step:step;ids.push(dir==="left"||dir==="right"?lane*N+p:p*N+lane)}const compact=ids.map(i=>cells[i]).filter(Boolean),out=[];for(let i=0;i<compact.length;i++){if(compact[i]===compact[i+1]){const merged=compact[i]*2;out.push(merged);gained+=merged;i++}else out.push(compact[i])}ids.forEach((id,i)=>next[id]=out[i]||0)}if(next.every((v,i)=>v===cells[i]))return;previous=before;cells=next;score+=gained;best=Math.max(best,score);spawn();msg.textContent="";finish();render()}
function reset(){cells=Array(16).fill(0);score=0;ended=false;won=false;previous=null;msg.textContent="";spawn();spawn();render();board.focus()}
document.getElementById("restart").addEventListener("click",reset);
document.getElementById("undo").addEventListener("click",()=>{if(!previous)return;({cells,score,ended,won}=previous);previous=null;msg.textContent="Last move reversed.";render()});
document.getElementById("full").addEventListener("click",async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector("main").requestFullscreen()}catch{msg.textContent="Fullscreen unavailable."}});
const dirs={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"};
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches("input,textarea"))return;const dir=dirs[e.key];if(dir){e.preventDefault();move(dir)}});
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.dir)));
let start=null;board.addEventListener("pointerdown",e=>{start={x:e.clientX,y:e.clientY}});board.addEventListener("pointerup",e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up")});board.addEventListener("pointercancel",()=>{start=null});
const saved=safeRead();if(saved&&Array.isArray(saved.cells)&&saved.cells.length===16&&saved.cells.every(v=>Number.isSafeInteger(v)&&v>=0)&&Number.isSafeInteger(saved.score)&&saved.score>=0){cells=saved.cells;score=saved.score;best=Math.max(score,Number(saved.best)||0);ended=!!saved.ended;won=!!saved.won;render()}else reset();
})();
</script></body></html>
