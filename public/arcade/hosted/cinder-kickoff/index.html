<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110e16"><title>Cinder Kickoff | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#48271e,#0e1018 70%);color:#ffe8d2;font:16px system-ui}main{max-width:900px;margin:auto}a{color:#ffbc7b}h1{font-size:clamp(2rem,7vw,3.8rem);color:#ffa15e;margin:10px 0}p{color:#d4bdb0;line-height:1.4}.stats{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0;color:#ffdbab;font-weight:900}.field{max-width:800px;margin:auto}canvas{display:block;width:100%;height:auto;border:3px solid #d78b51;border-radius:12px;background:#1b3935;touch-action:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{background:#60362b;border:1px solid #d88952;border-radius:9px;padding:12px 16px;color:#ffe6ce;font:800 15px system-ui;cursor:pointer}.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:5px;margin:12px auto}.pad button{padding:12px 0}.pad #up{grid-column:2}.pad #left{grid-column:1}.pad #down{grid-column:2}.pad #right{grid-column:3}#status{font-weight:800;color:#ffdaa5;min-height:40px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Kickoff</h1><p>One minute. One ball. The Void never learned sportsmanship. Move with WASD or arrow keys, and kick with Space or the KICK button.</p><div class="stats"><span>CINDER <output id="you">0</output></span><span>VOID <output id="cpu">0</output></span><span>TIME <output id="time">60</output>s</span><span>BEST <output id="best">0</output></span></div><div class="field"><canvas id="field" width="800" height="450" aria-label="Top-down soccer arena with two players and a ball"></canvas></div><div class="pad"><button id="up" aria-label="Move up">▲</button><button id="left" aria-label="Move left">◀</button><button id="down" aria-label="Move down">▼</button><button id="right" aria-label="Move right">▶</button></div><div class="controls"><button id="kick">KICK</button><button id="start">New match</button><button id="pause">Pause</button><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Press New match to begin.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),canvas=$("field"),g=canvas.getContext("2d"),W=800,H=450,GOALTOP=155,GOALBOTTOM=295,keys=new Set(),images=[new Image(),new Image(),new Image()];["cinder-striker","void-keeper","ash-ball"].forEach((n,i)=>{images[i].src="./sprites/"+n+".svg";images[i].onload=draw});let p={x:200,y:225,vx:0,vy:0},cpu={x:600,y:225,vx:0,vy:0},ball={x:400,y:225,vx:0,vy:0},you=0,them=0,remaining=60,best=0,playing=false,paused=false,last=0,kickCooldown=0,cpuCooldown=0,submitted=false;try{best=Number(localStorage.getItem("ashfall:cinder-kickoff:best"))||0}catch{}const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));function hud(){$("you").textContent=you;$("cpu").textContent=them;$("time").textContent=Math.ceil(remaining);$("best").textContent=best}function center(){p={x:200,y:225,vx:0,vy:0};cpu={x:600,y:225,vx:0,vy:0};ball={x:400,y:225,vx:0,vy:0};kickCooldown=0;cpuCooldown=0}function reset(){center();you=0;them=0;remaining=60;playing=true;paused=false;submitted=false;$("status").textContent="Kickoff! Defend the left goal and score on the right.";hud()}function end(){if(!playing)return;playing=false;best=Math.max(best,you);try{localStorage.setItem("ashfall:cinder-kickoff:best",String(best))}catch{}$("status").textContent=you>them?"Cinder wins the match!":you<them?"The Void takes the match.":"A draw in the ashes.";hud();if(!submitted&&window.AshFallArcade?.recordScore){submitted=true;const score=you*150+(you>them?500:0);Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-kickoff",score,{score,game:"cinder-kickoff",goals:you,conceded:them})).catch(()=>{})}}function kick(who,dir){const dx=ball.x-who.x,dy=ball.y-who.y,d=Math.hypot(dx,dy);if(d>58)return false;const mag=Math.hypot(dir.x,dir.y)||1;ball.vx=dir.x/mag*430;ball.vy=dir.y/mag*430;ball.x=who.x+dx/(d||1)*42;ball.y=who.y+dy/(d||1)*42;return true}function userKick(){if(!playing||paused||kickCooldown>0)return;const dx=ball.x-p.x,dy=ball.y-p.y;const dir={x:Math.abs(dx)+Math.abs(dy)<1?1:dx,y:dy};if(kick(p,dir))kickCooldown=.3}function step(dt){if(!playing||paused)return;remaining=Math.max(0,remaining-dt);kickCooldown=Math.max(0,kickCooldown-dt);cpuCooldown=Math.max(0,cpuCooldown-dt);let mx=(keys.has("ArrowRight")||keys.has("d")?1:0)-(keys.has("ArrowLeft")||keys.has("a")?1:0),my=(keys.has("ArrowDown")||keys.has("s")?1:0)-(keys.has("ArrowUp")||keys.has("w")?1:0),m=Math.hypot(mx,my)||1;p.x=clamp(p.x+mx/m*255*dt,30,W-30);p.y=clamp(p.y+my/m*255*dt,30,H-30);const tx=ball.x+32,ty=ball.y,ex=tx-cpu.x,ey=ty-cpu.y,ed=Math.hypot(ex,ey)||1;cpu.x=clamp(cpu.x+ex/ed*205*dt,30,W-30);cpu.y=clamp(cpu.y+ey/ed*205*dt,30,H-30);if(cpuCooldown===0&&kick(cpu,{x:-1,y:(225-ball.y)*.004})){cpuCooldown=.55}for(const who of [p,cpu]){const dx=ball.x-who.x,dy=ball.y-who.y,d=Math.hypot(dx,dy)||1;if(d<39){ball.x=who.x+dx/d*39;ball.y=who.y+dy/d*39;ball.vx+=dx/d*75;ball.vy+=dy/d*75}}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const friction=Math.exp(-1.65*dt);ball.vx*=friction;ball.vy*=friction;if(ball.y<14){ball.y=14;ball.vy=Math.abs(ball.vy)*.8}if(ball.y>H-14){ball.y=H-14;ball.vy=-Math.abs(ball.vy)*.8}if(ball.x<14||ball.x>W-14){if(ball.y>=GOALTOP&&ball.y<=GOALBOTTOM){if(ball.x<14)them++;else you++;center();$("status").textContent=ball.x<400?"Void scores!":"Cinder scores!";hud()}else{ball.x=clamp(ball.x,14,W-14);ball.vx=-ball.vx*.8}}if(remaining<=0)end();hud()}function draw(){g.fillStyle="#193e36";g.fillRect(0,0,W,H);for(let i=0;i<8;i++){g.fillStyle=i%2?"#ffffff06":"#00000009";g.fillRect(i*100,0,100,H)}g.strokeStyle="#d8c8a7";g.lineWidth=3;g.strokeRect(15,15,W-30,H-30);g.beginPath();g.moveTo(W/2,15);g.lineTo(W/2,H-15);g.stroke();g.beginPath();g.arc(W/2,H/2,75,0,Math.PI*2);g.stroke();g.strokeRect(15,110,115,230);g.strokeRect(W-130,110,115,230);g.fillStyle="#e98b55";g.fillRect(0,GOALTOP,13,GOALBOTTOM-GOALTOP);g.fillStyle="#b9a0ed";g.fillRect(W-13,GOALTOP,13,GOALBOTTOM-GOALTOP);for(const [who,i] of [[p,0],[cpu,1],[ball,2]]){const radius=i===2?15:26,im=images[i];if(im.complete&&im.naturalWidth)g.drawImage(im,who.x-radius,who.y-radius,radius*2,radius*2);else{g.fillStyle=["#f39b56","#ae94df","#ffe6c9"][i];g.beginPath();g.arc(who.x,who.y,radius,0,Math.PI*2);g.fill()}}if(!playing||paused){g.fillStyle="#0b0d15bb";g.fillRect(0,0,W,H);g.textAlign="center";g.fillStyle="#ffe0b4";g.font="bold 40px system-ui";g.fillText(paused?"PAUSED":remaining<=0?"FULL TIME":"CINDER KICKOFF",W/2,H/2)}}function frame(t){const dt=Math.min(.04,last?(t-last)/1000:0);last=t;step(dt);draw();requestAnimationFrame(frame)}const allowed=["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d"," "];document.addEventListener("keydown",e=>{if(!allowed.includes(e.key))return;e.preventDefault();keys.add(e.key);if(e.key===" "&&!e.repeat)userKick()});document.addEventListener("keyup",e=>keys.delete(e.key));for(const [id,k] of [["up","ArrowUp"],["down","ArrowDown"],["left","ArrowLeft"],["right","ArrowRight"]]){const b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(ev,()=>keys.delete(k))}$("kick").onclick=userKick;$("start").onclick=reset;$("pause").onclick=()=>{if(playing){paused=!paused;$("status").textContent=paused?"Match paused.":"Match resumed."}};$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else canvas.requestFullscreen().catch(()=>{})};document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)paused=true});hud();requestAnimationFrame(frame)})();
</script></body></html>
