<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Taps | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49291f,#0e1019 75%);color:#ffe7d1;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffc18b}h1{color:#ffa15c;font-size:clamp(2rem,8vw,3.6rem)}p{color:#dbc5b8;line-height:1.5}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-width:510px;margin:20px 0}.cell{aspect-ratio:1;display:grid;place-items:center;min-width:0;background:#322936;border:2px solid #99644b;border-radius:10px;color:#ffd5a2;cursor:pointer}.cell img{width:68%;height:68%}.cell.flash{background:#e49a58;color:#221a24}.conduit{font-size:clamp(22px,6vw,43px);font-weight:900}button:not(.cell){padding:12px 18px;background:#65392c;color:#ffe8d2;border:1px solid #da905b;border-radius:9px;font-weight:800;cursor:pointer;margin:7px 8px 7px 0}#status{font-weight:800;color:#ffdda9;min-height:35px}.guess{padding:12px;font-size:22px;width:140px;background:#27212d;color:#ffe6cb;border:2px solid #d58b53;border-radius:8px}.history p{padding:8px;border-bottom:1px solid #5c453f}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Taps</h1><p>Tap the moving ember before it escapes. Each hit scores 10 points.</p><div id="board" class="board"></div><button id="start">Start round</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status");function finish(score){try{const k="ashfall:cinder-taps:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-taps",score,{score,game:"cinder-taps"})).catch(()=>{})}let score=0,time=30,target=0,playing=false,clock,hop;function draw(){board.innerHTML="";for(let i=0;i<9;i++){const b=document.createElement("button");b.className="cell";b.setAttribute("aria-label","Vent "+(i+1));if(playing&&i===target)b.innerHTML='<img src="./sprites/ember-target.svg" alt="Ember">';b.onclick=()=>{if(playing&&i===target){score+=10;target=Math.floor(Math.random()*9);draw()}};board.append(b)}status.textContent=(playing?"Time "+time+"s · ":time===0?"Round complete · ":"Ready · ")+"Score "+score}function reset(){clearInterval(clock);clearInterval(hop);score=0;time=30;playing=true;target=Math.floor(Math.random()*9);clock=setInterval(()=>{time--;if(time<=0){playing=false;clearInterval(clock);clearInterval(hop);finish(score)}draw()},1000);hop=setInterval(()=>{target=Math.floor(Math.random()*9);draw()},850);draw()}document.getElementById("start").onclick=reset;document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing){playing=false;clearInterval(clock);clearInterval(hop);status.textContent="Round interrupted. Start again."}});draw();})();</script></body></html>
