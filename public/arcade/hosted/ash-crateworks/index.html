<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Crateworks | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#48281f,#0d0e17 75%);color:#ffe9d3;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffbb7d}h1{font-size:clamp(2rem,7vw,3.5rem);color:#ffa15e}p{line-height:1.5;color:#d7c3b7}canvas{display:block;width:min(100%,480px);height:auto;border:3px solid #ca804d;border-radius:12px;touch-action:none}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:520px;margin:12px 0}.cell{aspect-ratio:1;display:grid;place-items:center;background:#40332f;font-size:25px;border-radius:5px}.cell.wall{background:#1a1b29}.cell.goal{box-shadow:inset 0 0 0 3px #e7a861}.cell img,.hole img{width:75%;height:75%}.holes{grid-template-columns:repeat(3,1fr);max-width:450px}.hole{aspect-ratio:1;background:#332634;border:3px solid #af7051;border-radius:50%;cursor:pointer}.pad{display:flex;gap:8px;flex-wrap:wrap}button:not(.hole){padding:12px 16px;margin:8px 5px 8px 0;background:#623729;border:1px solid #e0975b;color:#ffe6c9;border-radius:9px;font-weight:800;cursor:pointer}#status{color:#ffdbab;font-weight:800;min-height:32px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Crateworks</h1><div id="board" class="board" aria-label="Warehouse crate puzzle"></div><p>Push every crate onto a furnace. Arrow keys, WASD, or the buttons below. Undo is available.</p><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button id="undo">Undo</button><button id="next">Next level</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status");function finish(points){try{const k="ashfall:ash-crateworks:best";localStorage.setItem(k,String(Math.max(points,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-crateworks",points,{score:points,game:"ash-crateworks"})).catch(()=>{})}const maps=[["########","#......#","#..g...#","#..b...#","#..p...#","#......#","########"],["########","#......#","#..g.g.#","#..b.b.#","#..p...#","#......#","########"],["########","#......#","#.g..g.#","#.b..b.#","#...p..#","#......#","########"],["########","#......#","#..gg..#","#..bb..#","#..p...#","#......#","########"]];let level=0,walls,goals,crates,player,history=[],moves=0,won=false;const key=(x,y)=>x+","+y,dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function load(i){level=i%maps.length;walls=new Set;goals=new Set;crates=new Set;history=[];moves=0;won=false;maps[level].forEach((line,y)=>[...line].forEach((ch,x)=>{const k=key(x,y);if(ch==="#")walls.add(k);if(ch==="g")goals.add(k);if(ch==="b")crates.add(k);if(ch==="p")player={x,y}}));render()}function step(d){if(won)return;const [dx,dy]=dirs[d],x=player.x+dx,y=player.y+dy,k=key(x,y);if(walls.has(k))return;const next=key(x+dx,y+dy);if(crates.has(k)&&(walls.has(next)||crates.has(next)))return;history.push({player:{...player},crates:new Set(crates)});if(crates.has(k)){crates.delete(k);crates.add(next)}player={x,y};moves++;if([...goals].every(k=>crates.has(k))){won=true;finish(Math.max(100,700-moves*10));}render()}function render(){const board=$("board");board.innerHTML="";board.style.gridTemplateColumns="repeat(8,1fr)";maps[level].forEach((line,y)=>[...line].forEach((ch,x)=>{const k=key(x,y),b=document.createElement("div");b.className="cell "+(walls.has(k)?"wall":"");if(goals.has(k))b.classList.add("goal");if(crates.has(k))b.innerHTML='<img src="./sprites/crate.svg" alt="Crate">';else if(player.x===x&&player.y===y)b.textContent="♟";else if(goals.has(k))b.innerHTML='<img src="./sprites/furnace.svg" alt="Furnace">';board.append(b)}));status.textContent="Level "+(level+1)+" · Moves "+moves+(won?" · Solved!":"")};document.addEventListener("keydown",e=>{const k={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key];if(k){e.preventDefault();step(k)}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>step(b.dataset.dir));$("undo").onclick=()=>{const s=history.pop();if(!s)return;player=s.player;crates=s.crates;moves--;won=false;render()};$("next").onclick=()=>load(level+1);load(0);})();
</script></body></html>
