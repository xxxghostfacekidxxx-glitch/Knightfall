<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#150e12"><title>Ember Pop | Chaos Cartridge</title><style>*{box-sizing:border-box}body{background:radial-gradient(circle at top,#4a251e,#0d0d13 65%);color:#fce8d3;font:16px system-ui;margin:0;padding:14px}main{max-width:860px;margin:auto}a{color:#ffb57a}h1{font-size:clamp(2rem,8vw,4rem);margin:12px 0;color:#ff9a53}p{color:#d2bfb4;line-height:1.5}.hud{display:flex;gap:18px;flex-wrap:wrap;font-weight:900;margin:12px 0;color:#ffce8c}canvas{display:block;width:100%;aspect-ratio:16/10;border:2px solid #d67c46;border-radius:14px;background:#11131e;touch-action:none}button{background:#e8823d;color:#1f0f0a;border:0;border-radius:10px;padding:13px 18px;margin:10px 6px 8px 0;font:inherit;font-weight:900;cursor:pointer}#status{color:#ffcf8d;font-weight:800}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ember Pop</h1><p>Catch the escaping fire spirits. Avoid ash mines. Chain your hits before the clock runs out.</p><div class="hud"><span>SCORE <output id="score">0</output></span><span>TIME <output id="time">60</output>s</span><span>COMBO <output id="combo">0</output></span><span>BEST <output id="best">0</output></span></div><canvas id="game" width="960" height="600" aria-label="Ember Pop arcade playfield"></canvas><button id="start">Start / Restart</button><button id="pause">Pause</button><button id="full">Fullscreen</button><p id="status" role="status">Tap or click the wisps to score. Avoid the mines!</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const c=document.getElementById("game"),g=c.getContext("2d"),W=c.width,H=c.height,$=id=>document.getElementById(id),sprites={},names=["wisp","mine","star"];for(const n of names){const im=new Image();im.src="./sprites/"+n+".svg";sprites[n]=im}let objects=[],sparks=[],score=0,best=0,combo=0,seconds=60,running=false,paused=false,spawnWait=0,last=0;try{best=Number(localStorage.getItem("ashfall:ember-pop:best"))||0}catch{}function hud(){$("score").textContent=score;$("best").textContent=best;$("combo").textContent=combo;$("time").textContent=Math.ceil(seconds)}function submit(){try{localStorage.setItem("ashfall:ember-pop:best",String(best))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ember-pop",score,{score,game:"ember-pop",lastPlayedAt:new Date().toISOString()})).catch(()=>{})}function reset(){objects=[];sparks=[];score=0;combo=0;seconds=60;spawnWait=.1;running=true;paused=false;$("pause").textContent="Pause";$("status").textContent="Catch wisps. Dodge mines.";hud()}function spawn(){const type=Math.random()<.14?"mine":Math.random()<.12?"star":"wisp";objects.push({type,x:45+Math.random()*(W-90),y:H+60,vy:90+Math.random()*90+score*.012,vx:(Math.random()-.5)*70,r:type==="mine"?32:37,age:0})}function pop(x,y,color){for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=45+Math.random()*180;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5,color})}}function hit(e){if(!running||paused)return;const rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(Math.hypot(x-o.x,y-o.y)<o.r*1.25){objects.splice(i,1);if(o.type==="mine"){combo=0;score=Math.max(0,score-75);seconds=Math.max(0,seconds-3);pop(o.x,o.y,"#ff5b52");$("status").textContent="Mine hit! -75 points and -3 seconds."}else{combo++;const points=(o.type==="star"?50:10)*Math.min(5,1+Math.floor(combo/5));score+=points;best=Math.max(best,score);pop(o.x,o.y,o.type==="star"?"#fff1a3":"#ff994b");$("status").textContent="+"+points+" · Combo "+combo}hud();return}}combo=0;hud()}c.addEventListener("pointerdown",hit);function tick(dt){if(!running||paused)return;dt=Math.min(.05,dt);seconds-=dt;if(seconds<=0){seconds=0;running=false;$("status").textContent="Time! Final score: "+score;submit();hud();return}spawnWait-=dt;if(spawnWait<=0){spawn();spawnWait=Math.max(.2,.7-score*.0001)}for(const o of objects){o.x+=o.vx*dt;o.y-=o.vy*dt;o.age+=dt}const before=objects.length;objects=objects.filter(o=>o.y>-65);if(objects.length<before)combo=0;for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}sparks=sparks.filter(p=>p.t>0);hud()}function draw(t){g.fillStyle="#10131c";g.fillRect(0,0,W,H);for(let i=0;i<40;i++){const x=i*157%W,y=(i*97+t*.013*(i%3+1))%H;g.fillStyle="#66402c";g.fillRect(x,y,2,2)}for(const o of objects){const im=sprites[o.type];g.save();g.translate(o.x,o.y);g.rotate(Math.sin(o.age*2)*.16);if(im.complete&&im.naturalWidth)g.drawImage(im,-o.r,-o.r*1.3,o.r*2,o.r*2.6);else{g.fillStyle=o.type==="mine"?"#ab4545":"#ffb04c";g.beginPath();g.arc(0,0,o.r,0,Math.PI*2);g.fill()}g.restore()}for(const p of sparks){g.globalAlpha=Math.max(0,p.t*2);g.fillStyle=p.color;g.fillRect(p.x,p.y,5,5)}g.globalAlpha=1;if(!running||paused){g.fillStyle="#080b13bb";g.fillRect(0,0,W,H);g.fillStyle="#ffd8a5";g.font="bold 46px system-ui";g.textAlign="center";g.fillText(paused?"PAUSED":seconds===0?"TIME UP":"EMBER POP",W/2,H/2)}}function frame(t){tick(last?(t-last)/1000:0);last=t;draw(t);requestAnimationFrame(frame)}$("start").onclick=reset;$("pause").onclick=()=>{if(running){paused=!paused;$("pause").textContent=paused?"Resume":"Pause"}};$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else c.requestFullscreen().catch(()=>{})};document.addEventListener("visibilitychange",()=>{if(document.hidden&&running){paused=true;$("pause").textContent="Resume"}});hud();requestAnimationFrame(frame)})();
</script></body></html>
