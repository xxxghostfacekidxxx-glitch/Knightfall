<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Constellation | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b2a20,#0f111a 76%);color:#ffe7cf;font:16px system-ui}main{max-width:680px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa15e}p{line-height:1.5;color:#ddc6b7}button{padding:12px 16px;margin:5px;background:#64382e;border:1px solid #da8d56;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:540px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(18px,5vw,30px);background:#35283a}.tile.chosen{outline:4px solid #ffce84}.maze-cell{aspect-ratio:1;display:grid;place-items:center;background:#292430;font-size:clamp(12px,3vw,22px);color:#ffd58c}canvas{display:block;width:100%;max-width:540px;height:auto;border:3px solid #d18b56;border-radius:10px;touch-action:none}#status{font-weight:800;color:#ffdda9;min-height:42px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Void Constellation</h1><p>Connect every star once using the network of visible paths.</p><img src="./sprites/star.svg" width="42" height="42" alt=""><canvas id="screen" width="540" height="440"></canvas><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:void-constellation:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("void-constellation",score,{score,game:"void-constellation"})).catch(()=>{})}const c=$("screen"),g=c.getContext("2d");let nodes=[],edges=[],visited=[],done=false;function reset(){nodes=Array.from({length:9},(_,i)=>({x:90+(i%3)*175,y:65+Math.floor(i/3)*150}));edges=[];for(let i=0;i<9;i++)for(let j=i+1;j<9;j++)if(Math.abs(i%3-j%3)+Math.abs(Math.floor(i/3)-Math.floor(j/3))===1)edges.push([i,j]);visited=[0];done=false;draw()}function pick(i){if(done||visited.includes(i)||!edges.some(([a,b])=>a===visited.at(-1)&&b===i||b===visited.at(-1)&&a===i))return;visited.push(i);if(visited.length===nodes.length){done=true;finish(900)}draw()}function draw(){g.fillStyle="#111724";g.fillRect(0,0,540,440);for(const [a,b] of edges){g.strokeStyle="#68546e";g.lineWidth=3;g.beginPath();g.moveTo(nodes[a].x,nodes[a].y);g.lineTo(nodes[b].x,nodes[b].y);g.stroke()}for(let i=1;i<visited.length;i++){const a=nodes[visited[i-1]],b=nodes[visited[i]];g.strokeStyle="#ffb76c";g.lineWidth=7;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}nodes.forEach((p,i)=>{g.fillStyle=visited.includes(i)?"#ffb66d":"#ac95e8";g.beginPath();g.arc(p.x,p.y,17,0,7);g.fill();g.fillStyle="#161723";g.font="bold 15px system-ui";g.textAlign="center";g.fillText(String(i+1),p.x,p.y+5)});status.textContent=done?"Constellation completed!":"Stars "+visited.length+"/9 · Continue from the last star"}c.onpointerdown=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*540/r.width,y=(e.clientY-r.top)*440/r.height;for(let i=0;i<nodes.length;i++)if(Math.hypot(x-nodes[i].x,y-nodes[i].y)<26){pick(i);break}};$("reset").onclick=reset;reset();})();</script></body></html>
