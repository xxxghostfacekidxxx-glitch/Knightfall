<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Whack-a-Bug | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,14px);max-width:480px;margin:auto}.hole{aspect-ratio:1;border:1px solid #ffffff1a;border-radius:16px;background:radial-gradient(ellipse at center,#202938,#080a0f 70%);font-size:clamp(2rem,9vw,4rem);cursor:pointer}.hole.bug{background:radial-gradient(circle,#ff5edb30,#080a0f 72%);border-color:#ff5edb80}.hole:disabled{cursor:default}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / ARCADE</div><h1 class="title">WHACK-A-<br><span>BUG.EXE</span></h1><p class="muted">Thirty seconds. Nine holes. Tiny pests with terrible timing. Click or tap a bug before it vanishes.</p><div class="hud"><span>BUGS WHACKED <b id="score">0</b></span><span>TIME <b id="time">30</b>s</span><span id="state">READY</span></div><div class="grid" id="grid"></div><div class="controls"><button class="btn" id="start">Start round</button><button class="btn" id="reset">Reset</button></div><p class="muted">Local score only. No bugs or accounts were harmed.</p></section></main><script>
const grid=document.getElementById("grid"),$=id=>document.getElementById(id);let score=0,time=30,active=false,current=-1,spawn=null,timer=null,tick=null;
for(let i=0;i<9;i++){const b=document.createElement("button");b.className="hole";b.setAttribute("aria-label","Hole "+(i+1));b.textContent="";b.addEventListener("click",()=>{if(active&&current===i){score++;$("score").textContent=score;b.textContent="💥";b.classList.remove("bug");current=-1;setTimeout(()=>{if(active)b.textContent="";},130);}});grid.appendChild(b);}
function clear(){clearInterval(spawn);clearInterval(tick);spawn=tick=null;active=false;current=-1;[...grid.children].forEach(b=>{b.textContent="";b.classList.remove("bug");});}
function start(){clear();score=0;time=30;active=true;$("score").textContent=0;$("time").textContent=30;$("state").textContent="GO!";spawn=setInterval(()=>{[...grid.children].forEach(b=>{b.textContent="";b.classList.remove("bug");});current=Math.floor(Math.random()*9);const b=grid.children[current];b.textContent=["🪲","🐛","👾","🪳"][Math.floor(Math.random()*4)];b.classList.add("bug");setTimeout(()=>{if(active&&current>=0){grid.children[current].textContent="";grid.children[current].classList.remove("bug");current=-1;}},650);},720);tick=setInterval(()=>{time--;if(time<0)time=0;$("time").textContent=time;if(time===0){clear();$("state").textContent="ROUND OVER";}},1000);}
$("start").addEventListener("click",start);$("reset").addEventListener("click",()=>{clear();score=0;time=30;$("score").textContent=0;$("time").textContent=30;$("state").textContent="READY";});</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-whack-a-bug" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
