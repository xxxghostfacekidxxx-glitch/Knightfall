<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Road Riot | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.road{aspect-ratio:420/620}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / CROSSING</div><h1 class="title">ROAD<br><span>RIOT</span></h1><p class="muted">Cross lanes, dodge traffic, and move forward one tile at a time. Arrow keys, WASD, or tap a direction. The cars have absolutely no respect for your journey.</p><div class="hud"><span>ROWS <b id="score">0</b></span><span id="state">CROSS!</span></div><canvas id="game" class="road" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">New crossing</button><span class="muted">Local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let player,lanes,score,over,last,moveCd;
function init(){player={col:3,row:8};lanes=[];for(let r=0;r<14;r++)lanes.push(makeLane(r));score=0;over=false;last=0;moveCd=0;$("score").textContent=0;$("state").textContent="CROSS!";requestAnimationFrame(loop);}
function makeLane(row){const safe=row%4===0||row%4===1;const lane={safe,dir:row%2?1:-1,speed:35+Math.random()*70,cars:[]};if(!safe){for(let i=0;i<3;i++)lane.cars.push({x:i*180+Math.random()*60,w:38+Math.random()*28});}return lane;}
function move(dx,dy){if(over||moveCd>0)return;player.col=Math.max(0,Math.min(6,player.col+dx));player.row=Math.max(0,player.row+dy);moveCd=.09;if(player.row<3){score+=3;player.row+=5;for(let i=0;i<5;i++)lanes.unshift(makeLane(-i-1));lanes=lanes.slice(0,14);$("score").textContent=score;}}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;moveCd=Math.max(0,moveCd-dt);if(!over){for(const l of lanes){if(l.safe)continue;for(const car of l.cars){car.x+=l.dir*l.speed*dt;if(car.x>450)car.x=-car.w-10;if(car.x< -car.w-10)car.x=450;}const rowIndex=lanes.indexOf(l);if(rowIndex===player.row&&!l.safe){const px=player.col*60+30;for(const car of l.cars)if(px>car.x-14&&px<car.x+car.w+14){over=true;$("state").textContent="ROADKILL";}}}}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,620);x.fillStyle="#0b1018";x.fillRect(0,0,420,620);const rh=620/14;for(let r=0;r<14;r++){const l=lanes[r],y=r*rh;x.fillStyle=l.safe?(r%2?"#15281c":"#1b3324"):"#202734";x.fillRect(0,y,420,rh);if(!l.safe){x.strokeStyle="#ffffff30";x.setLineDash([15,12]);x.beginPath();x.moveTo(0,y+rh/2);x.lineTo(420,y+rh/2);x.stroke();x.setLineDash([]);for(const car of l.cars){x.fillStyle=l.dir>0?"#ff5edb":"#a8ff48";x.fillRect(car.x,y+8,car.w,rh-16);x.fillStyle="#0b1018";x.fillRect(car.x+6,y+12,car.w-12,6);}}}const px=player.col*60+30,py=player.row*rh+rh/2;x.fillStyle="#ff5edb";x.shadowColor="#ff5edb";x.shadowBlur=12;x.beginPath();x.arc(px,py,13,0,Math.PI*2);x.fill();x.shadowBlur=0;if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#a8ff48";x.textAlign="center";x.font="bold 30px system-ui";x.fillText("ROADKILL",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Rows crossed: "+score,210,330);}}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")move(-1,0);if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")move(1,0);if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")move(0,-1);if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")move(0,1);});c.addEventListener("pointerdown",e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*420/r.width,py=(e.clientY-r.top)*620/r.height;if(px<140)move(-1,0);else if(px>280)move(1,0);else if(py<310)move(0,-1);else move(0,1);});$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-crossy-road" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
