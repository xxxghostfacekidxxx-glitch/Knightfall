<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Mines | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4a2921,#10101b 75%);color:#ffe7cf;font:16px system-ui}main{max-width:620px;margin:auto}a{color:#ffbd83}h1{color:#ffa15e;font-size:clamp(2rem,8vw,3.5rem)}p{color:#d9c2b6;line-height:1.5}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:520px;margin:18px auto}.tile{aspect-ratio:1;display:grid;place-items:center;border:2px solid #98654e;border-radius:9px;min-width:0;cursor:pointer;color:#ffe4b5;font-weight:900;font-size:clamp(18px,5vw,30px)}.tile img{width:70%;height:70%}.lit{background:#7a4235}.dark{background:#252334}.found{background:#30564b}.glyph{font-size:clamp(18px,5vw,31px)}button:not(.tile){padding:12px 15px;background:#63392d;border:1px solid #d58a56;border-radius:9px;color:#ffe6cc;font-weight:800;cursor:pointer;margin-right:8px}#status{font-weight:800;color:#ffdda9;min-height:38px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Mines</h1><p>Tap to reveal. Toggle Flag mode to mark suspected mines. Clear every safe cell.</p><div class="board" id="board" aria-label="Cinder Mines puzzle"></div><p id="status" role="status"></p><button id="restart">New puzzle</button><button id="mode">Flag mode: OFF</button><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status"),mode=document.getElementById("mode");function finish(points){status.textContent="Puzzle cleared! "+points+" points.";try{const key="ashfall:cinder-mines:best";localStorage.setItem(key,String(Math.max(points,Number(localStorage.getItem(key))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-mines",points,{score:points,game:"cinder-mines"})).catch(()=>{})}const N=8,MINES=10;let cells=[],flags=0,revealed=0,done=false,flagMode=false,first=true;function reset(){cells=Array.from({length:N*N},()=>({mine:false,n:0,up:false,flag:false}));flags=0;revealed=0;done=false;first=true;flagMode=false;mode.textContent="Flag mode: OFF";render()}function plant(safe){const safeR=Math.floor(safe/N),safeC=safe%N;let pool=cells.map((_,i)=>i).filter(i=>Math.abs(Math.floor(i/N)-safeR)>1||Math.abs(i%N-safeC)>1);for(let j=pool.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[pool[j],pool[k]]=[pool[k],pool[j]]}pool.slice(0,MINES).forEach(i=>cells[i].mine=true);for(let i=0;i<cells.length;i++)cells[i].n=neighbors(i).filter(j=>cells[j].mine).length}function neighbors(i){const r=Math.floor(i/N),c=i%N,ns=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const y=r+dy,x=c+dx;if((dx||dy)&&x>=0&&x<N&&y>=0&&y<N)ns.push(y*N+x)}return ns}function click(i){if(done||cells[i].up)return;if(flagMode){cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;render();return}if(cells[i].flag)return;if(first){plant(i);first=false}if(cells[i].mine){done=true;cells.forEach(c=>{if(c.mine)c.up=true});status.textContent="Void charge detonated! Try again.";render();return}const q=[i];while(q.length){const j=q.pop(),c=cells[j];if(c.up||c.flag)continue;c.up=true;revealed++;if(c.n===0)for(const n of neighbors(j))if(!cells[n].up&&!cells[n].mine)q.push(n)}if(revealed===N*N-MINES){done=true;finish(Math.max(100,900-flags*10))}render()}function render(){board.innerHTML="";cells.forEach((c,i)=>{const b=document.createElement("button");b.className="tile "+(c.up?"lit":"dark");b.innerHTML=c.up?(c.mine?'<img src="./sprites/void-mine.svg" alt="">':c.n?'<span class="glyph">'+c.n+'</span>':""):c.flag?'<img src="./sprites/ash-marker.svg" alt="">':"";b.setAttribute("aria-label",c.up?(c.mine?"Mine":c.n+" adjacent mines"):c.flag?"Flagged":"Hidden cell");b.onclick=()=>click(i);b.oncontextmenu=e=>{e.preventDefault();if(done||c.up)return;c.flag=!c.flag;flags+=c.flag?1:-1;render()};board.append(b)});if(!done)status.textContent=revealed+"/"+(N*N-MINES)+" safe cells · "+flags+" flags"}
document.getElementById("restart").onclick=reset;mode.onclick=()=>{flagMode=!flagMode;mode.textContent="Flag mode: "+(flagMode?"ON":"OFF")};reset()})();
</script></body></html>
