<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120e13"><title>Pyre Stacks | Chaos Cartridge</title><style>*{box-sizing:border-box}body{background:radial-gradient(circle at 50% 0,#46271c,#0d0d13 70%);color:#f9e4cf;font:16px system-ui;margin:0;padding:14px}main{max-width:950px;margin:auto}a{color:#ffb778}h1{font-size:clamp(2rem,8vw,4rem);color:#ff9e50;margin:12px 0 4px}p{color:#d1beb0;line-height:1.5}.hud{display:flex;gap:20px;flex-wrap:wrap;font-weight:900;color:#ffda9d;margin:14px 0}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:340px;padding:12px;border:2px solid #a85c35;border-radius:16px;background:linear-gradient(#171923,#0e1018);position:relative}.tower{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;cursor:pointer;background:transparent;border:1px solid #ffffff14;border-radius:12px;padding:18px 5px 32px;min-height:300px;touch-action:manipulation}.tower:focus-visible{outline:3px solid #ffd08d}.tower.selected{background:#ffb75c14;border-color:#ffb75c}.tower:before{content:"";position:absolute;bottom:31px;left:calc(50% - 7px);width:14px;height:76%;border-radius:10px;background:linear-gradient(90deg,#4c3029,#c58a53,#513028)}.tower:after{content:"";position:absolute;bottom:22px;width:94%;height:14px;border-radius:12px;background:linear-gradient(#d39a63,#6e3c2c)}.discs{position:relative;z-index:1;width:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:3px}.disc{height:30px;border-radius:12px;border:2px solid #ffd8a0;background:linear-gradient(#f5b96d,#c46a35 48%,#72352a);display:grid;place-items:center;color:#2b1311;font-weight:900;text-shadow:0 1px #ffdfac;background-image:url("./sprites/ember-disc.svg");background-size:100% 100%}.tower-label{position:absolute;bottom:2px;color:#f7c28c;font-weight:900;z-index:2}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button{cursor:pointer;font:inherit;font-weight:800;color:#ffe6c5;background:#593225;border:1px solid #c77844;border-radius:10px;padding:12px 16px}button:disabled{opacity:.4;cursor:not-allowed}#status{color:#ffd18f;font-weight:800;min-height:25px}.badge{display:inline-flex;align-items:center;gap:8px}.badge img{width:34px;height:34px}@media(max-width:560px){.board{min-height:290px;gap:4px;padding:6px}.tower{min-height:270px;padding:12px 2px 28px}.disc{height:26px;font-size:12px}.hud{gap:10px}}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Pyre Stacks</h1><p>Move the ember rings between three pyres. Never place a larger ring on a smaller one. Solve all five trials.</p><div class="hud"><span>TRIAL <output id="level">1</output>/5</span><span>MOVES <output id="moves">0</output></span><span>PAR <output id="par">7</output></span><span class="badge"><img src="./sprites/sigil.svg" alt=""> INFERNAL LOGIC</span></div><div id="board" class="board" role="group" aria-label="Three pyre towers"><button class="tower" data-tower="0" aria-label="Select left pyre"><span class="discs"></span><span class="tower-label">I</span></button><button class="tower" data-tower="1" aria-label="Select middle pyre"><span class="discs"></span><span class="tower-label">II</span></button><button class="tower" data-tower="2" aria-label="Select right pyre"><span class="discs"></span><span class="tower-label">III</span></button></div><div class="controls"><button id="reset">Restart trial</button><button id="undo">Undo</button><button id="next" disabled>Next trial</button><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Select a tower, then select where to move its top ring.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll("[data-tower]")],storageKey="ashfall:pyre-stacks:v1";let level=1,towers=[],selected=null,moves=0,history=[],solved=false;
function save(){try{localStorage.setItem(storageKey,JSON.stringify({level,towers,moves,solved}))}catch{}}
function load(){try{const x=JSON.parse(localStorage.getItem(storageKey)||"null");if(!x||!Number.isInteger(x.level)||x.level<1||x.level>5||!Array.isArray(x.towers)||x.towers.length!==3)return false;const n=x.level+2,flat=x.towers.flat();if(flat.length!==n||flat.some(v=>!Number.isInteger(v)||v<1||v>n)||new Set(flat).size!==n||x.towers.some(t=>!Array.isArray(t)||t.some((v,i)=>i>0&&v>=t[i-1]))||!Number.isInteger(x.moves)||x.moves<0)return false;level=x.level;towers=x.towers.map(t=>[...t]);moves=x.moves;solved=towers[2].length===n;return true}catch{return false}}
function setup(){towers=[Array.from({length:level+2},(_,i)=>level+2-i),[],[]];selected=null;moves=0;history=[];solved=false;render()}
function render(){buttons.forEach((b,i)=>{b.classList.toggle("selected",selected===i);const target=b.querySelector(".discs");target.replaceChildren();towers[i].forEach(n=>{const d=document.createElement("span");d.className="disc";d.style.width=Math.min(94,27+n*12)+"%";d.textContent=n;d.setAttribute("aria-label","Ring "+n);target.append(d)});b.setAttribute("aria-label","Pyre "+(i+1)+", "+towers[i].length+" rings"+(selected===i?", selected":""))});$("level").textContent=level;$("moves").textContent=moves;$("par").textContent=(2**(level+2)-1);$("undo").disabled=!history.length;$("next").disabled=!solved||level===5;save()}
function submit(){const par=2**(level+2)-1,points=Math.max(100,1000-(moves-par)*35)+level*200;if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("pyre-stacks",points,{score:points,moves,level,game:"pyre-stacks",lastPlayedAt:new Date().toISOString()})).catch(()=>{})}
function choose(i){if(solved)return;if(selected===null){if(!towers[i].length){$("status").textContent="That pyre is empty. Select one with rings.";return}selected=i;$("status").textContent="Now choose the destination pyre.";render();return}if(selected===i){selected=null;$("status").textContent="Selection cleared.";render();return}const from=towers[selected],to=towers[i],top=from[from.length-1];if(to.length&&to[to.length-1]<top){$("status").textContent="A larger ring cannot rest on a smaller ring.";selected=null;render();return}history.push({towers:towers.map(t=>[...t]),moves});to.push(from.pop());moves++;selected=null;if(towers[2].length===level+2){solved=true;$("status").textContent="Trial "+level+" cleared in "+moves+" moves!"+(level===5?" All pyres conquered.":" Advance to the next trial.");submit()}else $("status").textContent="Ring moved. Keep going.";render()}
buttons.forEach((b,i)=>b.addEventListener("click",()=>choose(i)));$("reset").onclick=()=>{setup();$("status").textContent="Trial restarted."};$("undo").onclick=()=>{if(!history.length)return;const prev=history.pop();towers=prev.towers;moves=prev.moves;selected=null;solved=false;$("status").textContent="Move reversed.";render()};$("next").onclick=()=>{if(!solved||level===5)return;level++;setup();$("status").textContent="Trial "+level+": the pyres grow taller."};$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $("board").requestFullscreen().catch(()=>{$("status").textContent="Fullscreen unavailable."})};if(!load())setup();else render();
})();
</script></body></html>
