<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Sequence | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49291f,#0e1019 75%);color:#ffe7d1;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffc18b}h1{color:#ffa15c;font-size:clamp(2rem,8vw,3.6rem)}p{color:#dbc5b8;line-height:1.5}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-width:510px;margin:20px 0}.cell{aspect-ratio:1;display:grid;place-items:center;min-width:0;background:#322936;border:2px solid #99644b;border-radius:10px;color:#ffd5a2;cursor:pointer}.cell img{width:68%;height:68%}.cell.flash{background:#e49a58;color:#221a24}.conduit{font-size:clamp(22px,6vw,43px);font-weight:900}button:not(.cell){padding:12px 18px;background:#65392c;color:#ffe8d2;border:1px solid #da905b;border-radius:9px;font-weight:800;cursor:pointer;margin:7px 8px 7px 0}#status{font-weight:800;color:#ffdda9;min-height:35px}.guess{padding:12px;font-size:22px;width:140px;background:#27212d;color:#ffe6cb;border:2px solid #d58b53;border-radius:8px}.history p{padding:8px;border-bottom:1px solid #5c453f}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Void Sequence</h1><p>Watch the rune flashes, then repeat them in order. The pattern grows each round.</p><div id="board" class="board"></div><button id="start">Start sequence</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status");function finish(score){try{const k="ashfall:void-sequence:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("void-sequence",score,{score,game:"void-sequence"})).catch(()=>{})}let sequence=[],input=0,round=0,playing=false,showing=false,lit=-1,token=0;function render(){board.innerHTML="";for(let i=0;i<4;i++){const b=document.createElement("button");b.className="cell "+(lit===i?"flash":"");b.innerHTML='<img src="./sprites/rune.svg" alt="Rune">';b.style.filter="hue-rotate("+(i*75)+"deg)";b.setAttribute("aria-label","Rune "+(i+1));b.onclick=()=>press(i);board.append(b)}status.textContent="Round "+round+(showing?" · Watch carefully":playing?" · Repeat the pattern":" · Press Start")}async function reveal(my){showing=true;render();await new Promise(r=>setTimeout(r,450));for(const n of sequence){if(my!==token)return;lit=n;render();await new Promise(r=>setTimeout(r,420));lit=-1;render();await new Promise(r=>setTimeout(r,180))}if(my===token){showing=false;input=0;render()}}function next(){round++;sequence.push(Math.floor(Math.random()*4));reveal(token)}function press(i){if(!playing||showing)return;if(i!==sequence[input]){playing=false;token++;finish(Math.max(0,(round-1)*100));render();status.textContent="Wrong rune. Completed "+(round-1)+" rounds.";return}input++;if(input===sequence.length){showing=true;render();setTimeout(()=>{if(playing)next()},500)}}function reset(){token++;sequence=[];input=0;round=0;playing=true;showing=true;next()}document.getElementById("start").onclick=reset;render();})();</script></body></html>
