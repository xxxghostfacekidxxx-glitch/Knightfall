<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bubble Pop | Chaos Cartridge</title><style>
:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:700px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;max-width:520px;margin:auto;padding:10px;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018}.bubble{aspect-ratio:1;border:0;border-radius:50%;padding:0;cursor:pointer;box-shadow:inset -4px -5px 8px #0005,inset 3px 3px 6px #ffffff38}.bubble:focus-visible{outline:2px solid white;outline-offset:2px}.bubble.c0{background:#ff5edb}.bubble.c1{background:#a8ff48}.bubble.c2{background:#45d9ff}.bubble.c3{background:#ffb84d}.bubble.c4{background:#b69aff}.bubble.empty{visibility:hidden;pointer-events:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / PUZZLE</div><h1 class="title">BUBBLE<br><span>POP.EXE</span></h1><p class="muted">Pop groups of matching adjacent bubbles. Groups of two or more score points; larger clusters score better. You have 60 seconds to make a colorful mess.</p><div class="hud"><span>SCORE <b id="score">0</b></span><span>TIME <b id="time">60</b>s</span><span id="state">POP AWAY</span></div><div class="grid" id="grid"></div><div class="controls"><button class="btn" id="restart">New board</button><span class="muted">Tap a bubble group · local score only</span></div></section></main><script>
const R=8,C=9,N=5,$=id=>document.getElementById(id);let board,score,time,active,interval,last;
function rand(){return Math.floor(Math.random()*N)}
function init(){board=Array.from({length:R},()=>Array.from({length:C},rand));score=0;time=60;active=true;$("score").textContent=0;$("time").textContent=60;$("state").textContent="POP AWAY";render();clearInterval(interval);interval=setInterval(()=>{if(!active)return;time--;if(time<=0){time=0;active=false;$("state").textContent="TIME UP";clearInterval(interval);} $("time").textContent=time;},1000);}
function group(r,c){const color=board[r][c];if(color===null)return[];const stack=[[r,c]],seen=new Set([r+","+c]),out=[];while(stack.length){const [y,x]=stack.pop();out.push([y,x]);for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){const yy=y+dy,xx=x+dx,k=yy+","+xx;if(yy>=0&&yy<R&&xx>=0&&xx<C&&!seen.has(k)&&board[yy][xx]===color){seen.add(k);stack.push([yy,xx]);}}}return out;}
function pop(r,c){if(!active||board[r][c]===null)return;const g=group(r,c);if(g.length<2){$("state").textContent="Need a pair or bigger";return;}for(const [y,x] of g)board[y][x]=null;score+=g.length*g.length;$("score").textContent=score;for(let x=0;x<C;x++){const col=[];for(let y=R-1;y>=0;y--)if(board[y][x]!==null)col.push(board[y][x]);while(col.length<R)col.push(rand());for(let y=R-1,i=0;y>=0;y--,i++)board[y][x]=col[i];}render();$("state").textContent="+"+(g.length*g.length)+" POINTS";}
function render(){const root=$("grid");root.innerHTML="";for(let r=0;r<R;r++)for(let c=0;c<C;c++){const b=document.createElement("button");b.className="bubble c"+board[r][c];b.setAttribute("aria-label","Bubble row "+(r+1)+" column "+(c+1));b.addEventListener("click",()=>pop(r,c));root.appendChild(b);}}
$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-bubble-pop" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
