<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Vault | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#48291f,#0e1019 75%);color:#ffe8d1;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc18b}h1{color:#ffa25e;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 16px;background:#66392c;border:1px solid #d9925a;color:#ffe5ca;border-radius:9px;font-weight:800;cursor:pointer;margin:4px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:530px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(20px,5vw,33px);background:#322735}#readout{font-size:24px;font-weight:800;padding:25px 0}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cf8956}#status{font-weight:800;color:#ffdda8;min-height:35px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ember Vault</h1><p>Align four rotating rune wheels to crack a mysterious infernal lock.</p><div id="board" class="board"></div><button id="restart">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board"),readout=$("readout"),roll=$("action"),bank=$("extra");function finish(score){try{const k="ashfall:ember-vault:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ember-vault",score,{score,game:"ember-vault"})).catch(()=>{})}const runes=["✦","☽","✧","◆","♜","✹"];let wheels=[],target=[],moves=0,done=false;function reset(){target=Array.from({length:4},()=>Math.floor(Math.random()*6));wheels=Array.from({length:4},()=>Math.floor(Math.random()*6));if(wheels.every((v,i)=>v===target[i]))wheels[0]=(wheels[0]+1)%6;moves=0;done=false;draw()}function spin(i,n){if(done)return;wheels[i]=(wheels[i]+n+6)%6;moves++;if(wheels.every((v,i)=>v===target[i])){done=true;finish(Math.max(100,1000-moves*20))}draw()}function draw(){board.innerHTML="";board.style.gridTemplateColumns="repeat(2,1fr)";wheels.forEach((v,i)=>{const wrap=document.createElement("div");const a=document.createElement("button"),b=document.createElement("button"),label=document.createElement("strong");a.textContent="−";b.textContent="+";label.textContent=" "+runes[v]+" ";a.onclick=()=>spin(i,-1);b.onclick=()=>spin(i,1);wrap.append(a,label,b);board.append(wrap)});status.textContent=(done?"Vault unlocked!":"Match "+target.map(v=>runes[v]).join(" "))+" · "+moves+" turns"}$("restart").onclick=reset;reset();})();</script></body></html>
