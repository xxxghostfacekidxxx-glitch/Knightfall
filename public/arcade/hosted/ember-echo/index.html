<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Echo | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b2a20,#0f111a 76%);color:#ffe7cf;font:16px system-ui}main{max-width:680px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa15e}p{line-height:1.5;color:#ddc6b7}button{padding:12px 16px;margin:5px;background:#64382e;border:1px solid #da8d56;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:540px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(18px,5vw,30px);background:#35283a}.tile.chosen{outline:4px solid #ffce84}.maze-cell{aspect-ratio:1;display:grid;place-items:center;background:#292430;font-size:clamp(12px,3vw,22px);color:#ffd58c}canvas{display:block;width:100%;max-width:540px;height:auto;border:3px solid #d18b56;border-radius:10px;touch-action:none}#status{font-weight:800;color:#ffdda9;min-height:42px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ember Echo</h1><p>Repeat a growing sequence of colored signals with keyboard or touch.</p><img src="./sprites/echo.svg" width="42" height="42" alt=""><div id="board" class="board"></div><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:ember-echo:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ember-echo",score,{score,game:"ember-echo"})).catch(()=>{})}let seq=[],cursor=0,round=0,active=false,showing=false,epoch=0;const palette=["#ff9d62","#9d8bdf","#77cba9","#f0d17b"];function draw(){board.innerHTML="";for(let i=0;i<4;i++){const b=document.createElement("button");b.className="tile";b.style.background=palette[i];b.setAttribute("aria-label","Signal "+(i+1));b.onclick=()=>pick(i);board.append(b)}status.textContent=active?(showing?"Watch round "+round:"Repeat round "+round):"Press New game to begin"}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function next(){const current=epoch;showing=true;seq.push(Math.floor(Math.random()*4));round++;cursor=0;draw();await sleep(500);for(const n of seq){if(epoch!==current)return;board.children[n].style.filter="brightness(1.8)";await sleep(400);if(epoch!==current)return;board.children[n].style.filter="";await sleep(190)}if(epoch===current){showing=false;draw()}}function pick(i){if(!active||showing)return;if(seq[cursor]!==i){active=false;epoch++;finish((round-1)*100);status.textContent="Sequence broken. "+(round-1)+" rounds cleared";return}cursor++;if(cursor===seq.length){showing=true;setTimeout(()=>{if(active)next()},450)}}function reset(){epoch++;seq=[];round=0;active=true;next()}$("reset").onclick=reset;draw();})();</script></body></html>
