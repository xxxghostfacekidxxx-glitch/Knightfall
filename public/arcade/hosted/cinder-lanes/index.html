<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Lanes | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49281d,#0f111b 75%);color:#ffe8d0;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa363}p{color:#ddc6b8;line-height:1.5}button{padding:12px 16px;margin:5px;background:#663a2d;border:1px solid #dc935d;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:530px;margin:20px 0}.tube{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:#302636;border:3px solid #a86d4f;border-top:0;border-radius:0 0 20px 20px}.tube.chosen{outline:3px solid #ffe4a3}.ember{width:42px;height:32px;border-radius:8px;background:#28212f}.tile{aspect-ratio:1;min-width:0;font-size:clamp(15px,4vw,28px);background:#342738}.tile.static{display:grid;place-items:center;color:#ffe5c6;border:1px solid #ad7250;border-radius:8px}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cc8553;border-radius:12px;touch-action:none}label{display:inline-block;margin:8px}input[type=range]{display:block;accent-color:#ff9b5e}#status{font-weight:800;color:#ffdda7;min-height:40px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Lanes</h1><p>Switch between four lanes to collect embers while avoiding descending void traps.</p><img src="./sprites/lane-ember.svg" alt="" width="42" height="42"><canvas id="screen" width="500" height="320"></canvas><button id="left">← Left</button><button id="right">Right →</button><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:cinder-lanes:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-lanes",score,{score,game:"cinder-lanes"})).catch(()=>{})}const c=$("screen"),g=c.getContext("2d");let lane=1,items=[],score=0,active=true,last=0,spawn=0,reported=false;function reset(){lane=1;items=[];score=0;spawn=0;active=true;reported=false}function move(n){if(active)lane=Math.max(0,Math.min(3,lane+n))}function step(dt){if(!active)return;score+=dt*2;spawn+=dt;if(spawn>.55){spawn=0;items.push({lane:Math.floor(Math.random()*4),y:-15,bad:Math.random()<.43})}for(const it of items){it.y+=(130+score*.25)*dt;if(it.y>=264&&!it.used&&it.y<290){it.used=true;if(it.lane===lane){if(it.bad){active=false;if(!reported){reported=true;finish(Math.floor(score))}}else score+=25}}}items=items.filter(it=>it.y<340)}function draw(){g.fillStyle="#151923";g.fillRect(0,0,500,320);for(let i=0;i<4;i++){g.strokeStyle="#674335";g.strokeRect(i*125,0,125,320)}for(const it of items){g.fillStyle=it.bad?"#a884d8":"#ffb369";g.beginPath();g.arc(it.lane*125+62,it.y,14,0,7);g.fill()}g.fillStyle="#ffe4b3";g.fillRect(lane*125+42,270,40,25);g.font="bold 23px system-ui";g.fillText("Score "+Math.floor(score),15,30);status.textContent=active?"Collect amber. Avoid purple.":"Run ended · "+Math.floor(score)}function frame(t){if(last)step(Math.min(.04,(t-last)/1000));last=t;draw();requestAnimationFrame(frame)}$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}if(e.key==="ArrowRight"){e.preventDefault();move(1)}});c.onpointerdown=e=>{const r=c.getBoundingClientRect();lane=Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)*500/r.width/125)))};$("reset").onclick=reset;reset();requestAnimationFrame(frame);})();</script></body></html>
