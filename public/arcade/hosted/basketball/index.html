<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Inferno Hoops | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#f2a05d;--green:#ffcc88}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#49251b 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#3c241c 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #eaa16b70;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#ffcc88,#f2a05d);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.court{aspect-ratio:400/600}</style><style>.ashfall-original-mark{display:block;width:56px;height:56px;filter:drop-shadow(0 0 12px #e99a5b77);margin:4px 0 10px}</style></head><body><img class="ashfall-original-mark" src="./sprites/inferno-ball.svg" alt="Inferno Hoops original sigil"><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SPORTS</div><h1 class="title">Inferno Hoops<br><span>BLITZ</span></h1><p class="muted">Drag from the ball toward the hoop, then release. Build an arc, beat the clock, and try not to blame the rim.</p><div class="hud"><span>BUCKETS <b id="score">0</b></span><span>TIME <b id="time">45</b>s</span><span id="state">AIM</span></div><canvas id="game" class="court" width="400" height="600"></canvas><div class="controls"><button class="btn" id="restart">New game</button><span class="muted">Swipe or drag to shoot · local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d");let ball,aim,drag=false,score=0,time=45,ended=false,last=0,shotCounted=false;const $=id=>document.getElementById(id);
function resetBall(){ball={x:70,y:510,vx:0,vy:0,r:13,active:false};aim=null;shotCounted=false;}
function init(){score=0;time=45;ended=false;last=0;resetBall();$("score").textContent=0;$("time").textContent=45;$("state").textContent="AIM";requestAnimationFrame(loop);}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!ended){time-=dt;if(time<=0){time=0;ended=true;$("state").textContent="TIME UP";}if(ball.active)physics(dt);}draw();$("time").textContent=Math.ceil(time);requestAnimationFrame(loop);}
function physics(dt){const oldX=ball.x,oldY=ball.y;ball.vy+=650*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.997;if(!shotCounted&&ball.x>=302&&ball.x<=355&&ball.y>=155&&ball.y<=215){score++;shotCounted=true;$("score").textContent=score;$("state").textContent="BUCKET!";}if(ball.y>540||ball.x>420||ball.x< -30){ball.active=false;setTimeout(()=>{if(!ended)resetBall()},350);$("state").textContent=shotCounted?"NICE SHOT":"MISS";} }
function draw(){x.clearRect(0,0,400,600);const g=x.createLinearGradient(0,0,400,600);g.addColorStop(0,"#141b28");g.addColorStop(1,"#080a0f");x.fillStyle=g;x.fillRect(0,0,400,600);x.strokeStyle="#f2a05d80";x.lineWidth=2;x.strokeRect(20,35,360,530);x.beginPath();x.arc(200,300,65,0,Math.PI*2);x.stroke();x.strokeStyle="#ffcc88";x.lineWidth=5;x.beginPath();x.moveTo(300,175);x.lineTo(355,175);x.stroke();x.strokeStyle="#f2a05d";x.lineWidth=3;x.beginPath();x.moveTo(304,178);x.lineTo(350,178);x.stroke();x.strokeStyle="#ffffff80";x.beginPath();x.moveTo(332,180);x.lineTo(332,240);x.stroke();x.strokeStyle="#ffcc8870";x.beginPath();x.moveTo(260,240);x.lineTo(400,240);x.stroke();x.fillStyle="#f2a05d";x.shadowColor="#f2a05d";x.shadowBlur=12;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.strokeStyle="#46113c";x.lineWidth=2;x.beginPath();x.arc(ball.x,ball.y,ball.r*.65,0,Math.PI*2);x.moveTo(ball.x-ball.r,ball.y);x.lineTo(ball.x+ball.r,ball.y);x.stroke();if(drag&&aim){x.strokeStyle="#ffcc88";x.lineWidth=3;x.setLineDash([6,5]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(aim.x,aim.y);x.stroke();x.setLineDash([]);}if(ended){x.fillStyle="#080a0fdd";x.fillRect(0,0,400,600);x.fillStyle="#ffcc88";x.textAlign="center";x.font="bold 30px system-ui";x.fillText("TIME UP",200,285);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Buckets: "+score,200,320);}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*600/r.height};}
c.addEventListener("pointerdown",e=>{if(ended||ball.active)return;drag=true;aim=pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(drag)aim=pos(e)});c.addEventListener("pointerup",e=>{if(!drag||ended)return;drag=false;const p=pos(e),dx=p.x-ball.x,dy=p.y-ball.y;ball.vx=Math.max(120,Math.min(300,dx*1.0));ball.vy=Math.max(-650,Math.min(-120,dy*2.4));ball.active=true;aim=null;$("state").textContent="SHOOTING";});$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-basketball" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
