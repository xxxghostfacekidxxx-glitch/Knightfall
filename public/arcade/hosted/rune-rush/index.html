<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rune Rush | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b291d,#10111a 76%);color:#ffe8d2;font:16px system-ui}main{max-width:670px;margin:auto}a{color:#ffc08a}h1{color:#ffa260;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 15px;background:#65382c;border:1px solid #d9925b;color:#ffe7d0;border-radius:8px;font-weight:800;cursor:pointer}button:disabled{opacity:.3}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:520px;margin:18px 0}.tile{aspect-ratio:1;min-width:0;padding:2px;background-color:#302736;background-size:22%;background-position:right bottom;background-repeat:no-repeat;font-size:clamp(12px,4vw,24px)}.tile img{width:75%;height:75%}.selected{outline:4px solid #fca45e}.reels{font-size:clamp(45px,12vw,88px);letter-spacing:12px;padding:30px 0;color:#ffc27c}input{font-size:22px;padding:12px;width:150px;background:#282231;color:#fff;border:2px solid #d68c58;border-radius:8px}#status{color:#ffdda9;font-weight:800;min-height:35px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Rune Rush</h1><p>Solve rapid-fire rune arithmetic before the timer expires.</p><h2 id="question" style="background:url('./sprites/rune-token.svg') no-repeat right center;background-size:42px">Ready?</h2><input id="entry" inputmode="numeric" type="number" aria-label="Answer"><button id="submit">Answer</button><p><button id="start">Start round</button></p><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board");function finish(score){try{const k="ashfall:rune-rush:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("rune-rush",score,{score,game:"rune-rush"})).catch(()=>{})}let score=0,remaining=45,answer=0,timer=null,active=false;const q=$("question"),input=$("entry");function next(){const a=1+Math.floor(Math.random()*19),b=1+Math.floor(Math.random()*19),op=Math.random()<.5?"+":"×";answer=op==="+"?a+b:a*b;q.textContent=a+" "+op+" "+b+" = ?";input.value="";input.focus()}function stop(){active=false;clearInterval(timer);finish(score);status.textContent="Round complete · "+score+" points"}function reset(){clearInterval(timer);score=0;remaining=45;active=true;next();timer=setInterval(()=>{remaining--;if(remaining<=0)stop();else status.textContent=remaining+" seconds · "+score+" points"},1000);status.textContent="45 seconds · 0 points"}$("submit").onclick=()=>{if(!active)return;if(Number(input.value)===answer){score+=20;next()}else{score=Math.max(0,score-5);input.select()}status.textContent=remaining+" seconds · "+score+" points"};input.onkeydown=e=>{if(e.key==="Enter")$("submit").click()};$("start").onclick=reset;status.textContent="Press Start to begin.";})();</script></body></html>
