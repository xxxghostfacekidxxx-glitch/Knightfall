<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Pulse | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49281d,#0f111b 75%);color:#ffe8d0;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa363}p{color:#ddc6b8;line-height:1.5}button{padding:12px 16px;margin:5px;background:#663a2d;border:1px solid #dc935d;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:530px;margin:20px 0}.tube{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:#302636;border:3px solid #a86d4f;border-top:0;border-radius:0 0 20px 20px}.tube.chosen{outline:3px solid #ffe4a3}.ember{width:42px;height:32px;border-radius:8px;background:#28212f}.tile{aspect-ratio:1;min-width:0;font-size:clamp(15px,4vw,28px);background:#342738}.tile.static{display:grid;place-items:center;color:#ffe5c6;border:1px solid #ad7250;border-radius:8px}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cc8553;border-radius:12px;touch-action:none}label{display:inline-block;margin:8px}input[type=range]{display:block;accent-color:#ff9b5e}#status{font-weight:800;color:#ffdda7;min-height:40px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Void Pulse</h1><p>Stop the rotating energy needle inside the glowing target sector. Ten rounds, shrinking targets.</p><img src="./sprites/pulse-core.svg" alt="" width="42" height="42"><canvas id="screen" width="500" height="500"></canvas><button id="action">Strike</button><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:void-pulse:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("void-pulse",score,{score,game:"void-pulse"})).catch(()=>{})}const c=$("screen"),g=c.getContext("2d");let angle=0,target=0,width=.65,round=1,score=0,active=true,last=0,locked=false;function reset(){angle=0;target=Math.random()*Math.PI*2;width=.65;round=1;score=0;active=true;locked=false;draw()}function strike(){if(!active||locked)return;const diff=Math.abs(Math.atan2(Math.sin(angle-target),Math.cos(angle-target)));if(diff<=width/2)score+=Math.round(100+(width/2-diff)*100);round++;if(round>10){active=false;finish(score)}else{target=Math.random()*Math.PI*2;width=Math.max(.17,.65-round*.045)}draw()}function draw(){g.fillStyle="#171622";g.fillRect(0,0,500,500);g.strokeStyle="#604137";g.lineWidth=18;g.beginPath();g.arc(250,250,170,0,7);g.stroke();g.strokeStyle="#ffb96b";g.lineWidth=21;g.beginPath();g.arc(250,250,170,target-width/2,target+width/2);g.stroke();g.strokeStyle="#b894ed";g.lineWidth=5;g.beginPath();g.moveTo(250,250);g.lineTo(250+Math.cos(angle)*165,250+Math.sin(angle)*165);g.stroke();g.fillStyle="#ffcf95";g.beginPath();g.arc(250,250,19,0,7);g.fill();g.fillStyle="#ffe8d0";g.textAlign="center";g.font="bold 24px system-ui";g.fillText("Round "+Math.min(round,10)+"/10 · "+score,250,35);status.textContent=active?"Tap Strike when the needle crosses the amber sector":"Complete! "+score+" points"}function frame(t){if(last&&active)angle=(angle+Math.min(.04,(t-last)/1000)*(2.3+round*.22))%(Math.PI*2);last=t;draw();requestAnimationFrame(frame)}$("action").onclick=strike;c.onpointerdown=strike;document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();strike()}});$("reset").onclick=reset;reset();requestAnimationFrame(frame);})();</script></body></html>
