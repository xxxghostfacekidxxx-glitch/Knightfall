<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Fallout | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4c291d,#0e1018 76%);color:#ffe9d2;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffc18b}h1{color:#ffa35e;font-size:clamp(2rem,8vw,3.5rem)}p{color:#d7c1b4;line-height:1.5}canvas{display:block;width:min(100%,500px);height:auto;border:3px solid #d08951;border-radius:12px;touch-action:none}button{padding:12px 16px;margin:8px 8px 8px 0;background:#65392c;border:1px solid #dc8d51;color:#ffe6cb;border-radius:9px;font-weight:800;cursor:pointer}#status{font-weight:800;color:#ffdda9}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Fallout</h1><p>Dodge a rain of burning debris and survive as the inferno accelerates. Use touch, mouse, or arrow keys.</p><canvas id="game" width="500" height="500"></canvas><button id="restart">New run</button><button id="pause">Pause</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),art=new Image();art.src="./sprites/falling-cinder.svg";function finish(score){try{const k="ashfall:ash-fallout:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-fallout",score,{score,game:"ash-fallout"})).catch(()=>{})}const c=$("game"),g=c.getContext("2d");let player,rocks,score,active=false,paused=false,last=0,spawn=0,keys=new Set(),reported=false;function reset(){player={x:250,y:440};rocks=[];score=0;spawn=0;active=true;paused=false;reported=false}function end(){active=false;if(reported)return;reported=true;finish(Math.floor(score))}function step(dt){if(!active||paused)return;score+=dt*25;spawn+=dt;const interval=Math.max(.16,.65-score/1500);while(spawn>interval){spawn-=interval;rocks.push({x:15+Math.random()*470,y:-20,r:9+Math.random()*16,s:120+score*.12+Math.random()*80})}let d=(keys.has("ArrowRight")||keys.has("d")?1:0)-(keys.has("ArrowLeft")||keys.has("a")?1:0);player.x=Math.max(20,Math.min(480,player.x+d*310*dt));for(const rock of rocks){rock.y+=rock.s*dt;if(Math.hypot(rock.x-player.x,rock.y-player.y)<rock.r+15)end()}rocks=rocks.filter(r=>r.y<530)}function draw(){g.fillStyle="#17131c";g.fillRect(0,0,500,500);g.fillStyle="#4a2c2c";g.fillRect(0,465,500,35);for(const r of rocks){g.fillStyle="#d9753e";g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.fill();if(art.complete&&art.naturalWidth)g.drawImage(art,r.x-r.r,r.y-r.r,r.r*2,r.r*2)}g.fillStyle="#ffe2a4";g.beginPath();g.moveTo(player.x,player.y-18);g.lineTo(player.x-18,player.y+16);g.lineTo(player.x+18,player.y+16);g.closePath();g.fill();g.textAlign="center";g.fillStyle="#ffe2b4";g.font="bold 25px system-ui";g.fillText("Score "+Math.floor(score),250,40);if(!active||paused){g.fillStyle="#080a13b9";g.fillRect(0,0,500,500);g.fillStyle="#ffdaa7";g.fillText(paused?"PAUSED":"ASHFALL OVER",250,250)}status.textContent=active?"Stay clear of falling debris.":"Final score "+Math.floor(score)}function frame(t){const dt=Math.min(.04,last?(t-last)/1000:0);last=t;step(dt);draw();requestAnimationFrame(frame)}function pointer(e){const r=c.getBoundingClientRect();player.x=Math.max(20,Math.min(480,(e.clientX-r.left)*500/r.width))}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pointer(e)};c.onpointermove=e=>{if(e.buttons||e.pointerType==="touch")pointer(e)};document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","a","d"].includes(e.key)){e.preventDefault();keys.add(e.key)}});document.addEventListener("keyup",e=>keys.delete(e.key));$("restart").onclick=reset;$("pause").onclick=()=>{if(active)paused=!paused};document.addEventListener("visibilitychange",()=>{if(document.hidden)paused=true});reset();requestAnimationFrame(frame)})();</script></body></html>
