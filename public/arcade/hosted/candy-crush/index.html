<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinder Confection | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#f2a05d;--green:#ffcc88}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#49251b 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#3c241c 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#ffcc88,#f2a05d);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;max-width:520px;margin:auto;padding:8px;border:1px solid #eaa16b70;border-radius:12px;background:#0b1018}.gem{aspect-ratio:1;border:0;border-radius:35%;cursor:pointer;box-shadow:inset -4px -5px 8px #0005,inset 3px 3px 6px #ffffff40;transform:rotate(0);transition:transform .12s}.gem.c0{background:linear-gradient(135deg,#ffb0ef,#f2a05d)}.gem.c1{background:linear-gradient(135deg,#edffc5,#ffcc88)}.gem.c2{background:linear-gradient(135deg,#a4f3ff,#45d9ff)}.gem.c3{background:linear-gradient(135deg,#ffe0a1,#ffb84d)}.gem.c4{background:linear-gradient(135deg,#d7c5ff,#9d7cff)}.gem.selected{outline:3px solid white;outline-offset:1px;transform:scale(.88) rotate(8deg)}.gem:disabled{cursor:default}</style><style>.ashfall-original-mark{display:block;width:58px;height:58px;filter:drop-shadow(0 0 13px #e99a5b77);margin:4px 0 10px}</style></head><body><img class="ashfall-original-mark" src="./sprites/cinder-candy.svg" alt="Cinder Confection original sigil"><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / MATCH-3</div><h1 class="title">Cinder Confection</h1><p class="muted">Swap neighboring gems to line up three or more. Chain matches for extra points. Twenty-five moves. No upstream candy mascots, logos, or assets.</p><div class="hud"><span>SCORE <b id="score">0</b></span><span>MOVES <b id="moves">25</b></span><span id="state">MATCH 3+</span></div><div class="grid" id="grid"></div><div class="controls"><button class="btn" id="restart">New board</button><span class="muted">Tap two neighboring gems</span></div></section></main><script>
const N=8,COL=5,$=id=>document.getElementById(id);let board,selected=null,score=0,moves=25,locked=false;
function rand(){return Math.floor(Math.random()*COL)}
function init(){board=Array.from({length:N},()=>Array.from({length:N},rand));for(let r=0;r<N;r++)for(let c=0;c<N;c++){while((c>=2&&board[r][c]===board[r][c-1]&&board[r][c]===board[r][c-2])||(r>=2&&board[r][c]===board[r-1][c]&&board[r][c]===board[r-2][c]))board[r][c]=rand();}selected=null;score=0;moves=25;locked=false;update();$("state").textContent="MATCH 3+";}
function update(){ $("score").textContent=score;$("moves").textContent=moves;const root=$("grid");root.innerHTML="";for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=document.createElement("button");b.className="gem c"+board[r][c]+(selected&&selected.r===r&&selected.c===c?" selected":"");b.setAttribute("aria-label","Gem row "+(r+1)+" column "+(c+1));b.addEventListener("click",()=>tap(r,c));root.appendChild(b);}}
function matches(){const set=new Set();for(let r=0;r<N;r++){let start=0;for(let c=1;c<=N;c++){if(c<N&&board[r][c]===board[r][start])continue;if(c-start>=3)for(let k=start;k<c;k++)set.add(r+","+k);start=c;}}for(let c=0;c<N;c++){let start=0;for(let r=1;r<=N;r++){if(r<N&&board[r][c]===board[start][c])continue;if(r-start>=3)for(let k=start;k<r;k++)set.add(k+","+c);start=r;}}return [...set].map(s=>s.split(",").map(Number));}
function settle(){let m=matches();if(!m.length){locked=false;update();return;}score+=m.length*10+(m.length>=4?20:0);for(const [r,c] of m)board[r][c]=null;for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(board[r][c]!==null)col.push(board[r][c]);while(col.length<N)col.push(rand());for(let r=N-1,i=0;r>=0;r--,i++)board[r][c]=col[i];}selected=null;update();setTimeout(settle,100);}
function tap(r,c){if(locked||moves<=0)return;if(!selected){selected={r,c};update();return;}const a=selected;if(a.r===r&&a.c===c){selected=null;update();return;}if(Math.abs(a.r-r)+Math.abs(a.c-c)!==1){selected={r,c};update();return;}[board[a.r][a.c],board[r][c]]=[board[r][c],board[a.r][a.c]];selected=null;const m=matches();if(!m.length){[board[a.r][a.c],board[r][c]]=[board[r][c],board[a.r][a.c]];$("state").textContent="No match. Try another swap.";update();return;}moves--;locked=true;$("state").textContent="SUGAR RUSH!";update();setTimeout(settle,100);if(moves===0)$("state").textContent="OUT OF MOVES";}
$("restart").addEventListener("click",init);window.exportSaveState=()=>locked||moves<=0?null:({board:board.map(row=>row.slice()),selected:selected?{...selected}:null,score,moves});window.importSaveState=d=>{if(!d||!Array.isArray(d.board)||d.board.length!==N||!d.board.every(row=>Array.isArray(row)&&row.length===N&&row.every(v=>Number.isInteger(v)&&v>=0&&v<COL))||!Number.isFinite(d.score)||!Number.isFinite(d.moves))return false;board=d.board.map(row=>row.slice());selected=d.selected&&Number.isInteger(d.selected.r)&&Number.isInteger(d.selected.c)&&d.selected.r>=0&&d.selected.r<N&&d.selected.c>=0&&d.selected.c<N?{r:d.selected.r,c:d.selected.c}:null;score=Math.max(0,Math.floor(d.score));moves=Math.max(0,Math.min(25,Math.floor(d.moves)));locked=false;update();$("state").textContent="Cloud save restored.";return true};window.isGameOver=()=>moves<=0;window.isGameActive=()=>moves>0;init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-candy-crush" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
