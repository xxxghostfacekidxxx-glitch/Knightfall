<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alien Battle | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.battle{aspect-ratio:420/620}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SHOOTER</div><h1 class="title">ALIEN<br><span>BATTLE</span></h1><p class="muted">Survive the swarm. Move with WASD/arrows, aim with your pointer, and click or press Space to fire. You get three hull points. The aliens do not negotiate.</p><div class="hud"><span>SCORE <b id="score">0</b></span><span>HULL <b id="hull">3</b></span><span id="state">ENGAGED</span></div><canvas id="game" class="battle" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">Restart battle</button><span class="muted">Touch/click supported · local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let player,aliens,shots,score,hull,over,spawn,last,keys={},aimX=210,aimY=100,fireCooldown=0;
function init(){player={x:210,y:540,r:15};aliens=[];shots=[];score=0;hull=3;over=false;spawn=0;last=0;fireCooldown=0;$("score").textContent=0;$("hull").textContent=3;$("state").textContent="ENGAGED";requestAnimationFrame(loop);}
function shoot(){if(over||fireCooldown>0)return;shots.push({x:player.x,y:player.y-16,vx:(aimX-player.x)*.012,vy:-430});fireCooldown=.18;}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){fireCooldown=Math.max(0,fireCooldown-dt);if(keys.ArrowLeft||keys.a||keys.A)player.x-=250*dt;if(keys.ArrowRight||keys.d||keys.D)player.x+=250*dt;if(keys.ArrowUp||keys.w||keys.W)player.y-=250*dt;if(keys.ArrowDown||keys.s||keys.S)player.y+=250*dt;player.x=Math.max(18,Math.min(402,player.x));player.y=Math.max(340,Math.min(590,player.y));if(keys.Space)shoot();spawn-=dt;if(spawn<=0){aliens.push({x:25+Math.random()*370,y:-20,r:13,v:55+Math.random()*55,phase:Math.random()*6});spawn=Math.max(.22,.75-score*.004);}for(const a of aliens){a.y+=a.v*dt;a.x+=Math.sin(t*.002+a.phase)*35*dt;}for(const b of shots){b.x+=b.vx;b.y+=b.vy;}for(const b of shots)for(const a of aliens)if(!a.dead&&Math.hypot(a.x-b.x,a.y-b.y)<a.r+5){a.dead=true;b.dead=true;score+=10;$("score").textContent=score;}for(const a of aliens)if(!a.dead&&a.y>player.y-12&&Math.abs(a.x-player.x)<a.r+player.r){a.dead=true;hull--;$("hull").textContent=hull;if(hull<=0){over=true;$("state").textContent="SHIP LOST";}}aliens=aliens.filter(a=>!a.dead&&a.y<650);shots=shots.filter(b=>!b.dead&&b.y>-20);}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,620);x.fillStyle="#080a0f";x.fillRect(0,0,420,620);for(let i=0;i<32;i++){x.fillStyle=i%3?"#ffffff18":"#ff5edb55";x.fillRect((i*73)%420,(i*109)%620,2,2);}x.strokeStyle="#a8ff4818";for(let i=0;i<8;i++){x.beginPath();x.moveTo(i*60,0);x.lineTo(i*60,620);x.stroke();}for(const a of aliens){x.fillStyle="#a8ff48";x.shadowColor="#a8ff48";x.shadowBlur=12;x.beginPath();x.ellipse(a.x,a.y,a.r*1.25,a.r,0,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle="#10160a";x.fillRect(a.x-7,a.y-3,4,4);x.fillRect(a.x+4,a.y-3,4,4);}x.fillStyle="#ff5edb";x.shadowColor="#ff5edb";x.shadowBlur=14;x.beginPath();x.moveTo(player.x,player.y-20);x.lineTo(player.x-16,player.y+14);x.lineTo(player.x,player.y+7);x.lineTo(player.x+16,player.y+14);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle="#a8ff48";for(const b of shots){x.fillRect(b.x-2,b.y-7,4,12);}if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#a8ff48";x.textAlign="center";x.font="bold 28px system-ui";x.fillText("SHIP LOST",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Score: "+score,210,330);}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*420/r.width,y:(e.clientY-r.top)*620/r.height};}
c.addEventListener("pointermove",e=>{const p=pos(e);aimX=p.x;aimY=p.y;});c.addEventListener("pointerdown",e=>{const p=pos(e);aimX=p.x;aimY=p.y;shoot();});document.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault()});document.addEventListener("keyup",e=>keys[e.key]=false);$("restart").addEventListener("click",init);init();
</script></body></html>
