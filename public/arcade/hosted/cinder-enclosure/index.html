<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140e16"><title>Cinder Enclosure | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#4c2b21,#101019 70%);color:#ffe8d0;font:16px system-ui}main{max-width:750px;margin:auto}a{color:#ffbb7b}h1{font-size:clamp(2rem,7vw,3.7rem);color:#ff9c55;margin:12px 0}p{line-height:1.45;color:#cbbab0}.stats{display:flex;gap:15px;flex-wrap:wrap;margin:12px 0;font-weight:900;color:#ffd79c}.stats img{height:23px;vertical-align:middle}.arena{max-width:540px;margin:auto}canvas{width:100%;height:auto;display:block;border:3px solid #c6814e;border-radius:12px;background:#171723;touch-action:manipulation}button{border:1px solid #db8a54;border-radius:9px;padding:12px 16px;background:#62362b;color:#ffe5c7;font:800 15px system-ui;cursor:pointer}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}#status{font-weight:800;color:#ffd59d;min-height:42px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Enclosure</h1><p>Claim the wasteland one boundary at a time. Close a square to capture its ember core and earn another move. Outsmart the Void AI.</p><div class="stats"><span><img src="./sprites/ember-core.svg" alt=""> YOU <output id="you">0</output></span><span><img src="./sprites/void-core.svg" alt=""> VOID <output id="cpu">0</output></span><span>OPEN EDGES <output id="remaining">60</output></span></div><div class="arena"><canvas id="arena" width="600" height="600" aria-label="Six by six dots and squares territory board"></canvas></div><div class="controls"><button id="restart">New battle</button><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Select a line between two adjacent dots.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const N=5,C=600,M=70,S=(C-2*M)/N,$=id=>document.getElementById(id),canvas=$("arena"),ctx=canvas.getContext("2d"),key="ashfall:cinder-enclosure:v1",edges=[];for(let r=0;r<=N;r++)for(let c=0;c<N;c++)edges.push({kind:"h",r,c});for(let r=0;r<N;r++)for(let c=0;c<=N;c++)edges.push({kind:"v",r,c});const h=(r,c)=>r*N+c,v=(r,c)=>(N+1)*N+r*(N+1)+c;let taken=[],owners=[],turn=1,busy=false,finished=false,score=[0,0,0],best=0,aiTimer=null;try{best=Number(localStorage.getItem("ashfall:cinder-enclosure:best"))||0}catch{}const imgs=[null,new Image(),new Image()];imgs[1].src="./sprites/ember-core.svg";imgs[2].src="./sprites/void-core.svg";function boxEdges(r,c){return[h(r,c),h(r+1,c),v(r,c),v(r,c+1)]}function completeBoxes(edge){const result=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!owners[r*N+c]&&boxEdges(r,c).includes(edge)&&boxEdges(r,c).every(i=>taken[i]))result.push(r*N+c);return result}function hud(){$("you").textContent=score[1];$("cpu").textContent=score[2];$("remaining").textContent=taken.filter(x=>!x).length}function reset(){if(aiTimer!==null){clearTimeout(aiTimer);aiTimer=null}taken=Array(edges.length).fill(false);owners=Array(N*N).fill(0);score=[0,0,0];turn=1;busy=false;finished=false;$("status").textContent="Ember moves first. Select an open boundary.";hud();draw()}function submit(){const points=score[1]*50+(score[1]>score[2]?400:0);if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-enclosure",points,{score:points,game:"cinder-enclosure",claimed:score[1],opponent:score[2]})).catch(()=>{})}function finish(){finished=true;busy=false;$("status").textContent=score[1]>score[2]?"Ember rules the wasteland!":score[1]<score[2]?"The Void has conquered the grid.":"The wasteland remains contested. Draw!";if(score[1]>best){best=score[1];try{localStorage.setItem("ashfall:cinder-enclosure:best",String(best))}catch{}}submit()}function take(i){if(finished||taken[i])return;taken[i]=true;const boxes=completeBoxes(i);for(const box of boxes){owners[box]=turn;score[turn]++}if(taken.every(Boolean)){hud();finish();draw();return}if(!boxes.length)turn=3-turn;hud();draw();$("status").textContent=boxes.length?(turn===1?"Ember captured "+boxes.length+" chamber! Move again.":"Void captured "+boxes.length+" chamber!"):turn===1?"Your move.":"Void is choosing a boundary.";if(turn===2){busy=true;aiTimer=setTimeout(()=>{aiTimer=null;if(finished||turn!==2)return;busy=false;take(chooseAI())},190)}}function chooseAI(){const options=edges.map((_,i)=>i).filter(i=>!taken[i]);let best=-Infinity,choices=[];for(const i of options){taken[i]=true;const made=completeBoxes(i).length;let danger=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!owners[r*N+c]&&boxEdges(r,c).includes(i)&&boxEdges(r,c).filter(e=>taken[e]).length===3)danger++;taken[i]=false;const value=made*100-danger*15+Math.random()*2;if(value>best){best=value;choices=[i]}else if(value===best)choices.push(i)}return choices[0]??options[0]}function linePoint(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*C/rect.width,y:(e.clientY-rect.top)*C/rect.height}}function nearest(p){let choice=-1,distance=22;edges.forEach((e,i)=>{if(taken[i])return;let d;if(e.kind==="h"){const y=M+e.r*S,x=M+e.c*S;d=Math.hypot(p.y-y,Math.max(x-p.x,0,p.x-(x+S)))}else{const x=M+e.c*S,y=M+e.r*S;d=Math.hypot(p.x-x,Math.max(y-p.y,0,p.y-(y+S)))}if(d<distance){distance=d;choice=i}});return choice}function draw(){ctx.clearRect(0,0,C,C);ctx.fillStyle="#171723";ctx.fillRect(0,0,C,C);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const own=owners[r*N+c];if(!own)continue;ctx.fillStyle=own===1?"#e48a4738":"#ab8dd538";ctx.fillRect(M+c*S+7,M+r*S+7,S-14,S-14);const im=imgs[own];if(im.complete&&im.naturalWidth)ctx.drawImage(im,M+c*S+S/2-22,M+r*S+S/2-22,44,44)}for(let i=0;i<edges.length;i++){const e=edges[i],x=M+e.c*S,y=M+e.r*S;ctx.beginPath();if(e.kind==="h"){ctx.moveTo(x,y);ctx.lineTo(x+S,y)}else{ctx.moveTo(x,y);ctx.lineTo(x,y+S)}ctx.strokeStyle=taken[i]?"#ffad67":"#605260";ctx.lineWidth=taken[i]?9:3;ctx.lineCap="round";ctx.stroke()}for(let r=0;r<=N;r++)for(let c=0;c<=N;c++){ctx.fillStyle="#ffe0b0";ctx.beginPath();ctx.arc(M+c*S,M+r*S,8,0,Math.PI*2);ctx.fill()}if(finished){ctx.fillStyle="#090a12aa";ctx.fillRect(0,0,C,C);ctx.fillStyle="#ffddac";ctx.font="bold 32px system-ui";ctx.textAlign="center";ctx.fillText("BATTLE COMPLETE",C/2,C/2)}}canvas.addEventListener("pointerdown",e=>{if(busy||finished||turn!==1)return;const i=nearest(linePoint(e));if(i>=0)take(i)});$("restart").onclick=reset;$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else canvas.requestFullscreen().catch(()=>{})};for(const im of imgs.slice(1))im.onload=draw;reset()})();
</script></body></html>
