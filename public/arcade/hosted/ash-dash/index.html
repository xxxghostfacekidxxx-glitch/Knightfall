<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Dash | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#48291f,#0e1019 75%);color:#ffe8d1;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc18b}h1{color:#ffa25e;font-size:clamp(2rem,8vw,3.4rem)}p{color:#d9c4b6;line-height:1.5}button{padding:12px 16px;background:#66392c;border:1px solid #d9925a;color:#ffe5ca;border-radius:9px;font-weight:800;cursor:pointer;margin:4px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:530px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(20px,5vw,33px);background:#322735}#readout{font-size:24px;font-weight:800;padding:25px 0}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cf8956}#status{font-weight:800;color:#ffdda8;min-height:35px}main{background-image:url("./sprites/runner.svg");background-repeat:no-repeat;background-size:38px;background-position:right 12px top 12px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Dash</h1><p>Jump over approaching ruins in a fast one-button survival sprint.</p><canvas id="screen" width="600" height="320"></canvas><button id="action">Jump</button><button id="restart">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),board=$("board"),readout=$("readout"),roll=$("action"),bank=$("extra");function finish(score){try{const k="ashfall:ash-dash:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-dash",score,{score,game:"ash-dash"})).catch(()=>{})}const c=$("screen"),g=c.getContext("2d");let y=0,vy=0,rocks=[],score=0,active=true,last=0,spawn=0,reported=false;function reset(){y=0;vy=0;rocks=[];score=0;spawn=0;active=true;reported=false}function jump(){if(active&&y===0)vy=460}function step(dt){if(!active)return;score+=dt*18;spawn+=dt;if(spawn>Math.max(.55,1.4-score/800)){spawn=0;rocks.push({x:620,w:20+Math.random()*22,h:25+Math.random()*30})}vy-=1100*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0;for(const r of rocks){r.x-=(200+score*.2)*dt;if(r.x<80&&r.x+r.w>55&&y<r.h){active=false;if(!reported){reported=true;finish(Math.floor(score))}}}rocks=rocks.filter(r=>r.x>-50)}function draw(){g.fillStyle="#151923";g.fillRect(0,0,600,320);g.fillStyle="#714737";g.fillRect(0,275,600,45);g.fillStyle="#ffb67d";g.fillRect(55,245-y,25,30);g.fillStyle="#ad78bb";for(const r of rocks)g.fillRect(r.x,275-r.h,r.w,r.h);g.fillStyle="#ffe2b4";g.font="bold 24px system-ui";g.fillText("Score "+Math.floor(score),20,40);status.textContent=active?"Tap Jump or press Space":"Run ended · "+Math.floor(score)}function frame(t){const dt=Math.min(.04,last?(t-last)/1000:0);last=t;step(dt);draw();requestAnimationFrame(frame)}$("action").onclick=jump;$("restart").onclick=reset;document.addEventListener("keydown",e=>{if(e.code==="Space"||e.key==="ArrowUp"){e.preventDefault();jump()}});document.addEventListener("visibilitychange",()=>{if(document.hidden)active=false});reset();requestAnimationFrame(frame);})();</script></body></html>
