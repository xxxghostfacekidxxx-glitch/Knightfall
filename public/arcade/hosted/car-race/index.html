<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Inferno Speedway | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#f2a05d;--green:#ffcc88}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#49251b 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#3c241c 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #eaa16b70;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#ffcc88,#f2a05d);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.race{aspect-ratio:420/620}</style><style>.ashfall-original-mark{display:block;width:58px;height:58px;filter:drop-shadow(0 0 13px #e99a5b77);margin:4px 0 10px}</style></head><body><img class="ashfall-original-mark" src="./sprites/speedway.svg" alt="Inferno Speedway original sigil"><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / RACING</div><h1 class="title">Inferno Speedway</h1><p class="muted">Dodge traffic, keep your car on the road, and see how long your luck lasts. Use left/right arrows or tap either side of the track.</p><div class="hud"><span>DISTANCE <b id="score">0</b></span><span id="state">RACING</span></div><canvas id="game" class="race" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">Restart race</button><span class="muted">Local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let lane,traffic,score,speed,spawn,over,last;
const lanes=[145,210,275],carY=520;
function init(){lane=1;traffic=[];score=0;speed=220;spawn=0;over=false;last=0;$("score").textContent=0;$("state").textContent="RACING";requestAnimationFrame(loop);}
function move(d){if(!over)lane=Math.max(0,Math.min(2,lane+d));}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){score+=dt*10;speed=220+score*1.6;spawn-=dt;if(spawn<=0){traffic.push({lane:Math.floor(Math.random()*3),y:-70,h:40+Math.random()*20});spawn=.55+Math.random()*.35;}for(const o of traffic)o.y+=speed*dt;for(const o of traffic)if(o.lane===lane&&o.y+o.h>carY-22&&o.y<carY+25){over=true;$("state").textContent="CRASHED";}traffic=traffic.filter(o=>o.y<670);$("score").textContent=Math.floor(score);}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,620);x.fillStyle="#111923";x.fillRect(0,0,420,620);x.fillStyle="#202a38";x.fillRect(90,0,240,620);x.strokeStyle="#ffcc8870";x.lineWidth=3;x.strokeRect(90,0,240,620);x.strokeStyle="#ffffff40";x.lineWidth=3;x.setLineDash([22,20]);x.beginPath();x.moveTo(170,0);x.lineTo(170,620);x.moveTo(250,0);x.lineTo(250,620);x.stroke();x.setLineDash([]);for(const o of traffic){x.fillStyle="#f2a05d";x.fillRect(lanes[o.lane]-18,o.y,36,o.h);x.fillStyle="#11151e";x.fillRect(lanes[o.lane]-12,o.y+8,24,9);}x.fillStyle="#ffcc88";x.shadowColor="#ffcc88";x.shadowBlur=12;x.fillRect(lanes[lane]-18,carY-25,36,50);x.shadowBlur=0;x.fillStyle="#11151e";x.fillRect(lanes[lane]-12,carY-15,24,10);if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#ffcc88";x.textAlign="center";x.font="bold 30px system-ui";x.fillText("CRASHED",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Distance: "+Math.floor(score),210,330);}}
c.addEventListener("pointerdown",e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*420/r.width;move(px<210?-1:1)});document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")move(-1);if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")move(1)});$("restart").addEventListener("click",init);window.exportSaveState=()=>over?null:({lane,traffic:traffic.map(o=>({...o})),score,speed,spawn});window.importSaveState=d=>{if(!d||!Number.isInteger(d.lane)||d.lane<0||d.lane>2||!Array.isArray(d.traffic)||d.traffic.length>40||!d.traffic.every(o=>o&&Number.isInteger(o.lane)&&o.lane>=0&&o.lane<3&&[o.y,o.h].every(Number.isFinite))||![d.score,d.speed,d.spawn].every(Number.isFinite))return false;lane=d.lane;traffic=d.traffic.map(o=>({...o}));score=Math.max(0,d.score);speed=Math.max(220,Math.min(5000,d.speed));spawn=Math.max(0,Math.min(3,d.spawn));over=false;last=performance.now();$("score").textContent=String(Math.floor(score));$("state").textContent="Cloud save restored.";draw();return true};window.isGameOver=()=>over;window.isGameActive=()=>!over;init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-car-race" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
