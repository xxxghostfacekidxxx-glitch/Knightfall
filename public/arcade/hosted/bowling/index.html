<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bowling After Dark | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.lane{aspect-ratio:420/650}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SPORTS</div><h1 class="title">BOWLING<br><span>AFTER DARK</span></h1><p class="muted">Pull back from the ball to aim and set power. Release to roll. Two throws, ten pins, no excuses.</p><div class="hud"><span>PINS <b id="score">0</b>/10</span><span>THROW <b id="throw">1</b>/2</span><span id="state">AIM</span></div><canvas id="game" class="lane" width="420" height="650"></canvas><div class="controls"><button class="btn" id="restart">New frame</button><span class="muted">Drag and release to roll · local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d");let pins,ball,drag=false,aim=null,throwNo=1,score=0,rolling=false,finished=false;const $=id=>document.getElementById(id);
function resetPins(){pins=[];for(let row=0;row<4;row++)for(let col=0;col<=row;col++)pins.push({x:210+(col-row/2)*30,y:115+row*28,down:false});}
function init(){resetPins();ball={x:210,y:565,vx:0,vy:0};drag=false;aim=null;throwNo=1;score=0;rolling=false;finished=false;updateHud();$("state").textContent="AIM";draw();}
function updateHud(){$("score").textContent=score;$("throw").textContent=throwNo;}
function loop(){if(rolling){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.992;ball.vy*=.992;for(const p of pins){if(p.down)continue;const dx=p.x-ball.x,dy=p.y-ball.y;if(Math.hypot(dx,dy)<22){p.down=true;score++;ball.vx+=dx*.012;ball.vy+=dy*.01;}}if(ball.y<70||ball.x<20||ball.x>400||Math.abs(ball.vx)+Math.abs(ball.vy)<1.2){rolling=false;if(throwNo===1){throwNo=2;ball={x:210,y:565,vx:0,vy:0};$("state").textContent="SECOND THROW";}else{finished=true;$("state").textContent=score===10?"STRIKE-ish!":"FRAME COMPLETE";}updateHud();}}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,650);const g=x.createLinearGradient(0,0,420,650);g.addColorStop(0,"#1a2230");g.addColorStop(1,"#090b12");x.fillStyle=g;x.fillRect(0,0,420,650);x.fillStyle="#a8ff4814";x.fillRect(72,45,276,575);x.strokeStyle="#ff5edb70";x.lineWidth=2;x.strokeRect(72,45,276,575);for(let i=0;i<6;i++){x.strokeStyle="#ffffff10";x.beginPath();x.moveTo(80+i*50,45);x.lineTo(80+i*50,620);x.stroke();}x.fillStyle="#ff5edb";x.font="bold 13px system-ui";x.textAlign="center";x.fillText("PIN DECK",210,35);for(const p of pins){x.save();x.translate(p.x,p.y);x.rotate(p.down?1.2:0);x.fillStyle=p.down?"#3a4350":"#f4f7fb";x.beginPath();x.ellipse(0,0,8,15,0,0,Math.PI*2);x.fill();x.fillStyle=p.down?"#3a4350":"#ff5edb";x.fillRect(-6,-6,12,3);x.restore();}x.fillStyle="#a8ff48";x.shadowColor="#a8ff48";x.shadowBlur=12;x.beginPath();x.arc(ball.x,ball.y,14,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle="#13200c";x.beginPath();x.arc(ball.x-4,ball.y-3,2,0,Math.PI*2);x.arc(ball.x+4,ball.y-3,2,0,Math.PI*2);x.fill();if(drag&&aim){x.strokeStyle="#ff5edb";x.lineWidth=3;x.setLineDash([6,5]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(aim.x,aim.y);x.stroke();x.setLineDash([]);}if(finished){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,650);x.fillStyle="#a8ff48";x.font="bold 29px system-ui";x.fillText("FRAME COMPLETE",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Pins down: "+score+"/10",210,332);}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*420/r.width,y:(e.clientY-r.top)*650/r.height};}
c.addEventListener("pointerdown",e=>{if(rolling||finished)return;drag=true;aim=pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(drag)aim=pos(e)});c.addEventListener("pointerup",e=>{if(!drag||finished)return;drag=false;const p=pos(e);ball.vx=Math.max(-5,Math.min(5,(p.x-ball.x)*.055));ball.vy=Math.max(-13,Math.min(-5,(p.y-ball.y)*.055));rolling=true;aim=null;$("state").textContent="ROLLING";});$("restart").addEventListener("click",init);init();requestAnimationFrame(loop);
</script></body></html>
