<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Cannon | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49281d,#0f111b 75%);color:#ffe8d0;font:16px system-ui}main{max-width:700px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa363}p{color:#ddc6b8;line-height:1.5}button{padding:12px 16px;margin:5px;background:#663a2d;border:1px solid #dc935d;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:530px;margin:20px 0}.tube{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:#302636;border:3px solid #a86d4f;border-top:0;border-radius:0 0 20px 20px}.tube.chosen{outline:3px solid #ffe4a3}.ember{width:42px;height:32px;border-radius:8px;background:#28212f}.tile{aspect-ratio:1;min-width:0;font-size:clamp(15px,4vw,28px);background:#342738}.tile.static{display:grid;place-items:center;color:#ffe5c6;border:1px solid #ad7250;border-radius:8px}canvas{display:block;width:100%;max-width:600px;height:auto;border:3px solid #cc8553;border-radius:12px;touch-action:none}label{display:inline-block;margin:8px}input[type=range]{display:block;accent-color:#ff9b5e}#status{font-weight:800;color:#ffdda7;min-height:40px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Cannon</h1><p>Set your cannon angle and power to hit distant fortress targets through gravity.</p><img src="./sprites/cannonball.svg" alt="" width="42" height="42"><canvas id="screen" width="600" height="320"></canvas><label>Angle <input id="angle" type="range" min="15" max="80" value="45"></label><label>Power <input id="power" type="range" min="35" max="100" value="70"></label><button id="action">Fire</button><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:ash-cannon:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-cannon",score,{score,game:"ash-cannon"})).catch(()=>{})}const c=$("screen"),g=c.getContext("2d");let angle=45,power=70,target=440,shots=0,hits=0,ball=null,active=true,last=0;function reset(){angle=45;power=70;target=360+Math.random()*160;shots=0;hits=0;ball=null;active=true;draw()}function fire(){if(!active||ball)return;const a=angle*Math.PI/180;ball={x:35,y:290,vx:Math.cos(a)*power*4.8,vy:-Math.sin(a)*power*4.8};shots++}function step(dt){if(!ball)return;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=320*dt;if(ball.x>target-17&&ball.x<target+17&&ball.y>251&&ball.y<295){hits++;ball=null;target=330+Math.random()*210;if(hits===5){active=false;finish(Math.max(100,1800-shots*40))}}else if(ball.y>310||ball.x>610)ball=null}function draw(){g.fillStyle="#191822";g.fillRect(0,0,600,320);g.fillStyle="#684335";g.fillRect(0,300,600,20);g.fillStyle="#c78c5c";g.fillRect(target-17,258,34,42);g.fillStyle="#ffc182";g.fillRect(target-9,265,18,25);g.save();g.translate(35,290);g.rotate(-angle*Math.PI/180);g.fillStyle="#e0a16b";g.fillRect(0,-8,42,16);g.restore();if(ball){g.fillStyle="#ffc67d";g.beginPath();g.arc(ball.x,ball.y,8,0,7);g.fill()}g.fillStyle="#ffe7ce";g.font="bold 19px system-ui";g.fillText("Hits "+hits+"/5 · Shots "+shots,15,30);status.textContent=active?"Angle "+angle+"° · Power "+power+" · Adjust and fire":"Fortress cleared in "+shots+" shots!"}function frame(t){if(last)step(Math.min(.04,(t-last)/1000));last=t;draw();requestAnimationFrame(frame)}$("action").onclick=fire;$("angle").oninput=e=>{angle=Number(e.target.value);draw()};$("power").oninput=e=>{power=Number(e.target.value);draw()};$("reset").onclick=()=>{reset();$("angle").value=45;$("power").value=70};reset();requestAnimationFrame(frame);})();</script></body></html>
