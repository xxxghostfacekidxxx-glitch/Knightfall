<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Smash | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#48281f,#0d0e17 75%);color:#ffe9d3;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffbb7d}h1{font-size:clamp(2rem,7vw,3.5rem);color:#ffa15e}p{line-height:1.5;color:#d7c3b7}canvas{display:block;width:min(100%,480px);height:auto;border:3px solid #ca804d;border-radius:12px;touch-action:none}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:520px;margin:12px 0}.cell{aspect-ratio:1;display:grid;place-items:center;background:#40332f;font-size:25px;border-radius:5px}.cell.wall{background:#1a1b29}.cell.goal{box-shadow:inset 0 0 0 3px #e7a861}.cell img,.hole img{width:75%;height:75%}.holes{grid-template-columns:repeat(3,1fr);max-width:450px}.hole{aspect-ratio:1;background:#332634;border:3px solid #af7051;border-radius:50%;cursor:pointer}.pad{display:flex;gap:8px;flex-wrap:wrap}button:not(.hole){padding:12px 16px;margin:8px 5px 8px 0;background:#623729;border:1px solid #e0975b;color:#ffe6c9;border-radius:9px;font-weight:800;cursor:pointer}#status{color:#ffdbab;font-weight:800;min-height:32px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Smash</h1><div id="board" class="board holes" aria-label="Nine crypt portals"></div><p>Tap the void wisps, not the friendly ember sparks. You have 45 seconds.</p><button id="start">Start round</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status");function finish(points){try{const k="ashfall:crypt-smash:best";localStorage.setItem(k,String(Math.max(points,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-smash",points,{score:points,game:"crypt-smash"})).catch(()=>{})}let score=0,time=45,active=false,target=-1,friend=false,timer=null,spawnTimer=null;const board=$("board");function render(){board.innerHTML="";for(let i=0;i<9;i++){const b=document.createElement("button");b.className="hole";if(i===target)b.innerHTML='<img src="./sprites/'+(friend?"ember-hammer.svg":"void-wisp.svg")+'" alt="'+(friend?"Friendly ember":"Void wisp")+'">';b.onclick=()=>{if(!active||i!==target)return;score+=friend?-25:50;target=-1;render()};board.append(b)}status.textContent=(active?"Time "+time+"s · Score "+score:time===0?"Round complete · Final score "+score:"Ready · Score "+score)}function spawn(){target=Math.floor(Math.random()*9);friend=Math.random()<.2;render()}function stop(){clearInterval(timer);clearInterval(spawnTimer);active=false;target=-1;finish(Math.max(0,score));render()}function reset(){clearInterval(timer);clearInterval(spawnTimer);score=0;time=45;active=true;spawn();timer=setInterval(()=>{if(!active)return;time--;if(time<=0)stop();else render()},1000);spawnTimer=setInterval(()=>{if(active)spawn()},720)}$("start").onclick=reset;document.addEventListener("visibilitychange",()=>{if(document.hidden&&active)stop()});render();})();
</script></body></html>
