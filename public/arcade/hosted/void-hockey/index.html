<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Hockey | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#48281f,#0d0f18 75%);color:#ffe9d3;font:16px system-ui}main{max-width:800px;margin:auto}a{color:#ffbb7d}h1{font-size:clamp(2rem,7vw,3.6rem);color:#ffa15e}canvas{display:block;width:100%;height:auto;border:3px solid #ca804d;border-radius:12px;touch-action:none}p{line-height:1.5;color:#d7c3b7}button{padding:12px 18px;margin:12px 8px 0 0;background:#643729;border:1px solid #e0975b;color:#ffe6c9;border-radius:9px;font-weight:800;cursor:pointer}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Void Hockey</h1><canvas id="game" width="720" height="480"></canvas><p>Move your paddle with touch, mouse, or arrow keys. First to seven goals wins.</p><button id="restart">New match</button><button id="pause">Pause</button><p id="stats"></p><script>
(()=>{const c=document.getElementById("game"),g=c.getContext("2d"),s=document.getElementById("stats"),keys=new Set(),imgs=["ember-paddle","void-paddle"].map(n=>{let i=new Image();i.src="./sprites/"+n+".svg";return i});let p,ai,b,score,active,paused,last=0,reported=false;const clamp=(v,a,z)=>Math.max(a,Math.min(z,v));function resetPuck(dir=1){b={x:360,y:240,vx:dir*220,vy:(Math.random()-.5)*190}}function reset(){p={x:110,y:240};ai={x:610,y:240};score=[0,0];active=true;paused=false;reported=false;resetPuck();}function end(){active=false;if(reported)return;reported=true;const points=score[0]*100+(score[0]>score[1]?500:0);try{localStorage.setItem("ashfall:void-hockey:best",String(Math.max(points,Number(localStorage.getItem("ashfall:void-hockey:best"))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("void-hockey",points,{score:points,game:"void-hockey"})).catch(()=>{})}function collide(who,sign){let dx=b.x-who.x,dy=b.y-who.y,d=Math.hypot(dx,dy)||1;if(d<43){const nx=dx/d,ny=dy/d;b.x=who.x+nx*43;b.y=who.y+ny*43;const speed=Math.min(650,Math.max(290,Math.hypot(b.vx,b.vy)*1.045));b.vx=nx*speed;b.vy=ny*speed;if(b.vx*sign<50)b.vx=sign*speed*.7}}function step(dt){if(!active||paused)return;let dx=(keys.has("ArrowRight")?1:0)-(keys.has("ArrowLeft")?1:0),dy=(keys.has("ArrowDown")?1:0)-(keys.has("ArrowUp")?1:0);p.x=clamp(p.x+dx*360*dt,30,330);p.y=clamp(p.y+dy*360*dt,30,450);ai.y=clamp(ai.y+clamp(b.y-ai.y,-250*dt,250*dt),30,450);ai.x=clamp(ai.x+clamp((b.x>360?Math.min(620,b.x+45):610)-ai.x,-200*dt,200*dt),390,690);b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<14||b.y>466){b.y=clamp(b.y,14,466);b.vy=-b.vy}collide(p,1);collide(ai,-1);if(b.x<14||b.x>706){if(b.y>170&&b.y<310){const left=b.x<14;score[left?1:0]++;if(score.some(x=>x>=7))end();else resetPuck(left?1:-1)}else{b.x=clamp(b.x,14,706);b.vx=-b.vx}}}function draw(){g.fillStyle="#101b27";g.fillRect(0,0,720,480);g.strokeStyle="#dc965f";g.lineWidth=4;g.strokeRect(12,12,696,456);g.beginPath();g.moveTo(360,12);g.lineTo(360,468);g.moveTo(430,240);g.arc(360,240,70,0,Math.PI*2);g.stroke();g.fillStyle="#ee915a";g.fillRect(0,170,12,140);g.fillStyle="#aa8bd9";g.fillRect(708,170,12,140);for(const [who,i] of [[p,0],[ai,1]]){const im=imgs[i];if(im.complete&&im.naturalWidth)g.drawImage(im,who.x-30,who.y-30,60,60);else{g.fillStyle=i?"#ad8ce0":"#ef935a";g.beginPath();g.arc(who.x,who.y,30,0,7);g.fill()}}g.fillStyle="#fff0d8";g.beginPath();g.arc(b.x,b.y,14,0,7);g.fill();g.font="bold 42px system-ui";g.textAlign="center";g.fillText(score[0]+" : "+score[1],360,55);if(!active||paused){g.fillStyle="#080a13b9";g.fillRect(0,0,720,480);g.fillStyle="#ffdaa8";g.fillText(paused?"PAUSED":"MATCH OVER",360,240)}s.textContent="Cinder "+score[0]+" · Void "+score[1]}function frame(t){let dt=Math.min(.03,last?(t-last)/1000:0);last=t;step(dt);draw();requestAnimationFrame(frame)}function pointer(e){let r=c.getBoundingClientRect();p.x=clamp((e.clientX-r.left)*720/r.width,30,330);p.y=clamp((e.clientY-r.top)*480/r.height,30,450)}c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);pointer(e)});c.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")pointer(e)});document.addEventListener("keydown",e=>{if(e.key.startsWith("Arrow")){e.preventDefault();keys.add(e.key)}});document.addEventListener("keyup",e=>keys.delete(e.key));document.getElementById("restart").onclick=reset;document.getElementById("pause").onclick=()=>{if(active)paused=!paused};document.addEventListener("visibilitychange",()=>{if(document.hidden)paused=true});reset();requestAnimationFrame(frame)})();
</script><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script></body></html>
