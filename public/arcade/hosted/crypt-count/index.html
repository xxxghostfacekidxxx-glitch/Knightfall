<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Count | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#49291f,#0e1019 75%);color:#ffe7d1;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffc18b}h1{color:#ffa15c;font-size:clamp(2rem,8vw,3.6rem)}p{color:#dbc5b8;line-height:1.5}.board{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:7px;max-width:510px;margin:20px 0}.cell{aspect-ratio:1;display:grid;place-items:center;min-width:0;background:#322936;border:2px solid #99644b;border-radius:10px;color:#ffd5a2;cursor:pointer}.cell img{width:68%;height:68%}.cell.flash{background:#e49a58;color:#221a24}.conduit{font-size:clamp(22px,6vw,43px);font-weight:900}button:not(.cell){padding:12px 18px;background:#65392c;color:#ffe8d2;border:1px solid #da905b;border-radius:9px;font-weight:800;cursor:pointer;margin:7px 8px 7px 0}#status{font-weight:800;color:#ffdda9;min-height:35px}.guess{padding:12px;font-size:22px;width:140px;background:#27212d;color:#ffe6cb;border:2px solid #d58b53;border-radius:8px}.history p{padding:8px;border-bottom:1px solid #5c453f}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Count</h1><p>Crack a four-digit code with no repeated digits. Each guess reveals exact and misplaced digits.</p><div id="board" class="board"></div><button id="start">New code</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status");function finish(score){try{const k="ashfall:crypt-count:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-count",score,{score,game:"crypt-count"})).catch(()=>{})}let secret="",tries=0,done=false;const input=document.createElement("input");input.inputMode="numeric";input.maxLength=4;input.pattern="[0-9]{4}";input.placeholder="4 digits";input.setAttribute("aria-label","Four digit guess");input.className="guess";const submit=document.createElement("button");submit.textContent="Submit guess";const history=document.createElement("div");history.className="history";board.replaceWith(input,submit,history);function reset(){const digits="0123456789".split("");for(let i=digits.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[digits[i],digits[j]]=[digits[j],digits[i]]}secret=digits.slice(0,4).join("");tries=0;done=false;input.value="";history.innerHTML="";status.textContent="Four distinct digits. Guess the secret code."}function guess(){if(done)return;const s=input.value.trim();if(!/^\d{4}$/.test(s)||new Set(s).size!==4){status.textContent="Enter four different digits.";return}tries++;let exact=0,shared=0;for(let i=0;i<4;i++){if(s[i]===secret[i])exact++;else if(secret.includes(s[i]))shared++}const p=document.createElement("p");p.textContent=s+" · "+exact+" exact · "+shared+" misplaced";history.prepend(p);input.value="";if(exact===4){done=true;finish(Math.max(100,1100-tries*70));status.textContent="Code cracked in "+tries+" guesses!"}else status.textContent="Guess "+tries+" · "+exact+" exact · "+shared+" misplaced"}submit.onclick=guess;input.onkeydown=e=>{if(e.key==="Enter")guess()};document.getElementById("start").onclick=reset;reset();})();</script></body></html>
