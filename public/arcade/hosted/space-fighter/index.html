<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinder Squadron | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff38ce;--green:#b8ff45}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #f2b47750;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#f2b477,#d88958);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.space{aspect-ratio:420/620}</style><style>

</style><style>:root{--pink:#ff55d8;--green:#b7ff3c;--lime:#b7ff3c}.ash-original-mark{display:block;margin:12px auto;width:52px;height:52px;filter:drop-shadow(0 0 10px #ff55d877)}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script><link rel="stylesheet" href="/arcade/nextgen.css?v=20261102-1"><script src="/arcade/nextgen.js?v=20261102-1" defer></script></head><body><img src="./sprites/squadron-mark.svg" alt="Cinder Squadron Ash-Fall emblem" width="52" height="52" class="ash-original-mark"><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SHOOTER</div><h1 class="title">CINDER<br><span>SQUADRON</span></h1><p class="muted">Hold your ground on the left side of a very rude galaxy. Move vertically, fire right, and stop the incoming fleet from touching your ship.</p><div class="hud"><span>ELIMS <b id="score">0</b></span><span>HULL <b id="hull">3</b></span><span id="state">FIGHT</span></div><canvas id="game" class="space" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">Restart mission</button><span class="muted">W/S or ↑/↓ · Space to fire · touch to steer</span></div></section></main><script src="/arcade/canvas-fx.js?v=20261102-2"></script><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);const fx=globalThis.AshFallCanvasFX?.create();let ship,enemies,shots,score,hull,over,last,spawn,fire,keys={},touchY=null,runToken=0,best=0;try{best=Number(localStorage.getItem("ashfall-space-fighter-best"))||0}catch{}
function init(){fx?.reset();runToken++;const token=runToken;ship={x:55,y:310};enemies=[];shots=[];score=0;hull=3;over=false;last=0;spawn=0;fire=0;keys={};$("score").textContent=0;$("hull").textContent=3;$("state").textContent="FIGHT";document.dispatchEvent(new CustomEvent("ashfall:arcade-started",{detail:{gameId:"cabinet-space-fighter"}}));requestAnimationFrame(t=>loop(t,token));}
function loop(t,token){if(token!==runToken)return;const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){if(keys.ArrowUp||keys.w||keys.W)ship.y-=250*dt;if(keys.ArrowDown||keys.s||keys.S)ship.y+=250*dt;if(touchY!==null)ship.y+=(touchY-ship.y)*Math.min(1,dt*6);ship.y=Math.max(28,Math.min(592,ship.y));if(Math.random()<.85)fx?.trail(ship.x-22,ship.y,-130,0,"#4cf4ff",1.2);fire-=dt;spawn-=dt;if((keys[" "]||fire<=0)&&fire<=0){shots.push({x:ship.x+20,y:ship.y,v:440});fire=.22;}if(spawn<=0){enemies.push({x:445,y:30+Math.random()*560,r:12+Math.random()*5,v:60+Math.random()*90});spawn=Math.max(.25,.8-score*.002);}for(const b of shots)b.x+=b.v*dt;for(const e of enemies)e.x-=e.v*dt;for(const b of shots)for(const e of enemies)if(!b.dead&&!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){b.dead=e.dead=true;fx?.impact(e.x,e.y,"#ff38ce",1.25);score++;$("score").textContent=score;if(score>best){best=score;try{localStorage.setItem("ashfall-space-fighter-best",String(best))}catch{}}}for(const e of enemies)if(!over&&!e.dead&&e.x<ship.x+15&&Math.abs(e.y-ship.y)<e.r+13){e.dead=true;fx?.impact(ship.x,ship.y,"#b8ff45",2.2);hull--;$("hull").textContent=hull;if(hull<=0){over=true;$("state").textContent="MISSION FAILED";document.dispatchEvent(new CustomEvent("ashfall:arcade-finished",{detail:{gameId:"cabinet-space-fighter",score}}));}}enemies=enemies.filter(e=>!e.dead&&e.x>-30);shots=shots.filter(b=>!b.dead&&b.x<450);}fx?.step(dt);draw();if(!over||(fx?.particles.length||0)>0||(fx?.rings.length||0)>0)requestAnimationFrame(t=>loop(t,token));}
function draw(){if(fx)fx.sky(x,last,420,620,"space");else{x.clearRect(0,0,420,620);x.fillStyle="#080a0f";x.fillRect(0,0,420,620);for(let i=0;i<40;i++){x.fillStyle=i%4?"#ffffff18":"#b96c4b55";x.fillRect((i*79)%420,(i*113)%620,2,2);}}x.strokeStyle="#4cf4ff1b";for(let i=0;i<7;i++){x.beginPath();x.moveTo(0,i*100);x.lineTo(420,i*100);x.stroke();}for(const e of enemies){x.fillStyle="#ff38ce";x.shadowColor="#ff38ce";x.shadowBlur=18;x.beginPath();x.moveTo(e.x+e.r,e.y);x.lineTo(e.x-e.r,e.y-e.r);x.lineTo(e.x-e.r*.6,e.y);x.lineTo(e.x-e.r,e.y+e.r);x.closePath();x.fill();x.shadowBlur=0;}x.fillStyle="#4cf4ff";x.shadowColor="#4cf4ff";x.shadowBlur=22;x.beginPath();x.moveTo(ship.x+20,ship.y);x.lineTo(ship.x-14,ship.y-16);x.lineTo(ship.x-8,ship.y);x.lineTo(ship.x-14,ship.y+16);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle="#b8ff45";x.shadowColor="#b8ff45";x.shadowBlur=15;for(const b of shots)x.fillRect(b.x,b.y-2,15,4);x.shadowBlur=0;fx?.draw(x);if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#b8ff45";x.textAlign="center";x.font="bold 27px system-ui";x.fillText("MISSION FAILED",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Eliminations: "+score+" · Best: "+best,210,330);}}
function pos(e){const r=c.getBoundingClientRect();return{y:(e.clientY-r.top)*620/r.height};}
c.addEventListener("pointermove",e=>{touchY=pos(e).y;});c.addEventListener("pointerleave",()=>touchY=null);document.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault()});document.addEventListener("keyup",e=>keys[e.key]=false);document.addEventListener("visibilitychange",()=>{last=0;keys={};touchY=null});$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-space-fighter" data-score-mode="score" data-score-selector="#score"></script>
