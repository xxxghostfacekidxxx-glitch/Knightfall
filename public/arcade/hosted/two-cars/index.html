<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Twin Inferno | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#f2a05d;--green:#ffcc88}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#49251b 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#3c241c 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #eaa16b70;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#ffcc88,#f2a05d);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.track{aspect-ratio:420/620}</style><style>.ashfall-original-mark{display:block;width:58px;height:58px;filter:drop-shadow(0 0 13px #e99a5b77);margin:4px 0 10px}</style></head><body><img class="ashfall-original-mark" src="./sprites/twin-car.svg" alt="Twin Inferno original sigil"><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / MULTITASKING</div><h1 class="title">Twin Inferno</h1><p class="muted">Control both cars at once. Tap the left half to steer the pink car, right half for the green car. Collect rings. Avoid blocks. Panic efficiently.</p><div class="hud"><span>RINGS <b id="score">0</b></span><span id="state">DRIVE</span></div><canvas id="game" class="track" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">Restart race</button><span class="muted">A/D and ←/→ also steer</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let laneL=1,laneR=1,items,score,speed,spawn,over,last;
const xs=[55,125,195],xr=[225,295,365],carY=520;
function init(){laneL=laneR=1;items=[];score=0;speed=220;spawn=0;over=false;last=0;$("score").textContent=0;$("state").textContent="DRIVE";requestAnimationFrame(loop);}
function steer(side,dir){if(over)return;if(side==="L")laneL=Math.max(0,Math.min(2,laneL+dir));else laneR=Math.max(0,Math.min(2,laneR+dir));}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){speed=220+score*1.2;spawn-=dt;if(spawn<=0){const side=Math.random()<.5?"L":"R",lane=Math.floor(Math.random()*3),coin=Math.random()<.42;items.push({side,lane,y:-30,coin});spawn=.48+Math.random()*.3;}for(const o of items)o.y+=speed*dt;for(const o of items){if(o.y>carY-25&&o.y<carY+30){const lane=o.side==="L"?laneL:laneR;if(lane===o.lane){if(o.coin){score++;o.hit=true;}else{over=true;$("state").textContent="CRASHED";}}}}items=items.filter(o=>o.y<650&&!o.hit);$("score").textContent=score;}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,620);x.fillStyle="#0b1018";x.fillRect(0,0,420,620);x.fillStyle="#151d2a";x.fillRect(20,0,180,620);x.fillRect(220,0,180,620);x.strokeStyle="#ffffff18";x.setLineDash([14,14]);for(let xx of [80,140,280,340]){x.beginPath();x.moveTo(xx,0);x.lineTo(xx,620);x.stroke();}x.setLineDash([]);x.strokeStyle="#f2a05d60";x.beginPath();x.moveTo(210,0);x.lineTo(210,620);x.stroke();for(const o of items){const xx=(o.side==="L"?xs:xr)[o.lane];if(o.coin){x.strokeStyle="#ffcc88";x.lineWidth=5;x.beginPath();x.arc(xx,o.y,11,0,Math.PI*2);x.stroke();}else{x.fillStyle="#f2a05d";x.fillRect(xx-13,o.y-15,26,30);}}car(xs[laneL],carY,"#f2a05d");car(xr[laneR],carY,"#ffcc88");if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#ffcc88";x.textAlign="center";x.font="bold 28px system-ui";x.fillText("DUAL CRASH",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Rings: "+score,210,330);}}
function car(xx,yy,color){x.fillStyle=color;x.shadowColor=color;x.shadowBlur=12;x.beginPath();x.roundRect(xx-14,yy-24,28,48,7);x.fill();x.shadowBlur=0;x.fillStyle="#080a0f";x.fillRect(xx-9,yy-15,18,10);x.fillRect(xx-9,yy+8,18,8);}
c.addEventListener("pointerdown",e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*420/r.width;steer(px<210?"L":"R",px<210?(px<105?-1:1):(px<315?-1:1));});document.addEventListener("keydown",e=>{if(e.key==="a"||e.key==="A")steer("L",-1);if(e.key==="d"||e.key==="D")steer("L",1);if(e.key==="ArrowLeft")steer("R",-1);if(e.key==="ArrowRight")steer("R",1);});$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-two-cars" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
