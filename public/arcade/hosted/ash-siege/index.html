<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Siege | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4b2a20,#0f111a 76%);color:#ffe7cf;font:16px system-ui}main{max-width:680px;margin:auto}a{color:#ffc08b}h1{font-size:clamp(2rem,8vw,3.4rem);color:#ffa15e}p{line-height:1.5;color:#ddc6b7}button{padding:12px 16px;margin:5px;background:#64382e;border:1px solid #da8d56;border-radius:9px;color:#ffe7cc;font-weight:800;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:540px;margin:20px 0}.tile{aspect-ratio:1;min-width:0;font-size:clamp(18px,5vw,30px);background:#35283a}.tile.chosen{outline:4px solid #ffce84}.maze-cell{aspect-ratio:1;display:grid;place-items:center;background:#292430;font-size:clamp(12px,3vw,22px);color:#ffd58c}canvas{display:block;width:100%;max-width:540px;height:auto;border:3px solid #d18b56;border-radius:10px;touch-action:none}#status{font-weight:800;color:#ffdda9;min-height:42px}</style></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ash Siege</h1><p>Defend the ash citadel by intercepting descending invaders before they cross the wall.</p><img src="./sprites/turret.svg" width="42" height="42" alt=""><canvas id="screen" width="540" height="420"></canvas><div><button id="left">← Move</button><button id="fire">Fire</button><button id="right">Move →</button></div><button id="reset">New game</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),board=$("board"),status=$("status");function finish(score){try{const k="ashfall:ash-siege:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ash-siege",score,{score,game:"ash-siege"})).catch(()=>{})}const c=$("screen"),g=c.getContext("2d");let ship=270,bullets=[],enemies=[],score=0,health=3,spawn=0,last=0,active=true,fireCooldown=0,reported=false;function reset(){ship=270;bullets=[];enemies=[];score=0;health=3;spawn=0;active=true;fireCooldown=0;reported=false}function fire(){if(!active||fireCooldown>0)return;bullets.push({x:ship,y:363});fireCooldown=.22}function move(dx){ship=Math.max(20,Math.min(520,ship+dx*32))}function end(){if(!active)return;active=false;if(!reported){reported=true;finish(score)}}function step(dt){if(!active)return;spawn+=dt;fireCooldown=Math.max(0,fireCooldown-dt);if(spawn>Math.max(.32,1.2-score/2000)){spawn=0;enemies.push({x:20+Math.random()*500,y:-20,s:55+score*.06})}for(const b of bullets)b.y-=420*dt;for(const e of enemies){e.y+=e.s*dt;if(e.y>370&&!e.lost){e.lost=true;health--;if(health<=0)end()}for(const b of bullets)if(!b.hit&&!e.hit&&Math.hypot(b.x-e.x,b.y-e.y)<22){b.hit=true;e.hit=true;score+=25}}bullets=bullets.filter(b=>b.y>-15&&!b.hit);enemies=enemies.filter(e=>e.y<450&&!e.hit&&!e.lost)}function draw(){g.fillStyle="#141722";g.fillRect(0,0,540,420);g.fillStyle="#7c4834";g.fillRect(0,388,540,32);g.fillStyle="#ffb474";g.fillRect(ship-18,367,36,21);for(const b of bullets){g.fillStyle="#ffe1a5";g.fillRect(b.x-3,b.y-9,6,15)}for(const e of enemies){g.fillStyle="#a787d5";g.beginPath();g.arc(e.x,e.y,15,0,7);g.fill()}g.fillStyle="#ffe3c5";g.font="bold 20px system-ui";g.fillText("Score "+score+"  ♥ "+health,14,28);status.textContent=active?"Defend the wall!":"Citadel breached · "+score+" points"}function frame(t){if(last)step(Math.min(.04,(t-last)/1000));last=t;draw();requestAnimationFrame(frame)}$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("fire").onclick=fire;c.onpointerdown=e=>{const r=c.getBoundingClientRect();ship=Math.max(20,Math.min(520,(e.clientX-r.left)*540/r.width));fire()};document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}if(e.key==="ArrowRight"){e.preventDefault();move(1)}if(e.code==="Space"){e.preventDefault();fire()}});document.addEventListener("visibilitychange",()=>{last=0});$("reset").onclick=reset;reset();requestAnimationFrame(frame);})();</script></body></html>
