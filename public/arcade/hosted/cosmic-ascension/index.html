<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Ascension</title><style> *{box-sizing:border-box}body{margin:0;background:#080914;color:#eef;font:16px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none}header{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 5px #000}h1{font-size:18px;margin:0;color:#bcb1ff}button,a{pointer-events:auto;color:white;background:#23213d;border:1px solid #7875ad;border-radius:8px;padding:8px;text-decoration:none}@media(max-width:600px){footer{flex-wrap:wrap}#hint{flex-basis:100%}header{font-size:12px}}footer{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center}#hint{flex:1;font-size:12px;color:#c0bbdf}progress{width:180px;accent-color:#aa8bff}</style><canvas id="space" aria-label="Cosmic evolution playfield"></canvas><header><h1>COSMIC ASCENSION</h1><div id="status" role="status"></div><progress id="growth" max="1" value="0"></progress></header><footer><a href="/chaos-cartridge.html">Arcade</a><button id="pause">Pause</button><button id="restart">Restart</button><button id="orbit" hidden>Orbits: stable</button><button id="evolve" hidden>Collapse star</button><span id="hint">Drag toward matter or use WASD / arrows. Capture orbiting bodies as you grow.</span></footer><script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),growth=document.querySelector('#growth');
const stages=[['Asteroid',1,'#9e9291'],['Planetoid',18,'#c49a7d'],['Planet',80,'#57a8e0'],['Gas giant',320,'#e0b47b'],['Star',1300,'#ffcd63'],['Black hole',6500,'#b17cff'],['Galactic nucleus',30000,'#ec9cff']];
const radius=m=>5*Math.cbrt(m),tier=m=>stages.reduce((n,s,i)=>m>=s[1]?i:n,0),rand=(a,b)=>a+Math.random()*(b-a),cap=(v,a,b)=>Math.max(a,Math.min(b,v));
let player,bodies,moons,zoom,w,h,paused=false,last=0,acc=0,keys=new Set(),pointer=null,stars=Array.from({length:300},()=>[Math.random(),Math.random(),rand(.2,1.5)]),elapsed=0,notice='',noticeT=0,peak=0,remnant='',age=0,saveClock=0,burst=0,orbitMode=0;
function reset(){player={x:0,y:0,vx:0,vy:0,m:1};bodies=[];moons=[];zoom=1.5;elapsed=0;notice='Collect smaller bodies. Avoid larger ones.';noticeT=5;peak=0;remnant='';age=0;saveClock=0;burst=0;orbitMode=0;acc=0;paused=false;pointer=null;keys.clear();document.querySelector('#pause').textContent='Pause';for(let i=0;i<100;i++)spawn(true)}
const SAVE='kf-cosmic-ascension-v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({player,moons,elapsed,age,peak,remnant,zoom,orbitMode}));}catch{}}
function restore(){try{const s=JSON.parse(localStorage.getItem(SAVE));if(!s||!s.player||!['x','y','vx','vy','m'].every(k=>Number.isFinite(s.player[k]))||s.player.m<1||s.player.m>1e15||!Array.isArray(s.moons)||s.moons.length>24||!s.moons.every(m=>['m','a','r','life'].every(k=>Number.isFinite(m[k]))&&m.m>0&&m.r>0))return;orbitMode=[0,1,2].includes(s.orbitMode)?s.orbitMode:0;player=s.player;moons=s.moons.map(m=>({...m,life:cap(m.life,0,1),civil:cap(Number(m.civil)||0,0,1)}));elapsed=Math.max(0,Number(s.elapsed)||0);age=Math.max(0,Number(s.age)||0);peak=tier(player.m);remnant=['White dwarf','Neutron star'].includes(s.remnant)?s.remnant:'';zoom=cap(16/radius(player.m),.025,1.5);bodies=[];for(let i=0;i<100;i++)spawn(true);notice='SYSTEM RESTORED';noticeT=4;}catch{}}
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(2,devicePixelRatio||1);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
function spawn(initial=false){const a=rand(0,Math.PI*2),dist=rand(initial?28:Math.max(w,h)*.55/zoom,Math.max(w,h)*.9/zoom+80),m=Math.max(.15,player.m*(Math.random()<.12?rand(1.25,3.5):Math.pow(rand(.02,1.4),3)*.4));bodies.push({x:player.x+Math.cos(a)*dist,y:player.y+Math.sin(a)*dist,vx:player.vx+rand(-12,12),vy:player.vy+rand(-12,12),m,angle:rand(0,6.28)})}
function step(dt){elapsed+=dt;age+=dt;burst=Math.max(0,burst-dt);saveClock+=dt;noticeT=Math.max(0,noticeT-dt);let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),y=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(pointer){x=pointer.x-w/2;y=pointer.y-h/2}const len=Math.hypot(x,y);if(len>0){const speed=95/zoom;player.vx+=x/len*speed*dt;player.vy+=y/len*speed*dt}const damp=Math.exp(-1.7*dt);player.vx*=damp;player.vy*=damp;player.x+=player.vx*dt;player.y+=player.vy*dt;
for(let i=bodies.length-1;i>=0;i--){const b=bodies[i],dx=player.x-b.x,dy=player.y-b.y,d=Math.max(.01,Math.hypot(dx,dy)),r=radius(player.m),br=radius(b.m),g=1200*player.m/(d*d+r*r*2);b.vx+=dx/d*g*dt;b.vy+=dy/d*g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.m>player.m*1.15){const pull=1200*b.m/(d*d+br*br*2);player.vx-=dx/d*pull*dt;player.vy-=dy/d*pull*dt;}const satellite=moons.find(m=>Math.hypot(b.x-player.x-Math.cos(m.a)*m.r,b.y-player.y-Math.sin(m.a)*m.r)<radius(m.m)+br&&b.m<m.m*.3);if(satellite){satellite.m+=b.m;bodies.splice(i,1);continue}if(d<r+br){if(b.m>player.m*1.15){player.m=Math.max(1,player.m*.7);player.vx+=dx/d*90/zoom;player.vy+=dy/d*90/zoom;notice='COLLISION · Mass lost';noticeT=3;}else{player.m+=b.m;} bodies.splice(i,1);continue}if(tier(player.m)>=2&&moons.length<(tier(player.m)>=6?24:12)&&b.m>player.m*.025&&b.m<player.m*.65&&d<r*6&&d>r*1.8&&Math.hypot(b.vx-player.vx,b.vy-player.vy)<Math.sqrt(2400*player.m/d)){moons.push({m:b.m,a:Math.atan2(-dy,-dx),r:d,life:0,civil:0});bodies.splice(i,1);continue}if(d>Math.max(w,h)*2/zoom+200)bodies.splice(i,1)}
const current=tier(player.m);if(current!==4)remnant='';if(current>peak){peak=current;age=0;notice='ASCENSION · '+stages[current][0];noticeT=5;}for(const m of moons){const base=radius(player.m)*2.2;if(orbitMode===1)m.r=Math.max(base,m.r-dt*base*.12);else if(orbitMode===2)m.r=Math.min(base*5,m.r+dt*base*.12);m.r=Math.max(m.r,base);m.a+=Math.sqrt(1200*player.m/m.r**3)*dt;const heat=(player.m+moons.filter(s=>tier(s.m)===4).reduce((n,s)=>n+s.m*.6,0))/(m.r*m.r);if(current===4&&!remnant&&tier(m.m)===2&&heat>.005&&heat<.12)m.life=Math.min(1,m.life+dt/45);else m.life=Math.max(0,m.life-dt/90);m.civil=cap((m.civil||0)+(m.life>=.99?dt/90:-dt/120),0,1);if(m.civil>=1){m.trade=(m.trade||0)+dt;if(m.trade>=12){m.trade=0;player.m+=Math.max(.1,m.m*.005);}}}while(bodies.length<100)spawn();if(saveClock>=10){saveClock=0;save()}zoom+=(cap(16/radius(player.m),.025,1.5)-zoom)*Math.min(1,dt*2)}
function orb(x,y,r,m,angle=0,life=0,civil=0){const t=tier(m),color=stages[t][2];if(r<.5)return;ctx.save();ctx.translate(x,y);ctx.rotate(angle);if(t>=4){const glow=ctx.createRadialGradient(0,0,r*.4,0,0,r*2.5);glow.addColorStop(0,color);glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(-r*2.5,-r*2.5,r*5,r*5)}const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.05,0,0,r);g.addColorStop(0,t>=5?'#12071f':'#f4e5d6');g.addColorStop(.5,t>=5?'#030107':color);g.addColorStop(1,t>=5?'#06030a':'#171323');ctx.fillStyle=g;ctx.beginPath();if(t===0){for(let k=0;k<9;k++){const a=k*6.283/9,rr=r*(.82+.16*Math.sin(k*7+2));ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath()}else ctx.arc(0,0,r,0,7);ctx.fill();if(t===2&&r>3){ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();ctx.fillStyle=life>.5?'#62b883':'#776f85';for(let j=0;j<5;j++){const a=j*2.399;ctx.beginPath();ctx.ellipse(Math.cos(a)*r*.5,Math.sin(a)*r*.5,r*.38,r*.19,a,0,7);ctx.fill()}if(civil>.5){ctx.fillStyle='#ffe5a0';for(let j=0;j<12;j++){const a=j*2.399;ctx.fillRect(Math.cos(a)*r*.7,Math.sin(a)*r*.7,Math.max(.7,r*.035),Math.max(.7,r*.035))}}ctx.restore();ctx.strokeStyle='#8ed8ff88';ctx.lineWidth=Math.max(.6,r*.06);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke()}if(t===6){for(let j=0;j<70;j++){const a=j*.31,rr=r*(.2+j/45);ctx.fillStyle=j%3?'#bc9dff':'#fff2d0';ctx.fillRect(Math.cos(a)*rr,Math.sin(a)*rr*.55,Math.max(.7,r*.045),Math.max(.7,r*.045))}}if(t===3||t>=5){ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.ellipse(0,0,r*1.7,r*.45,-.35,0,7);ctx.stroke()}ctx.restore()}
function draw(){ctx.fillStyle='#080914';ctx.fillRect(0,0,w,h);for(const [x,y,r] of stars){ctx.fillStyle='#aaa8d0';ctx.globalAlpha=r/2;ctx.fillRect(((x*w-player.x*.025*zoom)%w+w)%w,((y*h-player.y*.025*zoom)%h+h)%h,r,r)}ctx.globalAlpha=1;const sx=x=>w/2+(x-player.x)*zoom,sy=y=>h/2+(y-player.y)*zoom;for(const b of bodies){const x=sx(b.x),y=sy(b.y),r=radius(b.m)*zoom;if(x<-r*3||x>w+r*3||y<-r*3||y>h+r*3)continue;orb(x,y,r,b.m,b.angle);if(b.m>player.m*1.15){ctx.strokeStyle='#ff756766';ctx.beginPath();ctx.arc(x,y,r+4,0,7);ctx.stroke()}}for(const m of moons){ctx.strokeStyle='#957bc344';ctx.beginPath();ctx.arc(w/2,h/2,m.r*zoom,0,7);ctx.stroke();orb(w/2+Math.cos(m.a)*m.r*zoom,h/2+Math.sin(m.a)*m.r*zoom,radius(m.m)*zoom,m.m,0,m.life,m.civil)}orb(w/2,h/2,radius(player.m)*zoom,player.m,elapsed*.3);if(burst>0){ctx.strokeStyle='rgba(255,210,150,'+burst/3+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(w/2,h/2,20+(3-burst)*Math.max(w,h)/3,0,7);ctx.stroke()}const t=tier(player.m);const orbitButton=document.querySelector('#orbit');orbitButton.hidden=moons.length===0;orbitButton.textContent=['Orbits: stable','Orbits: inward','Orbits: outward'][orbitMode];document.querySelector('#evolve').hidden=t!==4||age<20||!!remnant;status.textContent=(remnant&&t===4?remnant:t===6&&moons.filter(m=>tier(m.m)>=4).length>=3?'Galaxy cluster':t===4&&moons.some(m=>tier(m.m)===4)?'Binary star system':t===4&&moons.length>=3?'Solar system':stages[t][0])+' · Mass '+Math.floor(player.m).toLocaleString()+' · Satellites '+moons.length+' · Living worlds '+moons.filter(m=>m.life>=1).length+' · Civilizations '+moons.filter(m=>m.civil>=1).length;if(noticeT>0){ctx.fillStyle='#e8d8ff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(notice,w/2,Math.max(100,h*.2));ctx.textAlign='start';}growth.value=t===stages.length-1?1:cap((player.m-stages[t][1])/(stages[t+1][1]-stages[t][1]),0,1)}
function frame(now){const dt=Math.min(.1,(now-last)/1000||0);last=now;if(!paused&&!document.hidden){acc+=dt;while(acc>=1/120){step(1/120);acc-=1/120}}draw();requestAnimationFrame(frame)}
addEventListener('resize',resize);addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();pointer=null});canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointer={x:e.clientX,y:e.clientY}};canvas.onpointermove=e=>{if(pointer)pointer={x:e.clientX,y:e.clientY}};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';pointer=null};document.querySelector('#orbit').onclick=()=>{orbitMode=(orbitMode+1)%3;save()};document.querySelector('#restart').onclick=()=>{if(confirm('Start a new universe? Your current local save will be replaced.')){reset();save()}};document.querySelector('#evolve').onclick=()=>{if(tier(player.m)!==4||age<20||remnant)return;remnant=player.m>=3500?'Neutron star':'White dwarf';player.m=Math.max(1300,player.m*.8);for(const m of moons)m.r*=1.4;notice='STELLAR COLLAPSE · '+remnant;noticeT=6;burst=3;save();};addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){save();keys.clear();pointer=null}});resize();reset();restore();requestAnimationFrame(frame);
</script></html>
