<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember Ricochet | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4c291d,#0e1018 76%);color:#ffe9d2;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffc18b}h1{color:#ffa35e;font-size:clamp(2rem,8vw,3.5rem)}p{color:#d7c1b4;line-height:1.5}canvas{display:block;width:min(100%,500px);height:auto;border:3px solid #d08951;border-radius:12px;touch-action:none}button{padding:12px 16px;margin:8px 8px 8px 0;background:#65392c;border:1px solid #dc8d51;color:#ffe6cb;border-radius:9px;font-weight:800;cursor:pointer}#status{font-weight:800;color:#ffdda9}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Ember Ricochet</h1><p>Bounce a burning orb off rotating shields and keep it alive through escalating waves. Use touch, mouse, or arrow keys.</p><canvas id="game" width="500" height="500"></canvas><button id="restart">New run</button><button id="pause">Pause</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),art=new Image();art.src="./sprites/ember-orb.svg";function finish(score){try{const k="ashfall:ember-ricochet:best";localStorage.setItem(k,String(Math.max(score,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("ember-ricochet",score,{score,game:"ember-ricochet"})).catch(()=>{})}const c=$("game"),g=c.getContext("2d");let angle=0,ball,score,active=false,last=0,paused=false,reported=false;function reset(){angle=0;ball={x:250,y:250,vx:155,vy:-195};score=0;active=true;paused=false;reported=false}function end(){active=false;if(reported)return;reported=true;finish(score)}function step(dt){if(!active||paused)return;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const dx=ball.x-250,dy=ball.y-250,d=Math.hypot(dx,dy)||1;if(d>203){const a=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(a-angle),Math.cos(a-angle));if(Math.abs(diff)<.52){const nx=dx/d,ny=dy/d,dot=ball.vx*nx+ball.vy*ny;ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.x=250+nx*200;ball.y=250+ny*200;score+=10;const speed=Math.min(430,Math.hypot(ball.vx,ball.vy)*1.018);const mag=Math.hypot(ball.vx,ball.vy)||1;ball.vx=ball.vx/mag*speed;ball.vy=ball.vy/mag*speed}else end()}}function draw(){g.fillStyle="#111621";g.fillRect(0,0,500,500);g.strokeStyle="#57403a";g.lineWidth=9;g.beginPath();g.arc(250,250,204,0,7);g.stroke();g.strokeStyle="#ffac6d";g.lineWidth=18;g.beginPath();g.arc(250,250,204,angle-.52,angle+.52);g.stroke();g.fillStyle="#ffc68b";g.beginPath();g.arc(ball.x,ball.y,12,0,7);g.fill();if(art.complete&&art.naturalWidth)g.drawImage(art,ball.x-12,ball.y-12,24,24);g.textAlign="center";g.fillStyle="#ffe2b4";g.font="bold 25px system-ui";g.fillText("Score "+score,250,42);if(!active||paused){g.fillStyle="#070911bb";g.fillRect(0,0,500,500);g.fillStyle="#ffdaa7";g.fillText(paused?"PAUSED":"RUN ENDED",250,250)}status.textContent=active?"Rotate the shield to catch the orb.":"Run ended · Score "+score}function frame(t){const dt=Math.min(.04,last?(t-last)/1000:0);last=t;step(dt);draw();requestAnimationFrame(frame)}function aim(e){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*500/r.width-250,y=(e.clientY-r.top)*500/r.height-250;angle=Math.atan2(y,x)}c.onpointerdown=aim;c.onpointermove=e=>{if(e.buttons||e.pointerType==="touch")aim(e)};document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();angle-=.2}if(e.key==="ArrowRight"){e.preventDefault();angle+=.2}});$("restart").onclick=reset;$("pause").onclick=()=>{if(active)paused=!paused};document.addEventListener("visibilitychange",()=>{if(document.hidden)paused=true});reset();requestAnimationFrame(frame)})();</script></body></html>
