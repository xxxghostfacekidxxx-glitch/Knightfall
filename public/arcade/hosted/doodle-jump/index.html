<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Skybound | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.canvas{aspect-ratio:400/650}.status{color:var(--green);font-weight:900}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / PLATFORMER</div><h1 class="title">SKYBOUND<br><span>JUMP RIOT</span></h1><p class="muted">Keep bouncing. Grab height. Avoid falling into the void. Move with A/D, arrow keys, or drag on the screen.</p><div class="hud"><span>HEIGHT <b id="score">0</b></span><span id="state" class="status">RUNNING</span></div><canvas id="game" class="canvas" width="400" height="650" aria-label="Skybound platform game"></canvas><div class="controls"><button class="btn" id="restart">Restart run</button><span class="muted">Touch and keyboard supported · local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),scoreEl=document.getElementById("score"),stateEl=document.getElementById("state");let keys={},player,plats,cam,score,dead,last=0,pointerX=null;
function init(){player={x:190,y:500,vx:0,vy:-520,r:15};plats=[];for(let i=0;i<12;i++)plats.push({x:Math.random()*320,y:540-i*58,w:60+Math.random()*30});cam=0;score=0;dead=false;scoreEl.textContent="0";stateEl.textContent="RUNNING";last=0;requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!dead)update(dt);draw();requestAnimationFrame(loop)}
function update(dt){if(keys.ArrowLeft||keys.a||keys.A)player.vx=-240;else if(keys.ArrowRight||keys.d||keys.D)player.vx=240;else if(pointerX!==null)player.vx=(pointerX-player.x)*4;else player.vx*=.88;player.x+=player.vx*dt;player.x=(player.x+400)%400;const oldY=player.y;player.vy+=1250*dt;player.y+=player.vy*dt;if(player.vy>0){for(const p of plats){const py=p.y+cam;if(oldY+player.r<=py&&player.y+player.r>=py&&player.x>p.x-8&&player.x<p.x+p.w+8){player.vy=-520;break;}}}if(player.y<250){const shift=250-(player.y-cam);player.y+=shift;score+=shift;scoreEl.textContent=Math.floor(score);for(const p of plats)p.y+=shift;plats=plats.filter(p=>p.y<660);while(plats.length<13){const top=Math.min(...plats.map(p=>p.y));plats.push({x:Math.random()*320,y:top-48-Math.random()*26,w:58+Math.random()*30});}}if(player.y>680){dead=true;stateEl.textContent="RUN ENDED";}}
function draw(){x.clearRect(0,0,400,650);x.fillStyle="#0b1018";x.fillRect(0,0,400,650);for(let i=0;i<20;i++){x.fillStyle=i%2?"#ff5edb12":"#a8ff4812";x.fillRect((i*67)%400,(i*97)%650,2,2);}for(const p of plats){x.fillStyle="#a8ff48";x.shadowColor="#a8ff48";x.shadowBlur=10;x.fillRect(p.x,p.y,p.w,8);x.shadowBlur=0;}x.fillStyle="#ff5edb";x.shadowColor="#ff5edb";x.shadowBlur=15;x.beginPath();x.arc(player.x,player.y-cam,player.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle="#15111b";x.beginPath();x.arc(player.x-5,player.y-cam-3,2.5,0,Math.PI*2);x.arc(player.x+5,player.y-cam-3,2.5,0,Math.PI*2);x.fill();if(dead){x.fillStyle="#080a0fdd";x.fillRect(0,0,400,650);x.fillStyle="#a8ff48";x.font="bold 30px system-ui";x.textAlign="center";x.fillText("RUN OVER",200,300);x.fillStyle="#fff";x.font="15px system-ui";x.fillText("Height: "+score,200,330);}}
document.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault()});document.addEventListener("keyup",e=>keys[e.key]=false);c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();pointerX=(e.clientX-r.left)*400/r.width;});c.addEventListener("pointerleave",()=>pointerX=null);document.getElementById("restart").addEventListener("click",init);window.exportSaveState=()=>dead?null:({player:{...player},plats:plats.map(p=>({...p})),cam,score});window.importSaveState=d=>{if(!d||!d.player||![d.player.x,d.player.y,d.player.vx,d.player.vy,d.player.r,d.cam,d.score].every(Number.isFinite)||!Array.isArray(d.plats)||d.plats.length<1||d.plats.length>100||!d.plats.every(p=>p&&[p.x,p.y,p.w].every(Number.isFinite)))return false;player={x:((d.player.x%400)+400)%400,y:Math.max(-100,Math.min(900,d.player.y)),vx:d.player.vx,vy:d.player.vy,r:Math.max(5,Math.min(30,d.player.r))};plats=d.plats.map(p=>({x:Math.max(-100,Math.min(400,p.x)),y:Math.max(-100,Math.min(1000,p.y)),w:Math.max(20,Math.min(180,p.w))}));cam=Math.max(-50000,Math.min(50000,d.cam));score=Math.max(0,Math.floor(d.score));dead=false;scoreEl.textContent=String(Math.floor(score));stateEl.textContent="Cloud save restored.";draw();return true};window.isGameOver=()=>dead;init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-doodle-jump" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
