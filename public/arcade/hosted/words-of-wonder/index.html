<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Word Weave | Chaos Cartridge</title><style>
:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:640px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.letters{display:flex;justify-content:center;gap:8px;margin:18px 0}.letter{width:clamp(42px,10vw,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-size:1.35rem;font-weight:1000}.inputrow{display:flex;gap:8px;max-width:420px;margin:auto}.inputrow input{min-width:0;flex:1;border:1px solid #ffffff30;border-radius:9px;background:#0b1018;color:#fff;padding:12px;font-size:1rem;text-transform:uppercase}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.words{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:16px 0}.word{padding:7px 9px;border-radius:8px;border:1px solid #a8ff4850;background:#a8ff4810;color:#eaffd5;font-weight:800}.status{text-align:center;color:var(--green);font-weight:900;min-height:26px;margin:12px 0}
</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / WORD PUZZLE</div><h1 class="title">WORD<br><span>WEAVE</span></h1><p class="muted">Build words from the six letters. Each valid word can only score once. Find the target words to finish the board.</p><div class="hud"><span>FOUND <b id="found">0</b>/12</span><span>POINTS <b id="score">0</b></span></div><div class="letters" id="letters"></div><form class="inputrow" id="form"><input id="guess" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="TYPE A WORD" aria-label="Guess word"><button class="btn">Enter</button></form><div class="status" id="status" aria-live="polite">Find all 12 words.</div><div class="words" id="words"></div><button class="btn" id="reset">New puzzle</button></section></main><script>
const bank=["STONE","STORE","ONSET","NOTES","TONES","TENOR","SNORE","ROSE","REST","NEST","SENT","TONE"];const letters="STONER";let found=[],score=0;const $=id=>document.getElementById(id);
function init(){found=[];score=0;$("found").textContent=0;$("score").textContent=0;$("status").textContent="Find all 12 words.";$("letters").innerHTML=[..."STONER"].map(ch=>'<span class="letter">'+ch+'</span>').join("");$("words").innerHTML="";$("guess").value="";}
function submit(e){e.preventDefault();const w=$("guess").value.trim().toUpperCase();$("guess").value="";if(!bank.includes(w)){$("status").textContent="Not in this puzzle's word list.";return;}if(found.includes(w)){$("status").textContent="Already found. No double-dipping.";return;}found.push(w);score+=w.length*10;$("found").textContent=found.length;$("score").textContent=score;const el=document.createElement("span");el.className="word";el.textContent=w;$("words").appendChild(el);$("status").textContent=found.length===bank.length?"Puzzle cleared. Your vocabulary has escaped containment.":"Nice. "+(bank.length-found.length)+" words left.";}
$("form").addEventListener("submit",submit);$("reset").addEventListener("click",init);init();
</script></body></html>
