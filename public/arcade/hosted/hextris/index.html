<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Hextris | Chaos Cartridge</title>
		<meta name="description" content="An addictive puzzle game inspired by Tetris.">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, minimal-ui"/>
		<link rel="stylesheet" href="style/style.css">
		<script src="vendor-bundle.js"></script>
		
	</head>
	<body>
    <header id="kf-header">
      <div><div class="brand">CHAOS CARTRIDGE · GPL IMPORT</div><div class="title">Hextris</div></div>
      <a href="/chaos-cartridge.html">← Arcade shelf</a>
      <button class="primary" id="kf-save">Save</button>
      <button id="kf-resume">Resume</button>
      <button id="kf-submit">Submit score</button>
      <span id="kf-sync" role="status" aria-live="polite">Local game saves are available.</span>
      <div id="arcade-account-status" role="status" aria-live="polite">Checking account…</div>
    </header>
		<canvas id="canvas"></canvas>
		<div id="overlay" class="faded overlay"></div>
		<div id='startBtn' ></div>
		<div id="helpScreen" class='unselectable'>
			<div id='inst_main_body'></div>
		</div>
		<img id="openSideBar" class='helpText' src="./images/btn_help.svg"/>
		<div class="faded overlay"></div>
		<img id="pauseBtn" src="./images/btn_pause.svg"/>
		<img id='restartBtn' src="./images/btn_restart.svg"/>
		<div id='HIGHSCORE'>HIGH SCORE</div>
		<div id='highScoreInGameText'>
			<div id='highScoreInGameTextHeader'>HIGH SCORE</div><div id='currentHighScore'>10292</div>
		</div>
		<div id="gameoverscreen">
			<div id='container'>
				<div id='gameOverBox' class='GOTitle'>GAME OVER</div>
				<div id='cScore'>1843</div>
				<div id='highScoresTitle' class='GOTitle'>HIGH SCORES</div>
				<div class='score'><span class='scoreNum'>1.</span> <div id="1place" style="display:inline;">0</div></div>
				<div class='score'><span class='scoreNum'>2.</span> <div id="2place" style="display:inline;">0</div></div>
				<div class='score'><span class='scoreNum'>3.</span> <div id="3place" style="display:inline;">0</div></div>
			</div>
			<div id='bottomContainer'>
				<img id='restart' src='./images/btn_restart.svg' height='57px'>
				<div id='socialShare' hidden></div>
				<div id='buttonCont' hidden></div>
			</div>
		</div>
	
    <script src="/arcade-save.js"></script>
    <script src="hextris.js"></script>
    <script>
      (() => {
        const $ = id => document.getElementById(id);
        const gameKey = "cabinet-hextris";
        const note = (text, ok = true) => { $("kf-sync").textContent = text; $("kf-sync").style.color = ok ? "#c6ff45" : "#ff9de8"; };
        $("kf-save").addEventListener("click", async () => {
          try {
            const serialized = exportSaveState();
            await window.AshFallArcade.ready; await window.AshFallArcade.saveProgress(gameKey, { serialized }, "autosave", 1);
            note("Game progress saved to your account.");
          } catch (e) { note(e.message || "Sign in to sync progress across devices.", false); }
        });
        $("kf-resume").addEventListener("click", async () => {
          try {
            await window.AshFallArcade.ready; const saved = await window.AshFallArcade.loadProgress(gameKey, "autosave");
            if (!saved || typeof saved.serialized !== "string") { note("No cloud save found yet.", false); return; }
            localStorage.setItem("saveState", saved.serialized);
            location.reload();
          } catch (e) { note(e.message || "Sign in to resume a cloud save.", false); }
        });
        $("kf-submit").addEventListener("click", async () => {
          try {
            await window.AshFallArcade.ready; const result = await window.AshFallArcade.recordScore(gameKey, Number(window.score) || 0, { serialized: exportSaveState() });
            note(result && result.saved ? "Score sent to the account leaderboard." : "Sign in to submit scores.", Boolean(result && result.saved));
          } catch (e) { note(e.message || "Score submission failed.", false); }
        });
        if (window.AshFallArcade && window.AshFallArcade.ready) window.AshFallArcade.ready.then(async () => {
          if (!window.AshFallArcade.user) return;
          try { const saved = await window.AshFallArcade.loadProgress(gameKey, "autosave"); if (saved && saved.serialized) note("Cloud save found. Tap Resume to load it."); } catch {}
        });
      })();
    </script>
</body>
</html>
