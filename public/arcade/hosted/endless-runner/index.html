<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Sprint | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.run{aspect-ratio:420/620}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / RUNNER</div><h1 class="title">NEON<br><span>SPRINT</span></h1><p class="muted">Jump the hazards and keep the run alive. Tap the screen, click, or press Space. The floor is not your friend.</p><div class="hud"><span>DISTANCE <b id="score">0</b></span><span id="state">RUNNING</span></div><canvas id="game" class="run" width="420" height="620"></canvas><div class="controls"><button class="btn" id="restart">Restart run</button><span class="muted">Tap/click/Space to jump</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let player,obs,score,speed,over,spawn,last,ground;
function init(){player={x:75,y:490,vy:0,w:30,h:38};obs=[];score=0;speed=260;over=false;spawn=0;last=0;ground=530;$("score").textContent=0;$("state").textContent="RUNNING";requestAnimationFrame(loop);}
function jump(){if(!over&&player.y>=ground-player.h-1)player.vy=-540;}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){score+=dt*10;speed=260+score*1.4;player.vy+=1450*dt;player.y+=player.vy*dt;if(player.y>ground-player.h){player.y=ground-player.h;player.vy=0;}spawn-=dt;if(spawn<=0){obs.push({x:435,y:ground-25,w:20+Math.random()*18,h:25+Math.random()*35});spawn=Math.max(.48,1.1-score/180)+Math.random()*.4;}for(const o of obs)o.x-=speed*dt;obs=obs.filter(o=>o.x+o.w>0);for(const o of obs)if(player.x+player.w-4>o.x&&player.x+4<o.x+o.w&&player.y+player.h>o.y){over=true;$("state").textContent="RUN OVER";} $("score").textContent=Math.floor(score);}draw();requestAnimationFrame(loop);}
function draw(){x.clearRect(0,0,420,620);x.fillStyle="#0b1018";x.fillRect(0,0,420,620);for(let i=0;i<18;i++){x.fillStyle="#ffffff12";x.fillRect((i*91-score*3)%420,60+(i*71)%420,2,2);}x.strokeStyle="#a8ff48";x.lineWidth=3;x.beginPath();x.moveTo(0,ground);x.lineTo(420,ground);x.stroke();x.fillStyle="#ff5edb";x.shadowColor="#ff5edb";x.shadowBlur=12;x.fillRect(player.x,player.y,player.w,player.h);x.shadowBlur=0;x.fillStyle="#080a0f";x.fillRect(player.x+7,player.y+8,4,4);x.fillRect(player.x+19,player.y+8,4,4);for(const o of obs){x.fillStyle="#a8ff48";x.shadowColor="#a8ff48";x.shadowBlur=10;x.fillRect(o.x,o.y,o.w,o.h);x.shadowBlur=0;}if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#a8ff48";x.textAlign="center";x.font="bold 30px system-ui";x.fillText("RUN OVER",210,300);x.fillStyle="#fff";x.font="18px system-ui";x.fillText("Distance: "+Math.floor(score),210,330);}}
c.addEventListener("pointerdown",jump);document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}});$("restart").addEventListener("click",init);window.exportSaveState=()=>over?null:({player:{...player},obs:obs.map(o=>({...o})),score,speed,spawn,ground});window.importSaveState=d=>{if(!d||!d.player||![d.player.x,d.player.y,d.player.vy,d.player.w,d.player.h,d.score,d.speed,d.spawn,d.ground].every(Number.isFinite)||!Array.isArray(d.obs)||d.obs.length>40||!d.obs.every(o=>o&&[o.x,o.y,o.w,o.h].every(Number.isFinite)))return false;player={x:Math.max(0,Math.min(420,d.player.x)),y:Math.max(0,Math.min(600,d.player.y)),vy:Math.max(-1000,Math.min(1000,d.player.vy)),w:Math.max(10,Math.min(80,d.player.w)),h:Math.max(10,Math.min(100,d.player.h))};obs=d.obs.map(o=>({x:Math.max(-100,Math.min(600,o.x)),y:Math.max(0,Math.min(620,o.y)),w:Math.max(5,Math.min(100,o.w)),h:Math.max(5,Math.min(150,o.h))}));score=Math.max(0,d.score);speed=Math.max(260,Math.min(5000,d.speed));spawn=Math.max(0,Math.min(5,d.spawn));ground=Math.max(350,Math.min(600,d.ground));over=false;$("score").textContent=String(Math.floor(score));$("state").textContent="Cloud save restored.";draw();return true};window.isGameOver=()=>over;window.isGameActive=()=>!over;init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-endless-runner" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
