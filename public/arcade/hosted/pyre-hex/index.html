<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pyre Hex | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#48291f,#0e0f18 75%);color:#ffe8d2;font:16px system-ui}main{max-width:650px;margin:auto}a{color:#ffbd83}h1{color:#ffa15d;font-size:clamp(2rem,8vw,3.6rem)}p{color:#d5c1b5;line-height:1.5}canvas{display:block;width:min(100%,520px);height:auto;border:3px solid #ce8551;border-radius:12px}button{padding:12px 15px;margin:8px;background:#64382b;border:1px solid #d48b53;border-radius:9px;color:#ffe5cb;font-weight:800;cursor:pointer}#status{color:#ffdda8;font-weight:800}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Pyre Hex</h1><p>Rotate the six-sided furnace and catch falling embers. Match three adjacent colors to clear the stacks before they reach the rim.</p><canvas id="game" width="520" height="520"></canvas><button id="left">↶ Rotate left</button><button id="right">Rotate right ↷</button><button id="restart">New run</button><button id="pause">Pause</button><p id="status" role="status"></p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d"),COLS=6,MAX=7,colors=["#ff9b5c","#a789e2","#80c9a6","#e8d17d"];let columns,rotation,score,active,paused,timer,falling;function finish(points){try{const k="ashfall:pyre-hex:best";localStorage.setItem(k,String(Math.max(points,Number(localStorage.getItem(k))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("pyre-hex",points,{score:points,game:"pyre-hex"})).catch(()=>{})}function reset(){clearInterval(timer);columns=Array.from({length:COLS},()=>[]);rotation=0;score=0;active=true;paused=false;falling=0;timer=setInterval(tick,750);draw()}function turn(n){if(!active||paused)return;rotation=(rotation+n+COLS)%COLS;draw()}function tick(){if(!active||paused)return;const slot=(falling+rotation)%COLS;columns[slot].push(Math.floor(Math.random()*4));falling=(falling+1)%COLS;let chain=0;for(;;){let removed=false;for(let c=0;c<COLS;c++){const stack=columns[c];if(stack.length>=3&&stack.slice(-3).every(v=>v===stack.at(-1))){stack.splice(-3);score+=75*(++chain);removed=true}}for(let c=0;c<COLS;c++){const a=columns[c],b=columns[(c+1)%COLS],d=columns[(c+2)%COLS];if(a.length&&b.length&&d.length&&a.at(-1)===b.at(-1)&&b.at(-1)===d.at(-1)){a.pop();b.pop();d.pop();score+=90*(++chain);removed=true;break}}if(!removed)break}if(columns.some(a=>a.length>=MAX)){active=false;clearInterval(timer);finish(score)}draw()}function draw(){ctx.fillStyle="#151521";ctx.fillRect(0,0,520,520);ctx.textAlign="center";ctx.fillStyle="#ffe2b5";ctx.font="bold 22px system-ui";ctx.fillText("SCORE "+score,260,32);const cx=260,cy=265;for(let c=0;c<COLS;c++){const a=c*Math.PI/3-Math.PI/2;ctx.strokeStyle="#72513f";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*65,cy+Math.sin(a)*65);ctx.lineTo(cx+Math.cos(a)*228,cy+Math.sin(a)*228);ctx.stroke();columns[c].forEach((v,i)=>{const r=82+i*23,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.fillStyle=colors[v];ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill()})}ctx.fillStyle="#a85b3c";ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,x=cx+Math.cos(a)*59,y=cy+Math.sin(a)*59;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.fillStyle="#ffe4b6";ctx.font="bold 28px system-ui";ctx.fillText("✹",cx,cy+10);ctx.fillText("↓",cx+Math.cos((falling+rotation)*Math.PI/3-Math.PI/2)*214,cy+Math.sin((falling+rotation)*Math.PI/3-Math.PI/2)*214);$("status").textContent=active?(paused?"Paused":"Score "+score+" · Turn the pyre to aim the next ember"):"Pyre overflow! Final score "+score}document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();turn(-1)}if(e.key==="ArrowRight"){e.preventDefault();turn(1)}});$("left").onclick=()=>turn(-1);$("right").onclick=()=>turn(1);$("restart").onclick=reset;$("pause").onclick=()=>{if(active)paused=!paused;draw()};document.addEventListener("visibilitychange",()=>{if(document.hidden)paused=true});reset()})();
</script></body></html>
