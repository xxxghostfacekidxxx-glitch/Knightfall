<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#130e16"><title>Cinder Archer | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:radial-gradient(circle at top,#4c291e,#0d0e16 75%);color:#fce8d2;font:16px system-ui}main{max-width:900px;margin:auto}a{color:#ffb879}h1{font-size:clamp(2rem,8vw,3.8rem);color:#ffa05d;margin:12px 0}p{color:#cfbcb0;line-height:1.45}.stats{display:flex;flex-wrap:wrap;gap:20px;margin:14px 0;color:#ffd69c;font-weight:900}.stage{position:relative}canvas{display:block;width:100%;height:auto;border:3px solid #bd7445;border-radius:12px;background:#15131e;touch-action:none}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}button{padding:12px 17px;border-radius:9px;border:1px solid #d88753;background:#663729;color:#ffe7cd;font:800 15px system-ui;cursor:pointer}#status{font-weight:800;color:#ffd39b;min-height:45px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Archer</h1><p>Draw back from the bow, release to fire, and account for gravity and the drifting wasteland targets. Ten arrows per round.</p><div class="stats"><span>SCORE <output id="score">0</output></span><span>BEST <output id="best">0</output></span><span>ARROWS <output id="arrows">10</output></span><span>HITS <output id="hits">0</output></span></div><div class="stage"><canvas id="stage" width="840" height="480" aria-label="Archery range: drag from the bow and release to fire"></canvas></div><div class="controls"><button id="fire">Fire aimed shot</button><button id="restart">New round</button><button id="full">Fullscreen</button></div><p id="status" role="status" aria-live="polite">Drag backward from the bow to aim, then release. Keyboard: arrows aim, space fires.</p><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),canvas=$("stage"),ctx=canvas.getContext("2d"),W=840,H=480,bow={x:105,y:270},targetImg=new Image(),bowImg=new Image();targetImg.src="./sprites/cinder-target.svg";bowImg.src="./sprites/ash-bow.svg";let score=0,best=0,arrows=10,hits=0,shots=[],aim={x:210,y:-65},dragging=false,active=true,finished=false,last=0,elapsed=0,submitted=false;try{best=Number(localStorage.getItem("ashfall:cinder-archer:best"))||0}catch{}const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));function target(){return {x:680+Math.sin(elapsed*.85)*48,y:225+Math.sin(elapsed*1.2)*88,r:49}}function hud(){$("score").textContent=score;$("best").textContent=best;$("arrows").textContent=arrows;$("hits").textContent=hits}function point(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height}}function setAim(p){let x=p.x-bow.x,y=p.y-bow.y;if(x<35){x=35}const mag=Math.hypot(x,y)||1;aim={x:x/mag*clamp(mag,70,320),y:y/mag*clamp(mag,70,320)}}function reset(){score=0;arrows=10;hits=0;shots=[];active=true;finished=false;submitted=false;elapsed=0;aim={x:210,y:-65};$("status").textContent="Range open. Draw and fire.";hud()}function finish(){if(finished)return;finished=true;active=false;best=Math.max(best,score);try{localStorage.setItem("ashfall:cinder-archer:best",String(best))}catch{}$("status").textContent="Round complete. "+hits+" hits, "+score+" points.";hud();if(!submitted&&window.AshFallArcade?.recordScore){submitted=true;Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("cinder-archer",score,{score,game:"cinder-archer",hits,shots:10})).catch(()=>{})}}function fire(){if(!active||arrows<=0)return;const mag=Math.hypot(aim.x,aim.y)||1,velocity=clamp(mag/17,9,19);shots.push({x:bow.x+40,y:bow.y,vx:aim.x/mag*velocity,vy:aim.y/mag*velocity,live:true,age:0});arrows--;$("status").textContent="Arrow loose! "+arrows+" remaining.";hud()}function update(dt){if(!active)return;elapsed+=dt;const t=target();for(const s of shots){if(!s.live)continue;const ox=s.x,oy=s.y;s.x+=s.vx*dt*60;s.y+=s.vy*dt*60;s.vy+=.19*dt*60;s.age+=dt;const vx=s.x-ox,vy=s.y-oy,dx=t.x-ox,dy=t.y-oy,den=vx*vx+vy*vy;const frac=den?clamp((dx*vx+dy*vy)/den,0,1):0,dist=Math.hypot(ox+vx*frac-t.x,oy+vy*frac-t.y);if(dist<t.r){s.live=false;const points=dist<9?100:dist<20?75:dist<34?50:25;score+=points;hits++;best=Math.max(best,score);$("status").textContent="Target struck! +"+points+" points.";hud()}else if(s.x>W+30||s.y>H+30||s.y< -40||s.age>7)s.live=false}shots=shots.filter(s=>s.live);if(arrows===0&&shots.length===0)finish()}function draw(){const g=ctx;g.clearRect(0,0,W,H);const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#34202a");bg.addColorStop(1,"#15151e");g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle="#462c2a";for(let i=0;i<8;i++){const x=i*130-30;g.beginPath();g.moveTo(x,H);g.lineTo(x+80,310+(i%3)*18);g.lineTo(x+175,H);g.fill()}g.fillStyle="#57342a";g.fillRect(0,435,W,45);g.strokeStyle="#ffb773";g.lineWidth=4;g.beginPath();g.moveTo(bow.x+30,bow.y);g.lineTo(bow.x+aim.x,bow.y+aim.y);g.stroke();g.strokeStyle="#ffdfb8";g.lineWidth=2;g.setLineDash([8,10]);g.beginPath();g.moveTo(bow.x+30,bow.y);g.lineTo(bow.x+aim.x*1.7,bow.y+aim.y*1.7+45);g.stroke();g.setLineDash([]);if(bowImg.complete&&bowImg.naturalWidth)g.drawImage(bowImg,bow.x-45,bow.y-90,75,180);else{g.strokeStyle="#ffa85f";g.beginPath();g.arc(bow.x,bow.y,80,-Math.PI/2,Math.PI/2,true);g.stroke()}const t=target();if(targetImg.complete&&targetImg.naturalWidth)g.drawImage(targetImg,t.x-t.r,t.y-t.r,t.r*2,t.r*2);else{g.fillStyle="#f29b52";g.beginPath();g.arc(t.x,t.y,t.r,0,Math.PI*2);g.fill()}for(const s of shots){g.save();g.translate(s.x,s.y);g.rotate(Math.atan2(s.vy,s.vx));g.strokeStyle="#ffe0ae";g.lineWidth=4;g.beginPath();g.moveTo(-28,0);g.lineTo(12,0);g.stroke();g.fillStyle="#ff9b5b";g.beginPath();g.moveTo(12,0);g.lineTo(2,-6);g.lineTo(2,6);g.fill();g.restore()}if(finished){g.fillStyle="#0b0c14bd";g.fillRect(0,0,W,H);g.fillStyle="#ffd9a3";g.font="bold 42px system-ui";g.textAlign="center";g.fillText("ROUND COMPLETE",W/2,H/2);g.font="bold 23px system-ui";g.fillText(score+" POINTS",W/2,H/2+45)}}function frame(time){const dt=Math.min(.05,last?(time-last)/1000:0);last=time;update(dt);draw();requestAnimationFrame(frame)}canvas.addEventListener("pointerdown",e=>{if(!active)return;dragging=true;canvas.setPointerCapture(e.pointerId);setAim(point(e))});canvas.addEventListener("pointermove",e=>{if(dragging)setAim(point(e))});canvas.addEventListener("pointerup",e=>{if(!dragging)return;setAim(point(e));dragging=false;fire()});canvas.addEventListener("pointercancel",()=>dragging=false);document.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key===" "&&!e.repeat)fire();if(e.key==="ArrowUp")aim.y-=12;if(e.key==="ArrowDown")aim.y+=12;if(e.key==="ArrowRight")aim.x=clamp(aim.x+12,50,320);if(e.key==="ArrowLeft")aim.x=clamp(aim.x-12,50,320)});$("fire").onclick=fire;$("restart").onclick=reset;$("full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else canvas.requestFullscreen().catch(()=>{})};hud();requestAnimationFrame(frame)})();
</script></body></html>
