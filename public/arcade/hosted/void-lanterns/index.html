<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Lanterns | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4a2921,#10101b 75%);color:#ffe7cf;font:16px system-ui}main{max-width:620px;margin:auto}a{color:#ffbd83}h1{color:#ffa15e;font-size:clamp(2rem,8vw,3.5rem)}p{color:#d9c2b6;line-height:1.5}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:520px;margin:18px auto}.tile{aspect-ratio:1;display:grid;place-items:center;border:2px solid #98654e;border-radius:9px;min-width:0;cursor:pointer;color:#ffe4b5;font-weight:900;font-size:clamp(18px,5vw,30px)}.tile img{width:70%;height:70%}.lit{background:#7a4235}.dark{background:#252334}.found{background:#30564b}.glyph{font-size:clamp(18px,5vw,31px)}button:not(.tile){padding:12px 15px;background:#63392d;border:1px solid #d58a56;border-radius:9px;color:#ffe6cc;font-weight:800;cursor:pointer;margin-right:8px}#status{font-weight:800;color:#ffdda9;min-height:38px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Void Lanterns</h1><p>Tap a lantern to toggle it and its four neighbors. Extinguish all 25.</p><div class="board" id="board" aria-label="Void Lanterns puzzle"></div><p id="status" role="status"></p><button id="restart">New puzzle</button><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status"),mode=document.getElementById("mode");function finish(points){status.textContent="Puzzle cleared! "+points+" points.";try{const key="ashfall:void-lanterns:best";localStorage.setItem(key,String(Math.max(points,Number(localStorage.getItem(key))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("void-lanterns",points,{score:points,game:"void-lanterns"})).catch(()=>{})}const N=5;let cells=[],moves=0,done=false;function reset(){cells=Array(25).fill(0);moves=0;done=false;for(let i=0;i<12;i++)flip(Math.floor(Math.random()*25),false);if(cells.every(v=>!v))flip(12,false);render()}function flip(i,count=true){if(done)return;const r=Math.floor(i/N),c=i%N;for(const [dr,dc] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){let y=r+dr,x=c+dc;if(x>=0&&x<N&&y>=0&&y<N)cells[y*N+x]^=1}if(count){moves++;if(cells.every(v=>!v)){done=true;finish(Math.max(50,1000-moves*15))}}render()}function render(){board.innerHTML="";cells.forEach((v,i)=>{const b=document.createElement("button");b.className="tile "+(v?"lit":"dark");b.innerHTML='<img src="./sprites/'+(v?"ember-lantern.svg":"void-lantern.svg")+'" alt="">';b.setAttribute("aria-label","Lantern "+(i+1)+" "+(v?"lit":"unlit"));b.onclick=()=>flip(i);board.append(b)});status.textContent=done?"The lanterns are extinguished! Score "+Math.max(50,1000-moves*15):moves+" moves · "+cells.filter(Boolean).length+" lanterns remain"}
document.getElementById("restart").onclick=reset;reset()})();
</script></body></html>
