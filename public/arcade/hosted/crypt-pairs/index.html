<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Pairs | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#4a2921,#10101b 75%);color:#ffe7cf;font:16px system-ui}main{max-width:620px;margin:auto}a{color:#ffbd83}h1{color:#ffa15e;font-size:clamp(2rem,8vw,3.5rem)}p{color:#d9c2b6;line-height:1.5}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:520px;margin:18px auto}.tile{aspect-ratio:1;display:grid;place-items:center;border:2px solid #98654e;border-radius:9px;min-width:0;cursor:pointer;color:#ffe4b5;font-weight:900;font-size:clamp(18px,5vw,30px)}.tile img{width:70%;height:70%}.lit{background:#7a4235}.dark{background:#252334}.found{background:#30564b}.glyph{font-size:clamp(18px,5vw,31px)}button:not(.tile){padding:12px 15px;background:#63392d;border:1px solid #d58a56;border-radius:9px;color:#ffe6cc;font-weight:800;cursor:pointer;margin-right:8px}#status{font-weight:800;color:#ffdda9;min-height:38px}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Pairs</h1><p>Find eight matching pairs. Every mismatch costs time and points.</p><div class="board" id="board" aria-label="Crypt Pairs puzzle"></div><p id="status" role="status"></p><button id="restart">New puzzle</button><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script><script>
(()=>{"use strict";const board=document.getElementById("board"),status=document.getElementById("status"),mode=document.getElementById("mode");function finish(points){status.textContent="Puzzle cleared! "+points+" points.";try{const key="ashfall:crypt-pairs:best";localStorage.setItem(key,String(Math.max(points,Number(localStorage.getItem(key))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-pairs",points,{score:points,game:"crypt-pairs"})).catch(()=>{})}let cards=[],opened=[],matched=0,moves=0,locked=false,done=false,timeout=null;function reset(){if(timeout)clearTimeout(timeout);timeout=null;cards=[...Array(8).keys(),...Array(8).keys()].sort(()=>Math.random()-.5).map(v=>({v,up:false,found:false}));opened=[];matched=0;moves=0;locked=false;done=false;render()}function pick(i){if(done||locked||cards[i].found||cards[i].up)return;cards[i].up=true;opened.push(i);if(opened.length===2){moves++;const [a,b]=opened;if(cards[a].v===cards[b].v){cards[a].found=cards[b].found=true;matched++;opened=[];if(matched===8){done=true;finish(Math.max(50,1200-moves*25))}}else{locked=true;timeout=setTimeout(()=>{cards[a].up=cards[b].up=false;opened=[];locked=false;timeout=null;render()},700)}}render()}function render(){board.innerHTML="";cards.forEach((card,i)=>{const b=document.createElement("button");b.className="tile "+(card.found?"found":card.up?"lit":"dark");const front=card.up||card.found;b.innerHTML=front?'<span class="glyph">'+["✦","☽","⚔","◆","☀","♜","✧","☄"][card.v]+'</span>':'<img src="./sprites/void-sigil.svg" alt="">';b.setAttribute("aria-label",front?"Revealed sigil":"Hidden sigil");b.onclick=()=>pick(i);board.append(b)});status.textContent=done?"All crypt sigils recovered!":matched+"/8 pairs · "+moves+" attempts"}
document.getElementById("restart").onclick=reset;reset()})();
</script></body></html>
