<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stack Tower | Chaos Cartridge</title><style>:root{color-scheme:dark;--pink:#ff5edb;--green:#a8ff48}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 15% 0,#35132d 0,transparent 36%),radial-gradient(ellipse at 95% 10%,#14303a 0,transparent 34%),#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto}.back{display:inline-block;color:#f5f7fb;text-decoration:none;font-weight:900;margin:0 0 12px}.panel{padding:clamp(12px,3vw,22px);border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(155deg,#171a26f5,#0b0e17f7);box-shadow:0 16px 45px #0006}.kicker{color:var(--pink);font-size:.68rem;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(2rem,7vw,3.5rem);line-height:.95;letter-spacing:-.06em;margin:.4rem 0}.title span{color:var(--green)}.muted{color:#aeb9c8;line-height:1.5}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:12px 0;font-weight:900}.hud b{color:var(--green)}canvas{display:block;width:100%;max-width:480px;margin:0 auto;border:1px solid #a8ff4850;border-radius:12px;background:#0b1018;touch-action:none}.btn{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(135deg,#a8ff48,#ff5edb);color:#100c13;font-weight:900;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.stack{aspect-ratio:420/620;cursor:pointer}</style></head><body><main class="wrap"><a class="back" href="/chaos-cartridge.html">← Chaos Cartridge</a><section class="panel"><div class="kicker">KNIGHTFALL NATIVE / SKILL</div><h1 class="title">STACK<br><span>TOWER.EXE</span></h1><p class="muted">Tap to drop each moving block. Keep the overlap, lose the excess. Build the tallest tower before your precision becomes a rumor.</p><div class="hud"><span>HEIGHT <b id="score">0</b></span><span id="state">READY</span></div><canvas id="game" class="stack" width="420" height="620" aria-label="Stack Tower game"></canvas><div class="controls"><button class="btn" id="restart">New tower</button><span class="muted">Tap/click to drop · local score only</span></div></section></main><script>
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);let blocks,active,over,score,dir,cam,last;
function init(){blocks=[{x:90,w:240,y:550}];active={x:0,w:240,y:500};dir=1;over=false;score=0;cam=0;last=0;$("score").textContent=0;$("state").textContent="DROP";requestAnimationFrame(loop);}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over){active.x+=dir*(180+score*9)*dt;if(active.x<0){active.x=0;dir=1;}if(active.x+active.w>420){active.x=420-active.w;dir=-1;}}draw();requestAnimationFrame(loop);}
function drop(){if(over)return;const prev=blocks[blocks.length-1],left=Math.max(active.x,prev.x),right=Math.min(active.x+active.w,prev.x+prev.w),w=right-left;if(w<12){over=true;$("state").textContent="TOWER COLLAPSED";return;}blocks.push({x:left,w,y:prev.y-50});score++;$("score").textContent=score;active={x:dir>0?0:420-w,w,y:prev.y-100};dir=dir>0?-1:1;if(blocks.length>9){blocks.forEach(b=>b.y+=50);active.y+=50;}if(score>=30){$("state").textContent="TOWER LEGEND";over=true;}}
function draw(){x.clearRect(0,0,420,620);const g=x.createLinearGradient(0,0,420,620);g.addColorStop(0,"#151c29");g.addColorStop(1,"#080a0f");x.fillStyle=g;x.fillRect(0,0,420,620);x.strokeStyle="#ffffff12";for(let i=0;i<9;i++){x.beginPath();x.moveTo(i*52,0);x.lineTo(i*52,620);x.stroke();}for(let i=0;i<blocks.length;i++){const b=blocks[i];x.fillStyle=i%2?"#ff5edb":"#a8ff48";x.shadowColor=x.fillStyle;x.shadowBlur=9;x.fillRect(b.x,b.y,b.w,46);x.shadowBlur=0;x.strokeStyle="#ffffff60";x.strokeRect(b.x,b.y,b.w,46);}if(!over){x.fillStyle="#45d9ff";x.shadowColor="#45d9ff";x.shadowBlur=12;x.fillRect(active.x,active.y,active.w,46);x.shadowBlur=0;}if(over){x.fillStyle="#080a0fdd";x.fillRect(0,0,420,620);x.fillStyle="#a8ff48";x.textAlign="center";x.font="bold 29px system-ui";x.fillText(score>=30?"TOWER LEGEND":"TOWER COLLAPSED",210,300);x.fillStyle="#fff";x.font="17px system-ui";x.fillText("Height: "+score,210,330);}}
c.addEventListener("pointerdown",drop);$("restart").addEventListener("click",init);init();
</script><script src="/arcade/hosted/arcade-account-bridge.js" data-game-id="cabinet-stack-tower" data-score-mode="score" data-score-selector="#score"></script>
</body></html>
