<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Breaker | Chaos Cartridge</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#48281f,#0d0f18 75%);color:#ffe9d3;font:16px system-ui}main{max-width:800px;margin:auto}a{color:#ffbb7d}h1{font-size:clamp(2rem,7vw,3.6rem);color:#ffa15e}canvas{display:block;width:100%;height:auto;border:3px solid #ca804d;border-radius:12px;touch-action:none}p{line-height:1.5;color:#d7c3b7}button{padding:12px 18px;margin:12px 8px 0 0;background:#643729;border:1px solid #e0975b;color:#ffe6c9;border-radius:9px;font-weight:800;cursor:pointer}</style><link rel="stylesheet" href="/arcade-cabinet-ui.css?v=20261030-audit"><script src="/arcade-cabinet-ui.js?v=20261030-audit" defer></script></head><body><main><a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Crypt Breaker</h1><canvas id="game" width="720" height="500"></canvas><p>Move the paddle with mouse, touch or arrow keys. Clear the crypt walls to advance.</p><button id="restart">New run</button><button id="pause">Pause</button><p id="stats"></p><script>
(()=>{const c=document.getElementById("game"),g=c.getContext("2d"),s=document.getElementById("stats"),keys=new Set(),imgs=["ember-orb","crypt-brick"].map(n=>{let i=new Image();i.src="./sprites/"+n+".svg";return i});let pad,ball,bricks,score,lives,wave,active,paused,last=0,reported=false;const clamp=(v,a,z)=>Math.max(a,Math.min(z,v));function setupWave(){bricks=[];for(let r=0;r<4+Math.min(wave,3);r++)for(let col=0;col<10;col++)bricks.push({x:29+col*67,y:52+r*29,alive:true,hp:wave>2&&r<2?2:1});ball={x:360,y:390,vx:165+(wave-1)*18,vy:-240-(wave-1)*20}}function reset(){pad=360;score=0;lives=3;wave=1;active=true;paused=false;reported=false;setupWave()}function finish(){active=false;if(reported)return;reported=true;try{localStorage.setItem("ashfall:crypt-breaker:best",String(Math.max(score,Number(localStorage.getItem("ashfall:crypt-breaker:best"))||0)))}catch{}if(window.AshFallArcade?.recordScore)Promise.resolve(window.AshFallArcade.ready).then(()=>window.AshFallArcade.recordScore("crypt-breaker",score,{score,game:"crypt-breaker",wave})).catch(()=>{})}function step(dt){if(!active||paused)return;pad=clamp(pad+((keys.has("ArrowRight")?1:0)-(keys.has("ArrowLeft")?1:0))*450*dt,52,668);let prevX=ball.x,prevY=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<12||ball.x>708){ball.x=clamp(ball.x,12,708);ball.vx=-ball.vx}if(ball.y<12){ball.y=12;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&prevY<=452&&ball.y>=452&&Math.abs(ball.x-pad)<63){ball.y=452;ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-pad)*2.6;ball.vx=clamp(ball.vx,-430,430)}for(const brick of bricks){if(!brick.alive)continue;if(ball.x+10>brick.x&&ball.x-10<brick.x+62&&ball.y+10>brick.y&&ball.y-10<brick.y+24){brick.hp--;if(!brick.hp){brick.alive=false;score+=10*wave}if(prevY+10<=brick.y||prevY-10>=brick.y+24)ball.vy=-ball.vy;else ball.vx=-ball.vx;break}}if(ball.y>515){lives--;if(!lives)finish();else ball={x:pad,y:390,vx:170,vy:-260}}if(bricks.every(b=>!b.alive)){wave++;score+=100;setupWave()}}function draw(){g.fillStyle="#15151f";g.fillRect(0,0,720,500);for(const brick of bricks)if(brick.alive){g.fillStyle=brick.hp===2?"#8f6ea8":"#bd633e";g.fillRect(brick.x,brick.y,62,24);if(imgs[1].complete&&imgs[1].naturalWidth)g.drawImage(imgs[1],brick.x+18,brick.y+1,24,22);g.strokeStyle="#ffd29b";g.strokeRect(brick.x,brick.y,62,24)}g.fillStyle="#f2a268";g.fillRect(pad-53,462,106,15);g.fillStyle="#ffe6bb";g.beginPath();g.arc(ball.x,ball.y,10,0,7);g.fill();if(imgs[0].complete&&imgs[0].naturalWidth)g.drawImage(imgs[0],ball.x-11,ball.y-11,22,22);g.fillStyle="#ffdbab";g.font="bold 20px system-ui";g.fillText("Score "+score+"   Lives "+lives+"   Wave "+wave,20,27);if(!active||paused){g.fillStyle="#090a13c4";g.fillRect(0,0,720,500);g.fillStyle="#ffe1b4";g.textAlign="center";g.font="bold 38px system-ui";g.fillText(paused?"PAUSED":"RUN OVER",360,250)}s.textContent="Score "+score+" · Lives "+lives+" · Wave "+wave}function frame(t){let dt=Math.min(.03,last?(t-last)/1000:0);last=t;step(dt);draw();requestAnimationFrame(frame)}function pointer(e){let r=c.getBoundingClientRect();pad=clamp((e.clientX-r.left)*720/r.width,52,668)}c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);pointer(e)});c.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")pointer(e)});document.addEventListener("keydown",e=>{if(e.key.startsWith("Arrow")){e.preventDefault();keys.add(e.key)}});document.addEventListener("keyup",e=>keys.delete(e.key));document.getElementById("restart").onclick=reset;document.getElementById("pause").onclick=()=>{if(active)paused=!paused};document.addEventListener("visibilitychange",()=>{if(document.hidden)paused=true});reset();requestAnimationFrame(frame)})();
</script><p id="arcade-account-status">Local play available.</p></main><script src="/arcade-save.js"></script></body></html>
