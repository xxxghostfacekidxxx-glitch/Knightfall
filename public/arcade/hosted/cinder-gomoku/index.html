<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinder Gomoku</title><style>body{background:#0a0b10;color:white;font:16px system-ui;text-align:center;padding:12px;margin:0}h1{color:#ff5fca}a{color:#9f9}#board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px;max-width:550px;margin:20px auto;background:#49414d;padding:6px;border-radius:10px}#board button{aspect-ratio:1;min-width:0;border:0;background:#c3a780;border-radius:3px;padding:0;touch-action:manipulation}#board button.p1:after,#board button.p2:after{content:'';display:block;width:80%;height:80%;margin:auto;border-radius:50%;background:#ff4dc8}#board button.p2:after{background:#111}#restart{padding:12px 20px;background:#ff5fca;border:0;border-radius:8px;font-weight:bold}#status{min-height:2em}</style><a href="/arcade-card-board.html">← Card & Board Games</a><h1>Cinder Gomoku</h1><p>Five stones in a row wins. You play pink; the CPU plays black.</p><p id="status" role="status"></p><div id="board" aria-label="Gomoku board"></div><button id="restart">New game</button><script>(()=>{'use strict';const N=11,board=document.getElementById('board'),status=document.getElementById('status');let cells,turn,done;const idx=(x,y)=>y*N+x;const valid=(x,y)=>x>=0&&y>=0&&x<N&&y<N;function count(x,y,p,dx,dy){let n=1;for(const s of [-1,1]){let a=x+dx*s,b=y+dy*s;while(valid(a,b)&&cells[idx(a,b)]===p){n++;a+=dx*s;b+=dy*s}}return n}function win(x,y,p){return [[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>count(x,y,p,dx,dy)>=5)}function options(){return cells.map((p,i)=>p?-1:i).filter(i=>i>=0)}function render(message){board.replaceChildren();cells.forEach((p,i)=>{const b=document.createElement('button');b.className=p?'p'+p:'';b.disabled=done||turn!==1||p!==0;b.setAttribute('aria-label','Row '+(Math.floor(i/N)+1)+' column '+(i%N+1)+(p?' occupied':''));b.onclick=()=>move(i,1);board.append(b)});status.textContent=message||(turn===1?'Your move':'CPU move')}function move(i,p){if(done||turn!==p||cells[i])return;cells[i]=p;const x=i%N,y=Math.floor(i/N);if(win(x,y,p)){done=true;render(p===1?'You win!':'CPU wins');return}if(!options().length){done=true;render('Draw');return}turn=3-p;render();if(turn===2)setTimeout(cpu,180)}function cpu(){if(done||turn!==2)return;const free=options();let pick=-1;for(const p of [2,1]){for(const i of free){cells[i]=p;const winning=win(i%N,Math.floor(i/N),p);cells[i]=0;if(winning){pick=i;break}}if(pick>=0)break}if(pick<0){const scored=free.map(i=>{const x=i%N,y=Math.floor(i/N);let score=0;for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)if(valid(x+a,y+b)){const v=cells[idx(x+a,y+b)];if(v)score+=(3-Math.max(Math.abs(a),Math.abs(b)))*(v===2?2:1)}return {i,score:score+Math.random()*.2}});scored.sort((a,b)=>b.score-a.score);pick=scored[0].i}move(pick,2)}function start(){cells=Array(N*N).fill(0);turn=1;done=false;render()}document.getElementById('restart').onclick=start;start()})();</script></html>
