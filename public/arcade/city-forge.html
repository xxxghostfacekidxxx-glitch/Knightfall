<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash-Fall City Forge</title><style>body{font:16px system-ui;background:#0b0b14;color:#fff;max-width:850px;margin:auto;padding:16px}h1{color:#ff55d8}a{color:#c6ff45}button{cursor:pointer}#palette{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#palette button,.actions button{padding:12px;background:#252535;color:#fff;border:1px solid #c6ff45;border-radius:8px}#map{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;touch-action:none}#map button{aspect-ratio:1;border:0;padding:0;min-width:0}#map button:focus-visible{outline:2px solid #fff}.actions{display:flex;gap:10px;margin:15px 0}#status{color:#c6ff45}</style><a href="/arcade-30-games.html">← Arcade</a><h1>ASH-FALL CITY FORGE</h1><p>Paint a 24×24 city map for GTA-2W. Download the map JSON and commit it as <code>vendor/fable-gta/src/data/map.json</code> to rebuild the game.</p><div id="palette"></div><div id="map" aria-label="Editable city grid"></div><div class="actions"><button id="play">▶ Play this city</button><button id="download">Download map.json</button><button id="clear">Clear map</button></div><p id="status" role="status">Choose a tile, then paint the city.</p><script>
const legend={'s':'sidewalk','-':'road_h','|':'road_v','+':'intersection','g':'grass','w':'water','B':'building','T':'building_tall'},colors={'s':'#85818d','-':'#45404c','|':'#45404c','+':'#45404c','g':'#39895b','w':'#3174ad','B':'#ed55ad','T':'#c6ff45'},map=document.getElementById('map');let brush='-',drawing=false,rows=Array.from({length:24},(_,y)=>Array.from({length:24},(_,x)=>x===12?'|':y===12?'-':'g'));rows[12][12]='+';const refresh=()=>[...map.children].forEach((b,i)=>b.style.background=colors[rows[Math.floor(i/24)][i%24]]);for(const [id,name] of Object.entries(legend)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{brush=id;document.getElementById('status').textContent='Painting '+name};document.getElementById('palette').append(b)}for(let i=0;i<576;i++){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','City tile '+(i+1));const paint=()=>{rows[Math.floor(i/24)][i%24]=brush;b.style.background=colors[brush]};b.onpointerdown=()=>{drawing=true;paint()};b.onpointerenter=()=>{if(drawing)paint()};b.onclick=paint;map.append(b)}window.onpointerup=()=>drawing=false;document.getElementById('clear').onclick=()=>{rows=Array.from({length:24},()=>Array(24).fill('g'));refresh()};document.getElementById('play').onclick=()=>{const data={name:'Ash-Fall Custom City',legend,rows:rows.map(r=>r.join('')),playerSpawn:{position:{x:22,y:0,z:18},rotationY:0},objects:[],vehicleSpawns:[],pedestrianSpawns:[]};try{localStorage.setItem('ashfall-city-forge-map-v1',JSON.stringify(data));location.href='/arcade/hosted/fable-gta/index.html'}catch(e){document.getElementById('status').textContent='Cannot transfer city: '+e.message}};document.getElementById('download').onclick=()=>{const data={name:'Ash-Fall Custom City',legend,rows:rows.map(r=>r.join('')),playerSpawn:{position:{x:22,y:0,z:18},rotationY:0},objects:[],vehicleSpawns:[],pedestrianSpawns:[]};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ash-fall-city-map.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};refresh();
</script></html>
