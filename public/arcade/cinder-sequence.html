<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120e1c"><title>Cinder Sequences | Knightfall</title>
<style>
:root{color-scheme:dark;--panel:#1b1426;--line:#59466a;--gold:#f5d176}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 50% -20%,#3a1d49,#120e1c 65%);color:#f6edf9;font:16px system-ui;margin:0;padding:clamp(12px,4vw,36px)}main{max-width:900px;margin:auto}a{color:#f6a5df}button,select{font:inherit;color:inherit;background:#30243e;border:1px solid #806294;border-radius:12px;padding:10px 12px;min-height:46px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{outline:3px solid var(--gold)}button:focus-visible,select:focus-visible{outline:3px solid white}.panel{background:#1b1426d9;border:1px solid var(--line);border-radius:16px;padding:clamp(12px,3vw,20px);margin:14px 0}.row,.hand{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.row{align-items:center}.seat{flex:1;min-width:125px}.seat.active{border-color:var(--gold);box-shadow:0 0 14px #f5d17635}.card{min-width:72px;display:grid;gap:3px}.card strong{font-size:1.45rem}.ash{color:#d0d5e0}.ember{color:#ff9970}.moon{color:#b6baff}.thorn{color:#a8e8ad}#status{min-height:2em}.subtle{color:#c5b8d1;font-size:.92rem}h1{font-size:clamp(2rem,6vw,3rem);margin:.45em 0}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}button:hover:not(:disabled){background:#49365d}}
</style>
</head>
<body><main>
<a href="/chaos-cartridge.html">← Chaos Cartridge</a><h1>Cinder Sequences</h1>
<p class="subtle">An original Knightfall card game. Draw, forge three same-sigil cards in consecutive ranks, then discard. First to three forged sequences wins.</p>
<section class="panel" id="setup"><label for="player-count">Seats (you plus bot opponents) </label><select id="player-count"><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select> <button id="start">Start table</button></section>
<section class="panel" aria-labelledby="table-title"><h2 id="table-title">Table</h2><div class="row" id="seats"></div><p id="round" class="subtle"></p><p id="status" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>Your cards</h2><div class="hand" id="hand"></div><div class="row"><button id="draw-deck">Draw from deck</button><button id="draw-discard">Draw discard</button><button id="meld">Forge selected trio</button><button id="discard" disabled>Discard selected</button></div><p class="subtle">After drawing, forge a legal trio if you can, then discard one card to end your turn.</p></section>
<button id="restart">New game</button>
</main>
<script type="module">
import {newGame,move,chooseBotMove,validSequence} from "./cinder-sequences.mjs";
let state=null,selected=new Set(),busy=false;
const $=id=>document.getElementById(id),names=["You","Lydibug","Butters","Eddie"],sigils={ash:"◆",ember:"✦",moon:"☾",thorn:"✿"};
function picked(){return state?.hands[0].filter(card=>selected.has(card.id))||[]}
function announce(message){$("status").textContent=message}
function render(){if(!state)return;const hand=state.hands[0]||[];$("hand").replaceChildren();$("seats").replaceChildren();state.scores.forEach((score,index)=>{const seat=document.createElement("div");seat.className="seat panel"+(state.turn===index&&state.winner===null?" active":"");seat.textContent=names[index]+" · "+score+" / 3 sequences";$("seats").append(seat)});$("round").textContent=state.winner!==null?"Game finished.":"Turn "+(Math.floor(state.turn/state.hands.length)+1)+" · "+(state.phase==="draw"?names[state.turn]+" draws a card.":names[state.turn]+(state.phase==="meld"?" may forge a trio or discard.":" discards to end the turn."));for(const card of hand){const button=document.createElement("button");button.className="card "+card.suit;button.type="button";button.setAttribute("aria-pressed",String(selected.has(card.id)));button.disabled=busy||state.turn!==0||state.winner!==null;const suit=document.createElement("span");suit.textContent=sigils[card.suit]+" "+card.suit;const rank=document.createElement("strong");rank.textContent=String(card.rank);button.append(suit,rank);button.onclick=()=>{selected.has(card.id)?selected.delete(card.id):selected.add(card.id);render()};$("hand").append(button)}const cards=picked();$("draw-deck").disabled=busy||state.winner!==null||state.turn!==0||state.phase!=="draw"||!state.deck.length;$("draw-discard").disabled=busy||state.winner!==null||state.turn!==0||state.phase!=="draw"||!state.discard.length;$("meld").disabled=busy||state.winner!==null||state.turn!==0||state.phase!=="meld"||cards.length!==3||!validSequence(cards);$("discard").disabled=busy||state.winner!==null||state.turn!==0||!['meld','discard'].includes(state.phase)||cards.length!==1}
function act(action){if(!state||busy||state.turn!==0)return false;const ok=move(state,0,action);if(ok){selected.clear();render()}return ok}
async function runBots(){busy=true;render();for(let count=0;count<30&&state.winner===null&&state.turn!==0;count++){await new Promise(resolve=>setTimeout(resolve,180));const action=chooseBotMove(state);if(!move(state,state.turn,action)){state.phase="finished";state.winner=state.scores.indexOf(Math.max(...state.scores));break}render()}busy=false;render();if(state.winner!==null)announce(names[state.winner]+" wins with "+state.scores[state.winner]+" forged sequences.");else announce("Your turn.")}
function finishAction(ok,message){if(!ok){announce(message);return}if(state.winner!==null){render();announce(names[state.winner]+" wins with "+state.scores[state.winner]+" forged sequences.");return}render();if(state.turn!==0)runBots();else announce(message)}
function start(){state=newGame(Number($("player-count").value));selected.clear();$("setup").hidden=true;render();announce("Your table is ready. Draw a card to start your turn.")}
$("start").onclick=start;$("restart").onclick=()=>{state=null;selected.clear();busy=false;$("setup").hidden=false;$("hand").replaceChildren();$("seats").replaceChildren();$("round").textContent="";announce("")};
$("draw-deck").onclick=()=>{const ok=act({type:"draw",from:"deck"});finishAction(ok,"The deck is empty; draw from the discard pile.")};$("draw-discard").onclick=()=>finishAction(act({type:"draw",from:"discard"}),"There is no discard to draw.");
$("meld").onclick=()=>{const cards=picked();finishAction(act({type:"meld",ids:cards.map(card=>card.id)}),"Sequence forged. Discard one card to finish your turn.")};$("discard").onclick=()=>{const [card]=picked();finishAction(act({type:"discard",id:card?.id}),"Card discarded.")};
</script>
</body></html>
