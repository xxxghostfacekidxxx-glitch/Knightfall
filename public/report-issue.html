<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an issue · Knightfall</title><link rel="stylesheet" href="/theme.css"><script src="/nav.js" defer></script><style>main{max-width:690px;margin:3rem auto;padding:1.4rem;background:#17141f;color:#f4e9f4;border:1px solid #915b83;border-radius:18px;font:16px/1.6 system-ui}label{display:block;margin:1rem 0;font-weight:700}input,textarea{display:block;width:100%;box-sizing:border-box;padding:.8rem;border-radius:10px;background:#262131;color:#fff;border:1px solid #a786a7;font:inherit}button{padding:.8rem 1.3rem;background:#cf4c98;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer}a{color:#f4a7d5}#status{min-height:2em}</style></head><body><header class="kf-header"></header><main><h1>Report a Knightfall issue</h1><p>Reports go to Knightfall administrators, not GitHub. Sign in before submitting. Include what happened and how to reproduce it. Never include passwords or private keys.</p><form id="report"><label>Game or site area<input id="game" maxlength="120" required></label><label>What went wrong?<textarea id="description" minlength="12" maxlength="3000" rows="7" required placeholder="What did you do, what happened, and what should have happened?"></textarea></label><button type="submit">Send to admins</button></form><p id="status" role="status" aria-live="polite"></p></main><script>const params=new URLSearchParams(location.search),form=document.getElementById("report"),status=document.getElementById("status");document.getElementById("game").value=(params.get("game")||"General site issue").slice(0,120);form.addEventListener("submit",async event=>{event.preventDefault();const button=form.querySelector("button");button.disabled=true;status.textContent="Submitting…";try{const response=await fetch("/api/arcade-issues",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:document.getElementById("game").value,description:document.getElementById("description").value,page_url:location.pathname+location.search})});const data=await response.json();if(!response.ok)throw Error(data.error||"Report could not be submitted.");status.textContent="Report received by the Knightfall admin queue. Reference #"+(data.id||"pending");form.reset();}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
