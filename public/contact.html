<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Knightfall Admins</title><link rel="stylesheet" href="/theme.css"><script src="/nav.js" defer></script><style>main{max-width:680px;margin:3rem auto;padding:1.5rem;background:#1c1724;color:#f5e9f3;border:1px solid #98698e;border-radius:18px;font:16px/1.6 system-ui}label{display:block;margin:1rem 0}textarea{width:100%;box-sizing:border-box;min-height:160px;padding:.8rem;background:#292235;color:white;border:1px solid #b78baa;border-radius:12px;font:inherit}button{background:#c44a95;color:white;padding:.8rem 1.3rem;border:0;border-radius:10px;font-weight:bold}</style></head><body><header class="kf-header"></header><main><h1>Contact Knightfall</h1><p>Send a private message directly to the Knightfall administrator queue. Sign in first. Never include passwords or payment details.</p><form id="contact"><label>Your message<textarea id="message" required minlength="12" maxlength="3000" placeholder="How can we help?"></textarea></label><button type="submit">Send to admins</button></form><p id="status" role="status" aria-live="polite"></p></main><script>document.getElementById("contact").addEventListener("submit",async e=>{e.preventDefault();const button=e.target.querySelector("button"),status=document.getElementById("status");button.disabled=true;status.textContent="Sending…";try{const response=await fetch("/api/arcade-issues",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:"Contact Us",description:document.getElementById("message").value,page_url:"/contact.html"})});const data=await response.json();if(!response.ok)throw Error(data.error||"Message not sent.");status.textContent="Your message has been sent to the Knightfall admin queue. Reference #"+(data.id||"pending");e.target.reset();}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
