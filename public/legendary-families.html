<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legendary Families · Knightfall</title><link rel="stylesheet" href="/theme.css"><style>main{max-width:1120px;margin:auto;padding:20px}.legendary-pair{border:1px solid #aa4d93;border-radius:24px;padding:20px;margin:20px 0;background:#160b23}.legendary-pair-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.legendary-character{margin:0;text-align:center}.legendary-scene{height:290px;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 60% 45%,#692458,#120c20 70%)}.legendary-scene img{position:absolute;object-fit:contain;max-width:100%;height:auto}.legendary-mount{width:68%;height:82%!important;right:0;bottom:0;left:auto}.legendary-rider{width:46%;height:76%!important;left:2%;bottom:0;filter:drop-shadow(0 8px 10px #000)}figcaption{padding:12px;font-weight:800;color:#ffd4f0}.legendary-tagline{margin:0 0 14px;color:#f7b9e7;font-style:italic}a{color:#ffa7db}.legendary-image-status{position:absolute;bottom:8px;left:8px;right:8px;background:#160b23e8;color:#fff;padding:8px;border-radius:8px}.art-missing .legendary-scene{outline:2px solid #ff8fb7}@media(max-width:520px){.legendary-pair{padding:12px}.legendary-scene{height:245px}.legendary-rider{width:48%}}@media(prefers-reduced-motion:reduce){.legendary-scene *{animation:none!important;transition:none!important}} .legendary-theme-switch{display:flex;flex-wrap:wrap;gap:.75rem;margin:1.5rem 0}.legendary-theme-switch button{min-height:44px;border:1px solid #e88bc4;border-radius:999px;background:#23132d;color:#ffe8f7;padding:.7rem 1rem;font:700 1rem system-ui;cursor:pointer}.legendary-theme-switch button[aria-pressed="true"]{background:#f3b2dc;color:#1d0920}.legendary-theme-switch button:focus-visible{outline:3px solid #d4ff69;outline-offset:3px}.legendary-pair[data-duo="boogie-minion"]{background:linear-gradient(145deg,#1a0d2bd9,#090d1df2),url("/assets/knightfall/themes/boogie-minion-realm.svg") center/cover}.legendary-pair[data-duo="villain-eddie"]{border-color:#f3a54c;background:linear-gradient(145deg,#2a0d1cd9,#130a0cf2),url("/assets/knightfall/themes/villain-eddie-realm.svg") center/cover}.legendary-pair[hidden]{display:none!important}.legendary-scene img{pointer-events:none}.legendary-scene .legendary-mount{object-position:right bottom}.legendary-scene .legendary-rider{object-position:left bottom}@media(max-width:520px){.legendary-pair-grid{grid-template-columns:minmax(0,1fr)}.legendary-theme-switch button{flex:1 1 100%}} </style></head><body><main><p><a href="/profile-edit.html">← Edit profile</a></p><h1>Legendary Families</h1><p>Meet the four legendary characters and their illustration companions. These are theme-art previews, not unlockable mounts or battle abilities.</p><nav class="legendary-theme-switch" aria-label="Preview legendary duo artwork"><button type="button" data-preview="boogie-minion" aria-pressed="true">🌙 Midnight &amp; Mayhem</button><button type="button" data-preview="villain-eddie" aria-pressed="false">🔥 Tiny Tyrants</button><button type="button" data-preview="all" aria-pressed="false">Show both</button></nav><div id="legendary-pairs" aria-live="polite"></div></main><script type="module">import{mountPairScenes}from"/legendary-pair-scenes.mjs";mountPairScenes(document.getElementById("legendary-pairs"));const sections=[...document.querySelectorAll(".legendary-pair")];const buttons=[...document.querySelectorAll("[data-preview]")];const allowed=new Set(buttons.map(button=>button.dataset.preview));function selectPreview(requested,{persist=true}={}){const selected=allowed.has(requested)?requested:"boogie-minion";buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.preview===selected)));sections.forEach(section=>{section.hidden=selected!=="all"&&section.dataset.duo!==selected});if(persist){const url=new URL(location.href);url.searchParams.set("duo",selected);history.replaceState(null,"",url)}}buttons.forEach(button=>button.addEventListener("click",()=>selectPreview(button.dataset.preview)));selectPreview(new URLSearchParams(location.search).get("duo"),{persist:false});window.addEventListener("popstate",()=>selectPreview(new URLSearchParams(location.search).get("duo"),{persist:false}))</script></body></html>
