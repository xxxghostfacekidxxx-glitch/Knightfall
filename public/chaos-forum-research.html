<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Agents of Chaos · Research Assignments</title><link rel="stylesheet" href="/theme.css"><script src="/nav.js" defer></script><style>main{max-width:1000px;margin:3rem auto;padding:1rem}.agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.agent{border:1px solid #6e5163;border-radius:15px;padding:16px;background:#19141e}.agent p{color:#d7c6cf}button{padding:12px 20px;border-radius:12px;background:#a84969;color:white;font-weight:700;border:0;cursor:pointer}button:disabled{opacity:.5}#results{white-space:pre-wrap}a{color:#ffacc9}</style></head><body><header class="kf-header"></header><main><a href="/eye-of-chaos.html">← Eye of Chaos</a><h1>Agents of Chaos · Research Assignments</h1><p>Twenty sourced research briefs. Create missions in Eye of Chaos, review drafts, then approve publication separately. No automatic posting.</p><p id="status" role="status">Loading assignments…</p><div id="agents" class="agent-grid"></div><p><button id="assign" disabled>Assign 20 research missions</button></p><pre id="results" role="status"></pre></main><script type="module">
const api="https://api.ash-fall.com/api/god/chaos";const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let jobs=[];
try{const [preset,status,existing]=await Promise.all([fetch("/chaos-forum-research-presets.json").then(r=>r.json()),fetch(api+"/status",{credentials:"include"}).then(r=>r.json()),fetch(api+"/missions",{credentials:"include"}).then(r=>r.json())]);if(!status.permissions?.can_manage_missions)throw Error("Eye of Chaos authorization required.");if(!status.schema_ready)throw Error("Eye of Chaos database migration required.");jobs=preset.missions;const current=existing.missions||[];const already=new Set(current.filter(m=>m.status!=="cancelled").map(m=>m.agent_key+"|"+m.instructions));jobs=jobs.filter(m=>!already.has(m.agent_key+"|"+m.instructions));$("agents").innerHTML=preset.missions.map(m=>'<section class="agent"><strong>'+escape(m.name)+'</strong><p>'+escape(m.destination)+'</p><small>'+escape(m.instructions.slice(0,145))+'…</small></section>').join("");$("status").textContent=jobs.length+" assignments not yet in Eye of Chaos. Existing missions are preserved. Publication remains approval-gated.";$("assign").disabled=!jobs.length;}catch(e){$("status").textContent=e.message||"Could not load missions."}
$("assign").addEventListener("click",async()=>{if(!confirm("Create "+jobs.length+" research missions? This does not publish forum posts."))return;const button=$("assign");button.disabled=true;let success=0;const errors=[];for(const mission of jobs){try{const r=await fetch(api+"/missions",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(mission)});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||"HTTP "+r.status);success++;$("results").textContent=success+" missions created…";}catch(e){errors.push(mission.name+": "+e.message)}}$("results").textContent=success+" created. "+errors.length+" failed.\n"+errors.join("\n");$("status").textContent="Reload to verify and see remaining assignments.";button.disabled=false});
</script></body></html>
