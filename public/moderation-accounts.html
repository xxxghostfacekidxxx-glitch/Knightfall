<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash-Fall | Account Recovery Tools</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/auth.css">
<style>.tools{width:min(100%,760px);margin:2rem auto;position:relative;z-index:1}.search-row{display:flex;gap:.6rem;margin:1.2rem 0}.search-row input{flex:1;min-width:0}.member{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;border-top:1px solid #292929}.member small{display:block;color:#999;margin-top:.25rem}.member button{white-space:nowrap}.note{color:#aaa;line-height:1.6;margin-top:.7rem}@media(max-width:520px){.member{align-items:flex-start;flex-direction:column}.search-row{flex-direction:column}}</style>
</head><body><main class="auth-shell tools"><section class="auth-card"><a class="back" href="/homepage.html">← Back to community</a><h1>ACCOUNT RECOVERY.</h1><p class="muted">Moderator tools. Reset links go to the account's registered email; staff never see or choose a member's password.</p>
<form id="search-form" class="search-row"><input id="query" minlength="2" maxlength="80" placeholder="Search username or display name" required><button class="primary" type="submit">Search</button></form><p class="note">Moderators can initiate recovery for member accounts. Administrator accounts are restricted to administrators. Every reset request is audited.</p><p id="status" class="status" role="status" aria-live="polite"></p><div id="results"></div></section></main>
<script>
const API="https://api.ash-fall.com",q=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path,options={}){const r=await fetch(API+path,{credentials:"include",cache:"no-store",...options,headers:{"content-type":"application/json",...(options.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}
function msg(s,error=false){q("#status").textContent=s;q("#status").className="status "+(error?"error":"success")}
async function search(){const query=q("#query").value.trim();if(query.length<2)return;msg("Searching…");try{const d=await api("/api/moderation/users?q="+encodeURIComponent(query));q("#results").innerHTML=d.users.map(u=>'<article class="member"><div><strong>'+esc(u.display_name||u.username)+'</strong><small>@'+esc(u.username)+' · '+esc(u.role)+' · '+esc(u.status)+'</small></div><button class="primary" data-reset="'+u.id+'" '+(u.status!=="active"?"disabled":"")+'>Send reset link</button></article>').join("")||'<p class="note">No matching accounts found.</p>';msg("Found "+d.users.length+" account(s).",true)}catch(e){msg(e.message,true)}}
q("#search-form").addEventListener("submit",e=>{e.preventDefault();search()});
q("#results").addEventListener("click",async e=>{const b=e.target.closest("[data-reset]");if(!b)return;if(!confirm("Send a password reset link to this account's registered email?"))return;b.disabled=true;try{const d=await api("/api/moderation/users/"+b.dataset.reset+"/password-reset",{method:"POST",body:"{}"});msg(d.message||"Reset link sent.",true)}catch(err){msg(err.message,true)}finally{b.disabled=false}});
(async()=>{try{const d=await api("/api/auth/me");if(!["moderator","admin"].includes(d.user?.role))throw Error("Moderator access required.");msg("Moderator recovery tools ready.",true)}catch(e){msg(e.message,true);q("#search-form").hidden=true}})();
</script></body></html>
