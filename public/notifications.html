<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knightfall | Notifications</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/notifications.css"></head><body><header class="kf-header"></header><main class="notifications-shell"><section class="notifications-hero"><div><p class="eyebrow">COMMUNITY SIGNALS</p><h1>Notifications<span>.</span></h1><p>Replies, follows, messages, and other events that actually matter.</p></div><button id="read-all">Mark all read</button></section><div id="status"></div><section id="notifications"></section></main><script src="/nav.js"></script><script>
const API="https://api.ash-fall.com",root=document.querySelector("#notifications"),status=document.querySelector("#status"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=v=>new Date(v).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
async function api(p,o={}){const r=await fetch(API+p,{credentials:"include",cache:"no-store",...o,headers:{"content-type":"application/json",...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}
async function load(){try{const d=await api("/api/notifications?limit=100");root.innerHTML=(d.notifications||[]).map(n=>'<article class="notice '+(n.read_at?"read":"unread")+'" data-notice="'+n.id+'"><div class="notice-icon">'+(n.kind==="message"?"✉":n.kind==="follow"?"✦":"•")+'</div><div><strong>'+esc(n.title)+'</strong><p>'+esc(n.body)+'</p><small>'+esc(fmt(n.created_at))+(n.actor_username?" · @"+esc(n.actor_username):"")+'</small></div>'+(n.url?'<a class="notice-link" href="'+esc(n.url)+'">Open</a>':"")+'</article>').join("")||'<p class="empty">Nothing new. The silence is almost suspicious.</p>';document.querySelectorAll("[data-notice]").forEach(x=>x.onclick=async()=>{if(!x.classList.contains("unread"))return;await api("/api/notifications/"+x.dataset.notice,{method:"PATCH"});x.classList.remove("unread");x.classList.add("read")});status.textContent=(d.unread_count||0)+" unread";}catch(e){status.textContent=e.message}}
document.querySelector("#read-all").onclick=async()=>{try{await api("/api/notifications/read-all",{method:"POST"});await load()}catch(e){status.textContent=e.message}};load();
</script></body></html>
