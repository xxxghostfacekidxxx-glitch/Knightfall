<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Edit your Ash-Fall profile and decide what the rest of the internet gets to see."><title>Ash-Fall | Edit Profile</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/profile.css"></head>
<body><header class="kf-header"></header><main class="profile-shell"><section class="card"><h1>EDIT YOUR CHAOS PROFILE.</h1><p class="handle">Keep it human. The internet has enough bios written like corporate hostage notes.</p><form id="form">
<label>Display name<input name="display_name" maxlength="60" required></label>
<label>Bio<textarea name="bio" maxlength="1000" rows="6"></textarea></label>
<section class="avatar-editor"><label>Profile picture<input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="muted">Upload JPG, PNG, or WebP. Images are resized to 320 × 320 and compressed before saving.</p><div class="avatar-preview-wrap"><img id="avatar-preview" class="avatar-preview" alt="Profile picture preview" hidden><span id="avatar-placeholder" class="avatar-preview-placeholder">Your picture</span><button id="avatar-clear" class="action" type="button">Remove picture</button></div><label>Or use an image URL<input name="avatar_url" type="url" maxlength="500" placeholder="https://…"></label></section>
<label>Website<input name="website_url" type="url" maxlength="500" placeholder="https://…"></label>
<label>Location<input name="location" maxlength="100"></label>
<label>Pronouns<input name="pronouns" maxlength="60"></label>
<button type="submit">Save profile</button><p id="status" role="status" aria-live="polite"></p></form></section></main>
<script src="/nav.js" defer></script>
<script>
const API="https://api.ash-fall.com",form=document.querySelector("#form"),status=document.querySelector("#status");
const fields=["display_name","bio","avatar_url","website_url","location","pronouns"];
const avatarFile=document.querySelector("#avatar-file"),avatarPreview=document.querySelector("#avatar-preview"),avatarPlaceholder=document.querySelector("#avatar-placeholder"),avatarClear=document.querySelector("#avatar-clear"),avatarUrl=form.elements.avatar_url;
function previewAvatar(src){if(src){avatarPreview.src=src;avatarPreview.hidden=false;avatarPlaceholder.hidden=true;}else{avatarPreview.removeAttribute("src");avatarPreview.hidden=true;avatarPlaceholder.hidden=false;}}
avatarUrl.addEventListener("input",()=>{if(/^https?:\\/\\//i.test(avatarUrl.value))previewAvatar(avatarUrl.value);else if(!avatarUrl.value)previewAvatar("");});
avatarClear.addEventListener("click",()=>{avatarFile.value="";avatarUrl.value="";previewAvatar("");status.textContent="Picture cleared. Save profile to apply the change.";});
avatarFile.addEventListener("change",async()=>{const file=avatarFile.files?.[0];if(!file)return;if(file.size>8*1024*1024){status.textContent="Choose an image smaller than 8 MB.";avatarFile.value="";return;}status.textContent="Preparing your picture…";try{const bitmap=await createImageBitmap(file),scale=Math.min(1,320/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext("2d");ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();let quality=.82,data=canvas.toDataURL("image/jpeg",quality);while(data.length>95000&&quality>.4){quality-=.08;data=canvas.toDataURL("image/jpeg",quality);}if(data.length>100000)throw Error("That image could not be compressed enough. Try a smaller image.");avatarUrl.value=data;previewAvatar(data);status.textContent="Picture ready. Save profile to upload it."; }catch(error){status.textContent=error.message||"Could not process this image.";avatarFile.value="";}});

(async()=>{const r=await fetch(`${API}/api/auth/me`,{credentials:"include"});const d=await r.json();if(!d.user){location.href="/auth.html";return}fields.forEach(k=>form.elements[k].value=d.user[k]||"");previewAvatar(d.user.avatar_url||"")})();
form.addEventListener("submit",async e=>{e.preventDefault();status.textContent="Saving…";try{const data=Object.fromEntries(new FormData(form));const r=await fetch(`${API}/api/profile`,{method:"PUT",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to save profile.");status.textContent="Profile saved.";setTimeout(()=>location.href=`/profile.html?username=${encodeURIComponent(d.user.username)}`,500)}catch(err){status.textContent=err.message}});
</script></body></html>
